<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Spider Swat · Bamboo Physio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<style>
.pill.mid{display:flex;align-items:center;gap:6px}
.pill.mid canvas{width:34px;height:34px}
.lvl{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);font:900 46px Grandstander,sans-serif;max-width:94vw;color:#FFD84D;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);opacity:0;transition:opacity .25s,transform .25s;z-index:6;pointer-events:none;white-space:nowrap}
.lvl.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.who-row{display:flex;justify-content:center;margin:2px 0 6px}
.seg.big button{font-size:16px;padding:9px 14px;white-space:nowrap}
.who-note{margin:0 0 10px;font-size:14px;opacity:.75;text-align:center}
/* 16 Nov: high-score table (top 5, names) */
.hs-btn{display:block;margin:10px auto 0;border:3px solid var(--ink);border-radius:999px;background:#FFF1B8;color:var(--ink);font:700 15px Fredoka,sans-serif;padding:4px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.hs{margin:8px auto 0;max-width:300px;font:600 15px Fredoka,sans-serif}.hs[hidden]{display:none}
.hs h3{margin:0 0 4px;text-align:center;font:700 14px Fredoka,sans-serif;opacity:.7}
.hs ol{margin:0;padding:0;list-style:none}.hs li{display:flex;justify-content:space-between;gap:10px;padding:3px 10px;border-radius:10px}.hs li:nth-child(odd){background:rgba(255,216,77,.25)}
.hs .none{text-align:center;opacity:.6;margin:4px 0}
.hs-in{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 10px;font:700 16px Fredoka,sans-serif}
.hs-in input{font:700 18px Fredoka,sans-serif;border:3px solid var(--ink);border-radius:14px;padding:5px 10px;width:150px;background:#fff;color:var(--ink)}
.stopx{position:fixed;left:12px;bottom:calc(var(--safe-b) + 12px);z-index:6;display:none}.stopx.on{display:block}
.ptime{margin:-2px 0 8px;font:600 14px Fredoka,sans-serif;text-align:center;opacity:.8}   /* 21 Nov (Edgar): estimated playtime under the buttons */
/* 21 Nov (Edgar): story mode — "Bedtime spiders" */
.play-row{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}.card.home .play-row #play{flex:1.35;margin:0}
.card.home #party-btn{flex:1;background:linear-gradient(160deg,#FF9FC6,#7FC8F8);font-size:22px;padding:6px 0 4px;margin:0;line-height:1.1}.card.home #party-btn[hidden]{display:none}
.card.home #story-btn{flex:1;background:#8E7CC3;font-size:24px;padding:6px 0 4px;margin:0;line-height:1.1}
@media (orientation:landscape) and (max-height:620px){#smap{width:min(680px,calc(100vw - 24px))}#smap .lv-grid{grid-template-columns:repeat(5,1fr);gap:8px 10px}#smap .lv canvas{width:44px;height:44px}#smap .lv{font-size:19px}#smap .lv:nth-child(3n+2){transform:none}#smap h1{font-size:26px;margin:0}}
.lv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px;margin:6px 4px 12px}
.lv{position:relative;border:4px solid var(--ink);border-radius:26px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:4px 0 2px;cursor:pointer;font:900 22px Grandstander,Fredoka,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.lv:nth-child(3n+2){transform:translateY(10px)}
.lv canvas{width:56px;height:56px}
.lv.done{background:#FFF1B8}.lv.next{background:#E3F6D8;animation:lvpulse 1.4s ease-in-out infinite}
.lv.lock{opacity:.45;cursor:default}
.lv.party:not(.lock){background:linear-gradient(160deg,#FFE3F1,#E3F0FF)}
.lv .st{position:absolute;top:-10px;inset-inline-end:-6px;font-size:22px}
.lv .st.rk{font:900 18px Grandstander,Fredoka,sans-serif;width:30px;height:30px;line-height:30px;border:3px solid var(--ink);border-radius:50%;color:var(--ink);top:-12px}
#se-score{font-family:Grandstander,Fredoka,sans-serif}
@keyframes lvpulse{50%{box-shadow:0 4px 0 var(--ink),0 0 0 6px rgba(125,203,107,.45)}}
.smap-row{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.smap-row .hs-btn{margin:0}
.comic{position:fixed;inset:0;z-index:8;cursor:pointer;-webkit-tap-highlight-color:transparent}.comic[hidden]{display:none}
.bub{position:absolute;background:#fff;border:4px solid var(--ink);border-radius:26px;box-shadow:0 5px 0 var(--ink);padding:10px 16px 12px;font:600 21px/1.3 Fredoka,sans-serif;color:var(--ink);opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.bub.on{opacity:1;transform:scale(1)}
.bub b{display:block;font:900 15px Grandstander,Fredoka,sans-serif;opacity:.65;margin-bottom:2px}
.bub::after,.bub::before{content:'';position:absolute;left:var(--tx,40px);border:14px solid transparent}
.bub.down::before{bottom:-32px;border-top:18px solid var(--ink)}.bub.down::after{bottom:-21px;border-top:15px solid #fff;margin-left:0}
.bub.up::before{top:-32px;border-bottom:18px solid var(--ink)}.bub.up::after{top:-21px;border-bottom:15px solid #fff}
.comic-tap{position:absolute;bottom:calc(var(--safe-b) + 16px);left:50%;transform:translateX(-50%);border:4px solid var(--ink);border-radius:999px;background:#FFD84D;box-shadow:0 4px 0 var(--ink);font:900 24px Grandstander,Fredoka,sans-serif;color:var(--ink);padding:6px 22px 4px;white-space:nowrap;animation:tapb 1.2s ease-in-out infinite}
@keyframes tapb{50%{transform:translateX(-50%) translateY(-5px)}}
.comic-x{position:absolute;bottom:calc(var(--safe-b) + 18px);inset-inline-start:12px}
#send .btn{margin:6px 0 10px}
@media (max-height:520px){#send h1{font-size:28px;margin:0}#send .big-score{margin:0}#se-score{font-size:64px;line-height:1}#send .btn{font-size:24px;padding:6px 0 4px;margin:4px 0 6px}#send .best-line{margin:2px 0 4px}}
.remind-ov{position:fixed;inset:0;z-index:15;background:rgba(59,43,42,.45);display:flex;align-items:center;justify-content:center}.remind-ov[hidden]{display:none}
.card.remind{position:relative;inset:auto;transform:none;text-align:center}.card.remind p{font:600 21px/1.35 Fredoka,sans-serif;margin:4px 0 14px}.card.remind .btn{background:#8E7CC3;font-size:24px;margin:0 0 8px}
.trophy-ov{position:fixed;inset:0;z-index:20;background:rgba(59,43,42,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}.trophy-ov[hidden]{display:none}
.trophy-ov img{max-width:92vw;max-height:78vh;border-radius:16px;box-shadow:0 6px 0 #3B2B2A}
.trophy-row{display:flex;gap:10px}.trophy-row .hs-btn{margin:0;text-decoration:none;display:inline-block}
@media print{body *{visibility:hidden!important}.trophy-ov,.trophy-ov img{visibility:visible!important}.trophy-ov{position:fixed;inset:0;background:#fff;padding:0}.trophy-ov img{max-width:100%;max-height:100%;box-shadow:none;border-radius:0}.trophy-row{display:none}}#send .hs-btn{margin:0 auto 8px}
#score2{color:#D9467A}#best-pill[hidden],#score2[hidden],#who-note[hidden]{display:none!important}.duo #score{color:#2F7FC0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>

<div class="top">
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 33 C 10 20, 20 9, 34 6 C 33 20, 24 31, 8 33 Z" fill="#7DCB6B" stroke="#2b2118" stroke-width="3.5" stroke-linejoin="round"/><path d="M11 30 C 17 23, 23 16, 29 11" fill="none" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round"/></svg><span>Bamboo Physio</span></div>
  <div class="tr"><button class="snd" id="snd" aria-pressed="false">🔊</button>
  <div class="lang"><button id="lang-en" aria-pressed="true">EN</button><button id="lang-he" aria-pressed="false">עב</button></div></div>
</div>

<div class="hud" id="hud">
  <div class="pill"><b id="time">0</b><small id="t-left">seconds left</small></div>
  <div class="pill mid" dir="ltr"><canvas id="spicon" width="68" height="68"></canvas><b id="score">0</b><b id="score2" hidden>0</b></div>
  <div class="pill" id="best-pill"><b id="best">0</b><small id="t-best">best</small></div>
</div>

<button class="snd stopx" id="stopx" aria-label="Stop">✕</button>
<div class="msg" id="msg"></div>
<div class="count" id="count"></div>
<div class="toast" id="toast"></div>
<div class="lvl" id="lvl"></div>

<div class="card home" id="start">
  <h1 id="t-title">Spider Swat</h1>
  <p class="sub" id="t-sub"></p>
  <p class="ptime" id="ptime"></p>
  <div class="play-row" id="play-row"><button class="btn" id="play"><span id="t-play">Play</span></button>
  <button class="btn" id="story-btn">📖 <span id="t-story">Story</span></button>
  <button class="btn" id="party-btn" hidden>🎉 <span id="t-party">Party</span></button></div>
  <!-- 16 Nov (Edgar): 2-player mode, side by side, phone sideways only -->
  <div class="who-row"><div class="seg big" id="who-seg"><button data-v="solo"></button><button data-v="duo"></button></div></div>
  <p class="who-note" id="who-note" hidden></p>
  <button class="hs-btn" id="hs-btn">🏆 <span id="t-hs">High scores</span></button>
  <div class="hs" id="hs" hidden></div>
  <p class="note" id="t-privacy"></p>
  <details id="grown">
    <summary id="t-grown">For grown-ups</summary>
    <div class="g-body">
      <p id="t-g1"></p>
      <div class="g-row" id="round-row"><span id="t-round">Round</span>
        <div class="seg" id="round-seg"><button data-v="60"></button><button data-v="90"></button><button data-v="120"></button></div></div>
      <div class="g-row"><span id="t-reach">Reach</span>
        <div class="seg" id="reach-seg"><button data-v="near"></button><button data-v="far"></button></div></div>
      <div class="g-row"><span id="t-two">Two-hand racket</span>
        <div class="seg" id="two-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-music">Music</span>
        <div class="seg" id="music-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-amb">Night sounds</span>
        <div class="seg" id="amb-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-sfx">Sound effects</span>
        <div class="seg" id="sfx-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <p id="t-g2"></p>
      <p id="t-g3"></p>
      <p id="t-g5"></p>
      <p id="t-g6"></p>
      <p id="t-g7"></p>
      <p class="mini" id="t-legal"></p>
    </div>
  </details>
</div>

<!-- 21 Nov (Edgar): story mode — level map, comic page before each level, level result -->
<div class="card" id="smap" hidden>
  <h1 id="t-smap"></h1>
  <p class="sub" id="t-smapsub"></p>
  <div class="lv-grid" id="lv-grid"></div>
  <div class="smap-row"><button class="hs-btn" id="smap-back"></button><button class="hs-btn" id="smap-reset"></button></div>
</div>
<div class="comic" id="comic" hidden>
  <div class="bub" id="bub0"></div><div class="bub" id="bub1"></div>
  <div class="comic-tap" id="comic-tap"></div>
  <button class="snd comic-x" id="comic-x" aria-label="Close">✕</button>
</div>
<div class="card" id="send" hidden>
  <h1 id="se-title"></h1>
  <div class="big-score"><span id="se-score">0</span><small id="se-sub"></small></div>
  <p class="best-line" id="se-line"></p>
  <button class="btn" id="se-next"></button>
  <button class="btn" id="se-trophy" hidden style="background:#FFD84D;font-size:22px"></button>
  <button class="hs-btn" id="se-map"></button>
</div>
<div class="remind-ov" id="remind" hidden><div class="card remind"><p id="rm-txt"></p><button class="btn" id="rm-go"></button><button class="hs-btn" id="rm-later"></button></div></div>
<div class="trophy-ov" id="trophy" hidden><img id="trophy-img" alt=""><div class="trophy-row"><button class="hs-btn" id="tr-print"></button><a class="hs-btn" id="tr-save" download="spider-swat-trophy.png"></a><button class="hs-btn" id="tr-x">✕</button></div></div>

<div class="card" id="end" hidden>
  <div class="center"><span class="newbest" id="newbest" hidden></span></div>
  <h1 id="t-over"></h1>
  <div class="big-score"><span id="final">0</span><small id="t-sec2"></small></div>
  <p class="best-line" id="best-line"></p>
  <div id="hs-name"></div>
  <button class="btn" id="again"><span id="t-again">Play again</span></button>
  <p class="note" id="t-privacy2"></p>
</div>

 en:{title:"Spider Swat",sub:"Your hands are rackets. Swat the spiders away!",subG:n=>"Swat the spiders — get "+n+" points!",subG2:n=>"First to "+n+" points wins!",play:"Play",

const SPIDER={b:{body:'#5FB7F0',leg:'#3E8CC4',hp:1},n:{body:'#6B5B95',leg:'#4A3E78',hp:1},r:{body:'#F0604D',leg:'#B83E33',hp:2},h:{body:'#F0604D',leg:'#B83E33',hp:4},M:{body:'#9C86CF',leg:'#6E5AA6',hp:1},f:{body:'#FF9A3C',leg:'#D9661E',hp:1},fc:{body:'#FFC48A',leg:'#D98A4E',hp:1}};   // f = hot spider (story): touch it before freezing = lose a heart   // M = Mama Spider (story mode)
/* face: 'happy' | 'angry' | 'dizzy' | 'oops' */
function drawSpider(c,x,y,s,type,face,t,hp,legPhase=0,look=null){   // look: unit vector toward the nearest racket
  const D=SPIDER[type],lw=Math.max(2,s*.08);

  c.strokeStyle=INK;c.lineCap='round';

    const a=(-.55+i*.38)+Math.sin(t*6+i+legPhase)*.12;
    const kx=sd*s*(.62+.08*i),ky=-s*.25+i*s*.2,fx=sd*s*(.95+.05*(i%2)),fy=s*(-.05+i*.28)+Math.sin(t*6+i)*s*.05;
    c.lineWidth=s*.14+lw*1.6;c.beginPath();c.moveTo(sd*s*.2,s*(-.05+i*.08));c.quadraticCurveTo(kx,ky-s*.3,fx,fy);c.stroke();
    c.strokeStyle=D.leg;c.lineWidth=s*.14;c.beginPath();c.moveTo(sd*s*.2,s*(-.05+i*.08));c.quadraticCurveTo(kx,ky-s*.3,fx,fy);c.stroke();c.strokeStyle=INK;
  }
  if(type==='f'){const g=c.createRadialGradient(0,s*.1,s*.3,0,s*.1,s*1.3);g.addColorStop(0,'rgba(255,170,80,.55)');g.addColorStop(1,'rgba(255,170,80,0)');c.fillStyle=g;c.fillRect(-s*1.4,-s*1.3,s*2.8,s*2.8);}
  sticker(c,ell(0,s*.1,s*.5,s*.46),D.body,lw);
  c.fillStyle='rgba(255,255,255,.28)';c.fill(ell(-s*.2,-s*.08,s*.14,s*.09,-.5));
  // eyes
  const ey=s*.02;
  if(face==='sleep'){c.lineWidth=lw;for(const sd of [-1,1]){c.beginPath();c.arc(sd*s*.17,ey,s*.09,.15*Math.PI,.85*Math.PI);c.stroke();}   // asleep: closed eyes, little smile
    c.lineWidth=lw*.8;c.beginPath();c.arc(0,s*.24,s*.07,.2*Math.PI,.8*Math.PI);c.stroke();}
  else if(face==='dizzy'){c.lineWidth=lw*.9;for(const sd of [-1,1]){c.beginPath();c.arc(sd*s*.17,ey,s*.08,0,Math.PI*1.6);c.stroke();}
    c.beginPath();c.ellipse(0,s*.28,s*.09,s*.07,0,0,7);c.fillStyle=INK;c.fill();}
  else{
    for(const sd of [-1,1]){c.fillStyle='#fff';c.fill(ell(sd*s*.17,ey,s*.13,s*.15));c.lineWidth=lw*.7;c.stroke(ell(sd*s*.17,ey,s*.13,s*.15));
      const px=look?look.x*s*.05:(face==='oops'?0:sd*-s*.02),py=look?look.y*s*.05:0;c.fillStyle=INK;c.fill(ell(sd*s*.17+px,ey+s*.03+py,s*.07,s*.08));c.fillStyle='#fff';c.fill(ell(sd*s*.17+px+s*.025,ey+py,s*.025,s*.025));
      if(face==='sleepy'){c.save();c.clip(ell(sd*s*.17,ey,s*.13,s*.15));c.fillStyle=D.body;c.fillRect(sd*s*.17-s*.15,ey-s*.17,s*.3,s*.17);c.restore();   // heavy sleepy eyelids
        c.lineWidth=lw*.7;c.stroke(ell(sd*s*.17,ey,s*.13,s*.15));c.lineWidth=lw*.8;c.beginPath();c.moveTo(sd*s*.17-s*.13,ey);c.lineTo(sd*s*.17+s*.13,ey);c.stroke();}}
    if(face==='angry'){c.lineWidth=lw;c.beginPath();c.moveTo(-s*.32,-s*.17);c.lineTo(-s*.08,-s*.1);c.moveTo(s*.32,-s*.17);c.lineTo(s*.08,-s*.1);c.stroke();
      c.beginPath();c.arc(0,s*.36,s*.1,1.15*Math.PI,1.85*Math.PI);c.stroke();}
    else if(face==='oops'){c.fillStyle=INK;c.fill(ell(0,s*.3,s*.08,s*.1));}
    else{c.lineWidth=lw*.8;c.beginPath();c.arc(0,s*.22,s*.1,.15*Math.PI,.85*Math.PI);c.stroke();}
  }
  c.fillStyle='rgba(255,140,165,.75)';c.fill(ell(-s*.33,s*.2,s*.07,s*.045));c.fill(ell(s*.33,s*.2,s*.07,s*.045));

    c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=Math.max(2,s*.07);c.lineCap='round';
    for(let i=0;i<3;i++){const ph=(t*.9+i/3)%1,x0=(i-1)*s*.24,y0=-s*.45-ph*s*.7;c.globalAlpha=Math.min(1,(1-ph)*2);c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo(x0+s*.1,y0-s*.1,x0,y0-s*.2);c.quadraticCurveTo(x0-s*.1,y0-s*.3,x0,y0-s*.4);c.stroke();}
    c.globalAlpha=1;const dp=new Path2D();dp.moveTo(s*.42,-s*.16);dp.quadraticCurveTo(s*.52,-s*.02,s*.42,s*.02);dp.quadraticCurveTo(s*.33,-s*.02,s*.42,-s*.16);sticker(c,dp,'#BFE9FF',lw*.6);}

function drawHelmet(c,s,lw,dented){

  for(const sd of [-1,1]){const g=new Path2D();g.moveTo(sd*s*.5,s*.0);g.quadraticCurveTo(sd*s*.56,s*.2,sd*s*.4,s*.3);g.quadraticCurveTo(sd*s*.36,s*.12,sd*s*.36,s*.04);g.closePath();sticker(c,g,'#B7BCC7',lw*.8);}  // cheek guards
  sticker(c,ell(0,-s*.02,s*.32,s*.045),'#5B5F6B',lw*.6);           // visor slit (eyes peek below)
  c.fillStyle='#8E94A1';for(const rx of [-.36,-.18,0,.18,.36])c.fill(ell(rx*s,-s*.14-Math.abs(rx)*-.0*s,s*.03,s*.03));   // rivets

  sticker(c,pl,'#FF9FC6',lw*.8);                                     // plume
  if(dented){c.strokeStyle=INK;c.lineWidth=lw*.7;c.beginPath();c.moveTo(s*.18,-s*.38);c.lineTo(s*.26,-s*.28);c.lineTo(s*.2,-s*.2);c.stroke();}
}
/* 16 Nov (Edgar): the thorn ball — a fake spider: black ball, white thorns, hanging still on a thread. Touching it = a strike. */
function drawMace(c,x,y,s,t){

  for(let i=0;i<10;i++){const a=i/10*Math.PI*2+.2,p=new Path2D();
    p.moveTo(Math.cos(a-.24)*s*.4,Math.sin(a-.24)*s*.4);p.lineTo(Math.cos(a)*s*1.02,Math.sin(a)*s*1.02);p.lineTo(Math.cos(a+.24)*s*.4,Math.sin(a+.24)*s*.4);p.closePath();

  c.fillStyle='rgba(255,255,255,.3)';c.fill(ell(-s*.18,-s*.2,s*.13,s*.08,-.6));
  c.restore();
}

const POSES={zap:{ua:58,fa:58},ice:{ua:62,fa:150,together:true},power:{ua:0,fa:90}};   // ice: real arms need the elbows fairly high for the hands to meet above the head
function drawPoseKid(c,x,neck,hw,kind,t){
  const P=POSES[kind],L1=hw*1.0,L2=hw*.92,D=Math.PI/180;

    let ex=sx+Math.cos(ua*D)*L1,ey=sy-Math.sin(ua*D)*L1,wx=ex+Math.cos(fa*D)*L2,wy=ey-Math.sin(fa*D)*L2;
    if(P.together){ex=sx+sd*hw*.62;ey=sy-hw*.95;wx=x+sd*hw*.13;wy=neck-hw*2.15;}   // the cartoon: elbows out, palms together on top of the head
    c.lineCap='round';c.lineJoin='round';c.strokeStyle=INK;c.lineWidth=hw*.28+6;c.beginPath();c.moveTo(sx,sy);c.lineTo(ex,ey);c.lineTo(wx,wy);c.stroke();

function drawRacket(c,x,y,r,ang,col,big=false,t=0){

    const zs=sp.zap&&sp.state!=='fly'?sp.s*.1:0,bx=sp.x+Math.sin(sw)*len*.25+(zs?Math.sin(tNow*95+sp.id*40)*zs:0),by=sp.y+(zs?Math.cos(tNow*83+sp.id*30)*zs*.7:0);
    if(zs)drawZapAura(ctx,bx,by+(sp.type==='m'?0:sp.s*.1),sp.type==='m'?sp.s*1.3:sp.s,tNow,sp.id*50);
    if(sp.state!=='fly'){ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(sp.x,-10);ctx.quadraticCurveTo(sp.x,by*.5,bx,by-sp.s*.4);ctx.stroke();
      ctx.strokeStyle='rgba(43,33,24,.35)';ctx.lineWidth=1;ctx.stroke();}
    else{ctx.save();ctx.translate(sp.x,sp.y);ctx.rotate(sp.rot||0);ctx.scale(sp.k,sp.k);if(sp.type==='m')drawMace(ctx,0,0,sp.s,tNow);else drawSpider(ctx,0,0,sp.s,sp.type,sp.face,tNow,sp.hp,sp.id*10);ctx.restore();continue;}
    if(sp.type==='m'){drawMace(ctx,bx,by,sp.s,tNow);if(zs)drawZapSparks(ctx,bx,by,sp.s*1.3,tNow,sp.id*50);continue;}
    ctx.save();ctx.translate(bx,by);ctx.rotate(-sw*.6);drawSpider(ctx,0,0,sp.s,sp.type==='f'&&sp.ice?'fc':sp.type,sp.face,tNow,sp.hp,sp.id*10,lookAt(bx,by));ctx.restore();
    if(sp.ice)drawIce(ctx,bx,by+sp.s*.1,sp.s,tNow);

      for(let i=0;i<sp.hp;i++){ctx.save();ctx.translate(bx+(i-(sp.hp-1)/2)*sp.s*.32,by+sp.s*.85);sticker(ctx,ell(0,0,sp.s*.09,sp.s*.09),'#FFD84D',2);ctx.restore();}
    }
  }
  helmets=helmets.filter(h=>tNow-h.t<1.6);
  for(const h of helmets){h.vy+=H*1.6*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.rot+=dt*8;ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.rot);drawHelmet(ctx,h.s,Math.max(2,h.s*.08),true);ctx.restore();}
  puffs=puffs.filter(p=>(p.life-=dt)>0);
  for(const p of puffs){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.05,dt);p.vy*=Math.pow(.05,dt);const k=1-p.life/.75;
    ctx.save();ctx.globalAlpha=Math.min(1,p.life*2.5);sticker(ctx,ell(p.x,p.y,p.r*(.6+k*.9),p.r*(.55+k*.8)),p.ice?'#CDEFFF':'#FFFFFF',3.5);ctx.fillStyle='rgba(200,215,235,.9)';ctx.fill(ell(p.x-p.r*.2,p.y-p.r*.15,p.r*.25,p.r*.18));ctx.restore();}
  strands=strands.filter(p=>(p.life-=dt)>0);
  for(const p of strands){p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.save();ctx.globalAlpha=Math.min(1,p.life*2);ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.strokeStyle='#FFFFFF';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-p.len/2,0);ctx.quadraticCurveTo(0,-p.len*.3,p.len/2,0);ctx.stroke();ctx.restore();}
  pops=pops.filter(p=>(p.life-=dt)>0);

  // zap bolts: soft yellow zig-zags from the top to each zapped spider
  bolts=bolts.filter(b=>(b.life-=dt)>0);
  for(const b of bolts){ctx.save();ctx.globalAlpha=Math.min(1,b.life*3);const n=7,pts=[];for(let i=0;i<=n;i++){const k=i/n;pts.push([b.x+(i&&i<n?Math.sin(b.seed+i*2.3+tNow*40)*22:0),b.y*k]);}
    for(const [w,c] of [[11,INK],[6,'#FFE45C']]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();}ctx.restore();}

  if(story&&(state==='play'||state==='won'))drawStoryCards();
  if(state==='play'&&tNow-hintT0<4&&window.drawBigHint)drawBigHint((tNow-hintT0)/4);
  // points floating up
  floaters=floaters.filter(f=>(f.life-=dt)>0);

  // rackets
  if(state==='play'||state==='count'||(state==='ready'&&!cam)){
    for(const rk of rackets())drawRacket(ctx,rk.x,rk.y,rk.r,rk.a,rk.col,rk.big,tNow);
  }
  if(turn)drawTurnPhone();
}

/* battle layer: strike slots, red flash, "out" halves, the super-pose cards (they fill with the holding player's colour) */
/* 23 Nov (Edgar): super cards are round discs; holding the pose fills a thick, solid ring around the disc like a timer.
   1 player / story: the whole ring (blue). 2 players: blue fills the left half (top → bottom), pink the right half; a full half fires. */
const RING_COL=['#2F9BEA','#EE5E8F'];
// 23 Nov (Edgar): nothing may sit on top of anything else — the on-screen buttons/boxes to keep clear of
function uiRects(){const R=[...document.querySelectorAll('.brand,.tr,#hud.on .pill,#stopx.on')].map(e=>e.getBoundingClientRect()).filter(r=>r.width>0&&r.height>0);
  if(story&&story.L&&story.L.lives&&$('hud').classList.contains('on')){const hb=$('hud').getBoundingClientRect();R.push({left:Math.max(12,hb.left),right:Math.max(12,hb.left)+story.L.lives*26+12,top:hb.bottom,bottom:hb.bottom+34});}   // story hearts row
  return R;}
const hitsRect=(x,y,rx,ry,r,m=6)=>x+rx>r.left-m&&x-rx<r.right+m&&y+ry>r.top-m&&y-ry<r.bottom+m;
// a row of n slots from the bottom corner inwards, skipping over any button in the way
function slotRow(k,n,y,r,step){const R=uiRects(),xs=[];let x=k?W-22:22;const d=k?-1:1;
  while(xs.length<n&&x>0&&x<W){if(R.some(b=>hitsRect(x,y,r,r,b))){x+=d*4;continue;}xs.push(x);x+=d*step;}return xs;}
function drawSuperDisc(c,cx,cy,cw,ch,kind,tier,prog,both,resting,coolLeft,coolLen,t0){
  const pop=Math.min(1,(tNow-t0)/.25),R=Math.min(cw*.46,ch*.42),dy=ch*.06,y=cy+dy,lw=Math.max(7,R*.2);
  const charge=Math.max(prog[0]||0,prog[1]||0),grow=1+.07*charge+(charge>0?.02*Math.sin(tNow*14):0);
  c.save();c.translate(cx,y);c.scale(pop*grow,pop*grow);
  if(charge>0&&!resting){const g=c.createRadialGradient(0,0,R*.8,0,0,R*1.45);g.addColorStop(0,'rgba(255,240,150,.75)');g.addColorStop(1,'rgba(255,240,150,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,R*1.45,0,Math.PI*2);c.fill();}
  sticker(c,ell(0,0,R,R),'#FFF8EC',3.5);
  c.save();c.clip(ell(0,0,R-lw*.95,R-lw*.95));drawPoseKid(c,0,R*.42,R*.5,kind,tNow);c.restore();
  // ring track
  c.lineCap='butt';c.strokeStyle='#E9E1D2';c.lineWidth=lw;c.beginPath();c.arc(0,0,R-lw/2-1.5,0,Math.PI*2);c.stroke();
  if(resting){   // resting: a grey clock-wedge that shrinks as the card gets ready again
    const k=Math.max(0,coolLeft/coolLen);c.fillStyle='rgba(110,110,120,.6)';c.beginPath();c.moveTo(0,0);c.arc(0,0,R-1.5,-Math.PI/2,-Math.PI/2+Math.PI*2*k);c.closePath();c.fill();}
  else{
    const rr=R-lw/2-1.5,arcs=[];
    if(!both)arcs.push([prog[0]||0,RING_COL[0],-Math.PI/2,1,2]);   // one player: full ring clockwise
    else{arcs.push([prog[0]||0,RING_COL[0],-Math.PI/2,-1,1]);arcs.push([prog[1]||0,RING_COL[1],-Math.PI/2,1,1]);}   // blue left half, pink right half
    for(const [p,col,a0,dir,span] of arcs){if(!(p>0))continue;const a1=a0+dir*Math.PI*span*p;
      c.lineCap='round';c.beginPath();c.arc(0,0,rr,a0,a1,dir<0);c.strokeStyle=INK;c.lineWidth=lw+5;c.stroke();c.strokeStyle=col;c.lineWidth=lw;c.stroke();
      c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=Math.max(2,lw*.22);c.beginPath();c.arc(0,0,rr+lw*.18,a0,a1,dir<0);c.stroke();}
    if(both){c.strokeStyle=INK;c.lineWidth=2.5;c.beginPath();c.moveTo(0,-R);c.lineTo(0,-R+lw+3);c.moveTo(0,R);c.lineTo(0,R-lw-3);c.stroke();}}   // the two halves' start / finish marks
  c.lineWidth=3.5;c.strokeStyle=INK;c.stroke(ell(0,0,R,R));
  c.restore();
  // tier stars just above the disc (no emoji badge — it overlapped the next disc)
  for(let j=0;j<tier;j++){c.save();c.translate(cx+(j-(tier-1)/2)*R*.42,y-R-R*.16);sticker(c,starPath(R*.15),resting?'#E6E1D8':'#FFD84D',2);c.restore();}
}
function drawBattle(){

    // 3 strike slots in the outer top corner of each half: a little thorn ball fills each one
    const r=11,xs=slotRow(k,MAXSTRIKE,H-30,r,27);for(let i=0;i<MAXSTRIKE;i++){const x=xs[i]??(k?W-22-i*27:22+i*27),y=H-30;

function buildQueue(L){

  for(const [t,n] of Object.entries(L.pairs||{}))for(let i=0;i<n;i++)items.push({type:t,pair:true});
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}

  items.forEach((q,i)=>q.t=t0+i*gap+(i?(Math.random()-.5)*gap*.5:0));
  const thorns=[];for(let i=0;i<(L.thorns||0);i++)thorns.push({t:3+i*(49/Math.max(1,(L.thorns||1)-1))+(Math.random()-.5)*1.2,intro:!i&&L.intro==='m'});
