<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Spider Swat · Bamboo Physio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<style>
.pill.mid{display:flex;align-items:center;gap:6px}
.pill.mid canvas{width:34px;height:34px}
.lvl{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);font:900 46px Grandstander,sans-serif;max-width:94vw;color:#FFD84D;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);opacity:0;transition:opacity .25s,transform .25s;z-index:6;pointer-events:none;white-space:nowrap}
.lvl.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.who-row{display:flex;justify-content:center;margin:2px 0 6px}
.seg.big button{font-size:16px;padding:9px 14px;white-space:nowrap}
.who-note{margin:0 0 10px;font-size:14px;opacity:.75;text-align:center}
/* 16 Nov: high-score table (top 5, names) */
.hs-btn{display:block;margin:10px auto 0;border:3px solid var(--ink);border-radius:999px;background:#FFF1B8;color:var(--ink);font:700 15px Fredoka,sans-serif;padding:4px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.hs{margin:8px auto 0;max-width:300px;font:600 15px Fredoka,sans-serif}.hs[hidden]{display:none}
.hs h3{margin:0 0 4px;text-align:center;font:700 14px Fredoka,sans-serif;opacity:.7}
.hs ol{margin:0;padding:0;list-style:none}.hs li{display:flex;justify-content:space-between;gap:10px;padding:3px 10px;border-radius:10px}.hs li:nth-child(odd){background:rgba(255,216,77,.25)}
.hs .none{text-align:center;opacity:.6;margin:4px 0}
.hs-in{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 10px;font:700 16px Fredoka,sans-serif}
.hs-in input{font:700 18px Fredoka,sans-serif;border:3px solid var(--ink);border-radius:14px;padding:5px 10px;width:150px;background:#fff;color:var(--ink)}
#score2{color:#D9467A}#best-pill[hidden],#score2[hidden],#who-note[hidden]{display:none!important}.duo #score{color:#2F7FC0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>

<div class="top">
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 33 C 10 20, 20 9, 34 6 C 33 20, 24 31, 8 33 Z" fill="#7DCB6B" stroke="#2b2118" stroke-width="3.5" stroke-linejoin="round"/><path d="M11 30 C 17 23, 23 16, 29 11" fill="none" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round"/></svg><span>Bamboo Physio</span></div>
  <div class="tr"><button class="snd" id="snd" aria-pressed="false">🔊</button>
  <div class="lang"><button id="lang-en" aria-pressed="true">EN</button><button id="lang-he" aria-pressed="false">עב</button></div></div>
</div>

<div class="hud" id="hud">
  <div class="pill"><b id="time">0</b><small id="t-left">seconds left</small></div>
  <div class="pill mid" dir="ltr"><canvas id="spicon" width="68" height="68"></canvas><b id="score">0</b><b id="score2" hidden>0</b></div>
  <div class="pill" id="best-pill"><b id="best">0</b><small id="t-best">best</small></div>
</div>

<div class="msg" id="msg"></div>
<div class="count" id="count"></div>
<div class="toast" id="toast"></div>
<div class="lvl" id="lvl"></div>

<div class="card" id="start">
  <h1 id="t-title">Spider Swat</h1>
  <p class="sub" id="t-sub"></p>
  <!-- 16 Nov (Edgar): 2-player mode, side by side, phone sideways only -->
  <div class="who-row"><div class="seg big" id="who-seg"><button data-v="solo"></button><button data-v="duo"></button></div></div>
  <p class="who-note" id="who-note" hidden></p>
  <button class="btn" id="play"><span id="t-play">Play</span></button>
  <button class="hs-btn" id="hs-btn">🏆 <span id="t-hs">High scores</span></button>
  <div class="hs" id="hs" hidden></div>
  <p class="note" id="t-privacy"></p>
  <details id="grown">
    <summary id="t-grown">For grown-ups</summary>
    <div class="g-body">
      <p id="t-g1"></p>
      <div class="g-row"><span id="t-round">Round</span>
        <div class="seg" id="round-seg"><button data-v="60"></button><button data-v="90"></button><button data-v="120"></button></div></div>
      <div class="g-row"><span id="t-reach">Reach</span>
        <div class="seg" id="reach-seg"><button data-v="near"></button><button data-v="far"></button></div></div>
      <div class="g-row"><span id="t-two">Two-hand racket</span>
        <div class="seg" id="two-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-music">Music</span>
        <div class="seg" id="music-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-amb">Night sounds</span>
        <div class="seg" id="amb-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-sfx">Sound effects</span>
        <div class="seg" id="sfx-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <p id="t-g2"></p>
      <p id="t-g3"></p>
      <p id="t-g5"></p>
      <p id="t-g6"></p>
      <p id="t-g7"></p>
      <p class="mini" id="t-legal"></p>
    </div>
  </details>
</div>

<div class="card" id="end" hidden>
  <div class="center"><span class="newbest" id="newbest" hidden></span></div>
  <h1 id="t-over"></h1>
  <div class="big-score"><span id="final">0</span><small id="t-sec2"></small></div>
  <p class="best-line" id="best-line"></p>
  <div id="hs-name"></div>
  <button class="btn" id="again"><span id="t-again">Play again</span></button>
  <p class="note" id="t-privacy2"></p>
</div>

<script type="module">

/* ================= TEXT ================= */

let lang=LS.get('bamboo-lang','en'); if(!UI[lang])lang='en';
let roundLen=+LS.get('sw-round','90'); if(![60,90,120].includes(roundLen))roundLen=90;
let reach=LS.get('sw-reach','near'); if(!['near','far'].includes(reach))reach='near';
let twoOn=LS.get('sw-two','1')==='1';
let who=LS.get('sw-who','solo'); if(!['solo','duo'].includes(who))who='solo';
/* 16 Nov (Edgar): points instead of a spider count, and a top-5 high-score table with names, kept on this device only.
   One table per mode + round (+ reach for 1 player). The old single record is carried in once. */
const hsKey=()=>who==='duo'?'sw-hs-duo-'+roundLen:'sw-hs-'+roundLen+reach;
function getHS(){let a=[];try{a=JSON.parse(LS.get(hsKey(),'[]'))||[];}catch(e){a=[];}
  if(!a.length&&who!=='duo'){const old=+LS.get('sw-best-'+roundLen+reach,'0')||0;if(old>0)a=[{n:'',s:old}];}
  return a.filter(e=>e&&typeof e.s==='number').slice(0,5);}
const setHS=a=>LS.set(hsKey(),JSON.stringify(a.slice(0,5)));
let best=0; const loadBest=()=>{const a=getHS();best=a.length?a[0].s:0;$('best').textContent=best;};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showHS(){const u=UI[lang],a=getHS(),el=$('hs');
  const head=(who==='duo'?u.p2:u.p1)+' · '+roundLen+(lang==='he'?' שנ׳':' s')+(who==='duo'?'':' · '+u[reach]);
  el.innerHTML='<h3>'+esc(head)+'</h3>'+(a.length?'<ol>'+a.map((e,i)=>'<li><span>'+(i+1)+'. '+(esc(e.n)||'⭐')+'</span><b>'+e.s+'</b></li>').join('')+'</ol>':'<p class="none">'+esc(u.hsnone)+'</p>');}
$('hs-btn').onclick=()=>{const el=$('hs');el.hidden=!el.hidden;if(!el.hidden)showHS();audio();SFX.tink();};
let hsEntries=[];   // entries added this game that can still get a name: {id, k}
// 16 Nov (Edgar): the music is back ('Sneaky tiptoe'), with the crickets / night sounds kept on underneath (own setting 'sw-amb').
S.track='spiderTiptoe'; S.amb='night'; S.ambOn=LS.get('sw-amb','1')==='1';
const syncSound=bindSound(()=>UI[lang],{ambKey:'sw-amb'});

function segs(){
  const u=UI[lang],mark=(id,v)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===String(v)));
  document.querySelectorAll('#round-seg button').forEach(b=>b.textContent=b.dataset.v+(lang==='he'?' שנ׳':' s'));
  document.querySelectorAll('#reach-seg button').forEach(b=>b.textContent=u[b.dataset.v]);
  document.querySelectorAll('#two-seg button').forEach(b=>b.textContent=u[b.dataset.v==='1'?'on':'off']);
  mark('round-seg',roundLen);mark('reach-seg',reach);mark('two-seg',+twoOn);
  document.querySelectorAll('#who-seg button').forEach(b=>b.textContent=u[b.dataset.v]);mark('who-seg',who);
  $('who-note').hidden=who!=='duo';$('who-note').textContent=u.duonote;
}
function setLang(l){
  lang=l;LS.set('bamboo-lang',l);const u=UI[l];
  document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';document.querySelector('.top').dir='ltr';
  for(const k of ['title','sub','play','privacy','grown','g1','round','reach','two','music','amb','sfx','g2','g3','g5','g6','g7','legal','left','best','sec2','over','again','hs'])
    {const e=$('t-'+k);if(e)e.textContent=u[k];}
  $('t-privacy2').textContent=u.privacy;
  $('lang-en').setAttribute('aria-pressed',l==='en');$('lang-he').setAttribute('aria-pressed',l==='he');
  $('c').setAttribute('aria-label',u.aria);
  segs();syncSound();if(!$('end').hidden)fillEnd(lastNew);if(!$('hs').hidden)showHS();
}
$('lang-en').onclick=()=>setLang('en');$('lang-he').onclick=()=>setLang('he');
const hsRefresh=()=>{if(!$('hs').hidden)showHS();};
document.querySelectorAll('#round-seg button').forEach(b=>b.onclick=()=>{roundLen=+b.dataset.v;LS.set('sw-round',roundLen);loadBest();segs();hsRefresh();});
document.querySelectorAll('#reach-seg button').forEach(b=>b.onclick=()=>{reach=b.dataset.v;LS.set('sw-reach',reach);loadBest();segs();hsRefresh();});
document.querySelectorAll('#two-seg button').forEach(b=>b.onclick=()=>{twoOn=b.dataset.v==='1';LS.set('sw-two',b.dataset.v);segs();});
document.querySelectorAll('#who-seg button').forEach(b=>b.onclick=()=>{who=b.dataset.v;LS.set('sw-who',who);audio();SFX.tink();segs();loadBest();hsRefresh();});

/* ================= CANVAS + ART ================= */
const cv=$('c'),ctx=cv.getContext('2d');

const SPIDER={b:{body:'#5FB7F0',leg:'#3E8CC4',hp:1},n:{body:'#6B5B95',leg:'#4A3E78',hp:1},r:{body:'#F0604D',leg:'#B83E33',hp:2},h:{body:'#F0604D',leg:'#B83E33',hp:4}};
/* face: 'happy' | 'angry' | 'dizzy' | 'oops' */
function drawSpider(c,x,y,s,type,face,t,hp,legPhase=0,look=null){   // look: unit vector toward the nearest racket
  const D=SPIDER[type],lw=Math.max(2,s*.08);
  c.save();c.translate(x,y);
  // legs: 4 per side, soft curves
  c.strokeStyle=INK;c.lineCap='round';
  for(const sd of [-1,1])for(let i=0;i<4;i++){
    const a=(-.55+i*.38)+Math.sin(t*6+i+legPhase)*.12;
    const kx=sd*s*(.62+.08*i),ky=-s*.25+i*s*.2,fx=sd*s*(.95+.05*(i%2)),fy=s*(-.05+i*.28)+Math.sin(t*6+i)*s*.05;
    c.lineWidth=s*.14+lw*1.6;c.beginPath();c.moveTo(sd*s*.2,s*(-.05+i*.08));c.quadraticCurveTo(kx,ky-s*.3,fx,fy);c.stroke();
    c.strokeStyle=D.leg;c.lineWidth=s*.14;c.beginPath();c.moveTo(sd*s*.2,s*(-.05+i*.08));c.quadraticCurveTo(kx,ky-s*.3,fx,fy);c.stroke();c.strokeStyle=INK;
  }
  sticker(c,ell(0,s*.1,s*.5,s*.46),D.body,lw);
  c.fillStyle='rgba(255,255,255,.28)';c.fill(ell(-s*.2,-s*.08,s*.14,s*.09,-.5));
  // eyes
  const ey=s*.02;
  if(face==='dizzy'){c.lineWidth=lw*.9;for(const sd of [-1,1]){c.beginPath();c.arc(sd*s*.17,ey,s*.08,0,Math.PI*1.6);c.stroke();}
    c.beginPath();c.ellipse(0,s*.28,s*.09,s*.07,0,0,7);c.fillStyle=INK;c.fill();}
  else{
    for(const sd of [-1,1]){c.fillStyle='#fff';c.fill(ell(sd*s*.17,ey,s*.13,s*.15));c.lineWidth=lw*.7;c.stroke(ell(sd*s*.17,ey,s*.13,s*.15));
      const px=look?look.x*s*.05:(face==='oops'?0:sd*-s*.02),py=look?look.y*s*.05:0;c.fillStyle=INK;c.fill(ell(sd*s*.17+px,ey+s*.03+py,s*.07,s*.08));c.fillStyle='#fff';c.fill(ell(sd*s*.17+px+s*.025,ey+py,s*.025,s*.025));}
    if(face==='angry'){c.lineWidth=lw;c.beginPath();c.moveTo(-s*.32,-s*.17);c.lineTo(-s*.08,-s*.1);c.moveTo(s*.32,-s*.17);c.lineTo(s*.08,-s*.1);c.stroke();
      c.beginPath();c.arc(0,s*.36,s*.1,1.15*Math.PI,1.85*Math.PI);c.stroke();}
    else if(face==='oops'){c.fillStyle=INK;c.fill(ell(0,s*.3,s*.08,s*.1));}
    else{c.lineWidth=lw*.8;c.beginPath();c.arc(0,s*.22,s*.1,.15*Math.PI,.85*Math.PI);c.stroke();}
  }
  c.fillStyle='rgba(255,140,165,.75)';c.fill(ell(-s*.33,s*.2,s*.07,s*.045));c.fill(ell(s*.33,s*.2,s*.07,s*.045));
  // knight helmet while it still has more than 2 hits left
  if(type==='h'&&hp>2)drawHelmet(c,s,lw,hp<4);
  c.restore();
}
function drawHelmet(c,s,lw,dented){
  const p=new Path2D();p.moveTo(-s*.5,s*.0);p.bezierCurveTo(-s*.55,-s*.62,s*.55,-s*.62,s*.5,s*.0);p.lineTo(s*.48,s*.06);p.lineTo(-s*.48,s*.06);p.closePath();
  sticker(c,p,'#C9CDD6',lw);
  c.fillStyle='rgba(255,255,255,.55)';c.fill(ell(-s*.22,-s*.3,s*.09,s*.16,-.3));
  for(const sd of [-1,1]){const g=new Path2D();g.moveTo(sd*s*.5,s*.0);g.quadraticCurveTo(sd*s*.56,s*.2,sd*s*.4,s*.3);g.quadraticCurveTo(sd*s*.36,s*.12,sd*s*.36,s*.04);g.closePath();sticker(c,g,'#B7BCC7',lw*.8);}  // cheek guards
  sticker(c,ell(0,-s*.02,s*.32,s*.045),'#5B5F6B',lw*.6);           // visor slit (eyes peek below)
  c.fillStyle='#8E94A1';for(const rx of [-.36,-.18,0,.18,.36])c.fill(ell(rx*s,-s*.14-Math.abs(rx)*-.0*s,s*.03,s*.03));   // rivets
  const pl=new Path2D();pl.moveTo(0,-s*.44);pl.bezierCurveTo(s*.1,-s*.8,s*.42,-s*.78,s*.36,-s*.6);pl.bezierCurveTo(s*.22,-s*.56,s*.1,-s*.5,0,-s*.44);
  sticker(c,pl,'#FF9FC6',lw*.8);                                     // plume
  if(dented){c.strokeStyle=INK;c.lineWidth=lw*.7;c.beginPath();c.moveTo(s*.18,-s*.38);c.lineTo(s*.26,-s*.28);c.lineTo(s*.2,-s*.2);c.stroke();}
}
/* 16 Nov (Edgar): the thorn ball — a fake spider: black ball, white thorns, hanging still on a thread. Touching it = a strike. */
function drawMace(c,x,y,s,t){
  const lw=Math.max(2,s*.08);c.save();c.translate(x,y);c.rotate(Math.sin(t*1.3+x)*.08);
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2+.2,p=new Path2D();
    p.moveTo(Math.cos(a-.22)*s*.42,Math.sin(a-.22)*s*.42);p.lineTo(Math.cos(a)*s*.86,Math.sin(a)*s*.86);p.lineTo(Math.cos(a+.22)*s*.42,Math.sin(a+.22)*s*.42);p.closePath();sticker(c,p,'#FFFFFF',lw*.8);}
  sticker(c,ell(0,0,s*.5,s*.5),'#2E2A33',lw);
  c.fillStyle='rgba(255,255,255,.3)';c.fill(ell(-s*.18,-s*.2,s*.13,s*.08,-.6));
  c.restore();
}
function drawIce(c,x,y,s,t){   // a soft ice cube around an iced spider
  const p=new Path2D();p.roundRect(x-s*1.05,y-s*.85,s*2.1,s*1.75,s*.35);
  c.save();c.globalAlpha=.78;sticker(c,p,'rgba(200,236,255,.75)',Math.max(2,s*.07));c.globalAlpha=1;
  c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=Math.max(2,s*.07);c.lineCap='round';
  c.beginPath();c.moveTo(x-s*.75,y-s*.45);c.quadraticCurveTo(x-s*.7,y-s*.65,x-s*.45,y-s*.68);c.stroke();
  c.beginPath();c.moveTo(x+s*.7,y+s*.4);c.lineTo(x+s*.78,y+s*.2);c.stroke();c.restore();
}
/* the super poses, as target angles for the arm on the right of the screen (degrees, 0 = out to the side, 90 = straight up);
   the arm on the left is the mirror image. Shared tolerance = Freeze & Copy "Medium" (23°). */
const POSE_TOL=23;
const POSES={zap:{ua:58,fa:58},ice:{ua:35,fa:145,together:true},power:{ua:0,fa:90}};
function drawPoseKid(c,x,neck,hw,kind,t){
  const P=POSES[kind],L1=hw*1.0,L2=hw*.92,D=Math.PI/180;
  drawKid(c,99999,neck+hw*1.6,x,neck,hw,0,t);
  for(const sd of [-1,1]){const sx=x+sd*hw*.78,sy=neck+hw*.28,ua=sd>0?P.ua:180-P.ua,fa=sd>0?P.fa:180-P.fa;
    const ex=sx+Math.cos(ua*D)*L1,ey=sy-Math.sin(ua*D)*L1,wx=ex+Math.cos(fa*D)*L2,wy=ey-Math.sin(fa*D)*L2;
    c.lineCap='round';c.lineJoin='round';c.strokeStyle=INK;c.lineWidth=hw*.28+6;c.beginPath();c.moveTo(sx,sy);c.lineTo(ex,ey);c.lineTo(wx,wy);c.stroke();
    c.strokeStyle='#4FB3A9';c.lineWidth=hw*.28;c.stroke();sticker(c,ell(wx,wy,hw*.17,hw*.17),'#F6C9A0',3);}
  drawKid(c,99999,neck+hw*1.6,x,neck,hw,0,t);
}
/* ping-pong style paddle racket */
function drawRacket(c,x,y,r,ang,col,big=false,t=0){
  const lw=Math.max(3,r*.09);
  c.save();c.translate(x,y);c.rotate(ang);
  if(big){const g=c.createRadialGradient(0,0,r*.6,0,0,r*1.5);g.addColorStop(0,'rgba(255,240,150,.55)');g.addColorStop(1,'rgba(255,240,150,0)');c.fillStyle=g;c.fillRect(-r*1.5,-r*1.5,r*3,r*3);}
  const handle=new Path2D();handle.moveTo(-r*.2,r*.8);handle.lineTo(-r*.17,r*1.75);handle.quadraticCurveTo(0,r*1.88,r*.17,r*1.75);handle.lineTo(r*.2,r*.8);handle.closePath();
  sticker(c,handle,'#E0A35E',lw);
  sticker(c,ell(0,0,r,r*.95),'#E0A35E',lw);
  c.fillStyle=col;c.fill(ell(0,0,r*.86,r*.82));
  c.fillStyle='rgba(255,255,255,.35)';c.fill(ell(-r*.35,-r*.35,r*.22,r*.14,-.6));
  if(big){c.save();c.globalAlpha=.9;for(let i=0;i<3;i++){const a=t*2+i*2.1;c.save();c.translate(Math.cos(a)*r*.55,Math.sin(a)*r*.5);sticker(c,starPath(r*.12),'#FFD84D',lw*.5);c.restore();}c.restore();}
  c.restore();
}

const video=$('v');
let mode='demo',tracker=null,camOK=false,camTried=false,lastVT=-1;
const mkBody=()=>({ok:false,nose:{x:0,y:0},sw:0,shL:{x:0,y:0},shR:{x:0,y:0},hands:[{x:0,y:0,a:0,ok:false},{x:0,y:0,a:0,ok:false}],arms:[null,null],lastSeen:0,far:false,close:false});
const bodies=[mkBody(),mkBody()],body=bodies[0];   // 2 players: bodies[0] = left half (blue), bodies[1] = right half (pink)
const duo=()=>who==='duo';
const portraitNow=()=>H>W*1.05;
function sm(o,p,k){o.x+=(p.x-o.x)*k;o.y+=(p.y-o.y)*k;}
function track(now){
  if(!tracker||video.readyState<2||video.currentTime===lastVT)return;lastVT=video.currentTime;
  const all=poseFrames(tracker,video,now,W,H);if(!all){bodies.forEach(b=>b.ok=false);return;}
  const ps=all.filter(P=>P(11).v>=.4&&P(12).v>=.4).map(P=>({P,x:(P(11).x+P(12).x)/2,sw:Math.hypot(P(11).x-P(12).x,P(11).y-P(12).y)}));
  if(!duo()){ // one player: the closest (biggest) person
    const p=ps.reduce((a,b)=>!a||b.sw>a.sw?b:a,null);if(p)updBody(body,p.P,now,W);else body.ok=false;bodies[1].ok=false;return;}
  // two players: by side of the screen (if both are on one side, the left one is blue, the right one pink)
  ps.sort((a,b)=>a.x-b.x);let slot=[null,null];
  if(ps.length>=2){slot=[ps[0],ps[ps.length-1]];}
  else if(ps.length===1)slot[ps[0].x<W/2?0:1]=ps[0];
  slot.forEach((p,k)=>{if(p)updBody(bodies[k],p.P,now,W/2);else bodies[k].ok=false;});
}
function updBody(body,P,now,refW){
  const a=P(11),b=P(12);
  const k=body.ok?.6:1;
  const L=a.x<b.x?a:b,R=a.x<b.x?b:a;sm(body.shL,L,k);sm(body.shR,R,k);sm(body.nose,P(0),k);
  const sw=Math.hypot(R.x-L.x,R.y-L.y);body.sw+=(sw-body.sw)*k;body.close=sw>refW*.62;
  [[15,13],[16,14]].forEach(([wi,ei],j)=>{const w=P(wi),e=P(ei),h=body.hands[j];
    if(w.v<.35){h.ok=false;return;}
    const tgt={x:w.x+(w.x-e.x)*.45,y:w.y+(w.y-e.y)*.45};   // racket sits just past the wrist, in line with the forearm
    if(!h.ok){h.x=tgt.x;h.y=tgt.y;}else sm(h,tgt,.65);h.a=Math.atan2(w.y-e.y,w.x-e.x)-Math.PI/2+Math.PI;h.ok=true;});
  // arms by screen side (0 = left of the screen), for the super poses
  const chains=[[11,13,15],[12,14,16]].map(([si,ei,wi])=>({s:P(si),e:P(ei),w:P(wi)}));
  if(chains[0].s.x>chains[1].s.x)chains.reverse();
  body.arms=chains.map(ch=>ch.e.v>=.4&&ch.w.v>=.35?ch:null);
  body.ok=true;body.lastSeen=now;
}
// does this player hold super pose `kind`? both arms, upper arm and forearm each within POSE_TOL of the target
function poseOk(b,kind){
  if(!b.ok||!b.arms[0]||!b.arms[1])return false;const P=POSES[kind];
  const ang=(a,c)=>Math.atan2(-(c.y-a.y),c.x-a.x)*180/Math.PI,dif=(a,c)=>Math.abs(((a-c+540)%360)-180);
  for(let k=0;k<2;k++){const A=b.arms[k],m=k?0:180,ua=k?P.ua:180-P.ua,fa=k?P.fa:180-P.fa;
    if(dif(ang(A.s,A.e),ua)>POSE_TOL||dif(ang(A.e,A.w),fa)>POSE_TOL)return false;}
  if(P.together&&Math.hypot(b.arms[0].w.x-b.arms[1].w.x,b.arms[0].w.y-b.arms[1].w.y)>b.sw*.5)return false;
  return true;
}

let pending=[null,null];   // special spider promised after a banner (one per player side)
let state='menu',tNow=0,elapsed=0,score=0,scores=[0,0],countT=0,lastNew=false,level=0,nextSpawn=[0,0],announced={};
let spiders=[],helmets=[],pops=[],puffs=[],strands=[],floaters=[],bolts=[];
/* 16 Nov (Edgar): 2-player battle — thorn balls + strikes, and super poses (first to hold the pose gets it). One player: none of this. */
let strikes=[0,0],out=[false,false],strikeT=[-9,-9],flashT=[-9,-9],iceUntil=[0,0],powerUntil=[0,0],nextMace=[0,0],sup=null,nextSup=20,supBag=[];
const rkPrev=new Map(),rkVel={};   // racket speed, for the blue spiders' dodge
const prevHit=new Map();   // racket id + spider id -> was overlapping last frame

const sideBox=k=>duo()&&state!=='menu'?{x0:k*W/2,x1:(k+1)*W/2}:{x0:0,x1:W};   // 2 players: each has their own half
function frame0(k=0){ // shoulders and size used to place the spiders
  const b=bodies[k];
  if(mode==='camera'&&b.ok)return {shL:b.shL,shR:b.shR,sw:b.sw};
  const bx=sideBox(k),cx=(bx.x0+bx.x1)/2,sw=Math.min((bx.x1-bx.x0)*.36,H*.2);return {shL:{x:cx-sw/2,y:H*.66},shR:{x:cx+sw/2,y:H*.66},sw};
}
function spawn(force,own=0){
  const F=frame0(own),bx=sideBox(own),side=Math.random()<.5?-1:1,sh=side<0?F.shL:F.shR;
  const ang=[90,65,40,15,115][Math.floor(Math.random()*5)]*Math.PI/180;   // up, high diagonal, diagonal, sideways, across over the head
  const dist=F.sw*(reach==='far'?1.55:1.15)*(.9+Math.random()*.2);
  const size=Math.floor(Math.random()*3),s=Math.max(22,F.sw*[.2,.3,.42][size]);   // small = harder to hit, big = easier
  let x=sh.x+side*Math.cos(ang)*dist,y=sh.y-Math.sin(ang)*dist;
  // 15 Nov: phone upright — sideways spiders would land past the screen edge and all pile up there.
  // Instead, tilt them upward (same distance from the shoulder) until they fit on the screen.
  const xa=bx.x0+s*1.2,xb=bx.x1-s*1.2;
  for(let a2=ang,k=0;k<12&&(x<xa||x>xb);k++){a2=a2<Math.PI/2?a2+Math.PI/36*2:a2-Math.PI/36*2;x=sh.x+side*Math.cos(a2)*dist;y=sh.y-Math.sin(a2)*dist;}
  x=Math.max(xa,Math.min(xb,x));y=Math.max(H*(H>W?.12:.2),Math.min(H*.78,y));
  if(spiders.some(o=>o.state!=='fly'&&Math.hypot(o.x-x,o.ty-y)<s*2.2))return false;   // don't stack spiders
  if(force==='m'){spiders.push({id:Math.random(),own,x,ty:y,y:-40,s:Math.max(26,F.sw*.3),type:'m',hp:1,state:'down',t0:tNow,life:7,hangT:0,dodgeReady:1e9,face:'happy',swing:0,sv:0,faceT:0,k:1});FX.zip();return true;}
  let type='n';const r=Math.random();
  if(elapsed>=60){if(r<.2)type='b';else if(r<.36)type='h';else if(r<.58)type='r';}
  else if(elapsed>=45){if(r<.18)type='h';else if(r<.45)type='r';}
  else if(elapsed>=30){if(r<.4)type='r';}
  if(force)type=force;
  const iced=duo()&&tNow<iceUntil[own];
  spiders.push({id:Math.random(),own,x,ty:y,y:-40,s,type,hp:SPIDER[type].hp,state:'down',t0:tNow,life:3+(type==='h'?2:type==='r'||type==='b'?1:0)+(iced?2:0),hangT:0,dodgeReady:0,face:'happy',swing:0,sv:0,faceT:0,k:1,ice:iced});
  FX.zip();return true;
}
const RK_COL=[['#FF7A66','#5FB7F0'],['#5FB7F0','#5FB7F0'],['#FF9FC6','#FF9FC6']];   // one player: red + blue; 2 players: blue (left) / pink (right)
function rackets(){
  const res=[],n=duo()?2:1;
  for(let k=0;k<n;k++){
    if(duo()&&out[k])continue;
    const pw=duo()&&tNow<powerUntil[k],F=frame0(k),r=Math.max(26,F.sw*.27)*(pw?1.5:1),col=duo()?RK_COL[k+1]:RK_COL[0],bigCol=duo()?col[0]:'#8BD16B',two=twoOn&&!duo();
    if(mode==='camera'){
      const b=bodies[k],[h0,h1]=b.hands;if(!b.ok)continue;
      if(two&&h0.ok&&h1.ok&&Math.hypot(h0.x-h1.x,h0.y-h1.y)<F.sw*.55)res.push({id:k+'big',own:k,x:(h0.x+h1.x)/2,y:(h0.y+h1.y)/2,r:r*1.33,a:(h0.a+h1.a)/2,big:true,col:bigCol});
      else b.hands.forEach((h,j)=>{if(h.ok)res.push({id:k+'h'+j,own:k,x:h.x,y:h.y,r,a:h.a,big:pw,power:pw,col:col[j]});});
    } else {
      const bx=sideBox(k),pts=[...touches.values()].filter(p=>p.x>=bx.x0&&p.x<bx.x1);
      if(two&&pts.length>=2&&Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)<F.sw*.55)res.push({id:k+'big',own:k,x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2,r:r*1.33,a:0,big:true,col:bigCol});
      else pts.slice(0,2).forEach((p,j)=>res.push({id:k+'t'+j,own:k,x:p.x,y:p.y,r,a:0,big:pw,power:pw,col:col[j]}));
    }
  }

}

    // setup: fit the see-through avatar (head in the middle, trunk and hands visible) and hold
    const ob=b=>b.ok?{x:b.nose.x,y:b.nose.y,size:b.sw,arms:b.hands[0].ok&&b.hands[1].ok}:null;
    if(mode==='camera'&&!duo()&&guide.update(dt,ob(body),{x:0,y:0,w:W,h:H})==='done'){state='count';countT=tNow;msg('');}

    else{el.style.display='none';el.textContent='';state='play';spiders=[];SFX.boing();nextSpawn=[tNow+.4,tNow+.4];}
  }
  else if(state==='play'){
    const players=duo()?bodies:[body];
    const lost=mode==='camera'&&players.some(b=>!b.ok||now-b.lastSeen>600);
    if(lost){msg(duo()?UI[lang].both:UI[lang].body);}
    else{
      if(msgNow)msg('');

      elapsed+=dt;$('time').textContent=Math.max(0,Math.ceil(roundLen-elapsed));

  // zap bolts: soft yellow zig-zags from the top to each zapped spider
  bolts=bolts.filter(b=>(b.life-=dt)>0);
  for(const b of bolts){ctx.save();ctx.globalAlpha=Math.min(1,b.life*3);const n=7,pts=[];for(let i=0;i<=n;i++){const k=i/n;pts.push([b.x+(i&&i<n?Math.sin(b.seed+i*2.3+tNow*40)*22:0),b.y*k]);}
    for(const [w,c] of [[11,INK],[6,'#FFE45C']]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();}ctx.restore();}
  if(duo()&&state==='play')drawBattle();
  // points floating up
  floaters=floaters.filter(f=>(f.life-=dt)>0);
  for(const f of floaters){f.y-=dt*60;const fs=f.fs||26;ctx.save();ctx.globalAlpha=Math.min(1,f.life*2.5);ctx.font=`900 ${fs}px Grandstander,Fredoka,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='ltr';
    ctx.lineJoin='round';ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);ctx.restore();}
  // rackets
  if(state==='play'||state==='count'||(state==='ready'&&!cam)){
    for(const rk of rackets())drawRacket(ctx,rk.x,rk.y,rk.r,rk.a,rk.col,rk.big,tNow);
  }
  if(turn)drawTurnPhone();
}

/* battle layer: strike slots, red flash, "out" halves, the super-pose card and each player's hold star */
function drawBattle(){
  const u=UI[lang];
  for(const k of [0,1]){const x0=k*W/2;
    if(tNow-flashT[k]<.5){ctx.fillStyle=`rgba(240,96,77,${.35*(1-(tNow-flashT[k])/.5)})`;ctx.fillRect(x0,0,W/2,H);}
    if(out[k]){ctx.fillStyle='rgba(255,248,236,.6)';ctx.fillRect(x0,0,W/2,H);bubbleC(u.out[k],x0+W/4,H*.5,22,k?'#FFE3E8':'#DDF3FF');}
    // 3 strike slots in the outer top corner of each half: a little thorn ball fills each one
    const r=12;for(let i=0;i<3;i++){const x=k?W-26-i*32:26+i*32,y=H-30;
      if(i<strikes[k])drawMace(ctx,x,y,r*1.1,0);else{ctx.save();ctx.globalAlpha=.85;sticker(ctx,ell(x,y,r*.7,r*.7),'rgba(255,255,255,.8)',2.5);ctx.restore();}}
    if(tNow<powerUntil[k]){const left=Math.ceil(powerUntil[k]-tNow);bubbleC('💪 '+left,x0+W/4,H-30,18,'#FFF1B8');}
    if(tNow<iceUntil[k]){const left=Math.ceil(iceUntil[k]-tNow);bubbleC('🧊 '+left,x0+W/4,H-30,18,'#DDF3FF');}
  }
  if(!sup)return;
  // the pose card in the middle
  const cw=Math.min(W*.2,H*.36),ch=cw*1.25,cx=W/2,cy=H*.22+ch/2,pop=Math.min(1,(tNow-sup.t0)/.25);
  ctx.save();ctx.translate(cx,cy);ctx.scale(pop,pop);ctx.translate(-cx,-cy);
  const p=new Path2D();p.roundRect(cx-cw/2,cy-ch/2,cw,ch,20);sticker(ctx,p,'rgba(255,248,236,.95)',4);
  ctx.save();ctx.clip(p);drawPoseKid(ctx,cx,cy+ch*.18,cw*.19,sup.kind,tNow);ctx.restore();
  ctx.restore();
  bubbleC(u.sup[sup.kind].split(' ')[0]+' '+u.supName[sup.kind],cx,cy+ch/2+4,17,'#FFF1B8');
  bubbleC('⏱ '+Math.max(0,Math.ceil(sup.until-tNow)),cx,cy-ch/2-2,15,'#fff');
  // each player's hold star, above their head
  for(const k of [0,1]){if(out[k])continue;const b=bodies[k],x=b.ok?b.nose.x:W*(k?.75:.25),y=b.ok?Math.max(70,b.nose.y-b.sw*1.1):H*.25,R=26,pr=sup.prog[k];
    const sp=starPath(R);ctx.save();ctx.translate(x,y);sticker(ctx,sp,'rgba(255,255,255,.85)',3);
    ctx.save();ctx.clip(sp);ctx.fillStyle=k?'#FF9FB0':'#7FC8F8';ctx.fillRect(-R,R-2*R*pr,2*R,2*R*pr);ctx.restore();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke(sp);ctx.restore();}
}
function bubbleC(txt,x,y,fs,fill){
  ctx.save();ctx.font=`700 ${fs}px Fredoka,sans-serif`;ctx.direction=lang==='he'?'rtl':'ltr';ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(txt).width+fs*1.4,h=fs*1.9,bp=new Path2D();bp.roundRect(x-w/2,y-h/2,w,h,h/2);sticker(ctx,bp,fill,3);
  ctx.fillStyle=INK;ctx.fillText(txt,x,y+1);ctx.restore();
}
function drawTurnPhone(){
  ctx.fillStyle='rgba(255,248,236,.93)';ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H*.4,s=Math.min(W,H)*.3,k=(tNow%2.4)/2.4,rot=-Math.PI/2*Math.min(1,Math.max(0,(k-.3)*3));
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);const p=new Path2D();p.roundRect(-s*.32,-s*.58,s*.64,s*1.16,s*.12);sticker(ctx,p,'#fff',5);
  ctx.fillStyle='#DDF3FF';ctx.fillRect(-s*.24,-s*.46,s*.48,s*.92);drawSpider(ctx,0,0,s*.14,'n','happy',tNow,1);ctx.restore();
  ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx,cy,s*.85,-Math.PI*.9,-Math.PI*.55);ctx.stroke();
  const fs=Math.max(18,Math.min(26,W*.055));ctx.font=`700 ${fs}px Fredoka,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction=lang==='he'?'rtl':'ltr';
  const t=UI[lang].turn,tw=Math.min(W*.92,ctx.measureText(t).width+fs*1.4),bp=new Path2D();bp.roundRect(cx-tw/2,H*.74-fs*1.1,tw,fs*2.2,fs);sticker(ctx,bp,'#FFF6D6',4);
  ctx.fillStyle=INK;ctx.fillText(t,cx,H*.74,W*.88);
}
/* ================= HOW TO PLAY (cartoon for a 5-year-old) ================= */
{
  const lerpP=(a,b,k)=>({x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k});
  // the seated child: head + shoulders, two arms reaching to hands hL / hR (screen px); racket on each hand, or one big one
  function kid(c,w,h,hL,hR,t,big){const hw=Math.min(w*.15,h*.24),x=w*.5,neck=h*.72;drawKid(c,w,h,x,neck,hw,0,t);
    const rr=hw*.42;
    for(const [side,hd] of [[-1,hL],[1,hR]]){const sx=x+side*hw*.78,sy=neck+hw*.28,mx=(sx+hd.x)/2+side*hw*.25,my=(sy+hd.y)/2+hw*.25;
      c.lineCap='round';c.lineJoin='round';c.strokeStyle=INK;c.lineWidth=hw*.28+6;c.beginPath();c.moveTo(sx,sy);c.lineTo(mx,my);c.lineTo(hd.x,hd.y);c.stroke();
      c.strokeStyle='#4FB3A9';c.lineWidth=hw*.28;c.stroke();
      if(!big)drawRacket(c,hd.x+(hd.x-mx)*.35,hd.y+(hd.y-my)*.35,rr,Math.atan2(hd.y-my,hd.x-mx)+Math.PI/2,side<0?'#FF7A66':'#5FB7F0',false,t);}
    if(big){const m=lerpP(hL,hR,.5);drawRacket(c,m.x,m.y-rr*.6,rr*1.4,0,'#8BD16B',true,t);}
    drawKid(c,w,h,x,neck,hw,0,t);
    return {hw,neck};}
  function spider(c,x,y,s,t,o={}){
    if(!o.fly){c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=2.5;c.beginPath();c.moveTo(x,-5);c.lineTo(x,y-s*.4);c.stroke();drawSpider(c,x,y,s,o.type||'n',o.face||'happy',t,1);}
    else{c.save();c.translate(x,y);c.rotate(o.fly*8);c.scale(1-o.fly*.6,1-o.fly*.6);drawSpider(c,0,0,s,o.type||'n','dizzy',t,1);c.restore();
      for(let i=0;i<6;i++){const a=i/6*6.3;c.globalAlpha=Math.max(0,1-o.fly*1.5);sticker(c,ell(x+Math.cos(a)*s*(.4+o.fly*2),y+Math.sin(a)*s*(.4+o.fly*2),s*.3,s*.25),'#fff',3);c.globalAlpha=1;}}
  }
  const night=(c,w,h)=>{const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#BFE6FF');g.addColorStop(1,'#E8F7FF');c.fillStyle=g;c.fillRect(0,0,w,h);};
  setupHowTo({lang:()=>lang,play:()=>play(),steps:[
    {dur:2.4,cap:{en:'Your hands are rackets 🏓',he:'הידיים שלכם הן מחבטים 🏓'},draw(c,w,h,t,k){night(c,w,h);c.translate(0,h*.14);const hw=Math.min(w*.15,h*.24),wv=Math.sin(t*4)*hw*.2;
      kid(c,w,h,{x:w*.5-hw*1.6,y:h*.62+wv},{x:w*.5+hw*1.6,y:h*.62-wv},t,false);}},
    {dur:3,cap:{en:'Swat the spiders! 🕷️',he:'מעיפים את העכבישים! 🕷️'},draw(c,w,h,t,k){night(c,w,h);c.translate(0,h*.14);const hw=Math.min(w*.15,h*.24),sp={x:w*.5+hw*2.4,y:h*.3};
      const drop=seg(k,0,.25),reach=seg(k,.3,.6),fly=k>.6?seg(k,.6,1):0;
      kid(c,w,h,{x:w*.5-hw*1.6,y:h*.62},lerpP({x:w*.5+hw*1.6,y:h*.62},{x:sp.x-hw*.25,y:sp.y+hw*.45},reach),t,false);
      if(!fly)spider(c,sp.x,sp.y*drop,hw*.35,t,{face:reach>.6?'oops':'happy'});else spider(c,sp.x+fly*w*.3,sp.y-fly*h*.6,hw*.35,t,{fly});}},
    {dur:3,cap:{en:'Hands together = BIG racket!',he:'ידיים ביחד = מחבט ענק!'},draw(c,w,h,t,k){night(c,w,h);c.translate(0,h*.14);const hw=Math.min(w*.15,h*.24),up=seg(k,.1,.5),fly=k>.55?seg(k,.55,1):0,top={x:w*.5,y:h*.22};
      kid(c,w,h,lerpP({x:w*.5-hw*1.6,y:h*.62},{x:w*.5-hw*.15,y:h*.33},up),lerpP({x:w*.5+hw*1.6,y:h*.62},{x:w*.5+hw*.15,y:h*.33},up),t,up>.8);
      for(const d of [-1,1]){const x=top.x+d*hw*.5;if(!fly)spider(c,x,top.y,hw*.3,t,{type:'r',face:up>.6?'oops':'happy'});else spider(c,x+d*fly*w*.3,top.y-fly*h*.5,hw*.3,t,{type:'r',fly});}}},
    {dur:2.2,cap:{en:'Swat as many as you can ⭐',he:'מעיפים כמה שיותר ⭐'},draw(c,w,h,t,k){night(c,w,h);c.translate(0,h*.14);const hw=Math.min(w*.15,h*.24),wv=Math.abs(Math.sin(t*6))*hw*.4;
      kid(c,w,h,{x:w*.5-hw*1.7,y:h*.5-wv},{x:w*.5+hw*1.7,y:h*.5-wv},t,false);
      for(let i=0;i<8;i++){const a=i/8*6.3,r=h*(.08+k*.3);bigStar(c,w*.5+Math.cos(a)*r*1.6,h*.35+Math.sin(a)*r,15*(1.2-k*.6),a+k*3);}}}
  ]});
}
setLang(lang);loadBest();
requestAnimationFrame(frame);
