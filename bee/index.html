<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bee &amp; Flowers · Bamboo Physio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
.stopx{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:7;width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid var(--ink);font:900 20px Fredoka,sans-serif;box-shadow:0 3px 0 var(--ink);display:none;cursor:pointer}

.snd.cast{font-size:19px}

.levels.modes .lv{max-width:170px}
.levels.modes .lv canvas{width:110px;height:64px}

.btn2:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.best{font:700 15px Fredoka,sans-serif;margin:-4px 0 8px;text-align:center;min-height:18px}
.vs-names{display:flex;justify-content:center;gap:28px;font:700 15px Fredoka,sans-serif;margin:-2px 0 10px}
body.casting .toast{visibility:hidden}
@media (max-height:520px){
  .card{padding:10px 14px 8px}
  h1{font-size:26px}
  .sub{display:none}
  .levels{margin:0 0 8px}
  .levels.modes .lv canvas{width:76px;height:44px}
  .btn{font-size:24px;padding:6px 0 5px}

}

<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>

<div class="top">
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 33 C 10 20, 20 9, 34 6 C 33 20, 24 31, 8 33 Z" fill="#7DCB6B" stroke="#2b2118" stroke-width="3.5" stroke-linejoin="round"/><path d="M11 30 C 17 23, 23 16, 29 11" fill="none" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round"/></svg><span>Bamboo Physio</span></div>
  <div class="tr"><button class="snd cast" id="cast">📺</button><button class="snd" id="snd" aria-pressed="false">🔊</button>
  <div class="lang"><button id="lang-en" aria-pressed="true">EN</button><button id="lang-he" aria-pressed="false">עב</button></div></div>
</div>

<div class="toast" id="toast"></div>
<button class="stopx" id="stopx" aria-label="Stop">✕</button>

<div class="card home" id="start">

  <button class="btn" id="play"><span id="t-play">Play</span></button>
  <div class="levels modes" id="modes">

    <button class="lv" data-m="duo"><canvas width="220" height="128"></canvas><b id="t-duo"></b></button>
  </div>
  <div class="best" id="best"></div>
  <p class="note" id="t-privacy"></p>
  <details id="grown">
    <summary id="t-grown">For grown-ups</summary>
    <div class="g-body">
      <p id="t-g1"></p>
      <div class="g-row"><span id="t-endj">End with a jump</span>
        <div class="seg" id="endj-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-side">Beehives (1 player)</span>
        <div class="seg" id="side-seg"><button data-v="both"></button><button data-v="left"></button><button data-v="right"></button></div></div>
      <div class="g-row"><span id="t-tall">Thorns to jump over</span>

      <p id="t-g3"></p>

</div>

  <h1 id="t-over"></h1>
  <div class="big-score" dir="ltr"><span id="final">0</span></div>

  <button class="btn2" id="menu"></button>
  <p class="note" id="t-privacy2"></p>

<script type="module">
/* Bee & Flowers — v3, Edgar 19 Nov 2026: an OBSTACLE COURSE for bees.
   (v1 whole body + floor, v2 squat/jump detection: both didn't work in his tests.)
   · Go to the beehive at the side of the screen: a bee hops onto your head and follows your head everywhere.
   · Carry it to the flower on the other side (2 players: each starts at their outer edge, the flowers are in the middle),
     through thorn plants: some hang from the top (duck under), some grow from the bottom (stay tall / go over),
     some leave only a gap. Later levels: deeper ducks, more thorns.
   · The flower hangs high: the last move is a JUMP (grown-ups option "End with a jump", default on).
   · The bee touches the flower -> it sticks at once (no holding: you can't hold in mid-air). Then: back to the hive for
     a new bee and the next level.
   · Thorns touch the bee -> "ouch", the bee flies back to the hive, try again.
   · Distance: the head has to be in the middle band of the screen (40–60% of the height) to start, so the child stands
     at the right distance. During play, if the child walks much closer or farther (shoulder width changes), the bee lets
     go and waits until the child comes back to the right spot and picks it up again — walking closer can't replace a jump.
   No body-move recognition at all: only where the head is. 90 s. Nothing is recorded or sent. */
import {INK,$,LS,S,audio,tone,SFX,musicStart,musicStop,bindSound,ell,sticker,starPath,camLoad,timeoutP,setupGoal,goalText,fmtTime,goalBest} from '../shared/kit.js';
import {setupCast} from '../shared/cast.js';
import {setupHowTo,bigStar,ease} from '../shared/howto.js';
import {drawBee,drawFlower,drawHolder,drawKid,drawGarden,drawMeadow,drawThorns,drawDizzy,drawHive,BOWS} from './art.js';

const ROUND=90,BAND=[.4,.6];
const UI={
 en:{title:"Bee & Flowers",sub:"Carry the bee on your head through the thorns to the flower!",subG:n=>"Bring "+n+" bees to their flowers!",subG2:n=>"First to "+n+" flowers wins!",flowers:"flowers",play:"Play",solo:"1 player",duo:"2 players",
  privacy:"The camera is used only to play. Nothing is recorded or sent.",grown:"For grown-ups",
  g1:"Go to the beehive at the side of the screen: a bee sits on your head and follows it. Carry it to the flower on the other side without touching the thorns: duck under the ones hanging from the top, stay tall over the ones growing from the bottom, squeeze through the gaps. The flower hangs high, so the course ends with a jump. Touch the flower and the bee stays there; the next bee waits in the hive on that side, so the child goes back and forth (grown-ups can choose one side only). If a thorn touches the bee, it flies back to the hive. 90 seconds. 2 players: each starts at their own side, the flowers are in the middle.",
  endj:"End with a jump",side:"Beehives (1 player)",both:"Both sides",left:"Left",right:"Right",tall:"Thorns to jump over",on:"On",off:"Off",music:"Music",sfx:"Sound effects",mute:"Sound on or off",
  g2:"★ Stand the phone or tablet up sideways, at about chest height of the child, so the camera sees the head and shoulders. The game starts only when the head is in the sunny stripe in the middle of the screen: step closer or farther until it is. Walking much closer or farther during the game makes the bee let go.",
  g3:"★ \"Thorns to jump over\" (from level 3) adds thorns that only a jump clears — hard for most children.",
  legal:"A home practice game by Bamboo Physio. Not a medical device. © 2026 Bamboo Physio · Instrument sounds: FluidR3_GM by Frank Wen, CC BY 3.0",
  ready:"Getting ready…",go:"Go!",turn:"Turn the phone sideways to play",nocam:"No camera here. Drag your finger to move the head.",aria:"Game area",
  band:"Put your head in the sunny stripe",two:"Two players: both heads in the sunny stripe",high_back:"Head too high — step back a little",high_tilt:"Head too high — tilt the phone down a little",low_closer:"Head too low — come a little closer",low_tilt:"Head too low — tilt the phone up a little",like:"Stand like this",
  closer:"Come a little closer",back:"Step back a little",find:"Stand in front of the camera",
  hive:"Go get a bee!",again:"Back to the hive for a new bee!",letgo:"The bee let go — come back to it",
  ouch:"Ouch!",level:n=>"Level "+n,
  blue:"Blue",pink:"Pink",winL:"Blue wins!",winR:"Pink wins!",tie:"A tie!",best:n=>"Best: "+n+" 🌼",newBest:"New record!",great:"Great job!",
  playagain:"Play again",menu:"Menu"},
 he:{title:"הדבורה והפרחים",sub:"העבירו את הדבורה שעל הראש בין הקוצים אל הפרח!",subG:n=>"הביאו "+n+" דבורים אל הפרחים!",subG2:n=>"מי שמגיע ראשון ל־"+n+" פרחים מנצח!",flowers:"פרחים",play:"שחקו",solo:"שחקן אחד",duo:"2 שחקנים",
  privacy:"המצלמה משמשת רק למשחק. שום דבר לא מוקלט ולא נשלח.",grown:"למבוגרים",
  g1:"הולכים לכוורת בצד המסך: דבורה יושבת על הראש ונעה איתו. מעבירים אותה אל הפרח בצד השני בלי לגעת בקוצים: מתכופפים מתחת לקוצים שתלויים מלמעלה, נשארים זקופים מעל הקוצים שצומחים מלמטה, ועוברים ברווחים. הפרח תלוי גבוה, אז המסלול נגמר בקפיצה. נוגעים בפרח והדבורה נשארת שם; הדבורה הבאה מחכה בכוורת שבאותו צד, כך שהילד הולך הלוך ושוב (מבוגרים יכולים לבחור צד אחד בלבד). אם קוץ נוגע בדבורה, היא עפה בחזרה לכוורת. 90 שניות. 2 שחקנים: כל אחד מתחיל בצד שלו, הפרחים באמצע.",
  endj:"סיום בקפיצה",side:"כוורות (שחקן אחד)",both:"שני הצדדים",left:"שמאל",right:"ימין",tall:"קוצים לקפוץ מעליהם",on:"פועל",off:"כבוי",music:"מוזיקה",sfx:"צלילים במשחק",mute:"הפעלת או השתקת קול",
  g2:"★ העמידו את הטלפון או הטאבלט לרוחב, בערך בגובה החזה של הילד, כך שהמצלמה רואה את הראש והכתפיים. המשחק מתחיל רק כשהראש בפס השמש באמצע המסך: מתקרבים או מתרחקים עד שהוא שם. התקרבות או התרחקות גדולה באמצע המשחק גורמת לדבורה לעזוב.",
  g3:"★ \"קוצים לקפוץ מעליהם\" (משלב 3) מוסיף קוצים שרק קפיצה עוברת מעליהם — קשה לרוב הילדים.",
  legal:"משחק תרגול ביתי של Bamboo Physio. לא מכשיר רפואי. © 2026 Bamboo Physio · צלילי כלים: FluidR3_GM מאת Frank Wen, ‏CC BY 3.0",
  ready:"מתכוננים…",go:"יוצאים!",turn:"סובבו את הטלפון לרוחב כדי לשחק",nocam:"אין כאן מצלמה. גררו את האצבע כדי להזיז את הראש.",aria:"אזור המשחק",
  band:"שימו את הראש בפס השמש",two:"2 שחקנים: שני הראשים בפס השמש",high_back:"הראש גבוה מדי — התרחקו קצת",high_tilt:"הראש גבוה מדי — הטו קצת את הטלפון למטה",low_closer:"הראש נמוך מדי — התקרבו קצת",low_tilt:"הראש נמוך מדי — הטו קצת את הטלפון למעלה",like:"עמדו ככה",
  closer:"התקרבו קצת",back:"התרחקו קצת",find:"עמדו מול המצלמה",
  hive:"לכו להביא דבורה!",again:"חוזרים לכוורת לדבורה חדשה!",letgo:"הדבורה עזבה — חזרו אליה",
  ouch:"אאוץ׳!",level:n=>"שלב "+n,
  blue:"כחול",pink:"ורוד",winL:"הכחול ניצח!",winR:"הוורוד ניצח!",tie:"תיקו!",best:n=>"שיא: "+n+" 🌼",newBest:"שיא חדש!",great:"כל הכבוד!",
  playagain:"עוד פעם",menu:"תפריט"}
};

let lang=LS.get('bamboo-lang','en'); if(!UI[lang])lang='en';
let mode=LS.get('bee-mode','solo'); if(!['solo','duo'].includes(mode))mode='solo';
let endJump=LS.get('bee-endj','1')!=='0', tallOn=LS.get('bee-tall','0')==='1';
let side=LS.get('bee-side','both'); if(!['both','left','right'].includes(side))side='both';   // 1 player: hives on both sides (alternate) or one side only
let best=+LS.get('bee-best3','0')||0;
const QS=new URLSearchParams(location.search),FAKE=QS.has('fake'),SPEED=FAKE?(+QS.get('speed')||1):1;   // ?fake = no camera, drag a finger as the head (testing)
S.track='meadow'; S.amb='none'; S.ambOn=false;
const syncSound=bindSound(()=>UI[lang]);
let casting=false;
const cast=setupCast({canvas:$('c'),button:$('cast'),lang:()=>lang,sound:()=>(audio(),S),onChange:v=>{casting=v;document.body.classList.toggle('casting',v);}});

function segs(){
  const u=UI[lang];
  document.querySelectorAll('#endj-seg button').forEach(b=>{b.textContent=u[b.dataset.v==='1'?'on':'off'];b.setAttribute('aria-pressed',(b.dataset.v==='1')===endJump);});
  document.querySelectorAll('#tall-seg button').forEach(b=>{b.textContent=u[b.dataset.v==='1'?'on':'off'];b.setAttribute('aria-pressed',(b.dataset.v==='1')===tallOn);});
  document.querySelectorAll('#side-seg button').forEach(b=>{b.textContent=u[b.dataset.v];b.setAttribute('aria-pressed',b.dataset.v===side);});
  document.querySelectorAll('#modes .lv').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
  $('best').textContent=mode==='solo'&&best?u.best(best):'';
}
let lastRes=null;
function setLang(l){
  lang=l;LS.set('bamboo-lang',l);const u=UI[l];
  document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';document.querySelector('.top').dir='ltr';
  for(const k of ['title','sub','play','privacy','grown','g1','endj','side','tall','music','sfx','g2','g3','legal','solo','duo'])
    {const e=$('t-'+k);if(e)e.textContent=u[k];}
  $('t-privacy2').textContent=u.privacy;$('menu').textContent=u.menu;document.title=u.title+' · Bamboo Physio';
  $('lang-en').setAttribute('aria-pressed',l==='en');$('lang-he').setAttribute('aria-pressed',l==='he');
  $('c').setAttribute('aria-label',u.aria);
  segs();subLine&&subLine();syncSound();cast.paint&&cast.paint();if(lastRes&&!$('end').hidden)fillEnd();
}
$('lang-en').onclick=()=>setLang('en');$('lang-he').onclick=()=>setLang('he');
document.querySelectorAll('#endj-seg button').forEach(b=>b.onclick=()=>{endJump=b.dataset.v==='1';LS.set('bee-endj',endJump?'1':'0');SFX.tink();segs();});
/* 20 Nov (Edgar): play until a number of flowers instead of 90 seconds (2 players: first to the goal wins) */
const goal=setupGoal({key:'bee',min:3,max:20,step:1,def:6,unit:{en:'flowers',he:'פרחים'},onChange:()=>subLine()});
let G=0;
function subLine(){const n=goal.get(),u=UI[lang];$('t-sub').textContent=n?(mode==='duo'?u.subG2(n):u.subG(n)):u.sub;}
document.querySelectorAll('#tall-seg button').forEach(b=>b.onclick=()=>{tallOn=b.dataset.v==='1';LS.set('bee-tall',tallOn?'1':'0');SFX.tink();segs();});
document.querySelectorAll('#side-seg button').forEach(b=>b.onclick=()=>{side=b.dataset.v;LS.set('bee-side',side);SFX.tink();segs();});
document.querySelectorAll('#modes .lv').forEach(b=>b.onclick=()=>{mode=b.dataset.m;LS.set('bee-mode',mode);SFX.tink();segs();subLine();});

/* ================= CANVAS ================= */
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',resize);resize();
function toast(t,ms=4000){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.tm);if(ms)toast.tm=setTimeout(()=>e.classList.remove('on'),ms);}

/* ================= SOUND ================= */
const FX={
  buzz(){tone({f0:190,f1:240,dur:.5,type:'sawtooth',vol:.05,filter:700,q:2});tone({f0:197,f1:232,dur:.5,type:'sawtooth',vol:.04,filter:900,q:2,at:.02});},
  hop(){tone({f0:500,f1:900,dur:.14,type:'sine',vol:.18});},
  sip(k=0){const f=[660,740][k]||660;tone({f0:f,f1:f*1.6,dur:.12,type:'sine',vol:.22});SFX.sparkle();},
  ouch(){tone({f0:900,f1:420,dur:.25,type:'triangle',vol:.2});tone({f0:300,f1:200,dur:.3,type:'sine',vol:.12,at:.08});},
  letgo(){tone({f0:600,f1:380,dur:.2,type:'sine',vol:.12});},
  whistle(){tone({f0:1900,f1:2100,dur:.5,type:'sine',vol:.14});tone({f0:2000,f1:2250,dur:.5,type:'sine',vol:.08});},
  win(){[784,988,1175,1568].forEach((f,i)=>tone({f0:f,dur:.28,type:'triangle',vol:.28,at:i*.08}));}
};

/* ================= CAMERA + POSE TRACKING (on device) ================= */
const video=$('v');
let tracker=null,camOK=false,lastVT=-1,people=[];
const vmap=()=>{const vw=video.videoWidth||640,vh=video.videoHeight||480,s=Math.max(W/vw,H/vh);return {vw,vh,s,ox:(W-vw*s)/2,oy:(H-vh*s)/2};};
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();
  const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts=(d,k)=>({baseOptions:{modelAssetPath:`https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${k}/float16/1/pose_landmarker_${k}.task`,delegate:d},
    runningMode:'VIDEO',numPoses:2,minPoseDetectionConfidence:.45,minPosePresenceConfidence:.45,minTrackingConfidence:.45});
  let err=null;
  for(const [d,k] of [['GPU','full'],['GPU','lite'],['CPU','lite']]){try{tracker=await timeoutP(vision.PoseLandmarker.createFromOptions(files,opts(d,k)),d==='GPU'?30000:120000);break;}catch(e){err=e;}}
  if(!tracker)throw err||new Error('model');
  camOK=true;
}
/* each person -> nose, head (average of nose + ears), shoulder width (size = distance from the camera) */
function track(now){
  if(!tracker||video.readyState<2||video.currentTime===lastVT)return false;lastVT=video.currentTime;
  let res;try{res=tracker.detectForVideo(video,now);}catch(e){return false;}
  const m=vmap(),L=res.landmarks||[];
  people=L.map(lm=>{const p=lm.map(q=>({x:m.ox+(1-q.x)*m.vw*m.s,y:m.oy+q.y*m.vh*m.s,v:q.visibility??1}));
    const hs=[0,7,8].filter(i=>p[i].v>.4),hy=hs.length?hs.reduce((a,i)=>a+p[i].y,0)/hs.length:p[0].y;
    return {nose:p[0],hx:p[0].x,hy,sw:Math.hypot(p[11].x-p[12].x,p[11].y-p[12].y),cx:p[0].x,ok:p[0].v>.5};}).filter(p=>p.ok);
  people.sort((a,b)=>a.cx-b.cx);
  if(mode==='solo'&&people.length>1)people=[people.reduce((a,b)=>b.sw>a.sw?b:a)];   // 1 player: the closest person
  return true;
}
/* is this head where it should be? (setup) */
const SIZE=()=>mode==='duo'?[.16,.3,.6]:[.08,.15,.34];   // shoulder width ÷ lane width: min, ideal, max
/* the head height comes first (Edgar, 19 Nov: head above the stripe but the hint said "come closer").
   Which way to fix it depends on the size: big + head high = too close; small + head high = phone pointing too low. */
function fit(p,lane){
  if(!p)return 'find';
  const [mn,mid,mx]=SIZE(),r=p.sw/lane.w;
  if(p.nose.y<H*BAND[0])return r>=mid*.85?'high_back':'high_tilt';
  if(p.nose.y>H*BAND[1])return r<=mid*1.15?'low_closer':'low_tilt';
  if(r<mn)return 'closer';
  if(r>mx)return 'back';
  return '';
}

/* ================= PLAYERS / LANES / COURSES ================= */
function lanes(){return mode==='duo'?[{x:0,w:W/2,dir:1},{x:W/2,w:W/2,dir:-1}]:[{x:0,w:W,dir:1}];}
// dir 1: hive on the left, flower on the right. 2 players: the right child's hive is on the right edge, flower in the middle.
let players=[];
function makePlayer(k){
  const ln=lanes()[k];
  return {k,ln,dir:ln.dir,score:0,level:1,course:[],flower:null,ref:null,head:null,size:1,seenT:-9,badT:0,distBad:'',
    bee:{st:'hive',x:0,y:0,t:0,from:null,mood:'happy',dir:ln.dir},old:null,pop:-9,ouchT:-9,fake:{x:0,y:0}};
}
function personFor(k){
  if(mode==='solo')return people[0]||null;
  if(people.length>=2)return people[k];
  const p=people[0];if(!p)return null;return (p.cx<W/2?0:1)===k?p:null;
}
const U=P=>P.ref.u;
const beeR=P=>P.ref.u*.24;
// P.dir 1: hive on the left, flower on the right; -1: the other way round. 1 player "both sides": flips every level,
// so the next bee waits where the child already is and the child goes back and forth.
const hiveX=P=>P.dir>0?P.ln.x+P.ln.w*.07:P.ln.x+P.ln.w*.93;
const flowerX=P=>mode==='duo'?(P.dir>0?P.ln.x+P.ln.w*.9:P.ln.x+P.ln.w*.1):(P.dir>0?P.ln.x+P.ln.w*.93:P.ln.x+P.ln.w*.07);
const beeStand=P=>P.ref.top-beeR(P)*1.1;     // the bee sits on top of the head while standing
const home=P=>({x:hiveX(P)+P.dir*U(P)*.6,y:beeStand(P)});   // where the new bee waits, next to the hive
/* the course for each level (Edgar, 19 Nov: gentler climb, gaps one at a time).
   top d   = hangs from the top; the bee must come down d shoulder widths (+ its own size) to pass under
   low     = grows from the bottom; stay tall over it
   gap c,g = a hole centred c shoulder widths below the standing bee, g shoulder widths tall
   tall    = grows higher than the bee: only a jump clears it (grown-ups option, from level 5) */
function plan(L){
  const R=(a,b)=>a+Math.random()*(b-a);
  switch(L){
    case 1:return [['top',.45]];
    case 2:return [['low']];
    case 3:return [['top',.55],['low']];
    case 4:return [['gap',.75,1.3]];                         // first gap: big and easy
    case 5:return [['top',.65],['gap',.75,1.2]];
    case 6:{const c=R(.7,.85);return [['gap',c,1.15],['gap',c,1.15]];}   // two gaps, same height
    case 7:return Math.random()<.5?[['gap',.55,1.05],['gap',1,1.05]]:[['gap',1,1.05],['gap',.55,1.05]];   // two heights
    default:{const out=[];for(let i=0;i<3;i++)out.push(Math.random()<.75?['gap',R(.5,1.1),1]:['top',R(.7,.9)]);return out;}
  }
}
function newCourse(P){
  const L=P.level,u=U(P),by=beeStand(P),hx=hiveX(P),fx=flowerX(P),a=hx+(fx-hx)*.16,b=fx-(fx-hx)*.16,r=beeR(P);
  let items=plan(L);
  if(tallOn&&L>=5){const i=items.findIndex(t=>t[0]!=='gap');if(i>=0&&Math.random()<.6)items[i]=['tall'];}
  const n=Math.max(1,Math.min(items.length,Math.floor(Math.abs(b-a)/(u*1.25))));items=items.slice(0,n);
  const course=items.map(([kind,p1,p2],i)=>{
    const x=a+(b-a)*(i+.5)/n,w=Math.max(24,u*.4),parts=[];
    if(kind==='top')parts.push([-30,by+u*p1,'top']);                       // duck under
    else if(kind==='low')parts.push([by+u*.55,H+30,'bottom']);             // stay tall over it
    else if(kind==='tall')parts.push([by-u*.12,H+30,'bottom']);            // only a jump clears it
    else{const g=Math.max(u*p2,r*3.4),top=by+u*p1-g/2;parts.push([-30,top,'top']);parts.push([top+g,H+30,'bottom']);}   // squeeze through the gap
    return {kind,x,w,parts,t:0};
  });
  P.course=course;
  // the flower: high at the end (jump), or at head height
  const fs=flowerSize(P);
  P.flower={x:fx,y:endJump?Math.max(96+fs,by-u*.62):by-u*.05,t:0,st:'wait',open:.6};
  const h0=home(P);P.bee={st:'hive',x:h0.x,y:h0.y,t:0,mood:'happy',dir:P.dir,from:null};
}
const flowerSize=P=>Math.max(22,Math.min(64,U(P)*.34));

  if(R.mode==='duo'){$('final').textContent=R.a+' : '+R.b;$('t-over').textContent=R.a===R.b?u.tie:(R.a>R.b?u.winL:u.winR);
    $('n-left').textContent='🔵 '+u.blue;$('n-right').textContent='🩷 '+u.pink;}
  else{$('final').textContent='🌼 '+R.a;$('t-over').textContent=R.newBest?u.newBest:u.great;$('n-left').textContent=u.best(best);$('n-right').textContent='';}
  if(R.G){const T=goalText();if(R.mode==='solo'){$('t-over').textContent='🎯 '+T.reached;$('final').textContent='🌼 '+R.a+' · '+fmtTime(R.secs);
    $('n-left').textContent=R.gb&&R.gb.best?(R.gb.isNew?'⭐ ':'')+T.fast+fmtTime(R.gb.best):'';}
    else $('n-right').textContent+=' · '+fmtTime(R.secs);}
  $('t-again').textContent=u.playagain;$('t-privacy2').textContent=u.privacy;
}
function confetti(){for(let i=0;i<40;i++)pops.push({x:W*(.2+Math.random()*.6),y:H*.35,vx:(Math.random()-.5)*W*.9,vy:-H*(.4+Math.random()*.7),life:1.6+Math.random()*.6,c:['#FFD84D','#FF9FB0','#7DCB6B','#B79CF2'][i%4]});}
function petals(x,y){for(let i=0;i<14;i++){const a=i/14*6.28;pops.push({x,y,vx:Math.cos(a)*H*.35,vy:Math.sin(a)*H*.35-H*.2,life:.9+Math.random()*.4,c:i%2?'#FFD84D':'#FF9FB0',petal:1});}}

const portraitPlay=()=>H>W*1.05&&['setup','count','play'].includes(state);

/* where the head is this frame (top of the head) + is the child at the right distance? */
function readHead(P,dt){
  if(camOK){
    const p=personFor(P.k);
    if(!p)return;
    const top=p.hy-P.ref.u*.45;
    if(P.head){const k=Math.min(1,dt*22);P.head.x+=(p.hx-P.head.x)*k;P.head.y+=(top-P.head.y)*k;}else P.head={x:p.hx,y:top};
    P.seenT=tNow;
    const r=p.sw/P.ref.sw;P.distBad=r>1.25?'back':r<.8?'closer':'';
  } else {const F=P.fake;P.head={x:F.x,y:F.y-P.ref.u*.45};P.seenT=tNow;P.distBad='';}
}
/* does the bee (circle) touch a thorn part? also checks the path since last frame, so a fast step can't skip through */
function hitThorn(P,x0,y0,x1,y1){
  const r=beeR(P)*.62;
  for(const c of P.course)for(const [a,b] of c.parts){
    const half=c.w*.45+r,inY=y=>y+r>a&&y-r<b;
    if(Math.abs(x1-c.x)<half&&inY(y1))return c;
    if(Math.sign(x0-c.x)!==Math.sign(x1-c.x)&&(inY(y0)||inY(y1)))return c;
  }
  return null;
}
function stepPlayer(P,dt){
  readHead(P,dt);
  const b=P.bee,f=P.flower,lost=tNow-P.seenT>.5,r=beeR(P);
  if(P.old){P.old.t+=dt;if(P.old.t>1.2)P.old=null;}
  P.course.forEach(c=>c.t+=dt);if(f)f.t+=dt;
  if(b.st==='hive'||b.st==='wait'){   // waiting at the hive (or where it was let go): bring your head to it
    const hm=b.st==='hive'?home(P):null;
    if(hm){b.x+=(hm.x+Math.sin(tNow*2.3+P.k)*r*.5-b.x)*Math.min(1,dt*4);b.y+=(hm.y+Math.sin(tNow*3.1)*r*.4-b.y)*Math.min(1,dt*4);}
    else b.y+=Math.sin(tNow*4)*r*.02;
    const h=P.head;
    if(h&&!lost&&!P.distBad&&Math.hypot(h.x-b.x,(h.y-r)-b.y)<U(P)*.75){b.st='carry';b.mood='happy';FX.hop();}
  } else if(b.st==='carry'){
    if(lost||P.distBad){P.badT+=dt;if(P.badT>.35){b.st='wait';FX.letgo();P.badT=0;}}   // walked much closer/farther (or out of view): the bee lets go
    else P.badT=0;
    if(b.st==='carry'&&P.head){
      const nx=P.head.x,ny=P.head.y-r*1.1;
      const hit=hitThorn(P,b.x,b.y,nx,ny);
      b.x=nx;b.y=ny;if(f)b.dir=Math.sign(f.x-b.x)||b.dir;
      if(hit){b.st='ouch';b.t=0;b.from={x:b.x,y:b.y};b.mood='sad';hit.hitT=tNow;P.ouchT=tNow;FX.ouch();}
      else if(f&&Math.hypot(b.x-f.x,b.y-f.y)<flowerSize(P)*.8+r*.6){   // touched the flower: it sticks at once
        b.st='sip';b.t=0;b.mood='sip';f.st='got';P.score++;P.pop=tNow;FX.sip(P.k);petals(f.x,f.y);
      }
    }
  } else if(b.st==='ouch'){   // dizzy, then flies home to the hive
    b.t+=dt;const T=1.1;
    if(b.t>.45){const k=ease(Math.min(1,(b.t-.45)/(T-.45))),hm=home(P);b.x=b.from.x+(hm.x-b.from.x)*k;b.y=b.from.y+(hm.y-b.from.y)*k-Math.sin(k*Math.PI)*U(P)*.6;}
    if(b.t>=T){b.st='hive';b.mood='happy';}
  } else if(b.st==='sip'){
    b.t+=dt;b.x=f.x+Math.sin(b.t*14)*r*.15;b.y=f.y-flowerSize(P)*.65;f.open=Math.min(1,f.open+dt*2);
    if(b.t>=1.1){   // the bee stays with the flower; a new course + bee wait at the hive
      P.old={f:{...f},bee:{...b},t:0};P.level++;if(mode==='solo'&&side==='both')P.dir=-P.dir;newCourse(P);FX.buzz();
    }
  }
}

let last=performance.now();
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000))*SPEED;last=now;tNow+=dt;
  let fresh=false;if(camOK)fresh=track(now);
  if(portraitPlay()){render(dt);requestAnimationFrame(frame);return;}
  if(state==='setup'){
    const ok=players.every(P=>!fit(personFor(P.k),P.ln));
    if(ok){setupT+=dt;
      players.forEach(P=>{const p=personFor(P.k);P.cal=P.cal||[];P.cal.push(p);});
      if(setupT>1.2){players.forEach(P=>{const c=P.cal.slice(-20),sw=c.reduce((a,p)=>a+p.sw,0)/c.length,hy=c.reduce((a,p)=>a+p.hy,0)/c.length;
        const u=sw;P.ref={sw,u,top:hy-u*.45};P.head=null;});startCount();}}
    else{setupT=Math.max(0,setupT-dt*2);players.forEach(P=>P.cal=[]);}
    badT=setupT>0?0:badT+dt;   // 5 s without a good position -> show where to stand
  }
  else if(state==='count'){
    const n=3-Math.floor(tNow-countT);if(n!==lastCount){lastCount=n;if(n>0)SFX.tick();}
    if(tNow-countT>=3){state='play';elapsed=0;SFX.boing();players.forEach(P=>{P.level=1;newCourse(P);});}
  }
  else if(state==='play'){
    elapsed+=dt;
    players.forEach(P=>stepPlayer(P,dt));
    if(G){if(players.some(P=>P.score>=G))endGame(false);}
    else{const left=Math.ceil(ROUND-elapsed);if(left<=5&&left<lastSec&&left>0)SFX.tick();lastSec=left;
    if(elapsed>=ROUND)endGame(false);}
  }
  render(dt);
  requestAnimationFrame(frame);
}

/* ================= DRAWING ================= */
function drawMirrored(){const m=vmap();ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,W-m.ox-m.vw*m.s,m.oy,m.vw*m.s,m.vh*m.s);ctx.restore();}
function bubble(txt,x,y,fs,fill='#fff'){
  ctx.save();ctx.font=`700 ${fs}px Fredoka,sans-serif`;ctx.direction=lang==='he'?'rtl':'ltr';ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(txt).width+fs*1.4,h=fs*1.9;x=Math.max(w/2+6,Math.min(W-w/2-6,x));y=Math.max(h/2+4,Math.min(H-h/2-6,y));
  ctx.fillStyle=INK;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2+4,w,h,h/2);ctx.fill();
  ctx.fillStyle=fill;ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,h/2);ctx.fill();ctx.stroke();
  ctx.fillStyle=INK;ctx.fillText(txt,x,y+1);ctx.restore();
}
function bigText(txt,x,y,fs,col='#FFD84D',sc=1){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.font=`900 ${fs}px Grandstander,Fredoka,sans-serif`;ctx.direction=lang==='he'?'rtl':'ltr';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=fs*.14;ctx.strokeStyle=INK;ctx.fillStyle=INK;ctx.fillText(txt,0,fs*.08);ctx.strokeText(txt,0,0);ctx.fillStyle=col;ctx.fillText(txt,0,0);ctx.restore();
}
function drawTurnPhone(){
  ctx.fillStyle='rgba(255,248,236,.92)';ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H*.42,s=Math.min(W,H)*.22,k=(tNow%2.4)/2.4,rot=-Math.PI/2*Math.min(1,Math.max(0,(k-.3)*3));
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);const p=new Path2D();p.roundRect(-s*.32,-s*.58,s*.64,s*1.16,s*.12);sticker(ctx,p,'#fff',5);
  ctx.fillStyle='#DDF3FF';ctx.fillRect(-s*.24,-s*.46,s*.48,s*.92);ctx.restore();
  ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx,cy,s*.85,-Math.PI*.9,-Math.PI*.55);ctx.stroke();
  bubble(UI[lang].turn,W/2,H*.72,Math.max(18,Math.min(26,W*.05)));
}
/* setup: a soft sunny stripe across the middle of the screen — the head has to be in it */
function drawSetup(fs){
  const y0=H*BAND[0],y1=H*BAND[1],g=ctx.createLinearGradient(0,y0-H*.06,0,y1+H*.06);
  g.addColorStop(0,'rgba(255,226,120,0)');g.addColorStop(.25,'rgba(255,226,120,.45)');g.addColorStop(.75,'rgba(255,226,120,.45)');g.addColorStop(1,'rgba(255,226,120,0)');
  ctx.fillStyle=g;ctx.fillRect(0,y0-H*.06,W,y1-y0+H*.12);
  const u=UI[lang],L=lanes();
  bubble(mode==='duo'?u.two:u.band,W/2,H*.17,fs);
  L.forEach((ln,k)=>{const p=personFor(k),why=fit(p,ln),cx=ln.x+ln.w/2;
    if(why&&(why!=='find'||mode==='solo'||people.length))bubble(u[why],cx,H*.86,fs*.8,'#FFF3C4');
    if(p){const ok=!why;drawBee(ctx,p.hx,p.hy-p.sw*.75,Math.max(14,p.sw*.16),tNow+k,{mood:ok?'sip':'happy',bow:mode==='duo'?BOWS[k]:null,dir:ln.dir});}});
  if(badT>5)L.forEach((ln,k)=>drawGhost(ln,k,personFor(k),fs));
  if(setupT>0){const n=Math.ceil(Math.min(1,setupT/1.2)*5);for(let i=0;i<5;i++)sticker(ctx,ell(W/2+(i-2)*fs*1.3,H-fs*1.3,fs*.42,fs*.42),i<n?'#FFD84D':'#fff',3);}
}
/* after 5 s without a good position: a see-through cartoon child walks from where the player is now to the right spot
   (right size = right distance, head in the stripe), on a loop, with "Stand like this" */
function drawGhost(ln,k,p,fs){
  const mid=SIZE()[1]*ln.w,T=2.6,q=(tNow%T)/T,m=ease(Math.min(1,q/.6));
  const to={x:ln.x+ln.w/2,y:H*(BAND[0]+BAND[1])/2,sw:mid};
  const from=p?{x:p.nose.x,y:p.nose.y,sw:p.sw}:{x:ln.dir>0?ln.x-mid:ln.x+ln.w+mid,y:to.y,sw:mid};
  const sw=from.sw+(to.sw-from.sw)*m,x=from.x+(to.x-from.x)*m,ny=from.y+(to.y-from.y)*m,s=sw/.9,bob=q<.6?Math.abs(Math.sin(q*30))*s*.06:0;
  ctx.save();ctx.globalAlpha=.6;drawKid(ctx,x,ny+1.65*s-bob,s,'stand',mode==='duo'?['#BFE3FF','#FFD1DC'][k]:'#BFE3FF',tNow);ctx.restore();
  if(q>.6)bubble(UI[lang].like,to.x,to.y-s*2.1,fs*.85,'#FFF3C4');
}
function drawCourse(P){
  for(const c of P.course){const grow=ease(Math.min(1,c.t*2.5)),shake=c.hitT&&tNow-c.hitT<.5?Math.sin(tNow*50)*(1-(tNow-c.hitT)*2)*6:0;
    for(const [a,b,from] of c.parts){if(from==='top')drawThorns(ctx,c.x+shake,a,a+(b-a)*grow,c.w,tNow,'top');else drawThorns(ctx,c.x+shake,b-(b-a)*grow,b,c.w,tNow,'bottom');}}
}
function drawPlayer(P){
  const fs=flowerSize(P),b=P.bee,f=P.flower,r=beeR(P),u=UI[lang];
  // hive
  drawHive(ctx,hiveX(P),beeStand(P)+U(P)*.15,Math.min(U(P)*.42,P.ln.w*.06),tNow);
  // the old flower (with its bee) fades away after a delivery
  if(P.old){const a=Math.max(0,1-P.old.t/1.2);ctx.save();ctx.globalAlpha=a;drawHolder(ctx,P.old.f.x,P.old.f.y,fs,'high',H,tNow);drawFlower(ctx,P.old.f.x,P.old.f.y,fs,'high',1,tNow);
    drawBee(ctx,P.old.bee.x,P.old.bee.y,r,tNow,{mood:'sip',dir:P.dir,bow:mode==='duo'?BOWS[P.k]:null});ctx.restore();}
  drawCourse(P);
  if(f){const s=fs*Math.min(1,.4+f.t*2);drawHolder(ctx,f.x,f.y,s,'high',H,tNow);drawFlower(ctx,f.x,f.y,s,'high',f.st==='got'?1:.6+.1*Math.sin(tNow*3),tNow);}
  // the bee
  drawBee(ctx,b.x,b.y,r,tNow+P.k,{dir:b.dir,mood:b.mood,bow:mode==='duo'?BOWS[P.k]:null,tilt:b.st==='carry'?Math.sin(tNow*6)*.06:Math.sin(tNow*3)*.1});
  if(tNow-P.ouchT<1.1){drawDizzy(ctx,b.x,b.y,r,tNow);if(tNow-P.ouchT<.8)bigText(u.ouch,b.x,b.y-r*2.6,Math.max(22,r*1.4),'#FF9FB0');}
  // hints
  if(state!=='play')return;
  const tx=Math.max(110,Math.min(W-110,P.ln.x+P.ln.w/2)),tfs=Math.max(15,Math.min(22,W*.026));
  if(b.st==='hive'){
    bubble(P.score&&tNow-P.pop<4?u.again:u.hive,hiveX(P)+P.dir*Math.min(P.ln.w*.2,170),beeStand(P)-U(P)*1.2,tfs,'#FFF3C4');
    // little pollen dots drifting from where the head is toward the hive
    const h=P.head;if(h&&Math.abs(h.x-b.x)>U(P)){for(let i=0;i<5;i++){const k=((tNow*.6+i/5)%1),x=h.x+(b.x-h.x)*k,y=h.y-r+(b.y-h.y+r)*k-Math.sin(k*Math.PI)*r*2;ctx.fillStyle=`rgba(255,216,77,${.85*(1-k)})`;ctx.beginPath();ctx.arc(x,y,r*.18,0,7);ctx.fill();}}
  } else if(b.st==='wait')bubble(P.distBad?u[P.distBad]:u.letgo,b.x,b.y-r*3,tfs,'#FFF3C4');
}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const u=UI[lang],live=camOK&&video.readyState>=2;
  if(state==='menu'||state==='loading'){drawMeadow(ctx,W,H,tNow);drawDemo();drawPops(dt);return;}
  if(live){drawMirrored();ctx.fillStyle='rgba(255,248,236,.1)';ctx.fillRect(0,0,W,H);} else drawMeadow(ctx,W,H,tNow);
  if(portraitPlay()){drawTurnPhone();return;}
  drawGarden(ctx,W,H,tNow);
  const fs=Math.max(18,Math.min(26,W*.035));
  if(state==='setup'){drawSetup(fs);return drawPops(dt);}
  if(mode==='duo'){ctx.save();ctx.setLineDash([2,14]);ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(W/2,90);ctx.lineTo(W/2,H-20);ctx.stroke();ctx.restore();}
  if(!camOK)players.forEach(P=>{if(P.head)drawKid(ctx,P.head.x,P.head.y+P.ref.u*.55*2.35,P.ref.u*.55,'stand',mode==='duo'?['#BFE3FF','#FFD1DC'][P.k]:'#BFE3FF',tNow);});
  if(state==='play'||state==='over')players.forEach(drawPlayer);
  if(state==='count'){const n=3-Math.floor(tNow-countT),k=(tNow-countT)%1;
    if(n>0)bigText(String(n),W/2,H*.42,Math.min(150,H*.22),'#fff',1+.25*Math.max(0,1-k*4));}
  else if(state==='play'||state==='over'){
    if(state==='play'&&elapsed<.9)bigText(u.go,W/2,H*.3,Math.min(110,H*.17),'#FFD84D',1+.3*Math.max(0,1-elapsed*4));
    const left=Math.max(0,Math.ceil(ROUND-elapsed));
    // scores live in the bottom corners so the middle of the picture stays free for the child (21 Nov, Edgar)
    const pw=t=>{ctx.save();ctx.font=`700 ${fs}px Fredoka,sans-serif`;const w=ctx.measureText(t).width+fs*1.4;ctx.restore();return w;};
    const at=(t,side,y,f,fill)=>{const w=pw(t),x=side<0?LEFT0+w/2:W-12-w/2;bubble(t,x,y,f,fill);},LEFT0=86,row=fs*2.35,y0=H-fs*1.25-8;
    const clockT=G?'🎯 '+G:'⏱ '+left,clockF=G?'#FFF1B8':left<=10?'#FFE3E8':'#fff';
    const cols=mode==='duo'?['#DDF3FF','#FFE3E8']:['#FFF3C4'];
    players.forEach((P,k)=>{const pk=Math.max(0,1-(tNow-P.pop)*3),side=mode==='duo'?(k?1:-1):1,t='🌼 '+P.score,w=pw(t),x=side<0?LEFT0+w/2:W-12-w/2;
      ctx.save();ctx.translate(x,y0);ctx.scale(1+.35*pk,1+.35*pk);ctx.translate(-x,-y0);bubble(t,x,y0,fs,cols[k]);ctx.restore();});
    if(state==='play')at(clockT,1,y0-row,fs,clockF);
    if(mode==='solo'&&players[0])at(u.level(players[0].level),1,y0-row*2,fs*.8);
  }
  drawPops(dt);
}
function drawPops(dt){
  pops=pops.filter(p=>(p.life-=dt)>0);
  for(const p of pops){p.vy+=H*1.2*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*5);ctx.globalAlpha=Math.min(1,p.life*2);
    if(p.petal)sticker(ctx,ell(0,0,9,6),p.c,2);else sticker(ctx,starPath(12),p.c||'#FFD84D',2.5);ctx.restore();}
}
/* menu: hive -> through the thorns -> flower, on a loop */
function drawDemo(){
  const s=Math.max(18,Math.min(W*.04,H*.06)),y=H*.5,hx=W*.12,fx=W*.88,fy=H*.32;
  drawHive(ctx,hx,y-s*1.6,s*.8,tNow);
  drawThorns(ctx,W*.38,-20,y+s*.4,s*.9,tNow,'top');drawThorns(ctx,W*.62,y+s*1.4,H+20,s*.9,tNow,'bottom');
  drawHolder(ctx,fx,fy,s,'high',H,tNow);drawFlower(ctx,fx,fy,s,'high',1,tNow);
  const k=(tNow%5)/5,x=hx+(fx-hx)*Math.min(1,k/.8),dip=Math.exp(-(((x-W*.38)/(s*2.2))**2))*s*2.2,hop=Math.exp(-(((x-fx)/(s*2))**2))*(fy-y);
  drawBee(ctx,x,y+dip+hop,s*.6,tNow,{mood:k>.82?'sip':'happy'});
}
function icons(){
  const [soloC,duoC]=[...document.querySelectorAll('#modes canvas')].map(c=>c.getContext('2d'));
  soloC.clearRect(0,0,220,128);drawThorns(soloC,140,-10,58,18,0,'top');drawKid(soloC,80,122,30,'stand','#BFE3FF',0);drawBee(soloC,80,30,13,.3,{});drawFlower(soloC,190,30,18,'high',1,0);
  duoC.clearRect(0,0,220,128);drawKid(duoC,52,122,30,'stand','#BFE3FF',0);drawKid(duoC,168,122,30,'stand','#FFD1DC',0);drawFlower(duoC,110,34,18,'high',1,0);
  drawBee(duoC,52,30,12,.2,{bow:BOWS[0]});drawBee(duoC,168,30,12,.5,{dir:-1,bow:BOWS[1]});
}

/* ================= HOW TO PLAY ================= */
{
  const SZ=(w,h)=>Math.min(w*.09,h*.17);
  function ground(c,w,h){c.fillStyle='rgba(141,208,110,.7)';c.beginPath();c.ellipse(w/2,h*.9,w*.46,h*.06,0,0,7);c.fill();}
  function course(c,w,h,t,k,parts){   // the child walks from the hive to the flower; head follows `head(x)`
    const s=SZ(w,h),gy=h*.9,hx=w*.12,fx=w*.86,fy=h*.18;ground(c,w,h);
    drawHive(c,hx,h*.28,s*.45,t);parts.draw(c,s,gy);
    drawHolder(c,fx,fy,s*.8,'high',h,t);drawFlower(c,fx,fy,s*.8,'high',1,t);
    const x=hx+(fx-hx)*ease(Math.min(1,k/.75)),drop=parts.drop(x,s),lift=k>.72&&k<.9?Math.sin((k-.72)/.18*Math.PI)*s*1.3:0;
    const r=drawKid(c,x,gy+drop,s,'stand','#BFE3FF',t,lift);
    const got=k>.82;drawBee(c,got?fx:x,got?fy-s*.5:r.headY-s*.4,s*.36,t,{mood:got?'sip':'happy'});
  }
  setupHowTo({lang:()=>lang,play:()=>play(),steps:[
    {dur:2.6,cap:{en:'Get a bee from the hive 🐝',he:'לוקחים דבורה מהכוורת 🐝'},draw(c,w,h,t,k){course(c,w,h,t,Math.min(.05,k*.05),{draw(){},drop:()=>0});}},
    {dur:3.8,cap:{en:'Duck under the thorns! 🌿',he:'מתכופפים מתחת לקוצים! 🌿'},draw(c,w,h,t,k){course(c,w,h,t,k,{draw(c,s,gy){drawThorns(c,w*.48,-10,gy-s*2.1,s*.55,t,'top');},drop:(x,s)=>Math.exp(-(((x-w*.48)/(s*1.6))**2))*s*.9});}},
    {dur:3.8,cap:{en:'Stay tall over these, then jump to the flower! 🦘',he:'נשארים זקופים מעל אלה, ואז קופצים לפרח! 🦘'},draw(c,w,h,t,k){course(c,w,h,t,k,{draw(c,s,gy){drawThorns(c,w*.48,gy-s*1.6,gy,s*.55,t,'bottom');},drop:()=>0});}},
    {dur:2.6,cap:{en:'Back to the hive for a new bee! ⭐',he:'חוזרים לכוורת לדבורה חדשה! ⭐'},draw(c,w,h,t,k){const s=SZ(w,h),gy=h*.9;ground(c,w,h);drawHive(c,w*.12,h*.28,s*.45,t);
      const x=w*.8-(w*.8-w*.2)*ease(k);drawKid(c,x,gy,s,'stand','#BFE3FF',t);for(let i=0;i<6;i++){const a=i/6*6.3,rr=h*(.06+k*.2);bigStar(c,w*.12+Math.cos(a)*rr,h*.28+Math.sin(a)*rr,12*(1.2-k*.6),a+k*3);}}}
  ]});
}

// test hooks (?fake runs)
window.__P=()=>players;window.__setup=()=>{state="setup";badT=6;people=[];players=lanes().map((_,k)=>makePlayer(k));};
setLang(lang);icons();
document.fonts&&document.fonts.ready.then(icons);
requestAnimationFrame(frame);
