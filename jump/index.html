<script type="module">
/* Jump Race — Edgar, 15 Nov 2026.
   One-minute jumping race in front of the camera (phone sideways, whole body in view).
   · 2 players: two children side by side, each jump counted separately; most jumps after 1 minute wins.
   · Beat the animals: race the Panda (jumps every 3 s: all fours → two legs → jump → wobbly landing),
     then the Duck (every 2 s, flaps its wings in the air), then the Rabbit (every 1 s, ears flap at random).
     Beat an animal = more jumps than it when the minute ends.
   A jump is read from the upper body only (head + both shoulders), so the child can stand close and watch the
   screen; see the JUMP COUNTER notes. Body landmarks only (no audio, no rope); see project doc IP-CHECK.md. Nothing is recorded or sent. */
import {INK,$,LS,S,audio,tone,noise,SFX,musicStart,musicStop,bindSound,ell,sticker,starPath,drawRoom} from '../shared/kit.js';
import {camLoad,timeoutP} from '../shared/kit.js';
import {makeGuide} from '../shared/guide.js';
import {setupCast} from '../shared/cast.js';
import {setupHowTo,seg,bigStar} from '../shared/howto.js';
import {DRAW,RACERS,jumpsAt} from './animals.js';

const ROUND=60,ORDER=['panda','duck','rabbit'];
const UI={

  privacy:"המצלמה משמשת רק למשחק. שום דבר לא מוקלט ולא נשלח.",grown:"למבוגרים",
  g1:"קופצים כמה שיותר פעמים בדקה אחת. 2 שחקנים: מתחרים זה בזה, עומדים זה לצד זה. נגד החיות: מתחרים בפנדה (קופצת כל 3 שניות), אחר כך בברווז (כל 2 שניות) ואחר כך בארנב (כל שנייה). כדי לנצח חיה צריך לקפוץ יותר ממנה עד סוף הדקה. המצלמה צריכה לראות רק מהטבור ומעלה: קפיצה נספרת כשהראש ושתי הכתפיים עולים יחד ויורדים מהר. נפנוף ידיים, משיכת כתפיים, הנהון או עלייה על קצות האצבעות לא נספרים.",

  g2:"★ סובבו את הטלפון לרוחב והעמידו אותו בגובה החזה (על שולחן או מדף), בערך מטר מהילד, כך שהילד רואה את המסך והמצלמה רואה את הראש, הכתפיים והבטן. השאירו מקום מעל הראש לקפיצות. 2 שחקנים: עומדים זה לצד זה, קצת יותר רחוק.",

  ready:"מתכוננים…",two:"שני שחקנים, זה לצד זה!",closer:"התקרבו קצת",back:"התרחקו קצת",lower:"הנמיכו קצת את הטלפון",go:"קופצים!",beat:a=>"נצחו את ה"+a+"!",
  turn:"סובבו את הטלפון לרוחב כדי לשחק",nocam:"אין כאן מצלמה. הקישו על המסך כדי לקפוץ.",aria:"אזור המשחק",
  you:"אתם",blue:"כחול",pink:"ורוד",winL:"הכחול ניצח!",winR:"הוורוד ניצח!",tie:"תיקו!",won:a=>"ניצחתם את ה"+a+"!",lost:"כמעט!",tieA:"תיקו! ממש קרוב!",champ:"אלופי החיות!",
  next:a=>"הבא: "+a,again:"עוד ניסיון",playagain:"עוד פעם",menu:"תפריט",left:"שנ׳"}
};

let lang=LS.get('bamboo-lang','en'); if(!UI[lang])lang='en';
let mode=LS.get('jr-mode','vs'); if(!['vs','duo'].includes(mode))mode='vs';
let beaten=LS.get('jr-beat','');
let animal=LS.get('jr-animal','')||ORDER.find(a=>!beaten.includes(a[0]))||'panda'; if(!ORDER.includes(animal))animal='panda';
let sens=LS.get('jr-sens','normal'); if(!['small','normal'].includes(sens))sens='normal';
const QS=new URLSearchParams(location.search),FAKE=QS.has('fake'),SPEED=FAKE?(+QS.get('speed')||1):1;   // ?fake = no camera, tap to jump (testing)
S.track='island'; S.amb='none'; S.ambOn=false;   // bouncy marimba + kalimba (unused since Lava moved to rock)
const syncSound=bindSound(()=>UI[lang]);
let casting=false;
const cast=setupCast({canvas:$('c'),button:$('cast'),lang:()=>lang,sound:()=>(audio(),S),onChange:v=>{casting=v;document.body.classList.toggle('casting',v);}});

function segs(){
  const u=UI[lang];
  document.querySelectorAll('#sens-seg button').forEach(b=>{b.textContent=u[b.dataset.v];b.setAttribute('aria-pressed',b.dataset.v===sens);});
  document.querySelectorAll('#modes .lv').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
  document.querySelectorAll('#animals .lv').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.a===animal);b.querySelector('b').textContent=u[b.dataset.a];
    b.querySelector('.stars').textContent=beaten.includes(b.dataset.a[0])?'⭐':'';});
  $('animals').hidden=mode!=='vs';
}
let lastRes=null;
function setLang(l){
  lang=l;LS.set('bamboo-lang',l);const u=UI[l];
  document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';document.querySelector('.top').dir='ltr';
  for(const k of ['title','sub','play','privacy','grown','g1','sens','music','sfx','g2','g3','legal','vs','duo'])
    {const e=$('t-'+k);if(e)e.textContent=u[k];}
  $('t-privacy2').textContent=u.privacy;$('menu').textContent=u.menu;
  $('lang-en').setAttribute('aria-pressed',l==='en');$('lang-he').setAttribute('aria-pressed',l==='he');
  $('c').setAttribute('aria-label',u.aria);
  segs();syncSound();cast.paint&&cast.paint();if(lastRes&&!$('end').hidden)fillEnd();
}
$('lang-en').onclick=()=>setLang('en');$('lang-he').onclick=()=>setLang('he');
document.querySelectorAll('#sens-seg button').forEach(b=>b.onclick=()=>{sens=b.dataset.v;LS.set('jr-sens',sens);segs();});
document.querySelectorAll('#modes .lv').forEach(b=>b.onclick=()=>{mode=b.dataset.m;LS.set('jr-mode',mode);SFX.tink();segs();});
document.querySelectorAll('#animals .lv').forEach(b=>b.onclick=()=>{animal=b.dataset.a;LS.set('jr-animal',animal);SFX.tink();segs();});

/* ================= CANVAS ================= */
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',resize);resize();
function toast(t,ms=4000){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.tm);if(ms)toast.tm=setTimeout(()=>e.classList.remove('on'),ms);}

/* ================= SOUND ================= */
const FX={
  jump(k=0){const f=[520,660][k]||560;tone({f0:f*.6,f1:f*1.5,dur:.16,type:'sine',vol:.26});tone({f0:f*1.5,f1:f*1.9,dur:.08,type:'triangle',vol:.08,at:.05});},
  thud(){tone({f0:120,f1:50,dur:.35,type:'sine',vol:.42});noise({dur:.25,freq:280,vol:.35});},
  quack(){[0,.13].forEach(at=>tone({f0:640,f1:470,dur:.12,type:'sawtooth',vol:.12,filter:1150,q:3,at}));},
  flutter(){for(let i=0;i<5;i++)noise({dur:.04,freq:2200,vol:.07,type:'bandpass',at:i*.07});},
  hop(){tone({f0:900,f1:1500,dur:.07,type:'sine',vol:.12});},
  whistle(){tone({f0:1900,f1:2100,dur:.5,type:'sine',vol:.14});tone({f0:2000,f1:2250,dur:.5,type:'sine',vol:.08});},
  win(){[784,988,1175,1568].forEach((f,i)=>tone({f0:f,dur:.28,type:'triangle',vol:.28,at:i*.08}));},
  aww(){tone({f0:520,f1:330,dur:.5,type:'triangle',vol:.16});}
};

/* ================= CAMERA + POSE TRACKING (on device) ================= */
const video=$('v');
let tracker=null,camOK=false,lastVT=-1,people=[];
const vmap=()=>{const vw=video.videoWidth||640,vh=video.videoHeight||480,s=Math.max(W/vw,H/vh);return {vw,vh,s,ox:(W-vw*s)/2,oy:(H-vh*s)/2};};
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();
  const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts=(d,k)=>({baseOptions:{modelAssetPath:`https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${k}/float16/1/pose_landmarker_${k}.task`,delegate:d},
    runningMode:'VIDEO',numPoses:2,minPoseDetectionConfidence:.45,minPosePresenceConfidence:.45,minTrackingConfidence:.45});
  let err=null;
  for(const [d,k] of [['GPU','full'],['GPU','lite'],['CPU','lite']]){try{tracker=await timeoutP(vision.PoseLandmarker.createFromOptions(files,opts(d,k)),d==='GPU'?30000:120000);break;}catch(e){err=e;}}
  if(!tracker)throw err||new Error('model');
  camOK=true;
}
function track(now){
  if(!tracker||video.readyState<2||video.currentTime===lastVT)return false;lastVT=video.currentTime;
  let res;try{res=tracker.detectForVideo(video,now);}catch(e){return false;}
  const m=vmap(),L=res.landmarks||[];
  const ps=L.map(lm=>{const p=lm.map(q=>({x:m.ox+(1-q.x)*m.vw*m.s,y:m.oy+q.y*m.vh*m.s,v:q.visibility??1}));
    return {lm:p,nose:p[0],sw:Math.hypot(p[11].x-p[12].x,p[11].y-p[12].y)};}).filter(p=>p.lm[11].v>.4&&p.lm[12].v>.4);
  ps.sort((a,b)=>a.nose.x-b.nose.x);
  people=mode==='vs'&&ps.length>1?[ps.reduce((a,b)=>b.sw>a.sw?b:a)]:ps;   // vs: the closest person
  return true;
}

/* ================= JUMP COUNTER (upper body only) ================= */
/* 15 Nov (Edgar): the child stands close enough to see the screen, so the camera sees only belly button and up.
   A jump is read from the head (nose + ears) and both shoulders — never the arms:
   · the head AND both shoulders must rise together, above the child's standing level (a shrug moves only the
     shoulders, a nod only the head → no jump);
   · the rise must be quick (from standing level to the threshold in under 0.35 s) and the child must come back
     down within 0.9 s (getting up from a squat or rising on the toes and staying there → no jump);
   · sizes are in shoulder widths, so it works for small and big children, near or far.
   The jump is counted when the child lands. Waving or raising the arms does nothing. */
const TH={normal:.22,small:.13};
function makeDet(){return {n:0,last:-9e9,seen:-9e9,B:null,u:0,up:false,upT:0,lowT:0,belowT:0,hiT:0,pop:-9};}
function stepDet(d,p,now,onJump){
  const lm=p.lm;if(lm[0].v<.5)return;
  const hs=[0,7,8].filter(i=>lm[i].v>.4),yh=hs.reduce((a,i)=>a+lm[i].y,0)/hs.length,ys=(lm[11].y+lm[12].y)/2;
  const dt=Math.min(.2,(now-d.seen)/1000);
  if(!d.B||now-d.seen>600){d.B={s:ys,h:yh};d.u=p.sw;d.up=false;d.lowT=now;d.belowT=0;d.hiT=0;}
  d.seen=now;
  const B=d.B,rs=(B.s-ys)/d.u,rh=(B.h-yh)/d.u,rise=Math.min(rs,rh),th=TH[sens];
  if(!d.up){
    // 15 Nov (Edgar found a cheat: quick dips counted). The standing height is LOCKED during dips and squats:
    // it only follows the child while they stand at about that height, and moves down only after 1.5 s down low.
    if(Math.abs(rise)<.06){const k=Math.min(1,dt*3);B.s+=(ys-B.s)*k;B.h+=(yh-B.h)*k;d.u+=(p.sw-d.u)*Math.min(1,dt*1.5);d.lowT=now;d.belowT=0;}
    else if(rise<0){d.lowT=now;d.belowT+=dt;if(d.belowT>1.5){const k=Math.min(1,dt*2);B.s+=(ys-B.s)*k;B.h+=(yh-B.h)*k;}}
    else d.belowT=0;
    // up: clearly ABOVE standing height, head and shoulders together, reached quickly, and held for at least 2 frames
    if(rise>th&&Math.abs(rs-rh)<Math.max(.12,rise*.5)&&now-d.lowT<400){d.hiT+=dt;if(d.hiT>=.06){d.up=true;d.upT=now;d.hiT=0;}}
    else d.hiT=0;
  } else if(rise<th*.4){
    d.up=false;d.lowT=now;
    if(now-d.upT<900&&now-d.last>250){d.last=now;d.n++;d.pop=tNow;onJump&&onJump();}   // counted on landing
  } else if(now-d.upT>1200){ d.up=false;B.s=ys;B.h=yh;d.lowT=now; }   // stayed up: not a jump; this is the new standing height
}
/* setup check for 2 players: each one close enough to see the screen, head with room above it */
function fit(p){ if(p.lm[0].v<.5)return 'find'; if(p.sw<W*.1)return 'closer'; if(p.sw>W*.32)return 'back'; if(p.nose.y<H*.25)return 'lower'; return ''; }

/* ================= GAME ================= */
let state='menu',tNow=0,countT=0,lastCount=9,elapsed=0,dets=[makeDet(),makeDet()],aCount=0,guide=null,setupT=0,pops=[],animSide=0,lastSec=99;
const slotOf=p=>people.length>=2?people.indexOf(p):(p.nose.x<W/2?0:1);

async function play(){
  audio();SFX.go();
  $('start').hidden=true;$('end').hidden=true;
  if(!camOK&&!FAKE){toast(UI[lang].ready,0);state='loading';
    try{await camLoad(startCam);$('toast').classList.remove('on');}
    catch(e){console.warn(e);toast(UI[lang].nocam,6000);}}
  dets=[makeDet(),makeDet()];aCount=0;elapsed=0;pops=[];lastRes=null;lastSec=99;
  $('stopx').classList.add('on');musicStart();
  guide=null;
  if(camOK&&mode==='vs'){guide=makeGuide('reach',{},{en:{find:'Stand in front of the camera'},he:{find:'עמדו מול המצלמה'}});guide.reset();}
  state=camOK?'setup':'count';countT=tNow;setupT=0;lastCount=9;
}
$('play').onclick=play;$('again').onclick=()=>{if(lastRes&&lastRes.next){animal=lastRes.next;LS.set('jr-animal',animal);segs();}play();};
$('menu').onclick=()=>{$('end').hidden=true;$('start').hidden=false;state='menu';segs();};
$('stopx').onclick=()=>endGame(true);

/* no camera (or ?fake): tap = jump (2 players: left / right half of the screen) */
cv.addEventListener('pointerdown',e=>{ if(camOK||state!=='play')return; const k=mode==='duo'&&e.clientX>W/2?1:0; jumpFx(k);dets[k].n++;dets[k].pop=tNow; });
function jumpFx(k){FX.jump(k);}

function endGame(quit){
  state='over';musicStop();$('stopx').classList.remove('on');if(guide)guide.hide();
  if(quit){state='menu';$('start').hidden=false;segs();return;}
  FX.whistle();
  const me=dets[0].n,other=mode==='duo'?dets[1].n:aCount;
  const won=me>other;
  lastRes={mode,me,other,won,tie:me===other,animal,next:null};
  if(mode==='vs'&&won){if(!beaten.includes(animal[0])){beaten+=animal[0];LS.set('jr-beat',beaten);}
    const i=ORDER.indexOf(animal);lastRes.next=ORDER[i+1]||null;}
  if(mode==='duo'?!lastRes.tie:won){setTimeout(FX.win,500);confetti();} else if(mode==='vs')setTimeout(FX.aww,500);
  fillEnd();$('end').hidden=false;
}
function fillEnd(){
  const u=UI[lang],R=lastRes,an=u[R.animal];
  $('final').textContent=R.me+' : '+R.other;
  if(R.mode==='duo'){$('t-over').textContent=R.tie?u.tie:(R.me>R.other?u.winL:u.winR);$('n-left').textContent='🔵 '+u.blue;$('n-right').textContent='🩷 '+u.pink;
    $('t-again').textContent=u.playagain;}
  else{$('t-over').textContent=R.won?(R.animal==='rabbit'?u.champ:u.won(an)):(R.tie?u.tieA:u.lost);$('n-left').textContent=u.you;$('n-right').textContent=an;
    $('t-again').textContent=R.next?u.next(u[R.next]):(R.won?u.playagain:u.again);}
  $('t-privacy2').textContent=u.privacy;
}
function confetti(){for(let i=0;i<40;i++)pops.push({x:W*(.2+Math.random()*.6),y:H*.35,vx:(Math.random()-.5)*W*.9,vy:-H*(.4+Math.random()*.7),life:1.6+Math.random()*.6,c:['#FFD84D','#FF9FB0','#7DCB6B','#5FB7F0'][i%4]});}

const portraitPlay=()=>H>W*1.05&&['setup','count','play'].includes(state);
function stageRect(){const y=58,h=H-y-Math.max(56,H*.11),w=Math.min(W*.3,h*.82);return {x:12,y,w,h};}
function playRect(){if(mode==='duo')return {x:0,y:0,w:W,h:H};const R=stageRect(),x=R.x+R.w+8;return {x,y:0,w:W-x,h:H};}

let last=performance.now();
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000))*SPEED;last=now;tNow+=dt;
  let fresh=false;if(camOK)fresh=track(now);
  if(portraitPlay()){render(dt);requestAnimationFrame(frame);return;}   // waits until the phone is turned sideways
  if(state==='setup'){
    if(guide){const p=people[0];if(guide.update(dt,p?{x:p.nose.x,y:p.nose.y,size:p.sw,arms:p.lm[15].v>.5&&p.lm[16].v>.5}:null,playRect())==='done'){state='count';countT=tNow;lastCount=9;}}
    else{ if(people.length>=2&&people.every(p=>!fit(p))){setupT+=dt;if(setupT>1){state='count';countT=tNow;}}else setupT=Math.max(0,setupT-dt); }
  }
  else if(state==='count'){
    const n=3-Math.floor(tNow-countT);if(n!==lastCount){lastCount=n;if(n>0)SFX.tick();}
    if(tNow-countT>=3){state='play';elapsed=0;SFX.boing();dets.forEach(d=>{d.n=0;d.up=false;});}
    else if(camOK&&fresh)people.forEach(p=>stepDet(dets[mode==='duo'?slotOf(p):0],p,now,null));   // learn the standing level
  }
  else if(state==='play'){
    elapsed+=dt;
    if(camOK&&fresh)people.forEach(p=>{const k=mode==='duo'?slotOf(p):0;if(k>=0)stepDet(dets[k],p,now,()=>jumpFx(k));});
    if(mode==='vs'){const n=jumpsAt(animal,elapsed);if(n>aCount){aCount=n;({panda:FX.thud,duck:FX.quack,rabbit:FX.hop})[animal]();}
      if(animal==='duck'){const p=elapsed%2;if(p>=1&&p-dt<1)FX.flutter();}}
    const left=Math.ceil(ROUND-elapsed);if(left<=5&&left<lastSec&&left>0)SFX.tick();lastSec=left;
    if(elapsed>=ROUND)endGame(false);
  }
  render(dt);
  requestAnimationFrame(frame);
}

/* ================= DRAWING ================= */
function drawMirrored(){const m=vmap();ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,W-m.ox-m.vw*m.s,m.oy,m.vw*m.s,m.vh*m.s);ctx.restore();}
function bubble(txt,x,y,fs,fill='#fff'){
  ctx.save();ctx.font=`700 ${fs}px Fredoka,sans-serif`;ctx.direction=lang==='he'?'rtl':'ltr';ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(txt).width+fs*1.4,h=fs*1.9;
  ctx.fillStyle=INK;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2+4,w,h,h/2);ctx.fill();
  ctx.fillStyle=fill;ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,h/2);ctx.fill();ctx.stroke();
  ctx.fillStyle=INK;ctx.fillText(txt,x,y+1);ctx.restore();
}
function bigText(txt,x,y,fs,col='#FFD84D',sc=1){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.font=`900 ${fs}px Grandstander,Fredoka,sans-serif`;ctx.direction=lang==='he'?'rtl':'ltr';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=fs*.14;ctx.strokeStyle=INK;ctx.fillStyle=INK;ctx.fillText(txt,0,fs*.08);ctx.strokeText(txt,0,0);ctx.fillStyle=col;ctx.fillText(txt,0,0);ctx.restore();
}
function drawTurnPhone(){
  ctx.fillStyle='rgba(255,248,236,.92)';ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H*.42,s=Math.min(W,H)*.22,k=(tNow%2.4)/2.4,rot=-Math.PI/2*Math.min(1,Math.max(0,(k-.3)*3));
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);const p=new Path2D();p.roundRect(-s*.32,-s*.58,s*.64,s*1.16,s*.12);sticker(ctx,p,'#fff',5);
  ctx.fillStyle='#DDF3FF';ctx.fillRect(-s*.24,-s*.46,s*.48,s*.92);ctx.restore();
  ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx,cy,s*.85,-Math.PI*.9,-Math.PI*.55);ctx.stroke();
  bubble(UI[lang].turn,W/2,H*.72,Math.max(18,Math.min(26,W*.05)));
}
/* soft outdoor scene the animal plays in: sky, a hill, grass, a few flowers */
function scene(x,y,w,h,gy){
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#CDEEFF');g.addColorStop(1,'#EAF8FF');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,.85)';const cr=w*.08;ctx.beginPath();ctx.arc(x+w*.25,y+h*.14,cr,0,7);ctx.arc(x+w*.25+cr,y+h*.14-cr*.4,cr*1.2,0,7);ctx.arc(x+w*.25+cr*2.1,y+h*.14,cr*.9,0,7);ctx.fill();
  ctx.fillStyle='#B9E39A';ctx.beginPath();ctx.ellipse(x+w*.8,gy+h*.02,w*.55,h*.16,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#8DD06E';ctx.fillRect(x,gy,w,y+h-gy);
  ctx.fillStyle='#A3DB82';ctx.beginPath();ctx.ellipse(x+w*.3,gy+(y+h-gy)*.55,w*.4,(y+h-gy)*.25,0,0,7);ctx.fill();
  for(const [fx,fy,c] of [[.12,.3,'#FFD84D'],[.86,.55,'#FF9FB0'],[.66,.25,'#FFFFFF']]){const px=x+w*fx,py=gy+(y+h-gy)*fy,r=Math.max(3,w*.018);
    ctx.fillStyle=c;for(let i=0;i<5;i++){const a=i*1.257;ctx.beginPath();ctx.arc(px+Math.cos(a)*r,py+Math.sin(a)*r,r*.8,0,7);ctx.fill();}ctx.fillStyle='#F2A33A';ctx.beginPath();ctx.arc(px,py,r*.6,0,7);ctx.fill();}
}
function drawStage(){
  const R=stageRect(),u=UI[lang];
  ctx.save();const clip=new Path2D();clip.roundRect(R.x,R.y,R.w,R.h,24);
  ctx.save();ctx.clip(clip);const gy=R.y+R.h*.8;scene(R.x,R.y,R.w,R.h,gy);
  const s=Math.min(R.w*(animal==='panda'?.4:.5),R.h*.42/({panda:2,duck:1.7,rabbit:1.65})[animal]),ta=state==='play'?elapsed:-1-(tNow%40);
  DRAW[animal](ctx,R.x+R.w/2,gy,s,ta);
  ctx.restore();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke(clip);ctx.restore();
  // name + count
  const fs=Math.max(15,Math.min(22,R.w*.09));bubble(u[animal],R.x+R.w/2,R.y+fs*1.4,fs,'#FFF8EC');
  const n=state==='play'||state==='over'?aCount:0,ph=state==='play'?Math.max(0,1-(elapsed-(RACERS[animal].land+(aCount-1)*RACERS[animal].P))*4):0;
  bigText(String(n),R.x+R.w/2,R.y+fs*1.4+Math.min(R.w*.35,R.h*.16)*.95,Math.min(R.w*.35,R.h*.16),'#fff',1+.3*(aCount?ph:0));
}
function headPoint(p){const lm=p.lm;return {x:p.nose.x,y:p.nose.y-Math.max(p.sw*.9,40)};}
function chestPoint(p){const a=p.lm[11],b=p.lm[12];return {x:(a.x+b.x)/2,y:(a.y+b.y)/2+p.sw*.6};}   // lower chest, middle of the body
/* the running-out timer: a pie that shrinks clockwise; its colour goes from green to white as time runs out */
function drawClock(x,y,r,f,left){
  const mixc=(a,b,k)=>{const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),A=h(a),B=h(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')';};
  ctx.save();ctx.fillStyle='rgba(43,33,24,.25)';ctx.beginPath();ctx.arc(x,y+4,r+5,0,7);ctx.fill();
  sticker(ctx,ell(x,y,r+4,r+4),'rgba(255,255,255,.55)',4);
  if(f>0){const warn=left<=10?.15*Math.sin(tNow*10):0;ctx.fillStyle=mixc('#5CC26A','#FFFFFF',Math.min(1,1-f+warn));ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+f*Math.PI*2);ctx.closePath();ctx.fill();
    ctx.strokeStyle=INK;ctx.lineWidth=2.5;ctx.stroke();}
  ctx.restore();
  bigText(String(left),x,y,r*.75,'#fff',left<=10?1+.08*Math.max(0,Math.sin(tNow*10)):1);
}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const u=UI[lang],live=camOK&&video.readyState>=2&&state!=='menu'&&!(state==='over'&&!camOK);
  if(live&&state!=='menu'){drawMirrored();ctx.fillStyle='rgba(255,248,236,.08)';ctx.fillRect(0,0,W,H);}
  else drawRoom(ctx,W,H);
  if(state==='menu'||state==='loading'){drawDemo();drawPops(dt);return;}
  if(portraitPlay()){drawTurnPhone();return;}
  const fs=Math.max(18,Math.min(26,W*.04)),PR=playRect(),cx=PR.x+PR.w/2;
  if(mode==='vs')drawStage();
  else if(state!=='setup'){ctx.save();ctx.setLineDash([2,14]);ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(W/2,90);ctx.lineTo(W/2,H-20);ctx.stroke();ctx.restore();}
  if(state==='setup'){
    if(guide)guide.draw(ctx,PR,lang);
    else{bubble(u.two,W/2,H*.16,fs);
      const bad=people.map(fit).find(x=>x);if(bad&&bad!=='find')bubble(u[bad],W/2,H*.16+fs*2.4,fs*.8,'#FFF3C4');
      people.forEach(p=>{const h=headPoint(p);sticker(ctx,ell(h.x,Math.max(fs,h.y),fs*.9,fs*.9),!fit(p)?'#8BD16B':'#fff',3);
        ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';const hy=Math.max(fs,h.y);if(!fit(p)){ctx.beginPath();ctx.moveTo(h.x-fs*.4,hy);ctx.lineTo(h.x-fs*.1,hy+fs*.3);ctx.lineTo(h.x+fs*.45,hy-fs*.35);ctx.stroke();}});
      if(setupT>0){ctx.fillStyle='rgba(125,203,107,.9)';ctx.fillRect(W*.3,H-26,W*.4*Math.min(1,setupT),10);}}
    if(mode==='vs')bubble(u.beat(u[animal]),cx,H-fs*1.6,fs*.85,'#FFF8EC');
  }
  else if(state==='count'){const n=3-Math.floor(tNow-countT),k=(tNow-countT)%1;
    if(n>0)bigText(String(n),cx,H*.42,Math.min(150,H*.22),'#fff',1+.25*Math.max(0,1-k*4));
    if(mode==='vs')bubble(u.beat(u[animal]),cx,H*.18,fs,'#FFF8EC');}
  else if(state==='play'||state==='over'){
    if(state==='play'&&elapsed<.9)bigText(u.go,cx,H*.3,Math.min(110,H*.17),'#FFD84D',1+.3*Math.max(0,1-elapsed*4));
    const left=Math.max(0,Math.ceil(ROUND-elapsed));
    // 19 Nov (Edgar): a picture timer — a circle that runs out, green turning to white. vs: on the side away from the
    // animal (right edge); 2 players: in the middle, on the line between them.
    if(state==='play'){const r=Math.max(28,Math.min(52,H*.085)),tx=mode==='duo'?W/2:W-r-18,ty=mode==='duo'?r+62:r+70;drawClock(tx,ty,r,Math.max(0,1-elapsed/ROUND),left);}
    // counts: big WHITE number with a black outline on the lower chest (Edgar 19 Nov: over the head it covered the face;
    // white + black edge shows on a white shirt too)
    const cols=mode==='duo'?['#5FB7F0','#FF9FB0']:['#7DCB6B'];
    for(let k=0;k<cols.length;k++){
      const d=dets[k],pp=mode==='duo'?people.find(p=>slotOf(p)===k):people[0],pk=Math.max(0,1-(tNow-d.pop)*3.5),bs=Math.min(90,H*.13);
      if(pp&&camOK){const c=chestPoint(pp);bigText(String(d.n),c.x,Math.min(H-bs*.6,c.y),bs,'#fff',1+.4*pk);}
      else bigText(String(d.n),mode==='duo'?(k?W*.75:W*.25):cx,H*.45,Math.min(120,H*.2),'#fff',1+.4*pk);
    }
    if(mode==='duo'){bubble(String(dets[0].n),40,64+fs*.2,fs,'#DDF3FF');bubble(String(dets[1].n),W-40,64+fs*.2,fs,'#FFE3E8');}
  }
  drawPops(dt);
}
function drawPops(dt){
  pops=pops.filter(p=>(p.life-=dt)>0);
  for(const p of pops){p.vy+=H*1.2*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*5);ctx.globalAlpha=Math.min(1,p.life*2);sticker(ctx,starPath(12),p.c||'#FFD84D',2.5);ctx.restore();}
}
/* menu: the three animals jump in a row on the grass */
function drawDemo(){
  const card=$('start').hidden?$('end'):$('start'),ct=card&&!card.hidden?card.getBoundingClientRect().top:H;
  const gy=Math.min(H*.62,ct-10),s=Math.max(30,Math.min(W*.13,(gy-80)/1.9));
  if(gy-80<40)return;
  ctx.fillStyle='rgba(141,208,110,.55)';ctx.beginPath();ctx.ellipse(W/2,gy+s*.08,Math.min(W*.48,s*5),s*.22,0,0,7);ctx.fill();
  ORDER.forEach((a,i)=>DRAW[a](ctx,W/2+(i-1)*s*1.7,gy,a==='panda'?s*.8:s,tNow+i*.37));
}
/* card icons */
function icons(){
  document.querySelectorAll('#animals .lv canvas').forEach(c=>{const g=c.getContext('2d'),a=c.parentNode.dataset.a;g.clearRect(0,0,128,128);DRAW[a](g,64,118,a==='panda'?72:88,-1);});
  const [vsC,duoC]=[...document.querySelectorAll('#modes canvas')].map(c=>c.getContext('2d'));
  vsC.clearRect(0,0,220,128);drawBean(vsC,62,118,'#7DCB6B',.9);DRAW.panda(vsC,160,118,64,-1);
  duoC.clearRect(0,0,220,128);drawBean(duoC,72,118,'#5FB7F0',.9);drawBean(duoC,148,118,'#FF9FB0',.9,true);
}
function drawBean(c,x,gy,col,k,flip){   // a little jumping-bean player for the icons
  c.save();c.translate(x,gy);c.scale(flip?-k:k,k);
  sticker(c,ell(0,-48,30,42),col,4);c.fillStyle='rgba(255,255,255,.4)';c.fill(ell(-12,-70,8,5,-.5));
  for(const sd of [-1,1]){c.fillStyle=INK;c.fill(ell(sd*10,-56,5,6));c.fillStyle='#fff';c.fill(ell(sd*10+2,-58,2,2));}
  c.fillStyle='rgba(255,130,150,.65)';c.fill(ell(-18,-46,6,4));c.fill(ell(18,-46,6,4));
  c.strokeStyle=INK;c.lineWidth=3;c.lineCap='round';c.beginPath();c.arc(0,-46,7,.15*Math.PI,.85*Math.PI);c.stroke();
  c.lineWidth=5;c.beginPath();c.moveTo(-24,-56);c.lineTo(-40,-82);c.moveTo(24,-56);c.lineTo(40,-82);c.stroke();   // arms up: yay
  c.restore();
}

/* ================= HOW TO PLAY (cartoon for a 5-year-old) ================= */
{
  const P=.75;   // the cartoon kid jumps every 0.75 s
  const hopY=(t,s)=>{const k=(t%P)/P;return k<.6?Math.sin(k/.6*Math.PI)*s*.55:0;};
  function ground(c,w,h){c.fillStyle='rgba(141,208,110,.6)';c.beginPath();c.ellipse(w/2,h*.88,w*.44,h*.06,0,0,7);c.fill();}
  function count(c,x,y,n,fs,col){c.save();c.font=`900 ${fs}px Grandstander,Fredoka,sans-serif`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
    c.lineWidth=fs*.16;c.strokeStyle=INK;c.strokeText(String(n),x,y);c.fillStyle=col;c.fillText(String(n),x,y);c.restore();}
  const S=(w,h)=>Math.min(w*.16,h*.3);
  setupHowTo({lang:()=>lang,play:()=>play(),steps:[
    {dur:3,cap:{en:'Jump, jump, jump! 🦘',he:'קופצים, קופצים, קופצים! 🦘'},draw(c,w,h,t,k){const s=S(w,h),gy=h*.88;ground(c,w,h);
      drawBean(c,w/2,gy-hopY(t,s),'#7DCB6B',s/90);count(c,w/2,h*.4,Math.floor(t/P)+1,s*.55,'#FFD84D');}},
    {dur:3.4,cap:{en:'Race the animals 🐼',he:'מתחרים בחיות 🐼'},draw(c,w,h,t,k){const s=S(w,h),gy=h*.88;ground(c,w,h);
      drawBean(c,w*.33,gy-hopY(t,s),'#7DCB6B',s/90);DRAW.panda(c,w*.67,gy,s*.85,t+2);
      count(c,w*.33,h*.4,Math.floor(t/P)+1,s*.5,'#FFD84D');count(c,w*.67,h*.4,jumpsAt('panda',t+2),s*.5,'#FFFFFF');}},
    {dur:2.8,cap:{en:'…or race a friend 👫',he:'…או מתחרים בחבר 👫'},draw(c,w,h,t,k){const s=S(w,h),gy=h*.88;ground(c,w,h);
      drawBean(c,w*.33,gy-hopY(t,s),'#5FB7F0',s/90);drawBean(c,w*.67,gy-hopY(t+.3,s),'#FF9FB0',s/90,true);
      count(c,w*.33,h*.4,Math.floor(t/P)+1,s*.5,'#5FB7F0');count(c,w*.67,h*.4,Math.floor((t+.3)/P)+1,s*.5,'#FF9FB0');}},
    {dur:2.2,cap:{en:'Most jumps in 1 minute wins! ⭐',he:'מי שקופץ הכי הרבה בדקה מנצח! ⭐'},draw(c,w,h,t,k){const s=S(w,h),gy=h*.88;ground(c,w,h);
      drawBean(c,w/2,gy-hopY(t*1.4,s),'#7DCB6B',s/90);
      for(let i=0;i<8;i++){const a=i/8*6.3,r=h*(.08+k*.3);bigStar(c,w/2+Math.cos(a)*r*1.6,h*.5+Math.sin(a)*r,15*(1.2-k*.6),a+k*3);}}}
  ]});
}

if(FAKE){mode=LS.get('jr-mode','vs');}
setLang(lang);icons();
document.fonts&&document.fonts.ready.then(icons);
requestAnimationFrame(frame);
