<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Marble Plate · Bamboo Physio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<style>
.marbles-left{display:flex;gap:3px;align-items:center;min-height:40px}
.marbles-left canvas{width:30px;height:30px}
.marbles-left canvas.lost{opacity:.2;filter:grayscale(1)}
.marbles-left canvas{width:24px;height:24px}
.pick{justify-content:center;gap:12px;margin:4px 0 10px;font:700 17px Fredoka,sans-serif}
.pick .seg button{font-size:16px;padding:7px 14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>

<div class="top">
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 33 C 10 20, 20 9, 34 6 C 33 20, 24 31, 8 33 Z" fill="#7DCB6B" stroke="#2b2118" stroke-width="3.5" stroke-linejoin="round"/><path d="M11 30 C 17 23, 23 16, 29 11" fill="none" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round"/></svg><span>Bamboo Physio</span></div>
  <div class="tr"><button class="snd" id="snd" aria-pressed="false">🔊</button>
  <div class="lang"><button id="lang-en" aria-pressed="true">EN</button><button id="lang-he" aria-pressed="false">עב</button></div></div>
</div>

<div class="hud" id="hud">
  <div class="pill"><b id="score">0</b><small id="t-sec">seconds</small></div>
  <div class="marbles-left" id="lives"></div>
  <div class="pill"><b id="best">0</b><small id="t-best">best</small></div>
</div>

<div class="msg" id="msg"></div>
<div class="count" id="count"></div>
<div class="toast" id="toast"></div>

<div class="card" id="start">
  <h1 id="t-title">Marble Plate</h1>
  <p class="sub" id="t-sub"></p>
  <div class="g-row pick"><span id="t-size">Plate</span>
    <div class="seg" id="size-seg"><button data-v="wide"></button><button data-v="medium"></button><button data-v="narrow"></button></div></div>
  <div class="g-row pick"><span id="t-count">Marbles</span>
    <div class="seg" id="count-seg"><button data-v="3">3</button><button data-v="5">5</button><button data-v="7">7</button></div></div>
  <button class="btn" id="play"><span id="t-play">Play</span></button>
  <p class="note" id="t-privacy"></p>
  <details id="grown">
    <summary id="t-grown">For grown-ups</summary>
    <div class="g-body">
      <p id="t-g1"></p>
      <div class="g-row"><span id="t-music">Music</span>
        <div class="seg" id="music-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-amb">Pond sounds</span>
        <div class="seg" id="amb-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-sfx">Sound effects</span>
        <div class="seg" id="sfx-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <p id="t-g4"></p>
      <p id="t-g2"></p>
      <p id="t-g3"></p>
      <p class="mini" id="t-legal"></p>
    </div>
  </details>
</div>

<div class="card" id="end" hidden>
  <div class="center"><span class="newbest" id="newbest" hidden></span></div>
  <h1 id="t-over"></h1>
  <div class="big-score"><span id="final">0</span><small id="t-sec2"></small></div>
  <p class="best-line" id="best-line"></p>
  <button class="btn" id="again"><span id="t-again">Play again</span></button>
  <p class="note" id="t-privacy2"></p>
</div>

<script type="module">
import {INK,$,LS,S,audio,tone,SFX,musicStart,musicStop,bindSound,ell,sticker,starPath,drawRoom,drawKid,startFaceTracker,faceFrame,drawMirroredVideo} from '../shared/kit.js';

/* ================= TEXT ================= */
const UI={
 en:{title:"Marble Plate",sub:"Keep your head straight so the marbles stay on!",play:"Play",
  privacy:"The camera is used only to play. Nothing is recorded or sent.",grown:"For grown-ups",
  g1:"Marbles sit on a plate on the child's head. Any tilt makes them roll, so the child keeps the head straight and level. Now and then a bee lands on the plate and the marbles wobble, so the child has to correct. Score = seconds until all the marbles fall.",
  size:"Plate",count:"Marbles",wide:"Wide",medium:"Medium",narrow:"Narrow",
  music:"Music",amb:"Pond sounds",sfx:"Sound effects",on:"On",off:"Off",mute:"Sound on or off",

  g2:"★ Make it harder: sit on a therapy ball or a balance cushion, then stand, then stand on one leg.",
  g3:"★ Stand the phone upright at eye level, with room above the head for the plate.",
  legal:"A home practice game by Bamboo Physio. Not a medical device. © 2026 Bamboo Physio · Instrument sounds: FluidR3_GM by Frank Wen, CC BY 3.0",
  sec:"seconds",best:"best",sec2:"seconds of steady balancing",over:"Steady head!",again:"Play again",newbest:"New record!",bestis:"Best: ",
  ready:"Getting ready…",face:"Show me your face!",lost:"Where did you go?",back:"Move back a little",oops:"Plink!",
  nocam:"No camera here. Drag left and right to tilt the head.",aria:"Game area",
  bowl:"Bowl",plate:"Plate",tray:"Tray"},
 he:{title:"צלחת גולות",sub:"שמרו על ראש ישר כדי שהגולות לא ייפלו!",play:"שחקו",
  privacy:"המצלמה משמשת רק למשחק. שום דבר לא מוקלט ולא נשלח.",grown:"למבוגרים",
  g1:"על הראש של הילד יש צלחת עם גולות. כל הטיה של הראש מגלגלת אותן, אז הילד שומר על ראש ישר ומאוזן. מדי פעם דבורה נוחתת על הצלחת והגולות מתנדנדות, והילד צריך לתקן. הניקוד הוא מספר השניות עד שכל הגולות נופלות.",
  size:"צלחת",count:"גולות",wide:"רחבה",medium:"בינונית",narrow:"צרה",
  music:"מוזיקה",amb:"צלילי בריכה",sfx:"צלילים במשחק",on:"פועל",off:"כבוי",mute:"הפעלת או השתקת קול",
  g4:"★ שתי בחירות: גודל הצלחת ומספר הגולות. צלחת רחבה סולחת על תנועות קטנות, וצלחת צרה דורשת ראש יציב יותר. השפה המוגבהת נותנת הזדמנות אחרונה: גולה שהגיעה אליה עוד אפשר להציל אם מיישרים את הראש. 3, 5 או 7 גולות. לכל שילוב יש שיא משלו.",
  g2:"★ להקשות: ישיבה על כדור טיפולי או כרית איזון, אחר כך עמידה, ואז עמידה על רגל אחת.",
  g3:"★ העמידו את הטלפון ישר בגובה העיניים, עם מקום מעל הראש בשביל הצלחת.",
  legal:"משחק תרגול ביתי של Bamboo Physio. לא מכשיר רפואי. © 2026 Bamboo Physio · צלילי כלים: FluidR3_GM מאת Frank Wen, ‏CC BY 3.0",
  sec:"שניות",best:"שיא",sec2:"שניות של איזון יציב",over:"איזה ראש יציב!",again:"עוד פעם",newbest:"שיא חדש!",bestis:"השיא: ",
  ready:"מתכוננים…",face:"תראו לי את הפנים!",lost:"לאן נעלמתם?",back:"זוזו קצת אחורה",oops:"פלינק!",
  nocam:"אין כאן מצלמה. גררו ימינה ושמאלה כדי להטות את הראש.",aria:"אזור המשחק",
  bowl:"קערה",plate:"צלחת",tray:"מגש"}
};

/* ================= LEVELS ================= */
const COLORS=['#FF7A66','#5FB7F0','#8BD16B','#B79CFF','#FFC94D','#FF9FC6','#4FB3A9'];
/* one plate: its width (wide = forgiving) and the number of marbles are the two difficulty choices */
const WIDTH={wide:1.3,medium:1,narrow:.78};
const BPM={wide:84,medium:92,narrow:100};
let lang=LS.get('bamboo-lang','en'); if(!UI[lang])lang='en';
let size=LS.get('mp-size','medium'); if(!WIDTH[size])size='medium';
let count=+LS.get('mp-count','3'); if(![3,5,7].includes(count))count=3;
const dish='plate';
function cfg(){return {n:count,rad:.095/WIDTH[size],G:5.0,curve:.9,damp:2.0,dead:.055,bee:[8,12],kick:.5,rim:.8,rimK:2.2};}
const STEADY={g:1,d:1};
let best=0; const loadBest=()=>{best=+LS.get('mp-best-'+size+'-'+count,'0')||0;}; loadBest();

S.track='pond'; S.amb='pond'; S.bpm=()=>BPM[size];
const syncSound=bindSound(()=>UI[lang]);

function setLang(l){
  lang=l;LS.set('bamboo-lang',l);const u=UI[l];
  document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';document.querySelector('.top').dir='ltr';
  for(const k of ['title','sub','play','privacy','grown','g1','size','count','music','amb','sfx','g2','g3','g4','legal','sec','best','sec2','over','again'])
    {const e=$('t-'+k);if(e)e.textContent=u[k];}
  $('t-privacy2').textContent=u.privacy;
  document.querySelectorAll('#size-seg button').forEach(b=>{b.textContent=u[b.dataset.v];b.setAttribute('aria-pressed',b.dataset.v===size)});
  document.querySelectorAll('#count-seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===String(count)));
  $('lang-en').setAttribute('aria-pressed',l==='en');$('lang-he').setAttribute('aria-pressed',l==='he');
  $('c').setAttribute('aria-label',u.aria);
  syncSound();
  if(!$('end').hidden)fillEnd(lastNew);
}
$('lang-en').onclick=()=>setLang('en');$('lang-he').onclick=()=>setLang('he');
const pick=()=>{loadBest();$('best').textContent=Math.floor(best);audio();SFX.tink();resetMarbles();setLang(lang);};
document.querySelectorAll('#size-seg button').forEach(b=>b.onclick=()=>{size=b.dataset.v;LS.set('mp-size',size);pick();});
document.querySelectorAll('#count-seg button').forEach(b=>b.onclick=()=>{count=+b.dataset.v;LS.set('mp-count',count);pick();});

/* ================= CANVAS + ART ================= */
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',resize);resize();

function drawMarble(c,x,y,r,col,spin=0){
  const lw=Math.max(2,r*.16);
  sticker(c,ell(x,y,r,r),col,lw);
  c.save();c.translate(x,y);c.rotate(spin);
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=r*.18;c.lineCap='round';
  c.beginPath();c.arc(0,0,r*.5,-.4,1.6);c.stroke();
  c.restore();
  c.fillStyle='rgba(255,255,255,.85)';c.fill(ell(x-r*.35,y-r*.4,r*.22,r*.16,-.5));
}
/* dish geometry, local coords: origin = middle of the dish top, x across, y down */
function dishShape(type,h){
  if(type==='bowl')return {depth:h*.42,dip:x=>h*.24*(1-x*x)};
  if(type==='plate')return {depth:h*.12,dip:x=>h*.05*(1-x*x)};
  return {depth:h*.1,dip:()=>0};
}
function drawDishBack(c,type,h){
  const lw=Math.max(3,h*.045);
  if(type==='bowl'){ sticker(c,ell(0,0,h,h*.2),'#C98B4A',lw); c.fillStyle='#B3773C';c.fill(ell(0,h*.03,h*.86,h*.13)); }
  else if(type==='plate'){ sticker(c,ell(0,h*.03,h,h*.17),'#FFFFFF',lw);c.fillStyle='#F1F8FD';c.fill(ell(0,h*.03,h*.93,h*.15)); c.fillStyle='#E3F2FB';c.fill(ell(0,h*.03,h*.72,h*.11));
    c.strokeStyle='rgba(95,183,240,.55)';c.lineWidth=lw*.7;c.setLineDash([lw*.2,lw*2]);c.stroke(ell(0,h*.03,h*.86,h*.14));c.setLineDash([]); }
  else { sticker(c,ell(0,h*.04,h,h*.14),'#E8C07A',lw); c.fillStyle='rgba(255,255,255,.3)';c.fill(ell(-h*.4,h*.0,h*.25,h*.04)); }
}
function drawDishFront(c,type,h){
  const lw=Math.max(3,h*.045);
  if(type==='bowl'){
    const p=new Path2D();p.moveTo(-h,0);p.bezierCurveTo(-h*.95,h*.75,h*.95,h*.75,h,0);p.ellipse(0,0,h,h*.2,0,0,Math.PI,false);p.closePath();
    sticker(c,p,'#E0A35E',lw);
    c.strokeStyle='rgba(43,33,24,.25)';c.lineWidth=lw*.6;c.beginPath();c.ellipse(0,h*.3,h*.82,h*.13,0,.2,Math.PI-.2);c.stroke();
    c.fillStyle='rgba(255,255,255,.35)';c.fill(ell(-h*.55,h*.28,h*.14,h*.07,.4));
    sticker(c,ell(0,h*.6,h*.32,h*.08),'#C98B4A',lw*.8);
  } else if(type==='plate'){
    sticker(c,ell(0,h*.2,h*.42,h*.07),'#C9E3F5',lw*.8);
    const p=new Path2D();p.ellipse(0,h*.03,h,h*.17,0,0,Math.PI,false);p.ellipse(0,h*.1,h*.97,h*.17,0,Math.PI,0,true);p.closePath();
    sticker(c,p,'#D7ECF8',lw);
  } else {
    const p=new Path2D();p.ellipse(0,h*.04,h,h*.14,0,0,Math.PI,false);p.lineTo(-h,h*.16);p.ellipse(0,h*.16,h,h*.14,0,Math.PI,0,true);p.closePath();
    sticker(c,p,'#D4A85E',lw);
  }
}
function drawBee(c,x,y,s,t,flip=1){
  c.save();c.translate(x,y);c.scale(flip,1);const lw=Math.max(2,s*.09);
  const fl=.4+.6*Math.abs(Math.sin(t*40));
  c.save();c.globalAlpha=.85;sticker(c,ell(-s*.05,-s*.42,s*.22,s*.34*fl,-.4),'#FFFFFF',lw*.8);sticker(c,ell(s*.18,-s*.38,s*.18,s*.28*fl,.3),'#FFFFFF',lw*.8);c.restore();
  sticker(c,ell(0,0,s*.5,s*.36),'#FFD84D',lw);
  c.save();c.clip(ell(0,0,s*.5,s*.36));c.fillStyle=INK;c.fillRect(-s*.15,-s,s*.14,s*2);c.fillRect(s*.12,-s,s*.12,s*2);c.restore();
  sticker(c,ell(0,0,s*.5,s*.36),'rgba(0,0,0,0)',lw);
  c.fillStyle=INK;c.fill(ell(s*.36,-s*.06,s*.06,s*.08));c.fillStyle='#fff';c.fill(ell(s*.38,-s*.09,s*.02,s*.02));
  c.fillStyle='rgba(255,140,165,.85)';c.fill(ell(s*.34,s*.1,s*.06,s*.04));
  c.lineWidth=lw*.7;c.beginPath();c.moveTo(-s*.5,0);c.lineTo(-s*.64,s*.02);c.stroke();
  c.restore();
}

/* ================= TRACKING ================= */
const video=$('v');
let mode='demo',tracker=null,camOK=false,camTried=false,lastVT=-1;
const head={ok:false,x:0,y:0,w:0,roll:0,lastSeen:0};
function track(now){
  if(!tracker||video.readyState<2||video.currentTime===lastVT)return;lastVT=video.currentTime;
  const P=faceFrame(tracker,video,now,W,H);if(!P){head.ok=false;return;}
  let a=P(33),b=P(263);if(a.x>b.x)[a,b]=[b,a];
  const roll=Math.atan2(b.y-a.y,b.x-a.x);
  const L=P(234),R=P(454),w=Math.hypot(R.x-L.x,R.y-L.y),top=P(10);
  const tx=top.x+Math.sin(roll)*w*.12,ty=top.y-Math.cos(roll)*w*.12,k=head.ok?.45:1;
  head.x+=(tx-head.x)*k;head.y+=(ty-head.y)*k;head.w+=(w-head.w)*k;head.roll+=(roll-head.roll)*(head.ok?.4:1);
  head.ok=true;head.lastSeen=now;
}
let fingerRoll=0,fingerTarget=0,dragging=false;
cv.addEventListener('pointerdown',e=>{dragging=true;fingerFrom(e)});
cv.addEventListener('pointermove',e=>{if(dragging)fingerFrom(e)});
addEventListener('pointerup',()=>{dragging=false});
function fingerFrom(e){fingerTarget=Math.max(-.6,Math.min(.6,(e.clientX-W/2)/(W*.4)*.6));}
const keys={};addEventListener('keydown',e=>{keys[e.key]=1});addEventListener('keyup',e=>{keys[e.key]=0});

/* ================= GAME ================= */
let state='menu',score=0,starsGiven=0,tNow=0,countT=0,lastNew=false,demoRoll=0,kidNeck=H*.6;
let marbles=[],fallers=[],stars=[],wob=0;
const bee={on:false,phase:'',t0:0,side:1,next:0,x:0,y:0};

function resetMarbles(){
  const D=cfg();marbles=[];
  for(let i=0;i<D.n;i++){const x=D.n===1?0:(-.5+i/(D.n-1))*Math.min(1.45,D.n*D.rad*2.3);marbles.push({x,v:0,col:COLORS[i%7],spin:0,id:i});}
  bee.on=false;bee.next=tNow+D.bee[0]*.7;
}
function buildLives(){
  const box=$('lives');box.innerHTML='';const D=cfg();
  for(let i=0;i<D.n;i++){const c=document.createElement('canvas');c.width=60;c.height=60;const x=c.getContext('2d');drawMarble(x,30,30,24,COLORS[i%7]);
    if(!marbles.find(m=>m.id===i))c.className='lost';box.appendChild(c);}
}
function msg(t){const m=$('msg');if(t){m.textContent=t;m.classList.add('on')}else m.classList.remove('on');msgNow=t;}
let msgNow='';

async function play(){
  audio();SFX.go();musicStart();
  $('start').hidden=true;$('end').hidden=true;
  score=0;starsGiven=0;fallers=[];stars=[];resetMarbles();buildLives();
  $('score').textContent='0';$('best').textContent=Math.floor(best);$('hud').classList.add('on');
  if(!camTried){
    camTried=true;msg(UI[lang].ready);state='ready';
    try{tracker=await startFaceTracker(video);camOK=true;mode='camera';}
    catch(e){mode='finger';msg('');const t=$('toast');t.textContent=UI[lang].nocam;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),5000);}
  } else mode=camOK?'camera':'finger';
  if(mode==='finger'){state='count';countT=tNow;} else {state='ready';msg(UI[lang].face);}
}
$('play').onclick=play;$('again').onclick=play;

function surface(){
  if(mode==='camera'&&state!=='menu')return {x:head.x||W/2,y:head.y||H*.4,roll:head.roll,half:(head.w||W*.3)*.8*WIDTH[size]};
  const hw=Math.min(W*.46,H*.3),roll=state==='menu'?demoRoll:fingerRoll,r=hw*.5,top=-r*2.02;
  return {x:W/2+Math.sin(roll)*-top,y:kidNeck+Math.cos(roll)*top,roll,half:hw*.66*WIDTH[size]};
}

function physics(dt,roll,running){
  const D=cfg(),St=STEADY;
  const ramp=1+Math.min(.45,score/160);
  const dead=D.dead*St.d,r=Math.max(-.6,Math.min(.6,roll));
  const eff=Math.sign(r)*Math.max(0,Math.abs(r)-dead);
  for(const m of marbles){
    if(!running)break;
    const over=Math.abs(m.x)-D.rim,rimPush=over>0?-Math.sign(m.x)*D.rimK*over/(1-D.rim):0;   // raised rim: pushes back harder the higher it climbs
    const a=D.G*St.g*ramp*Math.sin(eff)-D.curve*m.x-D.damp*m.v+rimPush;
    m.v+=a*dt;
    if(eff===0&&Math.abs(m.v)<.04&&D.curve===0)m.v*=Math.pow(.05,dt);
    m.x+=m.v*dt;m.spin+=m.v*dt/D.rad;
  }
  // marble-to-marble bumps
  marbles.sort((a,b)=>a.x-b.x);
  for(let i=0;i<marbles.length-1;i++){
    const a=marbles[i],b=marbles[i+1],gap=2*D.rad-(b.x-a.x);
    if(gap>0){a.x-=gap/2;b.x+=gap/2;const rel=a.v-b.v;if(rel>0){const va=a.v,vb=b.v;a.v=vb*.85+va*.15;b.v=va*.85+vb*.15;if(rel>.12)SFX.tink(.9+Math.random()*.2);}}
  }
}

function fallOff(m,s){
  marbles=marbles.filter(x=>x!==m);
  const sh=dishShape(dish,s.half),lx=m.x*s.half,ly=sh.dip(Math.min(1,Math.abs(m.x)))-cfg().rad*s.half;
  fallers.push({x:s.x+Math.cos(s.roll)*lx-Math.sin(s.roll)*ly,y:s.y+Math.sin(s.roll)*lx+Math.cos(s.roll)*ly,
    vx:Math.sign(m.x)*s.half*1.2+m.v*s.half*.5,vy:-s.half*.6,col:m.col,r:cfg().rad*s.half,spin:m.spin,t:tNow,landed:false});
  SFX.tink(1.3);buildLives();
  msg(UI[lang].oops);setTimeout(()=>{if(msgNow===UI[lang].oops)msg('')},700);
  if(!marbles.length)setTimeout(()=>{if(state==='play')endGame()},1100);
}
function endGame(){
  state='over';musicStop();$('hud').classList.remove('on');msg('');
  lastNew=score>best&&score>=1;if(lastNew){best=score;LS.set('mp-best-'+size+'-'+count,best.toFixed(1));SFX.star();}
  fillEnd(lastNew);$('end').hidden=false;
}
function fillEnd(nb){const u=UI[lang];$('final').textContent=Math.floor(score);$('newbest').hidden=!nb;$('newbest').textContent=u.newbest;
  $('best-line').textContent=u.bestis+Math.floor(best);$('t-privacy2').textContent=u.privacy;$('t-over').textContent=u.over;$('t-sec2').textContent=u.sec2;}

function updateBee(dt,s){
  const D=cfg();
  if(!bee.on){ if(state==='play'&&tNow>bee.next&&marbles.length){bee.on=true;bee.phase='in';bee.t0=tNow;bee.side=Math.random()<.5?-1:1;SFX.buzz();} return; }
  const k=tNow-bee.t0, land={x:s.x+Math.cos(s.roll)*bee.side*s.half*.85,y:s.y+Math.sin(s.roll)*bee.side*s.half*.85-s.half*.18};
  if(bee.phase==='in'){const p=Math.min(1,k/1.2),sx=bee.side>0?W+40:-40,sy=s.y-s.half*1.4;
    bee.x=sx+(land.x-sx)*p;bee.y=sy+(land.y-sy)*p-Math.sin(p*Math.PI)*s.half*.4+Math.sin(tNow*9)*4;
    if(p>=1){bee.phase='sit';bee.t0=tNow;wob=1;const dir=Math.random()<.5?-1:1;for(const m of marbles)m.v+=dir*D.kick*(.8+Math.random()*.4);SFX.boing();}}
  else if(bee.phase==='sit'){bee.x=land.x;bee.y=land.y;if(k>.7){bee.phase='out';bee.t0=tNow;SFX.buzz();}}
  else {const p=Math.min(1,k/1.1),ex=bee.side>0?-60:W+60;bee.x=land.x+(ex-land.x)*p;bee.y=land.y-p*s.half*1.6+Math.sin(tNow*9)*4;
    if(p>=1){bee.on=false;bee.next=tNow+D.bee[0]+Math.random()*(D.bee[1]-D.bee[0]);}}
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;tNow+=dt;
  if(mode==='camera')track(now);
  let kt=fingerTarget;if(keys.ArrowLeft)kt=-.35;if(keys.ArrowRight)kt=.35;
  if(!dragging&&!keys.ArrowLeft&&!keys.ArrowRight)fingerTarget*=Math.pow(.2,dt);
  fingerRoll+=(kt-fingerRoll)*Math.min(1,dt*8);
  kidNeck+=((state==='menu'?H*.58:H*.82)-kidNeck)*Math.min(1,dt*4);
  wob=Math.max(0,wob-dt*2.5);
  const s=surface();

  if(state==='menu'){
    if(!marbles.length)resetMarbles();
    const avg=marbles.reduce((a,m)=>a+m.x+m.v*.6,0)/marbles.length;
    demoRoll+=((-avg*.5+Math.sin(tNow*.9)*.09)-demoRoll)*Math.min(1,dt*3);
    physics(dt,demoRoll,true);
    for(const m of marbles)if(Math.abs(m.x)>.95){m.x=Math.sign(m.x)*.95;m.v*=-.3;}
  }
  else if(state==='ready'){
    if(mode==='camera'&&head.ok){if(s.y-s.half*1.3<0)msg(UI[lang].back);else{state='count';countT=tNow;msg('');}}
  }
  else if(state==='count'){
    const n=3-Math.floor(tNow-countT),el=$('count');
    if(n>0){if(el.textContent!==String(n)){el.textContent=n;el.style.display='block';SFX.tick();}}
    else{el.style.display='none';el.textContent='';state='play';SFX.go();bee.next=tNow+cfg().bee[0]*.7;}
  }
  else if(state==='play'){
    const lostFace=mode==='camera'&&(!head.ok||now-head.lastSeen>500);
    if(lostFace)msg(UI[lang].lost);
    else{
      if(msgNow===UI[lang].lost)msg('');
      physics(dt,s.roll,true);
      updateBee(dt,s);
      if(marbles.length){score+=dt;$('score').textContent=Math.floor(score);
        if(Math.floor(score/10)>starsGiven){starsGiven++;SFX.star();stars.push({t:tNow});}}
      for(const m of [...marbles])if(Math.abs(m.x)>1.02)fallOff(m,s);
    }
  }
  render(s,dt);
  requestAnimationFrame(frame);
}

function render(s,dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const cam=mode==='camera'&&camOK&&state!=='menu';
  if(cam&&video.readyState>=2){drawMirroredVideo(ctx,video,W,H);ctx.fillStyle='rgba(255,248,236,.08)';ctx.fillRect(0,0,W,H);}
  else drawRoom(ctx,W,H);
  if(!cam){const hw=Math.min(W*.46,H*.3);drawKid(ctx,W,H,W/2,kidNeck,hw,s.roll,tNow);}
  const show=state!=='over'&&!(cam&&!head.ok);
  if(show){
    const h=s.half,sh=dishShape(dish,h),D=cfg(),r=D.rad*h;
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.roll+Math.sin(tNow*28)*.05*wob);
    drawDishBack(ctx,dish,h);
    const order=[...marbles].sort((a,b)=>a.id-b.id);
    for(const m of order){const cx=Math.max(-1,Math.min(1,m.x));const lift=Math.max(0,Math.abs(cx)-cfg().rim)/(1-cfg().rim)*h*.07;drawMarble(ctx,m.x*h,sh.dip(Math.abs(cx))-r-lift,r,m.col,m.spin);}
    drawDishFront(ctx,dish,h);
    if(state==='ready'||state==='count'){ctx.globalAlpha=.9;}
    ctx.restore();
  }
  // falling marbles
  fallers=fallers.filter(f=>tNow-f.t<2.2);
  for(const f of fallers){
    if(!f.landed){f.vy+=H*2.2*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.spin+=dt*10;if(f.y>H*.93){f.landed=true;f.y=H*.93;SFX.plunk();}}
    if(f.landed){const k=(tNow-f.t);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(f.x,H*.95,f.r*(1+k*2),f.r*.3*(1+k*2),0,0,7);ctx.stroke();}
    else drawMarble(ctx,f.x,f.y,f.r,f.col,f.spin);
  }
  if(bee.on)drawBee(ctx,bee.x,bee.y,s.half*.28,tNow,bee.phase==='out'?-bee.side:bee.side*-1);
  stars=stars.filter(o=>tNow-o.t<1.2);
  for(const o of stars){const k=(tNow-o.t)/1.2,sc=.6+Math.sin(Math.min(1,k*3)*Math.PI/2)*.6;ctx.save();ctx.translate(s.x,s.y-s.half*1.1-k*s.half*1.2);ctx.rotate(k*2);ctx.scale(sc,sc);
    ctx.globalAlpha=1-k*k;sticker(ctx,starPath(s.half*.24),'#FFD84D',4);ctx.restore();}
}

setLang(lang);
$('best').textContent=Math.floor(best);
resetMarbles();
requestAnimationFrame(frame);
</script>
