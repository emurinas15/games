<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Fruit Bat · Bamboo Physio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<style>
.stopx{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:7;width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid var(--ink);font:900 20px Fredoka,sans-serif;box-shadow:0 3px 0 var(--ink);display:none;cursor:pointer}
.stopx.on{display:block}
.snd.cast{font-size:19px}
.lv b{display:block;font:700 14px Fredoka,sans-serif}
.levels.modes .lv{max-width:170px}
.levels.modes .lv canvas{width:110px;height:64px}
.btn2{display:block;margin:10px auto 0;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 18px;font:700 16px Fredoka,sans-serif;color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
.btn2:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.best{font:700 15px Fredoka,sans-serif;margin:-4px 0 8px;text-align:center;min-height:18px}
.vs-names{display:flex;justify-content:center;gap:28px;font:700 15px Fredoka,sans-serif;margin:-2px 0 10px}
.seg button.locked{opacity:.55;background:repeating-linear-gradient(0deg,#f3eefa,#f3eefa)}
.crazy-info{background:#F3EAFB;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;margin:4px 0 8px;font:600 14px Fredoka,sans-serif}
.crazy-info.shake{animation:shk .45s}
@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.tvask{z-index:12;max-width:420px}.tvask p{font:600 18px Fredoka,sans-serif;margin:0 0 12px}
.win{z-index:13;max-width:460px;padding-top:6px;max-height:none;overflow:visible}
.win .btn{font-size:24px}
.win h1{font-size:28px;margin:0 0 6px;color:#7B5A93}
#win-trophy{display:block;margin:-4px auto -6px;width:190px;height:148px}
#win-prev{display:block;margin:0 auto;width:100%;max-width:330px;border:3px solid var(--ink);border-radius:16px;aspect-ratio:720/330;height:auto}
#win-p{font:600 15px Fredoka,sans-serif;margin:8px 4px}
@media (max-height:560px) and (orientation:landscape){
  .win{max-width:min(780px,94vw);display:grid;grid-template-columns:1fr 1.15fr;grid-template-rows:auto auto auto auto;column-gap:16px;align-items:center;padding:8px 14px 10px}
  #win-trophy{grid-column:1;grid-row:1;width:150px;height:117px}.win h1{grid-column:1;grid-row:2;font-size:22px}#win-p{grid-column:1;grid-row:3/5;font-size:14px;margin:2px}
  #win-prev{grid-column:2;grid-row:1/3;max-width:none}#win-go{grid-column:2;grid-row:3;margin-top:8px}#win-later{grid-column:2;grid-row:4}}
.hs-btn{display:block;margin:4px auto 0;border:3px solid var(--ink);border-radius:999px;background:#FFF1B8;color:var(--ink);font:700 15px Fredoka,sans-serif;padding:4px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.hs{margin:8px auto 0;max-width:300px;font:600 15px Fredoka,sans-serif}.hs[hidden]{display:none}
.hs h3{margin:0 0 4px;text-align:center;font:700 14px Fredoka,sans-serif;opacity:.7}
.hs-tabs{display:flex;justify-content:center;gap:6px;margin:0 0 6px}
.hs-tabs button{border:2.5px solid var(--ink);border-radius:999px;background:#fff;font:700 13px Fredoka,sans-serif;padding:2px 10px;cursor:pointer;color:var(--ink)}
.hs-tabs button[aria-pressed="true"]{background:#FFD84D}.hs-tabs button:disabled{opacity:.45}
.hs ol{margin:0;padding:0;list-style:none}.hs li{display:flex;justify-content:space-between;gap:10px;padding:3px 10px;border-radius:10px}.hs li:nth-child(odd){background:rgba(255,216,77,.25)}
.hs .none{text-align:center;opacity:.6;margin:4px 0}
.hs-in{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 10px;font:700 16px Fredoka,sans-serif}
.hs-in input{font:700 18px Fredoka,sans-serif;border:3px solid var(--ink);border-radius:14px;padding:5px 10px;width:150px;background:#fff;color:var(--ink)}
.unlock{font:700 16px Fredoka,sans-serif;background:#F3EAFB;border:3px solid var(--ink);border-radius:16px;padding:6px 12px;margin:0 auto 10px;max-width:340px}
body.casting .toast{visibility:hidden}
@media (max-height:520px){
  .card{padding:10px 14px 8px}
  h1{font-size:26px}
  .sub{display:none}
  .levels{margin:0 0 8px}
  .levels.modes .lv canvas{width:76px;height:44px}
  .btn{font-size:24px;padding:6px 0 5px}
  .note{margin:6px 4px 2px}
  .big-score{font-size:46px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>

<div class="top">
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 33 C 10 20, 20 9, 34 6 C 33 20, 24 31, 8 33 Z" fill="#7DCB6B" stroke="#2b2118" stroke-width="3.5" stroke-linejoin="round"/><path d="M11 30 C 17 23, 23 16, 29 11" fill="none" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round"/></svg><span>Bamboo Physio</span></div>

  <p class="note" id="t-privacy"></p>
  <details id="grown">
    <summary id="t-grown">For grown-ups</summary>

      <div class="crazy-info" id="crazy-info"></div>
      <div class="g-row"><span id="t-path">Show flight path</span>
        <div class="seg" id="path-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-tv">TV delay</span>
        <div class="seg" id="tv-seg"><button data-v="0"></button><button data-v="0.5">½ s</button><button data-v="1">1 s</button><button data-v="1.5">1½ s</button></div></div>
      <div class="g-row"><span id="t-music">Music</span>
        <div class="seg" id="music-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-amb">Evening sounds</span>
        <div class="seg" id="amb-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-sfx">Sound effects</span>
        <div class="seg" id="sfx-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <p id="t-g1"></p>
      <p id="t-g2"></p>
      <p id="t-g3"></p>
      <p id="t-g4"></p>
      <p id="t-g5"></p>
      <p class="mini" id="t-legal"></p>
    </div>
  </details>
</div>

<div class="card tvask" id="tvask" hidden><p id="tvq"></p><button class="btn" id="tv-yes"></button><button class="btn2" id="tv-no"></button></div>
<div class="card win" id="win" hidden>
  <canvas id="win-trophy" width="360" height="280"></canvas>
  <h1 id="win-t"></h1>
  <canvas id="win-prev" width="720" height="330"></canvas>
  <p class="note" id="win-p"></p>
  <button class="btn" id="win-go"></button>
  <button class="btn2" id="win-later"></button>
</div>
<div class="card" id="end" hidden>
  <h1 id="t-over"></h1>
  <div class="big-score" dir="ltr"><span id="final">0</span></div>
  <div class="vs-names" dir="ltr"><span id="n-left"></span><span id="n-right"></span></div>
  <div class="unlock" id="unlock" hidden></div>
  <div id="hs-name"></div>
  <button class="btn" id="again"><span id="t-again">Play again</span></button>
  <button class="btn2" id="menu"></button>
  <p class="note" id="t-privacy2"></p>
</div>

     (2.5 s normal, 1.5 s fast) and a soft see-through stripe shows its path. It grows a little and wiggles at the end.
     No blinking (safe for children with epilepsy).
   · From the side at fruit height  -> DUCK under it.
   · From the side, LOW (so the child can't just stay down) -> STAND UP tall.
   · From the top, straight down over the fruit -> STEP to the side.
   · 3 dodges = next level, and a new fruit (what fruit bats really eat). 10 levels; a bat every 4 s at level 1,
     every 2 s at level 10 (fast: 3.2 s -> 1.6 s, bats overlap now and then).
   · Settings: play until all 10 levels / 1 minute; speed normal / fast / crazy bats (locked until all 10 levels are done).
   · Grab = the bat flies off munching; a new fruit drops onto the head after 1 s. No points are taken off.

const video=$('v');
let tracker=null,camOK=false,lastVT=-1,people=[];
const vmap=()=>{const vw=video.videoWidth||640,vh=video.videoHeight||480,s=Math.max(W/vw,H/vh);return {vw,vh,s,ox:(W-vw*s)/2,oy:(H-vh*s)/2};};
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();
  const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts=(d,k)=>({baseOptions:{modelAssetPath:`https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${k}/float16/1/pose_landmarker_${k}.task`,delegate:d},
    runningMode:'VIDEO',numPoses:4,minPoseDetectionConfidence:.45,minPosePresenceConfidence:.45,minTrackingConfidence:.45});
  let err=null;
  for(const [d,k] of [['GPU','full'],['GPU','lite'],['CPU','lite']]){try{tracker=await timeoutP(vision.PoseLandmarker.createFromOptions(files,opts(d,k)),d==='GPU'?30000:120000);break;}catch(e){err=e;}}
  if(!tracker)throw err||new Error('model');
  tracker=lockOn(tracker,{kind:'pose',players:()=>mode==='duo'?2:1});   // follow only the player(s), never a grown-up behind
  camOK=true;
}
function track(now){
  if(!tracker||video.readyState<2||video.currentTime===lastVT)return false;lastVT=video.currentTime;
  let res;try{res=tracker.detectForVideo(video,now);}catch(e){return false;}
  const m=vmap(),L=res.landmarks||[];
  // found by the SHOULDERS (like Spider Swat) — from a few metres away the face is often too small to be sure of
  people=L.map(lm=>{const p=lm.map(q=>({x:m.ox+(1-q.x)*m.vw*m.s,y:m.oy+q.y*m.vh*m.s,v:q.visibility??1}));
    const sw=Math.hypot(p[11].x-p[12].x,p[11].y-p[12].y),sx=(p[11].x+p[12].x)/2,sy=(p[11].y+p[12].y)/2;
    const hs=[0,7,8].filter(i=>p[i].v>.4);
    const hx=hs.length?hs.reduce((a,i)=>a+p[i].x,0)/hs.length:sx, hy=hs.length?hs.reduce((a,i)=>a+p[i].y,0)/hs.length:sy-sw*.75;
    const nose=p[0].v>.4?p[0]:{x:hx,y:hy};
    return {nose,hx,hy,sw,cx:sx,ok:p[11].v>=.4&&p[12].v>=.4&&sw>4};}).filter(p=>p.ok);
  people.sort((a,b)=>a.cx-b.cx);
  if(mode==='solo'&&people.length>1)people=[people.reduce((a,b)=>b.sw>a.sw?b:a)];
  return true;
}
/* 23 Nov (Edgar): the same setup as Spider Swat — the see-through outline that fills green while the child holds still.
   1 player: the Swat 'reach' outline, a little lower and smaller so the fruit ends up around the middle of the screen
   with room to duck and to stand up again. 2 players: Swat's 2-player outline (reachLow) on each half. Hands not required. */
const GTXT={en:{find:'Stand in front of the camera'},he:{find:'עמדו מול המצלמה'}};
const guide=makeGuide('reach',{},{...GTXT,target:{y:.46,size:r=>Math.min(r.w*.22,r.h*.25),portrait:null}});
const guides=[makeGuide('reachLow',{},GTXT),makeGuide('reachLow',{},GTXT)];
/* ================= PLAYERS ================= */
function lanes(){return mode==='duo'?[{x:0,w:W/2,dir:1},{x:W/2,w:W/2,dir:-1}]:[{x:0,w:W,dir:1}];}
let players=[];
function makePlayer(k){
  return {k,get ln(){return lanes()[k];},t:0,level:1,lvEv:0,ev:0,hits:0,done:false,doneT:0,bats:[],last:[],lastSide:1,ref:null,head:null,seenT:-9,badT:0,distBad:'',paused:false,
    fruit:{st:'branch',kind:FRUITS[0],grow:1,yay:-9,back:0,onT:-9,fid:0,ready:false},wave:{left:0,nextT:0},hops:[],bounceT:-9,msgs:[],lvT:-9,fake:{x:0,y:0}};
}
function personFor(k){
  if(mode==='solo')return people[0]||null;
  if(people.length>=2)return people[k];
  const p=people[0];if(!p)return null;return (p.cx<W/2?0:1)===k?p:null;
}
const U=P=>P.ref.u;
const FR=P=>U(P)*.25;                          // fruit radius
const HIT=P=>U(P)*.55;                         // bat body + fruit: touching distance
const standY=P=>P.ref.top-FR(P)*.85;           // the fruit's height while the child stands
const laneY=(P,type)=>type==='low'?Math.min(H-U(P)*.35,standY(P)+U(P)*1.02):standY(P);
const batR=P=>U(P)*.3;
const fruitPos=P=>({x:P.head?P.head.x:P.ln.x+P.ln.w/2,y:(P.head?P.head.y:P.ref.top)-FR(P)*.85});
const topY=()=>Math.max(78,H*.13);             // where the top warning sits (under the top bar)

/* 24 Nov (Edgar): a fruit is picked from the branch with the head; only then do the bats come for it.
   After all its bats are dodged it hops into the basket, and a new fruit grows on the branch. 3 in the basket = next level.
   Bat mix by level (weights high / low / top / diagonal): low bats common at levels 3–5, rare later;
   diagonal bats (from a top corner, aimed at the fruit) only at levels 8–10 — and from level 4 in Crazy bats. */
const branchPos=P=>({x:P.ln.x+P.ln.w/2,y:Math.max(topY()+FR(P)*1.6,standY(P)-FR(P)*.15)});
function pickType(P){
  const L=P.level,cr=speed==='crazy',T=['high','low','top','diag'];
  let w=L===1?[1,0,0,0]:L===2?[.5,0,.5,0]:L===3?[.45,.35,.2,0]:L<=5?[.4,.3,.3,0]:L<=7?[.5,.12,.38,0]:[.37,.07,.3,.26];
  if(cr&&L>=4&&L<=7)w=[.35,.15,.25,.25];
  const n=P.last.length,last=P.last[n-1];
  if(n>=2&&P.last[n-2]===last){const i=T.indexOf(last);if(w.some((v,j)=>j!==i&&v>0))w=w.map((v,j)=>j===i?0:v);}   // never 3 the same in a row
  let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<4;i++){r-=w[i];if(r<=0&&w[i]>0)return T[i];}
  return 'high';
}
/* how many bats come for one fruit (keeps the top levels busy and the whole game ~2 minutes) */
/* the bats for the next fruit start getting ready right away — even while that fruit is still growing on the branch */
function newWave(P){const f=P.fruit;f.ready=true;f.fid++;P.wave={left:waveSize(P),nextT:P.t+.1};}
function waveSize(P){const L=P.level;let n=L<=4?1:L<=7?(Math.random()<.5?2:1):2;if(speed==='crazy'&&L>=3)n=L>=8&&Math.random()<.4?3:2;return n;}
function makeBat(P,type,cfg,side){
  const ln=P.ln,u=U(P),f=P.fruit.st==='head'?fruitPos(P):branchPos(P),R=Math.max(22,Math.min(46,u*.38));
  const lvk=1+.025*(P.level-1),b={type,st:'warn',t:0,ft:0,warn:cfg.warn,R,judged:false,mood:'hungry',fid:P.fruit.fid};
  if(type==='top'){
    b.x=Math.max(ln.x+u*.7,Math.min(ln.x+ln.w-u*.7,f.x));b.y=-u;b.vx=0;b.vy=H/cfg.dive*lvk;b.wx=b.x;b.wy=topY()+R*.2;b.dirv={x:0,y:1};
  } else if(type==='diag'){
    const dir=mode==='duo'?ln.dir:side,cx=dir>0?ln.x:ln.x+ln.w;   // from the top corner on that side
    const sx=cx-dir*u*.4,sy=-u*.4,dx=f.x-sx,dy=f.y-sy,L=Math.hypot(dx,dy),sp=W/cfg.side*lvk*.95;
    b.dir=dir;b.x=sx;b.y=sy;b.vx=dx/L*sp;b.vy=dy/L*sp;b.dirv={x:dx/L,y:dy/L};b.wx=cx+dir*R*1.3;b.wy=topY()+R*.2;
  } else {
    const dir=mode==='duo'?ln.dir:side;   // 2 players: always from your own outer edge
    b.dir=dir;b.y=laneY(P,type);b.x=dir>0?ln.x-u:ln.x+ln.w+u;b.vx=dir*W/cfg.side*lvk;b.vy=0;
    b.wx=dir>0?ln.x+R*1.25:ln.x+ln.w-R*1.25;b.wy=b.y;b.dirv={x:dir,y:0};
  }
  if(showPath){   // the bat waits inside the screen, where the sign would be, and flies from there
    const br=batR(P),hx=type==='top'?b.x:b.dir>0?ln.x+br*3:ln.x+ln.w-br*3,hy=type==='top'||type==='diag'?topY()+br*.6:b.y;
    if(type==='diag'){const dx=f.x-hx,dy=f.y-hy,L=Math.hypot(dx,dy),sp=Math.hypot(b.vx,b.vy);b.vx=dx/L*sp;b.vy=dy/L*sp;b.dirv={x:dx/L,y:dy/L};}

/* ?bot: plays by itself, perfectly (to check timings) */
function botHead(P){
  const u=U(P),cx=P.ln.x+P.ln.w/2,stand=P.ref.top+u*.45;let tx=P.bx??cx,ty=stand;
  if(P.fruit.st!=='head'){tx=branchPos(P).x;}
  else{const next=P.bats.filter(b=>!b.judged&&b.st!=='grab').sort((a,b)=>a.arr-b.arr)[0];
    if(next&&next.skip==null)next.skip=Math.random()<(+QS.get('miss')||0);   // ?miss=0.3: the test bot lets some bats get the fruit
    if(next&&next.skip){}
    else if(next&&next.st==='fly'||next&&next.arr+tvLag-P.t<1.2&&!next.held){
      if(next.type==='high')ty=stand+u*.85;
      if(next.type==='top'){if(P.bfor!==next){P.bfor=next;P.bdir=next.x<cx?1:-1;}tx=next.x+P.bdir*u*1.1;}
      if(next.type==='diag'){tx=cx-next.dir*u*1.3;ty=stand+u*.8;}
    } else if(!next)tx=cx;}
  P.bx=tx;const F=P.fake;F.x+=(tx-F.x)*.15;F.y+=(ty-F.y)*.15;
}
function readHead(P,dt){
  if(camOK){
    const p=personFor(P.k);
    if(!p)return;
    const top=p.hy-P.ref.u*.45;
    if(P.head){const k=Math.min(1,dt*22);P.head.x+=(p.hx-P.head.x)*k;P.head.y+=(top-P.head.y)*k;}else P.head={x:p.hx,y:top};
    P.seenT=tNow;
    const r=p.sw/P.ref.sw;P.distBad=r>1.35?'back':r<.75?'closer':'';
  } else {if(BOT)botHead(P);const F=P.fake;P.head={x:F.x,y:F.y-P.ref.u*.45};P.seenT=tNow;P.distBad='';}
}
const segDist=(px,py,x0,y0,x1,y1)=>{const dx=x1-x0,dy=y1-y0,L=dx*dx+dy*dy,k=L?Math.max(0,Math.min(1,((px-x0)*dx+(py-y0)*dy)/L)):0;return Math.hypot(px-(x0+dx*k),py-(y0+dy*k));};
function stepPlayer(P,dt){
  readHead(P,dt);
  const lost=tNow-P.seenT>.5;
  if(lost||P.distBad){P.badT+=dt;if(P.badT>.4)P.paused=true;}else{P.badT=0;P.paused=false;}
  const f=P.fruit;
  // the child left the picture with the fruit -> it goes back to the branch (and the bats coming for it give up)
  if(f.st==='head'&&tNow-P.seenT>1.5){f.st='branch';f.grow=1;f.ready=false;P.wave.left=0;P.bats.forEach(b=>{if(b.fid===f.fid)b.judged=true;});}
  if(P.paused||P.done)return;
  P.t+=dt;
  const fp=fruitPos(P),hit=HIT(P),u=U(P),bp=branchPos(P);
  // branch: grow a new fruit, pick it with the head
  if(f.st==='gone'&&P.t>=f.back){f.st='branch';f.grow=0;}
  if(f.st==='branch'){f.grow=Math.min(1,f.grow+dt*3.3);
    // as soon as the new fruit is ready, the first bat starts getting ready too (the child picks the fruit while the sign fills)
    if(f.grow>=1&&P.head&&Math.hypot(fp.x-bp.x,fp.y-bp.y)<FR(P)*1.8){f.st='head';f.onT=P.t;FX.plop();newWave(P);}}
  // the next bat of a wave comes once the ones before it are flying
  // safety net: a fruit on the head with no bats coming for it -> start its bats
  if(f.st==='head'&&P.wave.left===0&&P.t-f.onT>1.5&&!P.bats.some(o=>o.fid===f.fid&&!o.judged)&&!P.hops.length){P.stuckT=(P.stuckT||0)+dt;if(P.stuckT>1.2){P.stuckT=0;newWave(P);}}else P.stuckT=0;
  if(f.st==='head'&&P.wave.left>0&&P.t>=P.wave.nextT&&!P.bats.some(o=>o.fid===f.fid&&o.st==='warn'&&!o.judged&&o!==P.bats[P.bats.length-1]))spawnOne(P);
  // bats. With a TV delay the child sees everything late, so the dodge is judged against where the bat was tvLag seconds ago.
  for(const b of P.bats){
    b.t+=dt;
    if(b.st==='warn'){
      // a bat only flies once its fruit has been on the head for half a second; until then its sign stays full and wiggles
      const hold=b.hover?b.warn*PATH_OFF:b.warn;
      if(b.t>=hold&&b.fid===f.fid&&(f.st!=='head'||P.t-f.onT<.5)){b.t=hold;b.held=true;continue;}
      if(b.t>=b.warn){if(false){}else if(b.fid!==f.fid||f.st!=='head'){b.st='gone';}else{b.st='fly';b.t=0;FX.whoosh();}}
      continue;}
    if(b.st==='fly'){
      b.x+=b.vx*dt;b.y+=b.vy*dt;b.ft+=dt;
      // trail (Edgar 24 Nov, option A): a curly whiff of wind every 2 wing beats (wings beat at 11 rad/s -> every ~1.14 s), first one right after take-off
      if(!b.hover){const n=Math.floor((b.ft+WHIFF_EVERY*.75)/WHIFF_EVERY);if(n>(b.wn||0)){b.wn=n;(b.whiffs=b.whiffs||[]).push({x:b.x,y:b.y,vx:b.vx*.6,vy:b.vy*.6,t:P.t,spin:n%2?1:-1,ang:Math.atan2(b.vy,b.vx)});}}
      if(!b.judged){
        const k0=Math.max(0,b.ft-dt-tvLag),k1=Math.max(0,b.ft-tvLag);
        const jx0=b.x0+b.vx*k0,jy0=b.y0+b.vy*k0,jx=b.x0+b.vx*k1,jy=b.y0+b.vy*k1;
        if(f.st==='head'&&b.fid===f.fid&&P.t-f.onT>.15&&segDist(fp.x,fp.y,jx0,jy0,jx,jy)<hit){   // got it!
          b.judged=true;b.st='grab';b.carry=f.kind;b.mood='yum';b.t=0;b.vx*=.6;b.vy=b.type==='top'?H*.25:Math.min(0,b.vy*.3);
          f.st='gone';f.back=P.t+.6;P.hits++;FX.nom();P.msgs.push({txt:UI[lang].yum,x:fp.x,y:fp.y,t:P.t,col:'#FF9FB0'});
          P.wave.left=0;P.bats.forEach(o=>{if(o!==b&&o.fid===b.fid){o.judged=true;o.mood='happy';}});
        } else {
          const sp=Math.hypot(b.vx,b.vy),past=((jx-fp.x)*b.vx+(jy-fp.y)*b.vy)/sp>hit;
          if(past){b.judged=true;b.mood='aww';
            if(f.st==='head'&&b.fid===f.fid){P.ev++;f.yay=P.t;FX.phew();FX.aww();P.msgs.push({txt:UI[lang].phew,x:fp.x,y:fp.y,t:P.t,col:'#B8F0A0',stars:1});
              // all the bats for this fruit dodged -> it hops into the basket
              if(P.wave.left===0&&!P.bats.some(o=>!o.judged&&o.fid===f.fid)){P.hops.push({kind:f.kind,x:fp.x,y:fp.y,t:P.t});f.st='gone';f.back=P.t+.4;}}
          }
        }
      }
    } else if(b.st==='grab'){b.x+=b.vx*dt;b.vy-=H*1.1*dt;b.y+=b.vy*dt;}
    const jx=b.judged?b.x:b.x0+b.vx*Math.max(0,b.ft-tvLag),jy=b.judged?b.y:b.y0+b.vy*Math.max(0,b.ft-tvLag),ln=P.ln;
    if(Math.min(b.x,jx)>ln.x+ln.w+u*2.5||Math.max(b.x,jx)<ln.x-u*2.5||Math.min(b.y,jy)>H+u*2||b.y<-u*3&&b.st==='grab')b.st='gone';
  }
  P.bats=P.bats.filter(b=>b.st!=='gone');
  // fruits hopping into the basket
  for(const hp of P.hops)if(!hp.done&&P.t-hp.t>=HOP){hp.done=true;P.lvEv++;P.bounceT=P.t;FX.plop();
    if(P.lvEv>=PER){const bk=basketPos(P);for(let i=0;i<14;i++)pops.push({x:bk.x,y:bk.y-bk.s*.4,vx:(Math.random()-.5)*W*.4,vy:-H*(.3+Math.random()*.5),life:1.1+Math.random()*.4,c:['#FFD84D','#FF9FB0','#7DCB6B','#B79CF2'][i%4]});
      P.lvShow=P.lvEv;levelUp(P);}}
  P.hops=P.hops.filter(hp=>!hp.done);
  P.msgs=P.msgs.filter(m=>P.t-m.t<1.2);
}
const HOP=.55;
const FLY_FLAP=16,WHIFF_EVERY=4*Math.PI/FLY_FLAP,WHIFF_LIFE=.8;   // wings beat at 16 rad/s while flying; a whiff every 2 beats (~.8 s), drifts after the bat at 60% of its speed and fades
const PATH_FULL=.6,PATH_OFF=.72;   // flight path: dots grow until 60% of the warning, stay, then vanish start→finish from 72% to 100%, then the bat flies
const basketPos=P=>{const s=Math.max(28,Math.min(50,U(P)*.42,H*.085));return {x:mode==='duo'?P.ln.x+P.ln.w*(P.k?.36:.64):P.ln.x+P.ln.w/2,y:H-s*.95-12,s};};

let last=performance.now();
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000))*SPEEDUP;last=now;tNow+=dt;
  if(camOK)track(now);
  if(portraitPlay()){render(dt);requestAnimationFrame(frame);return;}
  if(state==='setup'){
    const ob=p=>p?{x:p.nose.x,y:p.nose.y,size:p.sw}:null;
    players.forEach(P=>{const p=personFor(P.k);if(p){P.cal=P.cal||[];P.cal.push(p);if(P.cal.length>20)P.cal.shift();}});
    const done=mode==='duo'?guides.map((g,k)=>g.update(dt,ob(personFor(k)),{...lanes()[k],y:0,h:H})==='done').every(Boolean):guide.update(dt,ob(personFor(0)),{x:0,y:0,w:W,h:H})==='done';
    if(done){players.forEach(P=>{const c=P.cal&&P.cal.length?P.cal:null;
        const sw=c?c.reduce((a,p)=>a+p.sw,0)/c.length:Math.min(W,H)*.2,hy=c?c.reduce((a,p)=>a+p.hy,0)/c.length:H*.46;
        P.ref={sw,u:sw,top:hy-sw*.45};P.head=null;});
      hideGuides();startCount();}
  }
  else if(state==='count'){
    const n=3-Math.floor(tNow-countT);if(n!==lastCount){lastCount=n;if(n>0)SFX.tick();}
    players.forEach(P=>readHead(P,dt));
    if(tNow-countT>=3){state='play';elapsed=0;SFX.boing();}
  }
  else if(state==='play'){
    players.forEach(P=>stepPlayer(P,dt));
    if(!players.some(P=>P.paused))elapsed+=dt;
    if(until==='levels'){if(players.some(P=>P.done))endGame(false);}
    else{const left=Math.ceil(ROUND-elapsed);if(left<=5&&left<lastSec&&left>0)SFX.tick();lastSec=left;if(elapsed>=ROUND)endGame(false);}
  }
  render(dt);
  requestAnimationFrame(frame);
}

  ctx.fillStyle=INK;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2+4,w,h,h/2);ctx.fill();
  ctx.fillStyle=fill;ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,h/2);ctx.fill();ctx.stroke();
  ctx.fillStyle=INK;ctx.fillText(txt,x,y+1);ctx.restore();
}
function bigText(txt,x,y,fs,col='#FFD84D',sc=1){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.font=`900 ${fs}px Grandstander,Fredoka,sans-serif`;ctx.direction=lang==='he'?'rtl':'ltr';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=fs*.14;ctx.strokeStyle=INK;ctx.fillStyle=INK;ctx.fillText(txt,0,fs*.08);ctx.strokeText(txt,0,0);ctx.fillStyle=col;ctx.fillText(txt,0,0);ctx.restore();
}
function drawTurnPhone(){
  ctx.fillStyle='rgba(255,248,236,.92)';ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H*.42,s=Math.min(W,H)*.22,k=(tNow%2.4)/2.4,rot=-Math.PI/2*Math.min(1,Math.max(0,(k-.3)*3));
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);const p=new Path2D();p.roundRect(-s*.32,-s*.58,s*.64,s*1.16,s*.12);sticker(ctx,p,'#fff',5);
  ctx.fillStyle='#DDF3FF';ctx.fillRect(-s*.24,-s*.46,s*.48,s*.92);ctx.restore();
  ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx,cy,s*.85,-Math.PI*.9,-Math.PI*.55);ctx.stroke();
  bubble(UI[lang].turn,W/2,H*.72,Math.max(18,Math.min(26,W*.05)));
}
function drawPlayer(P){
  const u=UI[lang],f=P.fruit,fp=fruitPos(P),r=FR(P),ln=P.ln,bp=branchPos(P),bk=basketPos(P);
  if(mode==='duo'){ctx.save();ctx.beginPath();ctx.rect(ln.x,0,ln.w,H);ctx.clip();}
  // the soft path stripes of bats getting ready (under everything)
  for(const b of P.bats)if(b.st==='warn'&&!b.hover){const k=b.t/b.warn,w=HIT(P)*.9;
    if(b.type==='top')drawLane(ctx,'v',b.x,b.wy,b.x,H,w,k);
    else if(b.type==='diag')drawDiagLane(b.x0,b.y0,b.dirv,w,k);
    else drawLane(ctx,'h',ln.x,b.y,ln.x+ln.w,b.y,w,k);}
  // branch + basket
  drawBranch(ctx,bp.x,bp.y,r,f.kind,tNow,{grow:f.st==='branch'?ease(f.grow):0,glow:f.st==='branch'&&f.grow>=1?.7+.3*Math.sin(tNow*3):0,empty:f.st!=='branch'});
  const bounce=P.t-P.bounceT<.35?(P.t-P.bounceT)/.35:0,nIn=P.t-P.lvT<.4&&P.lvShow?P.lvShow:P.lvEv,kindIn=P.t-P.lvT<.4&&P.level>1?FRUITS[P.level-2]:f.kind;
  const tag=FRUIT_NAMES[lang][FRUITS.indexOf(kindIn)]+(mode==='duo'?' · '+u.level(P.level):'');
  drawBasket(ctx,bk.x,bk.y,bk.s,kindIn,nIn,tNow,tag,lang==='he',bounce);
  // fruits hopping into the basket
  for(const hp of P.hops){const k=Math.min(1,(P.t-hp.t)/HOP),x=hp.x+(bk.x-hp.x)*k,y=hp.y+(bk.y-bk.s*.5-hp.y)*k-Math.sin(k*Math.PI)*H*.22;drawFruit(ctx,x,y,r*(1-.35*k),hp.kind,tNow,{mood:'yay',wob:k*6});}
  // the fruit on the head
  const danger=P.bats.some(b=>!b.judged&&(b.st==='fly'||(b.st==='warn'&&b.t/b.warn>.45)));
  if(f.st==='head'){const k=Math.min(1,(P.t-f.onT)/.25),x=bp.x+(fp.x-bp.x)*ease(k),y=bp.y+(fp.y-bp.y)*ease(k)-Math.sin(k*Math.PI)*r;
    drawFruit(ctx,x,y,r,f.kind,tNow,{mood:P.t-f.yay<.8?'yay':danger?'oh':'happy',wob:Math.sin(tNow*3+P.k)*.06});}
  for(const b of P.bats)for(const w of b.whiffs||[]){const age=P.t-w.t,k=age/WHIFF_LIFE;if(k<1)drawWhiff(ctx,w.x+w.vx*age-Math.cos(w.ang)*batR(P)*1.9,w.y+w.vy*age-Math.sin(w.ang)*batR(P)*1.9,batR(P)*(.55-.15*k),Math.min(1,(1-k)*1.6),w.ang,w.spin);}
  // bats: dark night bats with a white sticker border and speed lines, so they stand out in any room
  for(const b of P.bats){
    if(b.st==='warn')continue;
    const look=Math.max(-1,Math.min(1,(fp.x-b.x)/(U(P)*2))),lookY=Math.max(-1,Math.min(1,(fp.y-b.y)/(U(P)*2))),R=batR(P);
    drawBat(ctx,b.x,b.y+Math.sin(tNow*9+b.arr)*U(P)*.03,R,tNow+b.arr,{mood:b.mood,look,lookY,dive:b.type==='top'&&b.st==='fly'?.8:b.type==='diag'?.4:0,carry:b.st==='grab'?b.carry:null,
      tilt:b.type==='top'?0:b.type==='diag'?b.dir*.3:b.dir*.12,flap:b.st==='grab'?7:b.st==='fly'?FLY_FLAP:11,bow:mode==='duo'?BOWS[P.k]:null,border:0,trail:null});
  }
  if(P.t-P.lvT<1.6&&P.level>1)bigText(u.level(P.level),ln.x+ln.w/2,H*.42,Math.min(90,H*.13,ln.w*.16),'#FFD84D',1+.3*Math.max(0,1-(P.t-P.lvT)*4));
  for(const m of P.msgs){const k=(P.t-m.t)/1.2;if(m.stars)drawPhew(ctx,m.x,m.y,r*1.2,k);if(k<.8)bigText(m.txt,m.x,m.y-r*2.4-k*r,Math.max(22,r*1.1),m.col,1+.2*Math.max(0,1-k*5));}
  // warning signs on top so they are always seen
  for(const b of P.bats)if(b.st==='warn'){
    if(b.hover){const R=batR(P),q=b.t/b.warn;drawFlightPath(ctx,b.x,b.y,b.dirv,b.plen,(q-PATH_OFF)/(1-PATH_OFF),q/PATH_FULL,R*1.1);
      drawBat(ctx,b.x,b.y+Math.sin(tNow*3+b.arr)*R*.12,R,tNow+b.arr,{mood:'hungry',look:b.dirv.x,lookY:b.dirv.y,flap:6,tilt:b.type==='top'?0:b.dir*.08,bow:mode==='duo'?BOWS[P.k]:null});}
    else drawWarn(ctx,b.wx,b.wy,b.R,b.t/b.warn,b.dirv,tNow);}
  if(mode==='duo')ctx.restore();
  if(P.paused&&state==='play'){const tfs=Math.max(15,Math.min(22,W*.026));bubble(P.distBad?u[P.distBad]:u.find,ln.x+ln.w/2,H*.5,tfs,'#FFF3C4');bubble(u.wait,ln.x+ln.w/2,H*.5+tfs*2.6,tfs*.8,'#fff');}
  else if(f.st==='branch'&&f.grow>=1&&state==='play'&&P.ev===0&&P.t>2.5)bubble(u.pick,ln.x+ln.w/2,H*.52,Math.max(15,Math.min(21,W*.024)),'#FFF3C4');
}
function drawDiagLane(x0,y0,d,w,k){
  ctx.save();ctx.translate(x0,y0);ctx.rotate(Math.atan2(d.y,d.x));const L=Math.hypot(W,H)*1.2;
  const g=ctx.createLinearGradient(0,-w,0,w);g.addColorStop(0,'rgba(123,90,147,0)');g.addColorStop(.5,`rgba(123,90,147,${.08+.2*k})`);g.addColorStop(1,'rgba(123,90,147,0)');
  ctx.fillStyle=g;ctx.fillRect(0,-w,L,w*2);ctx.restore();
}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const u=UI[lang],live=camOK&&video.readyState>=2;
  if(state==='menu'||state==='loading'){drawDusk(ctx,W,H,tNow);drawDemo();drawPops(dt);return;}
  if(live){drawMirrored();ctx.fillStyle='rgba(255,248,236,.1)';ctx.fillRect(0,0,W,H);} else drawDusk(ctx,W,H,tNow);
  if(portraitPlay()){drawTurnPhone();return;}
  const fs=Math.max(18,Math.min(26,W*.035));
  if(state==='setup'){if(mode==='duo')guides.forEach((g,k)=>g.draw(ctx,{...lanes()[k],y:0,h:H},lang));else guide.draw(ctx,{x:0,y:0,w:W,h:H},lang);return drawPops(dt);}
  if(mode==='duo'){ctx.save();ctx.setLineDash([2,14]);ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(W/2,90);ctx.lineTo(W/2,H-20);ctx.stroke();ctx.restore();}
  if(!camOK)players.forEach(P=>{if(P.head){const u2=P.ref.u*.55,stand=P.ref.top,duck=P.head.y-stand>P.ref.u*.3;drawKid(ctx,P.head.x,P.head.y+u2*2.35*(duck?.72:1),u2,duck?'mid':'stand',mode==='duo'?['#BFE3FF','#FFD1DC'][P.k]:'#BFE3FF',tNow);}});
  if(state==='play'||state==='over'||state==='count')players.forEach(drawPlayer);
  if(state==='count'){const n=3-Math.floor(tNow-countT),k=(tNow-countT)%1;
    if(n>0)bigText(String(n),W/2,H*.42,Math.min(150,H*.22),'#fff',1+.25*Math.max(0,1-k*4));}
  else if(state==='play'||state==='over'){
    if(state==='play'&&elapsed<.9)bigText(u.go,W/2,H*.3,Math.min(110,H*.17),'#FFD84D',1+.3*Math.max(0,1-elapsed*4));
    drawHud(fs);
  }
  drawPops(dt);
}
/* bottom: dodges + level in the corner, the basket in the middle (it shows the level progress), a picture timer in 1 minute mode */
function drawHud(fs){
  const u=UI[lang],y0=H-fs*.95-12;
  const pw=(t,f=fs)=>{ctx.save();ctx.font=`700 ${f}px Fredoka,sans-serif`;const w=ctx.measureText(t).width+f*1.4;ctx.restore();return w;};
  const row=(P,fromRight)=>{
    let x=fromRight?W-12:66;const put=(t,f,fill)=>{const w=pw(t,f),cx=fromRight?x-w/2:x+w/2;bubble(t,cx,y0,f,fill);x+=fromRight?-(w+8):(w+8);};
    put('🦇 '+P.ev,fs,mode==='duo'?['#DDF3FF','#FFE3E8'][P.k]:'#FFF3C4');
    if(mode==='solo')put(u.level(P.level),fs*.8,'#fff');
  };
  if(mode==='duo'){row(players[0],false);row(players[1],true);}else row(players[0],true);
  if(state==='play'&&until==='time'){const r=Math.max(22,Math.min(38,H*.065)),left=Math.max(0,ROUND-elapsed);
    drawPie(mode==='duo'?W/2:W/2-basketPos(players[0]).s*2.2-r-10,H-r-14,r,left/ROUND,left<=10,'');}
}
function drawPie(x,y,r,f,warn,label){
  const mixc=(a,b,k)=>{const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),A=h(a),B=h(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')';};
  const sc=warn?1+.06*Math.max(0,Math.sin(tNow*6)):1;
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.fillStyle='rgba(43,33,24,.25)';ctx.beginPath();ctx.arc(0,4,r+5,0,7);ctx.fill();
  sticker(ctx,ell(0,0,r+4,r+4),label?'#fff':'rgba(255,255,255,.7)',4);
  f=Math.min(1,f);if(f>0){ctx.fillStyle=label?'#B79CF2':mixc('#5CC26A','#FFFFFF',1-f);ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,-Math.PI/2,-Math.PI/2+f*Math.PI*2);ctx.closePath();ctx.fill();
    ctx.strokeStyle=INK;ctx.lineWidth=2.5;ctx.stroke();}
  if(label){ctx.font=`${r*.9}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,0,r*.05);}
  ctx.restore();
}
function drawPops(dt){
  pops=pops.filter(p=>(p.life-=dt)>0);
  for(const p of pops){p.vy+=H*1.2*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*5);ctx.globalAlpha=Math.min(1,p.life*2);
    sticker(ctx,starPath(12),p.c||'#FFD84D',2.5);ctx.restore();}
}
/* menu: a child with a fruit on the head ducks under a bat, on a loop */
function drawDemo(){
  const s=Math.min(W*.06,H*.09),gy=H*.86,cx=W*.5,T=3.6,k=(tNow%T)/T;
  const duck=k>.3&&k<.72,dk=duck?Math.min(1,(k-.3)*12,(.72-k)*12):0;
  const r=drawKid(ctx,cx,gy,s,dk>.5?'mid':'stand','#BFE3FF',tNow);
  const fr=s*.55,fy=r.headY-fr*.85;drawFruit(ctx,cx,fy,fr,FRUITS[Math.floor(tNow/T)%FRUITS.length],tNow,{mood:k>.25&&k<.6?'oh':k>.6&&k<.85?'yay':'happy'});
  const standF=gy-s*2.75;   // fruit height when standing
  if(k<.35){drawWarn(ctx,W*.06+s*.7,standF,s*.7,k/.35,{x:1,y:0},tNow);}
  else{const q=(k-.35)/.5,bx=-s*2+(W+s*4)*q;drawBat(ctx,bx,standF,s*.75,tNow,{mood:bx>cx?'aww':'hungry',look:bx<cx?1:-1,tilt:.12,trail:{x:1,y:0}});}
}
function icons(){
  const [soloC,duoC]=[...document.querySelectorAll('#modes canvas')].map(c=>c.getContext('2d'));
  soloC.clearRect(0,0,220,128);drawKid(soloC,110,122,30,'mid','#BFE3FF',0);drawFruit(soloC,110,58,13,'fig',0,{mood:'oh'});drawBat(soloC,48,34,17,.2,{mood:'hungry',look:1,tilt:.12});
  duoC.clearRect(0,0,220,128);drawKid(duoC,52,122,30,'stand','#BFE3FF',0);drawKid(duoC,168,122,30,'stand','#FFD1DC',0);
  drawFruit(duoC,52,34,12,'banana',0);drawFruit(duoC,168,34,12,'mango',.4);drawBat(duoC,110,26,15,.3,{mood:'hungry',dive:.8});
}

/* ================= HOW TO PLAY ================= */
{
  const SZ=(w,h)=>Math.min(w*.09,h*.17);
  function scene(c,w,h,t,{x,pose='stand',fruit='fig',mood='happy'}){
    const s=SZ(w,h),gy=h*.92;c.fillStyle='rgba(141,208,110,.7)';c.beginPath();c.ellipse(w/2,h*.92,w*.46,h*.06,0,0,7);c.fill();
    const r=drawKid(c,x,gy,s,pose,'#BFE3FF',t),fr=s*.5;if(fruit)drawFruit(c,x,r.headY-fr*.85,fr,fruit,t,{mood});
    return {s,gy,fy:gy-s*2.75};
  }
  const B=(c,x,y,s,t,o)=>drawBat(c,x,y,s,t,{...o});
  setupHowTo({lang:()=>lang,play:()=>play(),steps:[
    {dur:3.4,cap:{en:'Touch the fruit with your head 🥭',he:'נוגעים בפרי עם הראש 🥭'},draw(c,w,h,t,k){const s=SZ(w,h),fr=s*.5,fy=h*.92-s*2.75,x=w*.32+w*.18*ease(Math.min(1,k/.45));
      const on=k>.5;drawBranch(c,w*.5,fy-fr*.3,fr,'mango',t,{empty:on,glow:on?0:1});scene(c,w,h,t,{x,fruit:on?'mango':null,mood:'yay'});}},
    {dur:3.6,cap:{en:'A bat from the side? Duck! 🦇',he:'עטלף מהצד? מתכופפים! 🦇'},draw(c,w,h,t,k){const d=k>.15&&k<.8;const S2=scene(c,w,h,t,{x:w*.5,pose:d?'mid':'stand',mood:d?'oh':'yay'});const bx=-S2.s+(w+S2.s*2)*ease(Math.min(1,k/.85));B(c,bx,S2.fy,S2.s*.6,t,{mood:bx>w*.5?'aww':'hungry',look:1,tilt:.12,trail:{x:1,y:0}});}},
    {dur:3.6,cap:{en:'A low bat? Stand up tall! 🧍',he:'עטלף נמוך? נעמדים זקוף! 🧍'},draw(c,w,h,t,k){const d=k<.25;const S2=scene(c,w,h,t,{x:w*.5,pose:d?'mid':'stand',mood:k>.85?'yay':'happy'});const bx=w+S2.s-(w+S2.s*2)*ease(Math.min(1,k/.85));B(c,bx,S2.fy+S2.s*1.15,S2.s*.6,t,{mood:bx<w*.5?'aww':'hungry',look:-1,tilt:-.12,trail:{x:-1,y:0}});}},
    {dur:3.6,cap:{en:'A bat from the top? Step aside! ↔️',he:'עטלף מלמעלה? זזים הצידה! ↔️'},draw(c,w,h,t,k){const x=w*.5+w*.2*ease(Math.min(1,Math.max(0,(k-.2)/.25)));const S2=scene(c,w,h,t,{x,mood:k>.85?'yay':'oh'});
      if(k<.45)drawWarn(c,w*.5,h*.16,S2.s*.6,k/.45,{x:0,y:1},t);else B(c,w*.5,h*.1+(h*.9)*ease((k-.45)/.55),S2.s*.6,t,{mood:'hungry',dive:.8,lookY:1,trail:{x:0,y:1}});}},
    {dur:3.4,cap:{en:'Dodged? The fruit hops into the basket! 3 = next level ⭐',he:'התחמקתם? הפרי קופץ לסל! 3 = שלב חדש ⭐'},draw(c,w,h,t,k){const S2=scene(c,w,h,t,{x:w*.3,fruit:null});
      const bx=w*.66,by=h*.86,q=Math.min(1,k/.5);if(q<1){
        drawFruit(c,w*.3+(bx-w*.3)*q,S2.fy+(by-S2.s*.5-S2.fy)*q-Math.sin(q*Math.PI)*h*.3,S2.s*.45,'mango',t,{mood:'yay'});}
      drawBasket(c,bx,by,S2.s*.5,'mango',q<1?1:2,t,FRUIT_NAMES[lang][2],lang==='he',q>=1&&k<.7?(k-.5)/.2:0);}}
  ]});
}

window.__P=()=>players;window.__setup=()=>{camOK=true;players=lanes().map((_,k)=>makePlayer(k));guide.reset();guides.forEach(g=>g.reset());state='setup';$('start').hidden=true;};window.__sim=a=>{people=a;};window.__state=()=>({state,elapsed});
setLang(lang);icons();
document.fonts&&document.fonts.ready.then(icons);
requestAnimationFrame(frame);
