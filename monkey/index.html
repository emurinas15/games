<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Monkey Climb · Bamboo Physio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<style>
html,body{background:#2E8C86}
.basket{display:flex;gap:2px;align-items:center;min-height:40px;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:2px 8px;box-shadow:0 3px 0 var(--ink)}
.basket canvas{width:24px;height:24px}
.basket canvas.off{opacity:.22;filter:grayscale(1)}
.nums{position:fixed;right:10px;bottom:calc(var(--safe-b) + 8px);background:rgba(255,255,255,.9);border:2px solid var(--ink);border-radius:12px;padding:3px 9px;font:600 13px Fredoka,sans-serif;z-index:5;display:none;direction:ltr}
.nums.on{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>

<div class="top">
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 33 C 10 20, 20 9, 34 6 C 33 20, 24 31, 8 33 Z" fill="#7DCB6B" stroke="#2b2118" stroke-width="3.5" stroke-linejoin="round"/><path d="M11 30 C 17 23, 23 16, 29 11" fill="none" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round"/></svg><span>Bamboo Physio</span></div>
  <div class="tr"><button class="snd" id="snd" aria-pressed="false">🔊</button>
  <div class="lang"><button id="lang-en" aria-pressed="true">EN</button><button id="lang-he" aria-pressed="false">עב</button></div></div>
</div>

<div class="hud" id="hud">
  <div class="pill"><b id="score">0</b><small id="t-sec">seconds</small></div>
  <div class="basket" id="basket"></div>
  <div class="pill"><b id="best">–</b><small id="t-best">fastest</small></div>
</div>

<div class="msg" id="msg"></div>
<div class="count" id="count"></div>
<div class="toast" id="toast"></div>
<div class="nums" id="nums"></div>

<div class="card home kid" id="start">
  <h1 id="t-title">Monkey Climb</h1>
  <p class="sub" id="t-sub"></p>
  <button class="btn" id="play"><span id="t-play">Play</span></button>
  <p class="note" id="t-privacy"></p>
  <details id="grown">
    <summary id="t-grown">For grown-ups</summary>
    <div class="g-body">
      <p id="t-g1"></p>
      <div class="g-row"><span id="t-goal">How high</span>
        <div class="seg" id="goal-seg"><button data-v="low"></button><button data-v="mid"></button><button data-v="high"></button></div></div>
      <div class="g-row"><span id="t-level">Ears level within</span>
        <div class="seg" id="level-seg"><button data-v="15"></button><button data-v="20"></button><button data-v="30"></button></div></div>
      <div class="g-row"><span id="t-hold">Hold for</span>
        <div class="seg" id="hold-seg"><button data-v="1"></button><button data-v="2"></button><button data-v="3"></button></div></div>
      <div class="g-row"><span id="t-dist">Distance check</span>
        <div class="seg" id="dist-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-simple">Simple scene</span>
        <div class="seg" id="simple-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-shownums">Show numbers</span>
        <div class="seg" id="nums-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-music">Music</span>
        <div class="seg" id="music-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-amb">Jungle sounds</span>
        <div class="seg" id="amb-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-sfx">Sound effects</span>
        <div class="seg" id="sfx-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <p id="t-g2"></p>
      <p id="t-g3"></p>
      <p id="t-g4"></p>
      <p id="t-g5"></p>
      <p class="mini" id="t-legal"></p>
    </div>
  </details>
</div>

<div class="card" id="end" hidden>
  <div class="center"><span class="newbest" id="newbest" hidden></span></div>
  <h1 id="t-over"></h1>
  <div class="big-score"><span id="final">0</span><small id="t-sec2"></small></div>
  <p class="best-line" id="best-line"></p>
  <button class="btn" id="again"><span id="t-again">Play again</span></button>
  <p class="note" id="t-privacy2"></p>
</div>

<script type="module">
import {INK,$,LS,S,audio,tone,SFX,musicStart,musicStop,bindSound,ell,sticker,starPath,startFaceTracker,coverMap,drawMirroredVideo,playSample,loadSamples,drawKid} from '../shared/kit.js';
import {camLoad,timeoutP} from '../shared/kit.js';

// the face is close to the phone (~30 cm) and fills the screen, so the setup outline is bigger and very forgiving on size
const guide=makeGuide('face',{},{target:{size:r=>Math.min(r.w*.5,r.h*.3),sizeMin:.45,sizeMax:2.4,dx:.22,dy:.2}});

/* Monkey Climb — head lift (neck extension) with level ears.
   Design follows the HappenLand animation guidelines v5: the banana (the goal) sits on the centre line inside the
   central zone; the monkey moves only up and down that line, slowly and eased; flat saturated background; the banana
   yellow is the one attention colour; every change is readable as a still picture (monkey low / high / holding the
   banana); the success pose is held about 3 s; nothing flashes; a "Simple scene" switch removes everything but
   tree, monkey and banana. */

/* ================= TEXT ================= */
const UI={
 en:{title:"Monkey Climb",sub:"Lift your head and help the two monkeys reach their bananas!",play:"Play",
  privacy:"The camera is used only to play. Nothing is recorded or sent.",grown:"For grown-ups",
  g1:"The child sees their own face big in the middle of the screen, with a monkey on a tree at each side. While the face is lifted toward the phone (the camera can see the whole face), both monkeys climb; when the head drops again or the face leaves the picture, they stop. Each monkey follows the eyebrow on its side: if one eyebrow is higher (the head is tilted), that monkey climbs faster, so the two monkeys show how level the head is. At the top each monkey holds on and grabs its banana; when both have them there is a big celebration. Six rounds; the score is the time it took.",
  goal:"How high",low:"A little",mid:"Straight",high:"Up",level:"Ears level within",hold:"Hold for",dist:"Distance check",simple:"Simple scene",mirror:"Little mirror",shownums:"Show numbers",
  music:"Music",amb:"Jungle sounds",sfx:"Sound effects",on:"On",off:"Off",mute:"Sound on or off",
  g2:"★ Stand the phone upright at the child's eye level, about 30 cm away (a short forearm's length). How high is measured against looking straight at the phone, so a phone that is too low makes it easier and too high makes it harder.",

  sec:"seconds",best:"fastest",sec2:"seconds for six rounds",over:"Six rounds! Yum!",again:"Play again",newbest:"New record!",bestis:"Fastest: ",
  ready:"Getting ready…",lost:"Lift your head up!",up:"Lift your head up!",level2:"Keep your head straight",closer:"Come a little closer",back:"Move back a little",poke:"Sit back and lift your head",
  nocam:"No camera here. Drag up and down to lift the head.",aria:"Game area",s:" s"},
 he:{title:"הקוף המטפס",sub:"הרימו את הראש ועזרו לשני הקופים להגיע לבננות!",play:"שחקו",
  privacy:"המצלמה משמשת רק למשחק. שום דבר לא מוקלט ולא נשלח.",grown:"למבוגרים",
  g1:"הילד רואה את הפנים שלו גדולות באמצע המסך, ובכל צד קוף על עץ. כל עוד הראש מורם אל הטלפון (המצלמה רואה את כל הפנים), שני הקופים מטפסים; כשהראש יורד שוב או שהפנים יוצאות מהתמונה — הם עוצרים. כל קוף הולך לפי הגבה שבצד שלו: אם גבה אחת גבוהה יותר (הראש מוטה), הקוף שלה מטפס מהר יותר, כך ששני הקופים מראים כמה הראש ישר. למעלה כל קוף נאחז ותופס את הבננה שלו, וכששניהם תפסו — חגיגה גדולה. שישה סבבים; הניקוד הוא הזמן שלקח.",
  goal:"כמה גבוה",low:"קצת",mid:"ישר",high:"למעלה",level:"אוזניים ישרות עד",hold:"להחזיק",dist:"בדיקת מרחק",simple:"תמונה פשוטה",mirror:"מראה קטנה",shownums:"להציג מספרים",
  music:"מוזיקה",amb:"צלילי ג׳ונגל",sfx:"צלילים במשחק",on:"פועל",off:"כבוי",mute:"הפעלת או השתקת קול",
  g2:"★ העמידו את הטלפון ישר בגובה העיניים של הילד, במרחק של כ־30 ס״מ (בערך אורך אמה). הגובה נמדד ביחס למבט ישר אל הטלפון, ולכן טלפון נמוך מדי מקל וטלפון גבוה מדי מקשה.",
  g3:"★ אוזניים ישרות: אם הראש נוטה הצידה יותר מהזווית שנבחרה (30° כברירת מחדל), הקופים מחכים ושום דבר לא נספר. בדיקת מרחק: קרוב מדי או רחוק מדי עוצר את הקוף, וגם דחיפת הפנים קדימה (סנטר קדימה) במקום הרמת הראש.",
  g4:"★ תמונה פשוטה מורידה את העלים הנוספים, לילדים שרואים הכי טוב כשיש פחות על המסך. הקופים, העצים והבננות נמצאים על פסים צבעוניים רגועים בצדדים, רחוק מהפנים, כך שקל למצוא אותם.",
  g5:"★ להציג מספרים – למטפל: הרמת הראש במעלות (0 = מבט ישר לטלפון), הטיית האוזניים במעלות והערכה של המרחק. אלה הערכות של המשחק, לא מדידות.",
  legal:"משחק תרגול ביתי של Bamboo Physio. לא מכשיר רפואי. © 2026 Bamboo Physio · צלילי כלים: FluidR3_GM מאת Frank Wen, ‏CC BY 3.0",
  sec:"שניות",best:"הכי מהר",sec2:"שניות לשישה סבבים",over:"שש בננות! יאמי!",again:"עוד פעם",newbest:"שיא חדש!",bestis:"הכי מהר: ",
  ready:"מתכוננים…",lost:"הרימו את הראש!",up:"הרימו את הראש!",level2:"ראש ישר",closer:"התקרבו קצת",back:"התרחקו קצת",poke:"שבו זקוף ותרימו את הראש",
  nocam:"אין כאן מצלמה. גררו למעלה ולמטה כדי להרים את הראש.",aria:"אזור המשחק",s:" שנ׳"}
};

/* ================= SETTINGS ================= */
const GOAL={low:-14,mid:-5,high:5};   // head-lift goal in degrees, 0 = face looking straight at the camera
const RANGE=30;                        // the monkey is at the bottom when the head is this many degrees below the goal
const ROUND=6;
const DIST={min:18,max:50};            // cm, "about 30 cm" with wide margins
const HFOV=62;                         // typical front camera horizontal field of view (degrees) for the distance estimate
const IRIS=1.17;                       // cm; the iris is about the same size from early childhood
let lang=LS.get('bamboo-lang','en');if(!UI[lang])lang='en';
let goal=LS.get('mk-goal','mid');if(!GOAL.hasOwnProperty(goal))goal='mid';
let level=+LS.get('mk-level2','30');if(![15,20,30].includes(level))level=30;   // 17 Nov (Edgar): much more forgiving, 30° by default
let holdSec=+LS.get('mk-hold','1');if(![1,2,3].includes(holdSec))holdSec=1;
let distOn=LS.get('mk-dist','1')==='1',simple=LS.get('mk-simple','0')==='1',numsOn=LS.get('mk-nums','0')==='1';
let best=0;
const bestKey=()=>'mk-best2-'+goal+holdSec+level;
const loadBest=()=>{best=+LS.get(bestKey(),'0')||0;$('best').textContent=best?Math.round(best):'–';};

S.track='natural';S.amb='pond';S.ambVol=.3;S.musicVol=.7;   // 17 Nov (Edgar): music stays in the background
const syncSound=bindSound(()=>UI[lang]);

function segs(){
  const u=UI[lang],mark=(id,v)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===String(v)));
  document.querySelectorAll('#goal-seg button').forEach(b=>b.textContent=u[b.dataset.v]);
  document.querySelectorAll('#level-seg button').forEach(b=>b.textContent=b.dataset.v+'°');
  document.querySelectorAll('#hold-seg button').forEach(b=>b.textContent=b.dataset.v+u.s);
  document.querySelectorAll('#dist-seg button,#simple-seg button,#nums-seg button').forEach(b=>b.textContent=u[b.dataset.v==='1'?'on':'off']);
  mark('goal-seg',goal);mark('level-seg',level);mark('hold-seg',holdSec);mark('dist-seg',+distOn);mark('simple-seg',+simple);mark('nums-seg',+numsOn);
}
function setLang(l){
  lang=l;LS.set('bamboo-lang',l);const u=UI[l];
  document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';document.querySelector('.top').dir='ltr';
  for(const k of ['title','sub','play','privacy','grown','g1','goal','level','hold','dist','simple','shownums','music','amb','sfx','g2','g3','g4','g5','legal','sec','best','sec2','over','again'])
    {const e=$('t-'+k);if(e)e.textContent=u[k];}
  $('t-privacy2').textContent=u.privacy;
  $('lang-en').setAttribute('aria-pressed',l==='en');$('lang-he').setAttribute('aria-pressed',l==='he');
  $('c').setAttribute('aria-label',u.aria);
  segs();syncSound();if(msgKey)msg(msgKey);
  if(!$('end').hidden)fillEnd(lastNew);
}
$('lang-en').onclick=()=>setLang('en');$('lang-he').onclick=()=>setLang('he');
const bindSeg=(id,fn)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{fn(b.dataset.v);segs();});
bindSeg('goal-seg',v=>{goal=v;LS.set('mk-goal',v);loadBest();});
bindSeg('level-seg',v=>{level=+v;LS.set('mk-level2',v);loadBest();});
bindSeg('hold-seg',v=>{holdSec=+v;LS.set('mk-hold',v);loadBest();});
bindSeg('dist-seg',v=>{distOn=v==='1';LS.set('mk-dist',v);});
bindSeg('simple-seg',v=>{simple=v==='1';LS.set('mk-simple',v);});
bindSeg('nums-seg',v=>{numsOn=v==='1';LS.set('mk-nums',v);});

/* ================= CANVAS ================= */
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',resize);resize();

/* ================= ART (sticker style) ================= */
const BG='#2E8C86', FUR='#9A6340', FUR_D='#7C4C2E', CREAM='#F7E1BE', BANANA='#FFD84D', LEAF='#3F9E4D', LEAF_D='#2F7A3B', TRUNK='#D29A5E';

function limb(c,x0,y0,x1,y1,cx,cy,w,lw,col){   // a soft furry arm/leg: outline stroke then fill stroke
  const p=new Path2D();p.moveTo(x0,y0);p.quadraticCurveTo(cx,cy,x1,y1);
  c.lineCap='round';c.lineJoin='round';
  c.strokeStyle=INK;c.lineWidth=w+lw*2;c.stroke(p);c.strokeStyle=col;c.lineWidth=w;c.stroke(p);
}
/* the monkey hugging the trunk. (x,y) = middle of the body, s = size.
   o.climb = climbing phase (moves arms/legs a little), o.reach 0..1 = right arm up to the banana, o.happy 0..1, o.tilt = head tilt */
function drawMonkey(c,x,y,s,o={}){
  const lw=Math.max(2.5,s*.045),ph=o.climb||0,reach=o.reach||0,happy=o.happy||0,tilt=o.tilt||0;
  const sw=Math.sin(ph)*s*.05;
  c.save();c.translate(x,y);
  // tail
  {const p=new Path2D();p.moveTo(s*.12,s*.38);p.bezierCurveTo(s*.6,s*.62,s*.86,s*.2,s*.66,-s*.02);p.bezierCurveTo(s*.55,-s*.16,s*.42,-s*.02,s*.52,s*.06);
   c.lineCap='round';c.strokeStyle=INK;c.lineWidth=s*.09+lw*2;c.stroke(p);c.strokeStyle=FUR;c.lineWidth=s*.09;c.stroke(p);}
  // legs wrapped round the trunk
  for(const d of [-1,1]){const k=d*sw;
    limb(c,d*s*.18,s*.32,d*s*.36,s*.5+k,d*s*.44,s*.22,s*.17,lw,FUR);
    sticker(c,ell(d*s*.38,s*.56+k,s*.12,s*.08,d*.3),CREAM,lw);}
  // body + belly
  sticker(c,ell(0,s*.12,s*.33,s*.4),FUR,lw);
  c.fillStyle=CREAM;c.fill(ell(0,s*.2,s*.21,s*.26));
  // arms: left always on the trunk; right one reaches up for the banana
  const L={x:-s*.3,y:-s*.62-sw},R0={x:s*.3,y:-s*.62+sw},R1={x:s*.06,y:-s*1.1};
  const R={x:R0.x+(R1.x-R0.x)*reach,y:R0.y+(R1.y-R0.y)*reach};
  limb(c,-s*.22,-s*.12,L.x,L.y,-s*.42,-s*.32,s*.13,lw,FUR);
  limb(c,s*.22,-s*.12,R.x,R.y,s*(.42-.2*reach),-s*(.32+.25*reach),s*.13,lw,FUR);
  sticker(c,ell(L.x,L.y,s*.09,s*.08),CREAM,lw);
  if(reach<.98)sticker(c,ell(R.x,R.y,s*.09,s*.08),CREAM,lw);
  // head
  c.save();c.translate(0,-s*.28);c.rotate(tilt);c.translate(0,s*.28);
  const hy=-s*.48;
  for(const d of [-1,1]){sticker(c,ell(d*s*.4,hy+s*.02,s*.14,s*.13),FUR,lw);c.fillStyle='#F4B9A0';c.fill(ell(d*s*.4,hy+s*.02,s*.075,s*.07));}
  sticker(c,ell(0,hy,s*.35,s*.31),FUR,lw);
  // tuft
  {const p=new Path2D();p.moveTo(-s*.08,hy-s*.29);p.quadraticCurveTo(-s*.02,hy-s*.44,s*.06,hy-s*.36);p.quadraticCurveTo(s*.02,hy-s*.32,s*.05,hy-s*.28);
   c.strokeStyle=INK;c.lineWidth=lw*1.1;c.lineCap='round';c.stroke(p);}
  // face mask
  c.fillStyle=CREAM;c.beginPath();c.ellipse(-s*.11,hy-s*.03,s*.13,s*.13,0,0,7);c.ellipse(s*.11,hy-s*.03,s*.13,s*.13,0,0,7);c.fill();
  c.beginPath();c.ellipse(0,hy+s*.12,s*.21,s*.14,0,0,7);c.fill();
  // eyes: round, or happy arcs
  for(const d of [-1,1]){
    if(happy>.5){c.strokeStyle=INK;c.lineWidth=lw*1.1;c.beginPath();c.arc(d*s*.1,hy-s*.01,s*.05,Math.PI*1.1,Math.PI*1.9);c.stroke();}
    else{c.fillStyle=INK;c.fill(ell(d*s*.1,hy-s*.03,s*.05,s*.062));c.fillStyle='#fff';c.fill(ell(d*s*.1+s*.018,hy-s*.055,s*.018,s*.018));}
    c.fillStyle='rgba(255,130,150,.55)';c.fill(ell(d*s*.2,hy+s*.08,s*.06,s*.04));
  }
  c.fillStyle=INK;c.fill(ell(-s*.03,hy+s*.06,s*.015,s*.012));c.fill(ell(s*.03,hy+s*.06,s*.015,s*.012));
  if(happy>.5){const m=new Path2D();m.moveTo(-s*.09,hy+s*.12);m.quadraticCurveTo(0,hy+s*.27,s*.09,hy+s*.12);m.closePath();sticker(c,m,'#C9465A',lw*.8);
    c.fillStyle='#F59AA8';c.fill(ell(0,hy+s*.19,s*.04,s*.022));}
  else{c.strokeStyle=INK;c.lineWidth=lw*.9;c.beginPath();c.arc(0,hy+s*.1,s*.07,.15*Math.PI,.85*Math.PI);c.stroke();}
  c.restore();
  // right hand on top when it holds the banana
  if(reach>=.98)sticker(c,ell(R.x,R.y,s*.09,s*.08),CREAM,lw);
  c.restore();
}
function drawBanana(c,x,y,s,rot=0){   // (x,y) = middle; hangs from its stem at the top
  const lw=Math.max(2.5,s*.07);
  c.save();c.translate(x,y);c.rotate(rot);
  const p=new Path2D();p.moveTo(-s*.12,-s*.55);
  p.bezierCurveTo(s*.42,-s*.35,s*.48,s*.3,s*.02,s*.58);
  p.bezierCurveTo(s*.2,s*.22,s*.16,-s*.25,-s*.12,-s*.55);p.closePath();
  sticker(c,p,BANANA,lw);
  c.fillStyle='rgba(255,255,255,.45)';c.fill(ell(s*.2,-s*.05,s*.04,s*.2,-.2));
  sticker(c,ell(s*.03,s*.57,s*.05,s*.04),'#6B4A2B',lw*.6);
  {const st=new Path2D();st.moveTo(-s*.12,-s*.55);st.lineTo(-s*.2,-s*.72);c.strokeStyle=INK;c.lineWidth=s*.08+lw*2;c.lineCap='round';c.stroke(st);c.strokeStyle='#8A6A3A';c.lineWidth=s*.08;c.stroke(st);}
  c.restore();
}
function leafShape(len,wid){const p=new Path2D();p.moveTo(0,0);p.bezierCurveTo(len*.3,-wid,len*.75,-wid*.9,len,0);p.bezierCurveTo(len*.75,wid*.6,len*.3,wid*.7,0,0);return p;}
function drawScene(c,w,h,g,o){
  if(!o.treeOnly){c.fillStyle=BG;c.fillRect(0,0,w,h);}
  const s=g.s,lw=Math.max(3,s*.05);
  if(!o.simple&&!o.treeOnly){   // standard version: soft hills and two big leaves at the edges (outside the action zone)
    c.fillStyle='#3FA36E';c.beginPath();c.ellipse(w*.18,h*1.04,w*.55,h*.14,0,0,7);c.ellipse(w*.86,h*1.06,w*.5,h*.13,0,0,7);c.fill();
    for(const [lx,ly,a,f] of [[0,h*.62,-.5,1],[w,h*.5,Math.PI+.45,1]]){c.save();c.translate(lx,ly);c.rotate(a);sticker(c,leafShape(s*1.6*f,s*.42*f),'#4DB06A',lw);
      c.strokeStyle='rgba(43,33,24,.35)';c.lineWidth=lw*.7;c.beginPath();c.moveTo(s*.1,0);c.quadraticCurveTo(s*.8,-s*.08,s*1.5,0);c.stroke();c.restore();}
  }
  // trunk
  const tw0=s*.5,tw1=s*.36,ty=g.crown+s*.15;
  const t=new Path2D();t.moveTo(g.x-tw0/2,h+10);t.bezierCurveTo(g.x-tw0*.45,h*.7,g.x-tw1*.6,ty+s,g.x-tw1/2,ty);t.lineTo(g.x+tw1/2,ty);
  t.bezierCurveTo(g.x+tw1*.6,ty+s,g.x+tw0*.45,h*.7,g.x+tw0/2,h+10);t.closePath();sticker(c,t,TRUNK,lw);
  c.strokeStyle='rgba(43,33,24,.28)';c.lineWidth=lw*.7;c.lineCap='round';
  for(let yy=ty+s*.5,i=0;yy<h;yy+=s*.55,i++){const ww=tw1+(tw0-tw1)*((yy-ty)/(h-ty));const dx=(i%2?.12:-.12)*ww;c.beginPath();c.moveTo(g.x-ww*.28+dx,yy);c.quadraticCurveTo(g.x+dx,yy+s*.07,g.x+ww*.28+dx,yy);c.stroke();}
  // crown of leaves (dark green behind the banana so the yellow stands out)
  const cx=g.x,cy=g.crown;
  const leaves=o.simple?[[-2.75,1.25],[-.4,1.25],[-1.95,1.05],[-1.2,1.05]]:[[-2.9,1.35],[-.25,1.35],[-2.35,1.2],[-.8,1.2],[-1.9,1.05],[-1.25,1.05]];
  for(const [a,f] of leaves){c.save();c.translate(cx,cy);c.rotate(a);sticker(c,leafShape(s*1.25*f,s*.36*f),a<-2||a>-1?LEAF:LEAF_D,lw);
    c.strokeStyle='rgba(43,33,24,.35)';c.lineWidth=lw*.7;c.beginPath();c.moveTo(s*.1,0);c.quadraticCurveTo(s*.6*f,-s*.06,s*1.15*f,0);c.stroke();c.restore();}
}

/* ================= TRACKING ================= */
const video=$('v');
let mode='demo',tracker=null,camOK=false,camTried=false,lastVT=-1;
const head={ok:false,lastSeen:0,lift:0,roll:0,cm:30,cx:0,cy:0,w:0,raw:{lift:0,roll:0,cm:30}};
function track(now){
  if(!tracker||video.readyState<2||video.currentTime===lastVT)return;lastVT=video.currentTime;
  let res;try{res=tracker.detectForVideo(video,now);}catch(e){return;}
  const lm=res&&res.faceLandmarks&&res.faceLandmarks[0];if(!lm){head.ok=false;return;}
  const vw=video.videoWidth||640,vh=video.videoHeight||480,m=coverMap(video,W,H);
  const P=i=>({x:m.ox+(1-lm[i].x)*vw*m.s,y:m.oy+lm[i].y*vh*m.s});
  // head lift: forehead (10) vs chin (152) depth — chin comes toward the camera as the head lifts
  const dy=(lm[152].y-lm[10].y)*vh,dz=(lm[10].z-lm[152].z)*vw;
  const lift=Math.atan2(dz,dy)*180/Math.PI;
  // ear tilt: line between the sides of the face against the bottom of the screen
  // 17 Nov fix: after mirroring, landmark 234 is on the RIGHT of the screen, so sort the two sides by x first.
  // (Before, the line ran right→left and read as ~180° tilt, so "ears level" always failed and the monkeys never climbed.)
  let a=P(234),b=P(454);if(a.x>b.x)[a,b]=[b,a];
  const roll=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
  // distance: iris width (about 11.7 mm at every age) and the camera's field of view
  let cm=head.cm;
  if(lm.length>476){const iw=(i,j)=>Math.hypot((lm[i].x-lm[j].x)*vw,(lm[i].y-lm[j].y)*vh);const ip=(iw(469,471)+iw(474,476))/2;
    if(ip>2){const f=(vw/2)/Math.tan(HFOV*Math.PI/360);cm=f*IRIS/ip;}}
  const k=head.ok?.25:1;
  head.lift+=(lift-head.lift)*k;head.roll+=(roll-head.roll)*k;head.cm+=(cm-head.cm)*(head.ok?.12:1);
  head.cx=(a.x+b.x)/2;head.cy=(a.y+b.y)/2;head.w=Math.hypot(b.x-a.x,b.y-a.y);
  // 17 Nov: eyebrows (middle of each brow), by screen side; height relative to the face width
  {const b1=P(105),b2=P(334),L=b1.x<b2.x?b1:b2,Rr=b1.x<b2.x?b2:b1,fw=Math.max(1,head.w),mid=(L.y+Rr.y)/2;
   const k2=head.ok?.3:1;head.brow=head.brow||[0,0];head.brow[0]+=((mid-L.y)/fw-head.brow[0])*k2;head.brow[1]+=((mid-Rr.y)/fw-head.brow[1])*k2;}
  head.raw={lift,roll,cm};head.ok=true;head.lastSeen=now;
}

let drag={on:false,y0:0,v0:0},fakeLift=-30;
cv.addEventListener('pointerdown',e=>{drag={on:true,y0:e.clientY,v0:fakeLift};});
cv.addEventListener('pointermove',e=>{if(!drag.on)return;fakeLift=Math.max(-45,Math.min(15,drag.v0+(drag.y0-e.clientY)/H*120));});
addEventListener('pointerup',()=>{drag.on=false;});

/* ================= GAME =================
   17 Nov (Edgar): the child sees their own face big in the middle; a monkey on a tree at each side.
   Face lifted + visible (and ears within the limit) → both monkeys climb; each monkey follows the eyebrow on its
   side (higher brow → that monkey climbs faster). Head down again / face gone → they stop where they are.
   At the top each monkey holds on and grabs its banana; both → a big celebration. */
let state='menu',tNow=0,score=0,countT=0,lastNew=false;
const newMk=()=>({h:0,v:0,ph:0,reach:0,happy:0,hold:0,got:false,gotT:-9,tilt:0});
let got=0,mks=[newMk(),newMk()],celebT=-1,stars=[],confetti=[],noteStep=0,startCm=0,cmSamples=[],bananaIn=1;
const BASE=.28;   // climb per second at even brows (≈3.5 s bottom → top)
function buildBasket(){const box=$('basket');box.innerHTML='';for(let i=0;i<ROUND;i++){const c=document.createElement('canvas');c.width=48;c.height=48;drawBanana(c.getContext('2d'),24,24,30,.5);if(i>=got)c.className='off';box.appendChild(c);}}
let msgKey='';function msg(k){const m=$('msg');if(k){m.textContent=UI[lang][k];m.classList.add('on')}else m.classList.remove('on');msgKey=k;}

async function play(){
  audio();loadSamples(S.AC,{kalimba:CLIMB});SFX.go();musicStart();
  $('start').hidden=true;$('end').hidden=true;
  score=0;got=0;celebT=-1;stars=[];confetti=[];noteStep=0;bananaIn=1;mks=[newMk(),newMk()];fakeLift=-30;
  buildBasket();$('score').textContent='0';loadBest();$('hud').classList.add('on');
  if(!camTried){
    camTried=true;msg('ready');state='ready';
    try{tracker=await camLoad(()=>startFaceTracker(video));camOK=true;mode='camera';}
    catch(e){mode='finger';msg('');const t=$('toast');t.textContent=UI[lang].nocam;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),5000);}
  } else mode=camOK?'camera':'finger';
  guide.reset();cmSamples=[];
  if(mode==='finger'){state='count';countT=tNow;} else {state='ready';msg('');}
}
$('play').onclick=play;$('again').onclick=play;

const CLIMB=[67,69,72,74,76,79,81,84];
function note(i,v=.15){const m=CLIMB[Math.max(0,Math.min(7,i))];if(!playSample(S.AC,'kalimba',m,S.AC.currentTime+.01,v,S.BUS.sfx))tone({f0:440*Math.pow(2,(m-69)/12),dur:.25,type:'triangle',vol:.1});}
function ook(at=0,p=1){[0,.2].forEach((d,i)=>tone({f0:(380+i*90)*p,f1:(620+i*120)*p,dur:.16,type:'triangle',vol:.16,at:at+d}));}
function grabSound(){SFX.chime();ook(.15,1.1);}
function partySound(){   // the big one: kalimba run up, a bright chord, monkeys cheering, a soft drum roll
  [0,2,4,5,7,7].forEach((n,i)=>setTimeout(()=>note(n,.2),i*90));
  [523,659,784,1047].forEach((f,i)=>tone({f0:f,dur:1.1,type:'triangle',vol:.09,at:.6+i*.02}));
  ook(.7,1);ook(1.1,1.25);ook(1.5,.9);
  for(let i=0;i<10;i++)tone({f0:110,f1:70,dur:.09,type:'sine',vol:.18,at:.05+i*.055});
  SFX.chime();setTimeout(()=>SFX.chime(),700);}
function endGame(){
  state='over';musicStop();$('hud').classList.remove('on');msg('');$('nums').classList.remove('on');
  lastNew=!best||score<best;if(lastNew){best=score;LS.set(bestKey(),best.toFixed(1));}
  fillEnd(lastNew);$('end').hidden=false;SFX.chime();
}
function fillEnd(nb){const u=UI[lang];$('final').textContent=Math.round(score);$('newbest').hidden=!nb;$('newbest').textContent=u.newbest;
  $('best-line').textContent=u.bestis+Math.round(best);$('t-privacy2').textContent=u.privacy;$('t-over').textContent=u.over;$('t-sec2').textContent=u.sec2;}

/* reading this frame: can the monkeys climb, and if not, why. brow[k] = how much higher that side's eyebrow is (face widths) */
function reading(lost){
  if(mode!=='camera')return {lift:fakeLift,roll:0,brow:[0,0],why:fakeLift>=GOAL[goal]-10?'':'up'};
  if(lost)return {lift:-99,roll:0,brow:[0,0],why:'up'};
  const r={lift:head.lift,roll:head.roll,cm:head.cm,brow:head.brow||[0,0],why:''};
  if(r.lift<GOAL[goal]-10)r.why='up';   // head dropped again
  else if(Math.abs(r.roll)>level)r.why='level2';
  else if(distOn){if(r.cm>DIST.max)r.why='closer';else if(r.cm<DIST.min)r.why='back';
    else if(startCm&&r.cm<startCm*.8)r.why='poke';}
  return r;
}
function burst(x,y,n,sz){for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=sz*(2+Math.random()*4);stars.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-sz*2,r:a,life:1+Math.random()*.4,s:sz*(.1+Math.random()*.08)});}}
function party(){const C=['#FFD84D','#FF8FB8','#7FC8F8','#8BD16B','#FF9A3C','#FFFFFF'];
  for(let i=0;i<70;i++)confetti.push({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*60,vy:H*(.25+Math.random()*.25),r:Math.random()*6,vr:(Math.random()-.5)*8,c:C[i%C.length],w:6+Math.random()*7});}

let last=performance.now(),demoT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;tNow+=dt;
  if(mode==='camera')track(now);

  if(state==='menu'){demoT+=dt;const k=(Math.sin(demoT*.6)+1)/2;mks.forEach((m,i)=>{m.h+=(Math.min(1,k*(1+i*.15))-m.h)*Math.min(1,dt*1.2);m.ph+=dt*1.5;});}
  else if(state==='ready'){if(mode==='camera'&&guide.update(dt,head.ok?{x:head.cx,y:head.cy,size:head.w}:null,{x:0,y:0,w:W,h:H})==='done'){state='count';countT=tNow;msg('');}}
  else if(state==='count'){
    if(mode==='camera'&&head.ok)cmSamples.push(head.cm);
    const n=3-Math.floor(tNow-countT),el=$('count');
    if(n>0){if(el.textContent!==String(n)){el.textContent=n;el.style.display='block';SFX.tick();}}
    else{el.style.display='none';el.textContent='';state='play';SFX.boing();
      cmSamples.sort((a,b)=>a-b);startCm=cmSamples.length?cmSamples[cmSamples.length>>1]:0;}
  }
  else if(state==='play'){
    const lost=mode==='camera'&&(!head.ok||now-head.lastSeen>500);
    score+=dt;$('score').textContent=Math.floor(score);
    if(celebT>=0){   // the party is held ~3.5 s, then both monkeys slide down and new bananas fade in
      celebT+=dt;
      if(celebT>3.5){const k=Math.min(1,(celebT-3.5)/1.4);
        for(const m of mks){m.reach=1-Math.min(1,k*2);m.happy=k<.5?1:0;m.h=Math.max(0,1-k*k*(3-2*k));}bananaIn=Math.max(0,(celebT-4)/.8);
        if(k>=1){celebT=-1;mks=[newMk(),newMk()];noteStep=0;bananaIn=1;if(got>=ROUND)endGame();}}
      else bananaIn=0;
    }
    else{
      const r=reading(lost);msg(r.why);
      for(let i=0;i<2;i++){const m=mks[i];
        m.tilt+=(Math.max(-.35,Math.min(.35,r.roll*Math.PI/180))-m.tilt)*Math.min(1,dt*3);
        if(m.got){m.happy=1;m.reach=1;continue;}
        const sp=r.why?0:BASE*Math.max(.4,Math.min(1.6,1+(r.brow[i]||0)*3));
        m.v+=(sp-m.v)*Math.min(1,dt*(r.why?8:4));   // eased start, quick stop
        m.h=Math.min(1,m.h+m.v*dt);if(m.v>.03)m.ph+=dt*Math.min(3,m.v*10);
        const atTop=m.h>=1;m.reach+=((atTop&&!r.why?.45:0)-m.reach)*Math.min(1,dt*4);
        if(atTop&&!r.why){m.hold+=dt;if(m.hold>=holdSec){m.got=true;m.gotT=tNow;m.v=0;grabSound();const g=geo();burst(g.xs[i],g.by,14,g.s);}}
      }
      const avg=(mks[0].h+mks[1].h)/2,step=Math.floor(avg*6);if(step>noteStep){noteStep=step;note(step);}
      if(mks[0].got&&mks[1].got){got++;buildBasket();celebT=0;msg('');party();partySound();const g=geo();burst(W/2,H*.4,30,g.s*1.3);}
    }
    if(numsOn&&mode==='camera'){const n=$('nums');n.classList.add('on');n.textContent=`lift ${head.lift.toFixed(0)}° · ears ${Math.abs(head.roll).toFixed(0)}° · ~${head.cm.toFixed(0)} cm`;}
    else $('nums').classList.remove('on');
  }
  render(dt);
  requestAnimationFrame(frame);
}

/* scene geometry: a tree at each side, the face area in the middle */
function geo(w=W,h=H){
  const s=Math.min(w*.2,h*.16),xs=[Math.max(s*.75,w*.11),w-Math.max(s*.75,w*.11)];
  const by=Math.max(h*.2,96+s*.7),top=by+s*1.12,bottom=h-s*.85;
  return {s,xs,x:xs[0],by,top:Math.min(top,bottom-s*.5),bottom,crown:by-s*.62};
}
function drawSides(c,w,h,g,cam){
  // 18 Nov (Edgar): no coloured "fog" strips behind the trees any more — the trees stand straight on the camera picture
  for(const x of g.xs)drawScene(c,w,h,{...g,x},{simple,treeOnly:true});
}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const cam=mode==='camera'&&camOK&&state!=='menu';
  if(cam&&state==='ready'){if(video.readyState>=2){drawMirroredVideo(ctx,video,W,H);ctx.fillStyle='rgba(30,90,86,.25)';ctx.fillRect(0,0,W,H);}else{ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);}
    guide.draw(ctx,{x:0,y:0,w:W,h:H},lang);return;}
  const g=geo();
  // the child's own face, full screen in the middle (or the cartoon child without a camera)
  if(cam&&video.readyState>=2)drawMirroredVideo(ctx,video,W,H);
  else{ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);const hw=Math.min(W*.24,H*.2),lift=state==='menu'?.5+Math.sin(demoT*.6)*.5:Math.max(0,Math.min(1,(fakeLift+40)/50));
    drawKid(ctx,W,H,W/2,H*.82,hw,0,tNow,0,.9-lift*1.6);}
  drawSides(ctx,W,H,g,cam);
  for(let i=0;i<2;i++){const m=mks[i],x=g.xs[i],flip=i?-1:1;
    if(!m.got&&bananaIn>0&&state!=='over'){ctx.save();ctx.globalAlpha=Math.min(1,bananaIn);
      drawBanana(ctx,x+g.s*.05,g.by,g.s*.62,.25);ctx.restore();}
    const y=g.bottom+(g.top-g.bottom)*m.h,dance=celebT>=0&&celebT<3.5?Math.sin(tNow*9+i)*g.s*.06:0;
    ctx.save();ctx.translate(x,0);ctx.scale(flip,1);   // the monkeys face the middle (mirror the left one)
    drawMonkey(ctx,0,y+dance,g.s,{climb:m.ph,reach:m.reach,happy:m.happy,tilt:m.tilt*flip});
    if(m.got){const R={x:g.s*.06,y:y+dance-g.s*1.1},pop=Math.min(1,(tNow-m.gotT)/.3);
      ctx.save();ctx.translate(R.x+g.s*.04,R.y-g.s*.2);ctx.scale(.8+pop*.3,.8+pop*.3);drawBanana(ctx,0,0,g.s*.62,.25+Math.sin(tNow*6)*.15);ctx.restore();
      sticker(ctx,ell(R.x,R.y,g.s*.09,g.s*.08),CREAM,Math.max(2.5,g.s*.045));}
    ctx.restore();
    if(m.hold>0&&!m.got){const k=Math.min(1,m.hold/holdSec);ctx.lineWidth=6;ctx.strokeStyle=BANANA;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,g.by,g.s*.55,-Math.PI/2,-Math.PI/2+k*6.283);ctx.stroke();}
  }
  // stars + confetti
  stars=stars.filter(o=>(o.life-=dt)>0);
  for(const o of stars){o.vy+=g.s*6*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.r+=dt*4;ctx.save();ctx.globalAlpha=Math.min(1,o.life*1.5);bigStar(ctx,o.x,o.y,o.s*1.6,o.r);ctx.restore();}
  confetti=confetti.filter(o=>o.y<H+40);
  for(const o of confetti){o.x+=o.vx*dt+Math.sin(tNow*3+o.r)*30*dt;o.y+=o.vy*dt;o.r+=o.vr*dt;ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.r);
    {ctx.fillStyle=o.c;ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.beginPath();ctx.rect(-o.w/2,-o.w*.3,o.w,o.w*.6);ctx.fill();ctx.stroke();}ctx.restore();}
  // 18 Nov (Edgar): no 🍌🎉 emojis — the monkeys' dance, stars and confetti are the celebration
}

{

    c.fillStyle=BG;c.fillRect(0,0,w,h);
