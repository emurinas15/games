<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Floor Is Lava · Bamboo Physio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<style>
.pill.mid{display:flex;align-items:center;gap:6px}
.pill.mid canvas{width:30px;height:30px}
.lvl{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.6);font:900 44px Grandstander,sans-serif;max-width:94vw;color:#FFD84D;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);opacity:0;transition:opacity .25s,transform .25s;z-index:6;pointer-events:none;white-space:nowrap}
.lvl.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.msg{top:calc(var(--safe-t) + 150px)}
.lvl{top:calc(var(--safe-t) + 150px)}
.count{top:48%;font-size:110px}
.btn2{display:block;width:100%;margin-top:10px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:700 18px Fredoka,sans-serif;padding:8px 0;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn2:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.snd.cast{font-size:19px}
#setup{top:calc(var(--safe-t) + 60px);bottom:auto;padding:8px 12px}
#setup .btn{font-size:22px;padding:6px 0 4px}
#setup .btn2{font-size:15px;padding:6px 0}
#guidepic{display:block;width:auto;max-width:100%;max-height:30vh;margin-left:auto;margin-right:auto;height:auto;border-radius:18px;border:3px solid var(--ink);background:#BFE6FF;margin:4px 0 6px}
#guide{max-height:calc(100vh - 70px);overflow:auto}
@media (orientation:landscape) and (max-height:560px){#guide{width:min(760px,calc(100vw - 24px))}#guide .gbody{display:flex;gap:12px;align-items:center}#guide .gbody canvas{flex:1.1;max-height:none;width:50%;margin:0}#guide .steps{flex:1;margin:0}#guide .steps li{font-size:14px}#guide h1{font-size:22px!important}#gok{margin-top:6px;font-size:24px;padding:6px 0 4px}}
.steps{list-style:none;padding:0;margin:4px 0 10px}
.steps li{display:flex;gap:10px;align-items:flex-start;margin:6px 0;font:600 15px/1.35 Fredoka,sans-serif}
.steps li b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font:900 15px Grandstander,sans-serif}
.steps.small{margin:0 0 8px}.steps.small li{font-size:14px;margin:4px 0}.steps.small li b{width:24px;height:24px;font-size:13px}
.hearts{display:flex;gap:2px;justify-content:center}
#setup p{margin:4px 0 10px;text-align:center;font:600 16px Fredoka,sans-serif;line-height:1.35}
#setup .row{display:flex;gap:10px}
#setup .row .btn{flex:2}
#setup .row .btn2{flex:1;margin-top:0}
.stars{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px 0 10px}
.stars div{display:flex;flex-direction:column;align-items:center;font:900 26px Grandstander,sans-serif}
.stars canvas{width:46px;height:46px}
.demo-tip{position:fixed;left:50%;bottom:calc(var(--safe-b) + 12px);transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font:700 15px Fredoka,sans-serif;box-shadow:0 3px 0 var(--ink);z-index:5;white-space:nowrap;display:none}
.demo-tip.on{display:block}
.stopx{position:fixed;left:12px;bottom:calc(var(--safe-b) + 12px);z-index:6;display:none}
.stopx.on{display:block}
body.casting .msg,body.casting .count,body.casting .lvl,body.casting .hud{visibility:hidden}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>

<div class="top">
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 33 C 10 20, 20 9, 34 6 C 33 20, 24 31, 8 33 Z" fill="#7DCB6B" stroke="#2b2118" stroke-width="3.5" stroke-linejoin="round"/><path d="M11 30 C 17 23, 23 16, 29 11" fill="none" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round"/></svg><span>Bamboo Physio</span></div>
  <div class="tr"><button class="snd cast" id="cast">📺</button><button class="snd" id="snd" aria-pressed="false">🔊</button>
  <div class="lang"><button id="lang-en" aria-pressed="true">EN</button><button id="lang-he" aria-pressed="false">עב</button></div></div>
</div>

<div class="hud" id="hud">
  <div class="pill"><b id="round">1</b><small id="t-rnd">level</small></div>
  <div class="pill"><b id="best">0</b><small id="t-best">best</small></div>
</div>

<div class="msg" id="msg"></div>
<div class="count" id="count"></div>
<div class="toast" id="toast"></div>
<div class="lvl" id="lvl"></div>
<div class="demo-tip" id="demotip"></div>
<button class="snd stopx" id="stopx" aria-label="Stop">✕</button>

<div class="card" id="start">
  <h1 id="t-title">Floor Is Lava</h1>
  <p class="sub" id="t-sub"></p>
  <button class="btn" id="play"><span id="t-play">Play</span></button>
  <button class="btn2" id="demo"><span id="t-demo">Watch a demo</span></button>
  <p class="note" id="t-privacy"></p>
  <details id="grown">
    <summary id="t-grown">For grown-ups</summary>
    <div class="g-body">
      <p id="t-g1"></p>
      <div class="g-row"><span id="t-startlv">Start at level</span>
        <div class="seg" id="startlv-seg"><button data-v="1"></button><button data-v="3"></button><button data-v="5"></button></div></div>
      <div class="g-row"><span id="t-cam">Camera</span>
        <div class="seg" id="cam-seg"><button data-v="user"></button><button data-v="environment"></button></div></div>
      <div class="g-row"><span id="t-music">Music</span>
        <div class="seg" id="music-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-amb">Lava sounds</span>
        <div class="seg" id="amb-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-sfx">Sound effects</span>
        <div class="seg" id="sfx-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <button class="btn2" id="howto"><span id="t-howto">How to set up</span></button>
      <button class="btn2" id="refloor"><span id="t-refloor">Set up the floor again</span></button>
      <p id="t-g2"></p>
      <p id="t-g3"></p>
      <p id="t-g4"></p>
      <p class="mini" id="t-legal"></p>
    </div>
  </details>
</div>

<div class="card" id="guide" hidden>
  <h1 id="t-gtitle" style="font-size:26px;margin:0 0 4px">Set up the play area</h1>
  <div class="gbody"><canvas id="guidepic" width="800" height="440"></canvas>
  <ol class="steps"><li><b>1</b><span id="t-gs1"></span></li><li><b>2</b><span id="t-gs2"></span></li><li><b>3</b><span id="t-gs3"></span></li></ol></div>
  <button class="btn" id="gok"><span id="t-gok">Got it</span></button>
</div>

<div class="card" id="setup" hidden>
  <ol class="steps small"><li><b>1</b><span id="t-ss1"></span></li><li><b>2</b><span id="t-ss2"></span></li><li><b>3</b><span id="t-ss3"></span></li></ol>
  <div class="row"><button class="btn" id="setok"><span id="t-setok">Ready!</span></button><button class="btn2" id="setreset"><span id="t-setreset">Reset</span></button></div>
</div>

<div class="card" id="end" hidden>
  <div class="center"><span class="newbest" id="newbest" hidden></span></div>
  <h1 id="t-over"></h1>
  <div class="big-score"><span id="final">0</span><small id="t-sec2"></small></div>
  <div class="stars" id="pstars"></div>
  <p class="best-line" id="best-line"></p>
  <button class="btn" id="again"><span id="t-again">Play again</span></button>
  <p class="note" id="t-privacy2"></p>
</div>

  g3:"★ מסך הטלפון קטן מרחוק: הקישו על 📺 כדי להציג את המשחק בטלוויזיה או במחשב, וכולם מסתכלים על המסך הגדול.",
  g4:"★ בפעם הראשונה, גררו את 4 האבנים לפינות שטח המשחק על הרצפה. הטלפון זוכר את זה.",

  ready:"מתכוננים…",feet:"תראו לי את כפות הרגליים! עמדו על הרצפה.",onfloor:"היכנסו לרצפת הלבה!",

let startLv=+LS.get('lv-start','1'); if(![1,3,5].includes(startLv))startLv=1;

  lang=l;LS.set('bamboo-lang',l);const u=UI[l];
  document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';document.querySelector('.top').dir='ltr';
  for(const k of ['title','sub','play','demo','privacy','grown','g1','startlv','howto','cam','music','amb','sfx','refloor','g2','g3','g4','legal','rnd','best','sec2','again','setok','setreset','gtitle','gs1','gs2','gs3','gok','ss1','ss2','ss3'])
    {const e=$('t-'+k);if(e)e.textContent=u[k];}
  $('t-privacy2').textContent=u.privacy;$('demotip').textContent=u.demotip;

  $('c').setAttribute('aria-label',u.aria);
  segs();syncSound();cast.paint();if(!$('end').hidden)fillEnd(lastNew);
}
$('lang-en').onclick=()=>setLang('en');$('lang-he').onclick=()=>setLang('he');
document.querySelectorAll('#startlv-seg button').forEach(b=>b.onclick=()=>{startLv=+b.dataset.v;LS.set('lv-start',startLv);segs();});

/* ================= CANVAS ================= */
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',resize);resize();

/* ================= SOUND EFFECTS ================= */
const FX={
  pop(i=0){tone({f0:420+i*30,f1:900+i*40,dur:.09,type:'sine',vol:.16});},
  rock(){noise({dur:.09,freq:500,vol:.4,type:'lowpass'});tone({f0:150,f1:90,dur:.16,type:'triangle',vol:.3});},
  glass(){SFX.tink(1.1);tone({f0:2900,dur:.12,type:'sine',vol:.05,at:.04});},
  sizzle(){noise({dur:1.6,freq:4200,vol:.09,type:'highpass'});},
  melt(){noise({dur:.5,freq:900,vol:.18,type:'bandpass'});tone({f0:700,f1:200,dur:.45,type:'sine',vol:.08});},
  toast(){noise({dur:.5,freq:3500,vol:.14,type:'highpass'});tone({f0:300,f1:900,dur:.35,type:'sine',vol:.16,at:.08});tone({f0:900,f1:500,dur:.25,type:'sine',vol:.12,at:.45});},
  safe(){SFX.sparkle();},
  whoosh(){noise({dur:.4,freq:1200,vol:.12,type:'bandpass'});},
  hop(){tone({f0:330,f1:620,dur:.12,type:'sine',vol:.1});},
  outS(){tone({f0:520,f1:260,dur:.5,type:'triangle',vol:.14});tone({f0:390,f1:200,dur:.55,type:'triangle',vol:.1,at:.18});}
};

/* ================= FLOOR (homography 5×5 grid ↔ screen) ================= */
const N=5;
function solveH(src,dst){ // maps src[i] -> dst[i]
  const A=[],b=[];

/* ================= LAVA ================= */
const blobs=[];for(let i=0;i<16;i++)blobs.push({u:Math.random()*N,v:Math.random()*N,r:.35+Math.random()*.55,ph:Math.random()*7,sp:.15+Math.random()*.25,c:i%3});
const bubbles=[];
function lavaPool(){
  const pts=[],e=.18,step=.25;
  const edge=(u,v,nu,nv)=>{const w=.07*Math.sin(u*3.1+v*2.3+tNow*.8)+.05*Math.sin(u*7+v*5);pts.push([u+nu*w,v+nv*w]);};
  for(let u=-e;u<N+e;u+=step)edge(u,-e,0,-1);
  for(let v=-e;v<N+e;v+=step)edge(N+e,v,1,0);
  for(let u=N+e;u>-e;u-=step)edge(u,N+e,0,1);

}
function drawLava(alpha=1){

  ctx.save();ctx.clip(pool);

  if(Math.random()<.12)bubbles.push({u:Math.random()*N,v:Math.random()*N,t:tNow,life:.9+Math.random()*.6});
  for(let i=bubbles.length-1;i>=0;i--){const bb=bubbles[i],k=(tNow-bb.t)/bb.life;if(k>=1){bubbles.splice(i,1);continue;}
    const q=P(bb.u,bb.v),px=cellPx(bb.u,bb.v),r=px*.09*Math.sin(k*Math.PI*.9);

const COLORS=['#5FB7F0','#FF7AA8','#8BD16B','#FFB13D'];

const video=$('v');

function fakeTracker(){
  return {detectForVideo(img,now){const t=now/1000,L=[],M=[],pw=img.width,ph=img.height;
    for(let k=0;k<2;k++){const cx=.35+.3*k+.12*Math.sin(t*.7+k*2),fy=.78+.12*Math.sin(t*.5+k),hgt=.55*(.6+.4*fy);

      for(const [h,to,an,dx] of [[29,31,27,-.025],[30,32,28,.025]]){lm[h]={x:cx+dx,y:fy,visibility:1};lm[to]={x:cx+dx,y:fy+.01,visibility:1};lm[an]={x:cx+dx,y:fy-.02,visibility:1};}

async function startCam(){

function makeBots(){
  players=[];nextColor=0;
  const mk=(u,v,you)=>{const p={id:Math.random(),color:COLORS[nextColor++],u,v,tu:u,tv:v,hop:1,hopFrom:{u,v},status:'',statusT:0,score:0,lives:LIVES,bot:!you,you,feet:[{ok:true},{ok:true}],skill:.8+Math.random()*.15};players.push(p);return p;};
  mk(1.5,4.5,true);mk(3.5,4.5);mk(2.5,3.5);
}
function hopTo(p,c){if(!c)return;p.hopFrom={u:p.u,v:p.v};p.tu=c.u+(Math.random()-.5)*.15;p.tv=c.v+(Math.random()-.5)*.15;p.hop=0;p.hopDur=.45+Math.hypot(p.tu-p.u,p.tv-p.v)*.12;FX.hop();}
function botThink(){
  for(const p of players){if(!p.bot||p.out||p.outT)continue;
    const sk=p.skill-(levelNo-1)*.06;   // the bots get worse as the levels get harder
    const here=cells[Math.floor(Math.max(0,Math.min(N-1,p.v)))*N+Math.floor(Math.max(0,Math.min(N-1,p.u)))];
    const near=types=>{let b=null,bd=1e9;for(const c of cells)if(types.includes(c.type)&&!players.some(o=>o!==p&&Math.hypot(o.tu-c.u,o.tv-c.v)<.4)){const d=Math.hypot(c.u-p.u,c.v-p.v)+Math.random()*.8;if(d<bd){bd=d;b=c;}}return b;};
    if(phase==='quiz'&&!p.planned&&phaseT>.4+Math.random()*1.2){p.planned=true;if(here.type!=='q')hopTo(p,Math.random()<sk+.15?near(['q']):near(['lava']));}
    if(phase==='melt'&&!p.planned2&&phaseT>.25+Math.random()*.6){p.planned2=true;if(here.type==='glass'||here.type==='lava'){if(Math.random()<sk)hopTo(p,near(['rock']));}}
  }
}
function updateBots(dt){
  for(const p of players){
    if(p.out&&!p.benched&&p.hop>=1){p.benched=true;const side=p.u<N/2?-.9:N+.9;p.hopFrom={u:p.u,v:p.v};p.tu=side;p.tv=Math.max(.5,Math.min(N-.5,p.v));p.hop=0;p.hopDur=.9;}   // out: hop off to the side
    if(p.hop<1){p.hop=Math.min(1,p.hop+dt/p.hopDur);const k=ease(p.hop);p.u=p.hopFrom.u+(p.tu-p.hopFrom.u)*k;p.v=p.hopFrom.v+(p.tv-p.hopFrom.v)*k;}
    const q=P(p.u,p.v);p.sx=q.x;p.sy=q.y;p.px=cellPx(p.u,p.v);
    const lift=p.hop<1?Math.sin(p.hop*Math.PI)*p.px*.45:(p.status==='toast'&&tNow-p.statusT<2.2?Math.abs(Math.sin((tNow-p.statusT)*9))*p.px*.18:0);
    p.lift=lift;p.headPt={x:q.x,y:q.y-p.px*1.05-lift};
    p.feet=[{x:q.x-p.px*.08,y:q.y,ok:p.hop>=1},{x:q.x+p.px*.08,y:q.y,ok:p.hop>=1}];
  }
}
function drawBean(p){
  const s=p.px,x=p.sx,y=p.sy-(p.lift||0),hot=!p.out&&p.status==='toast'&&tNow-p.statusT<2.6;
  ctx.save();if(p.out)ctx.globalAlpha=.5;

  const bp=new Path2D();bp.ellipse(x,y-s*.42,s*.22,s*.38,0,0,7);sticker(ctx,bp,body,lw);

  ctx.fillStyle='rgba(255,120,140,.6)';ctx.fill(ell(x-s*.13,fy+s*.07,s*.04,s*.025));ctx.fill(ell(x+s*.13,fy+s*.07,s*.04,s*.025));
  ctx.strokeStyle=INK;ctx.lineWidth=lw*.8;ctx.lineCap='round';ctx.beginPath();

}

const LEVELS=[
 {q:15,rocks:9,ask:2.0,melt:2.6},{q:15,rocks:8,ask:1.8,melt:2.4},{q:14,rocks:7,ask:1.6,melt:2.2},{q:14,rocks:6,ask:1.4,melt:2.0},{q:13,rocks:6,ask:1.2,melt:1.9},
 {q:12,rocks:5,ask:1.0,melt:1.8},{q:12,rocks:5,ask:.9,melt:1.6},{q:11,rocks:4,ask:.8,melt:1.5},{q:10,rocks:4,ask:.6,melt:1.3},{q:10,rocks:3,ask:.5,melt:1.2}];
const COUNT=3,QTOTAL=3,QASK=.75,STEP=(QTOTAL-QASK)/COUNT;   // 13 Nov (Edgar): '?' then 3-2-1, all within 3 s (0.75 s each)

function startRound(){
  levelNo++;const L=LEVELS[levelNo-1];ASK=QASK;QUIZ=QTOTAL;MELT=L.melt;
  $('round').textContent=levelNo+'/10';
  for(const c of cells){c.type='lava';c.sink=0;}
  const order=cells.slice().sort(()=>Math.random()-.5).slice(0,L.q);
  order.forEach((c,i)=>{c.type='q';c.t0=tNow+i*.04;setTimeout(()=>FX.pop(i%6),i*40);});
  for(const p of players){p.status='';p.planned=p.planned2=false;}
  banner(levelNo===10?UI[lang].lastlv:UI[lang].level+' '+levelNo);
  quizN=-1;setPhase('quiz');FX.whoosh();
}
function reveal(){
  const L=LEVELS[levelNo-1],rocks=Math.max(L.rocks,alive().length);   // always at least one rock per child still playing
  const qs=cells.filter(c=>c.type==='q').sort(()=>Math.random()-.5);
  qs.forEach((c,i)=>{c.type=i<rocks?'rock':'glass';c.t0=tNow;});
  FX.rock();setTimeout(FX.glass,60);setTimeout(FX.sizzle,350);
  msg(UI[lang].melt);setPhase('melt');
  for(const p of alive()){const s=standing(p);if(s.on&&!s.rock&&!s.glass&&s.lava===s.on)judge(p,'toast');}   // straight on the lava
}

  for(const c of cells)if(c.type==='glass'){c.type='lava';}

  for(const p of alive()){if(p.status)continue;const s=standing(p);if(s.rock)judge(p,'safe');else if(s.on)judge(p,'toast');}
  reached=Math.max(reached,levelNo);

    if(mode==='demo')botThink();
    const el=$('count');
    if(phase==='quiz'){const n=phaseT<ASK?0:Math.ceil((QUIZ-phaseT)/STEP);if(quizN!==n){if(quizN===-1)msg(UI[lang].q);if(n>0){SFX.tick();numPopT=tNow;}quizN=n;}
      if(phaseT>=QUIZ){quizN=-1;reveal();}}
    else if(phase==='melt'){if(phaseT>=FLIP+MELT)finishRound();}
    else if(phase==='result'){if(phaseT>=RESULT){for(const c of cells)if(c.type==='rock')c.sinkT=tNow;resetFloor();}}
    else if(phase==='reset'){for(const c of cells)if(c.type==='rock')c.sink=Math.min(1,phaseT/RESET);
      if(phaseT>=RESET){if(!alive().length&&!players.some(p=>p.outT>tNow))endGame('out');else if(levelNo>=10)endGame('win');else startRound();}}
  }
  render(dt);
  requestAnimationFrame(frame);
}

function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const cam=mode==='camera'&&camOK&&state!=='menu'&&state!=='over';
  if(cam){ctx.fillStyle='#2a2033';ctx.fillRect(0,0,W,H);if(video.readyState>=2)drawVid(video);}
  else drawRoom(ctx,W,H);
    drawLava(setupMode?.28:1);
  const order=cells.slice().sort((a,b)=>a.v-b.v||a.u-b.u);
  if(setupMode){for(const c of order){const t=c.type;c.type='rock';c.t0=-9;c.sink=0;drawTileGhost(c);c.type=t;}}
  else{
    // draw tiles and demo players far → near so nearer things overlap
    const items=order.map(c=>({v:c.v+.45,c}));
    if(mode==='demo'&&(state==='play'||state==='count'))for(const p of players)items.push({v:p.v+.5,p});
    items.sort((a,b)=>a.v-b.v);
    for(const it of items){if(it.c){if(it.c.type!=='lava')drawTile(it.c);}else drawBean(it.p);}
  }
  if(cam&&cutA.width){drawVid(cutA);drawVid(cutB);drawVid(cutC);}
  if(cam&&(state==='play'||state==='count'||state==='ready'))for(const p of players){ // a little colour star above each child
    if(!p.headPt||p.mask<0||p.spect)continue;const s=Math.max(12,Math.min(30,(p.px||60)*.25));ctx.save();if(p.out)ctx.globalAlpha=.45;ctx.translate(p.headPt.x,p.headPt.y-s*2.2);sticker(ctx,starPath(s),p.out?'#BBBBBB':p.color,3);ctx.restore();
    if(!p.out){ctx.save();drawHearts(ctx,p.headPt.x,p.headPt.y-s*.6,p.lives,s*.42);ctx.restore();}}
  // effects
  for(let i=steam.length-1;i>=0;i--){const s=steam[i];s.life-=dt;if(s.life<=0){steam.splice(i,1);continue;}s.y+=s.vy*dt;s.x+=Math.sin(tNow*3+i)*.4;const k=1-s.life/s.max;
    ctx.save();ctx.globalAlpha=Math.min(s.soft?.55:.85,s.life*1.2);sticker(ctx,ell(s.x,s.y,s.r*(1+k),s.r*(.8+k*.8)),'#FFFFFF',2);ctx.restore();}
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.life-=dt;if(p.life<=0){sparks.splice(i,1);continue;}p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=Math.min(1,p.life*1.6);sticker(ctx,starPath(10),'#FFD84D',2);ctx.restore();}
  for(let i=labels.length-1;i>=0;i--){const l=labels[i],k=(tNow-l.t)/1.6;if(k>=1){labels.splice(i,1);continue;}
    const f=Math.max(18,Math.min(34,W*.05)),y=Math.max(150,l.y-k*30);ctx.save();ctx.globalAlpha=k<.8?1:(1-k)/.2;ctx.font=`900 ${f}px Grandstander,Fredoka,sans-serif`;ctx.textAlign='center';
    ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.strokeText(l.txt,l.x,y);ctx.fillStyle=l.color;ctx.fillText(l.txt,l.x,y);ctx.restore();}
  drawOverlay();
  if(setupMode){
    const pts=[0,1,2,3].map(handlePos);ctx.save();ctx.setLineDash([10,8]);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();ctx.restore();
    if(!touchedStone)fingerHint(pts);
    pts.forEach((p,i)=>{const r=drag===i?30:26;ctx.fillStyle='rgba(43,33,24,.3)';ctx.fill(ell(p.x,p.y+6,r,r*.5));sticker(ctx,ell(p.x,p.y,r,r*.8),'#B9A794',4);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fill(ell(p.x-r*.3,p.y-r*.3,r*.3,r*.15));});
  }
}
/* while showing on a big screen, the messages and scores are drawn into the picture itself so the TV gets them too */
function bubble(txt,cx,cy,f,fill='#fff',big=false){
  ctx.save();ctx.font=`${big?900:700} ${f}px ${big?'Grandstander,':''}Fredoka,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(txt).width+f*1.4,h=f*1.9,p=new Path2D();p.roundRect(cx-w/2,cy-h/2,w,h,h/2);
  ctx.fillStyle=INK;ctx.translate(0,4);ctx.fill(p);ctx.translate(0,-4);sticker(ctx,p,fill,3);ctx.fillStyle=INK;ctx.fillText(txt,cx,cy+1);ctx.restore();
}
function drawOverlay(){
  if(!casting)return;const f=Math.max(16,Math.min(26,W*.03)),top=70;
  if($('hud').classList.contains('on'))bubble(UI[lang].level+' '+$('round').textContent,W*.12,top,f*.8);
  if(msgNow)bubble(msgNow,W/2,top+f*3.2,f);
  const c=$('count');if(c.style.display==='block'&&c.textContent){ctx.save();const F=Math.min(H*.25,120);ctx.font=`900 ${F}px Grandstander,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=F*.08;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.strokeText(c.textContent,W/2,H*.48);ctx.fillStyle='#fff';ctx.fillText(c.textContent,W/2,H*.48);ctx.restore();}
  const lv=$('lvl');if(lv.classList.contains('on')){ctx.save();const F=Math.min(44,W*.06);ctx.font=`900 ${F}px Grandstander,sans-serif`;ctx.textAlign='center';ctx.lineWidth=F*.14;ctx.strokeStyle=INK;ctx.lineJoin='round';
    ctx.strokeText(lv.textContent,W/2,top+f*6);ctx.fillStyle='#FFD84D';ctx.fillText(lv.textContent,W/2,top+f*6);ctx.restore();}
}
/* idle hint on the setup screen: a cartoon finger presses a stone and drags it onto a corner mark */
function drawFinger(x,y,press){
  const k=press?.92:1;ctx.save();ctx.translate(x,y);ctx.scale(k,k);ctx.rotate(-.35);
  const skin='#FFD7B5',lw=3.5;
  const hand=new Path2D();hand.moveTo(-14,26);hand.bezierCurveTo(-30,40,-30,78,-6,92);hand.bezierCurveTo(16,104,44,92,46,66);hand.bezierCurveTo(48,48,40,34,24,30);hand.closePath();
  const finger=new Path2D();finger.moveTo(-11,4);finger.bezierCurveTo(-12,-8,12,-8,11,4);finger.lineTo(12,44);finger.bezierCurveTo(12,52,-12,52,-12,44);finger.closePath();
  ctx.fillStyle='rgba(43,33,24,.18)';ctx.fill(ell(10,96,34,8));
  sticker(ctx,hand,skin,lw);sticker(ctx,finger,skin,lw);
  for(const dx of [16,30])sticker(ctx,ell(dx+4,40,9,12,.3),skin,lw*.8);   // curled fingers
  ctx.fillStyle='#FFF1E4';ctx.fill(ell(0,3,6,5));ctx.strokeStyle='rgba(43,33,24,.5)';ctx.lineWidth=1.5;ctx.stroke(ell(0,3,6,5));   // nail
  ctx.restore();
}
function fingerHint(pts){
  const cyc=2.8,t=(tNow-setupT)%(cyc*4),i=Math.floor(t/cyc),k=(t%cyc)/cyc,p=pts[i];
  const cx=(pts[0].x+pts[1].x+pts[2].x+pts[3].x)/4,cy=(pts[0].y+pts[1].y+pts[2].y+pts[3].y)/4;
  let dx=p.x-cx,dy=p.y-cy;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
  const mark={x:p.x+dx*48,y:p.y+dy*30};
  ctx.save();ctx.globalAlpha=.9;sticker(ctx,ell(mark.x,mark.y,15,8),'#FFD84D',3);ctx.restore();   // the corner mark on the floor
  let fx,fy,press=false,gx=null;
  if(k<.25){const e=ease(k/.25);fx=p.x+60*(1-e)+10;fy=p.y+70*(1-e)+6;}
  else if(k<.35){fx=p.x+10;fy=p.y+6;press=true;}
  else if(k<.75){const e=ease((k-.35)/.4);gx={x:p.x+(mark.x-p.x)*e,y:p.y+(mark.y-p.y)*e};fx=gx.x+10;fy=gx.y+6;press=true;}
  else{const e=ease((k-.75)/.25);gx=mark;fx=mark.x+10+40*e;fy=mark.y+6+50*e;}
  if(gx){ctx.save();ctx.globalAlpha=.6;sticker(ctx,ell(gx.x,gx.y,24,19),'#B9A794',3);ctx.restore();}
  drawFinger(fx,fy,press);
}
function drawTileGhost(c){const pts=tileShape(c,.42).map(([u,v])=>P(u,v)),p=new Path2D();pts.forEach((q,i)=>i?p.lineTo(q.x,q.y):p.moveTo(q.x,q.y));p.closePath();
  ctx.save();ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.stroke(p);ctx.restore();}

setLang(lang);loadBest();
requestAnimationFrame(frame);
</script>
