<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Floor Is Lava · Bamboo Physio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<style>
.pill.mid{display:flex;align-items:center;gap:6px}
.pill.mid canvas{width:30px;height:30px}
.lvl{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.6);font:900 44px Grandstander,sans-serif;max-width:94vw;color:#FFD84D;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);opacity:0;transition:opacity .25s,transform .25s;z-index:6;pointer-events:none;white-space:nowrap}
.lvl.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.msg{top:calc(var(--safe-t) + 150px)}
.lvl{top:calc(var(--safe-t) + 150px)}
.count{top:48%;font-size:110px}
.btn2{display:block;width:100%;margin-top:10px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:700 18px Fredoka,sans-serif;padding:8px 0;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn2:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.snd.cast{font-size:19px}
#setup{top:calc(var(--safe-t) + 60px);bottom:auto;padding:10px 14px}
#setup p{margin:4px 0 10px;text-align:center;font:600 16px Fredoka,sans-serif;line-height:1.35}
#setup .row{display:flex;gap:10px}
#setup .row .btn{flex:2}
#setup .row .btn2{flex:1;margin-top:0}
.stars{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px 0 10px}
.stars div{display:flex;flex-direction:column;align-items:center;font:900 26px Grandstander,sans-serif}
.stars canvas{width:46px;height:46px}
.demo-tip{position:fixed;left:50%;bottom:calc(var(--safe-b) + 12px);transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font:700 15px Fredoka,sans-serif;box-shadow:0 3px 0 var(--ink);z-index:5;white-space:nowrap;display:none}
.demo-tip.on{display:block}
.stopx{position:fixed;left:12px;bottom:calc(var(--safe-b) + 12px);z-index:6;display:none}
.stopx.on{display:block}
body.casting .msg,body.casting .count,body.casting .lvl,body.casting .hud{visibility:hidden}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>

<div class="top">
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 33 C 10 20, 20 9, 34 6 C 33 20, 24 31, 8 33 Z" fill="#7DCB6B" stroke="#2b2118" stroke-width="3.5" stroke-linejoin="round"/><path d="M11 30 C 17 23, 23 16, 29 11" fill="none" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round"/></svg><span>Bamboo Physio</span></div>
  <div class="tr"><button class="snd cast" id="cast">📺</button><button class="snd" id="snd" aria-pressed="false">🔊</button>
  <div class="lang"><button id="lang-en" aria-pressed="true">EN</button><button id="lang-he" aria-pressed="false">עב</button></div></div>
</div>

<div class="hud" id="hud">
  <div class="pill"><b id="round">1</b><small id="t-rnd">round</small></div>
  <div class="pill mid"><canvas id="staricon" width="60" height="60"></canvas><b id="score">0</b></div>
  <div class="pill"><b id="best">0</b><small id="t-best">best</small></div>
</div>

<div class="msg" id="msg"></div>
<div class="count" id="count"></div>
<div class="toast" id="toast"></div>
<div class="lvl" id="lvl"></div>
<div class="demo-tip" id="demotip"></div>
<button class="snd stopx" id="stopx" aria-label="Stop">✕</button>

<div class="card" id="start">
  <h1 id="t-title">Floor Is Lava</h1>
  <p class="sub" id="t-sub"></p>
  <button class="btn" id="play"><span id="t-play">Play</span></button>
  <button class="btn2" id="demo"><span id="t-demo">Watch a demo</span></button>
  <p class="note" id="t-privacy"></p>
  <details id="grown">
    <summary id="t-grown">For grown-ups</summary>
    <div class="g-body">
      <p id="t-g1"></p>
      <div class="g-row"><span id="t-rounds">Rounds</span>
        <div class="seg" id="rounds-seg"><button data-v="5"></button><button data-v="8"></button><button data-v="12"></button></div></div>
      <div class="g-row"><span id="t-rocks">Rocks</span>
        <div class="seg" id="rocks-seg"><button data-v="4"></button><button data-v="6"></button><button data-v="9"></button></div></div>
      <div class="g-row"><span id="t-cam">Camera</span>
        <div class="seg" id="cam-seg"><button data-v="user"></button><button data-v="environment"></button></div></div>
      <div class="g-row"><span id="t-music">Music</span>
        <div class="seg" id="music-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-amb">Lava sounds</span>
        <div class="seg" id="amb-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <div class="g-row"><span id="t-sfx">Sound effects</span>
        <div class="seg" id="sfx-seg"><button data-v="1"></button><button data-v="0"></button></div></div>
      <button class="btn2" id="refloor"><span id="t-refloor">Set up the floor again</span></button>
      <p id="t-g2"></p>
      <p id="t-g3"></p>
      <p id="t-g4"></p>
      <p class="mini" id="t-legal"></p>
    </div>
  </details>
</div>

<div class="card" id="setup" hidden>
  <p id="t-setup"></p>
  <div class="row"><button class="btn" id="setok"><span id="t-setok">Ready!</span></button><button class="btn2" id="setreset"><span id="t-setreset">Reset</span></button></div>
</div>

<div class="card" id="end" hidden>
  <div class="center"><span class="newbest" id="newbest" hidden></span></div>
  <h1 id="t-over"></h1>
  <div class="big-score"><span id="final">0</span><small id="t-sec2"></small></div>
  <div class="stars" id="pstars"></div>
  <p class="best-line" id="best-line"></p>
  <button class="btn" id="again"><span id="t-again">Play again</span></button>
  <p class="note" id="t-privacy2"></p>
</div>

<script type="module">

/* ================= TEXT ================= */
const UI={

  rounds:"Rounds",rocks:"Rocks (of 15)",cam:"Camera",user:"Front",environment:"Back",
  music:"Music",amb:"Lava sounds",sfx:"Sound effects",on:"On",off:"Off",mute:"Sound on or off",refloor:"Set up the floor again",

  legal:"A home practice game by Bamboo Physio. Not a medical device. © 2026 Bamboo Physio · Instrument sounds: FluidR3_GM by Frank Wen, CC BY 3.0",

  demotip:"Tap a square to hop there",turn:"Turn the phone sideways for a bigger floor",you:"You",lastround:"Last round!"},
 he:{title:"הרצפה היא לבה",sub:"קפצו על קוביית סימן שאלה. סלע שומר עליכם. זכוכית נמסה!",play:"שחקו",demo:"צפו בהדגמה",
  privacy:"המצלמה משמשת רק למשחק. שום דבר לא מוקלט ולא נשלח.",grown:"למבוגרים",
  g1:"משחק צעדים לילד אחד או לכמה ילדים. דרך המצלמה הרצפה הופכת ללבה, מחולקת ל־5 × 5 משבצות. בכל סבב 15 משבצות קופצות כקוביות סימן שאלה למשך 3 שניות — כולם עולים על אחת. אחר כך הקוביות הופכות לסלע או לזכוכית. סלע בטוח. זכוכית נמסה תוך 2 שניות, כך שמי שעומד על זכוכית מקבל 2 שניות לעבור לסלע. מי שעומד ישר על הלבה מאדים ו״מתחמם״ לרגע (בעדינות ובצורה מצחיקה).",
  rounds:"סבבים",rocks:"סלעים (מתוך 15)",cam:"מצלמה",user:"קדמית",environment:"אחורית",
  music:"מוזיקה",amb:"צלילי לבה",sfx:"צלילים במשחק",on:"פועל",off:"כבוי",mute:"הפעלת או השתקת קול",refloor:"הגדרת הרצפה מחדש",
  g2:"★ פנו שטח רצפה של בערך 2.5 × 2.5 מ׳ (כל משבצת ≈ 50 ס״מ). העמידו את הטלפון לרוחב על מדף או כיסא, 1–2 מ׳ מאחורי השטח, כך שיראה את כל השטח ואת כפות הרגליים של כולם.",
  g3:"★ מסך הטלפון קטן מרחוק: הקישו על 📺 כדי להציג את המשחק בטלוויזיה או במחשב, וכולם מסתכלים על המסך הגדול.",
  g4:"★ בפעם הראשונה, גררו את 4 האבנים לפינות שטח המשחק על הרצפה. הטלפון זוכר את זה.",
  legal:"משחק תרגול ביתי של Bamboo Physio. לא מכשיר רפואי. © 2026 Bamboo Physio · צלילי כלים: FluidR3_GM מאת Frank Wen, ‏CC BY 3.0",
  rnd:"סבב",best:"שיא",sec2:"נחיתות בטוחות",over:["כל הכבוד!","רגליים חמות!","קופצי לבה!","אלופי הלבה!"],again:"עוד פעם",newbest:"שיא חדש!",bestis:"השיא: ",
  ready:"מתכוננים…",feet:"תראו לי את כפות הרגליים! עמדו על הרצפה.",onfloor:"היכנסו לרצפת הלבה!",
  setup:"גררו את 4 האבנים לפינות שטח המשחק על הרצפה.",setok:"מוכנים!",setreset:"איפוס",
  nocam:"אין כאן מצלמה — מציגים הדגמה במקום.",errAllow:"המצלמה חסומה. אשרו גישה למצלמה לאתר הזה בהגדרות הדפדפן, ואז הקישו שוב על שחקו.",errNone:"לא נמצאה מצלמה במכשיר.",errModel:"זיהוי התנועה לא נטען. בדקו את החיבור לאינטרנט והקישו שוב על שחקו.",errOther:"המצלמה לא נפתחה. סגרו אפליקציות אחרות שמשתמשות במצלמה והקישו שוב על שחקו.",errInApp:"טיפ: פתחו את הקישור ב־Chrome או ב־Safari, לא בתוך אפליקציה אחרת.",aria:"אזור המשחק",
  q:"קפצו על קוביית סימן שאלה!",reveal:"סלע או זכוכית?",melt:"הזכוכית נמסה — מצאו סלע!",safe:"בטוח!",toast:["חם חם!","מתחמם!","אוי, חם!","בהונות חמות!"],
  demotip:"הקישו על משבצת כדי לקפוץ אליה",turn:"סובבו את הטלפון לרוחב כדי לקבל רצפה גדולה יותר",you:"אני",lastround:"סבב אחרון!"}
};

let lang=LS.get('bamboo-lang','en'); if(!UI[lang])lang='en';
let rounds=+LS.get('lv-rounds','8'); if(![5,8,12].includes(rounds))rounds=8;
let rockN=+LS.get('lv-rocks','6'); if(![4,6,9].includes(rockN))rockN=6;
let facing=LS.get('lv-cam','user'); if(!['user','environment'].includes(facing))facing='user';
let best=0; const loadBest=()=>{best=+LS.get('lv-best-'+rounds,'0')||0;$('best').textContent=best;};
S.track='island'; S.amb='lava';
const syncSound=bindSound(()=>UI[lang]);
let casting=false;
const cast=setupCast({canvas:$('c'),button:$('cast'),lang:()=>lang,sound:()=>(audio(),S),onChange:v=>{casting=v;document.body.classList.toggle('casting',v);}});

function segs(){
  const u=UI[lang],mark=(id,v)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===String(v)));
  document.querySelectorAll('#rounds-seg button,#rocks-seg button').forEach(b=>b.textContent=b.dataset.v);
  document.querySelectorAll('#cam-seg button').forEach(b=>b.textContent=u[b.dataset.v]);
  mark('rounds-seg',rounds);mark('rocks-seg',rockN);mark('cam-seg',facing);
}
function setLang(l){
  lang=l;LS.set('bamboo-lang',l);const u=UI[l];
  document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';document.querySelector('.top').dir='ltr';
  for(const k of ['title','sub','play','demo','privacy','grown','g1','rounds','rocks','cam','music','amb','sfx','refloor','g2','g3','g4','legal','rnd','best','sec2','again','setup','setok','setreset'])
    {const e=$('t-'+k);if(e)e.textContent=u[k];}
  $('t-privacy2').textContent=u.privacy;$('demotip').textContent=u.demotip;
  $('lang-en').setAttribute('aria-pressed',l==='en');$('lang-he').setAttribute('aria-pressed',l==='he');
  $('c').setAttribute('aria-label',u.aria);
  segs();syncSound();cast.paint();if(!$('end').hidden)fillEnd(lastNew);
}
$('lang-en').onclick=()=>setLang('en');$('lang-he').onclick=()=>setLang('he');
document.querySelectorAll('#rounds-seg button').forEach(b=>b.onclick=()=>{rounds=+b.dataset.v;LS.set('lv-rounds',rounds);loadBest();segs();});
document.querySelectorAll('#rocks-seg button').forEach(b=>b.onclick=()=>{rockN=+b.dataset.v;LS.set('lv-rocks',rockN);segs();});
document.querySelectorAll('#cam-seg button').forEach(b=>b.onclick=()=>{if(facing!==b.dataset.v){facing=b.dataset.v;LS.set('lv-cam',facing);stopCam();}segs();});

/* ================= CANVAS ================= */
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',resize);resize();
{const c=$('staricon').getContext('2d');c.translate(30,31);sticker(c,starPath(24),'#FFD84D',4);}

/* ================= SOUND EFFECTS ================= */
const FX={
  pop(i=0){tone({f0:420+i*30,f1:900+i*40,dur:.09,type:'sine',vol:.16});},
  rock(){noise({dur:.09,freq:500,vol:.4,type:'lowpass'});tone({f0:150,f1:90,dur:.16,type:'triangle',vol:.3});},
  glass(){SFX.tink(1.1);tone({f0:2900,dur:.12,type:'sine',vol:.05,at:.04});},
  sizzle(){noise({dur:1.6,freq:4200,vol:.09,type:'highpass'});},
  melt(){noise({dur:.5,freq:900,vol:.18,type:'bandpass'});tone({f0:700,f1:200,dur:.45,type:'sine',vol:.08});},
  toast(){noise({dur:.5,freq:3500,vol:.14,type:'highpass'});tone({f0:300,f1:900,dur:.35,type:'sine',vol:.16,at:.08});tone({f0:900,f1:500,dur:.25,type:'sine',vol:.12,at:.45});},
  safe(){SFX.sparkle();},
  whoosh(){noise({dur:.4,freq:1200,vol:.12,type:'bandpass'});},
  hop(){tone({f0:330,f1:620,dur:.12,type:'sine',vol:.1});}
};

/* ================= FLOOR (homography 5×5 grid ↔ screen) ================= */
const N=5;
function solveH(src,dst){ // maps src[i] -> dst[i]
  const A=[],b=[];
  for(let i=0;i<4;i++){const [x,y]=src[i],[X,Y]=dst[i];
    A.push([x,y,1,0,0,0,-x*X,-y*X]);b.push(X);A.push([0,0,0,x,y,1,-x*Y,-y*Y]);b.push(Y);}
  for(let c=0;c<8;c++){let p=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    [A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];const d=A[c][c]||1e-9;
    for(let r=0;r<8;r++)if(r!==c){const f=A[r][c]/d;for(let k=c;k<8;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c];}}
  return b.map((v,i)=>v/A[i][i]);
}
const apH=(h,x,y)=>{const w=h[6]*x+h[7]*y+1;return {x:(h[0]*x+h[1]*y+h[2])/w,y:(h[3]*x+h[4]*y+h[5])/w};};
// corners in normalized picture coordinates (as shown on screen): far-left, far-right, near-right, near-left
const DEF=[[.27,.5],[.73,.5],[.97,.95],[.03,.95]];
let corners=(()=>{try{const c=JSON.parse(LS.get('lv-floor',''));if(Array.isArray(c)&&c.length===4)return c;}catch(e){}return null;})();
let G2S=null,S2G=null,vr={ox:0,oy:0,w:1,h:1,mirror:true};
const cornersNow=()=>(mode==='camera'&&camOK)||setupMode?(corners||DEF):(W>H?DEMO_L:DEMO_P);
function updateFloor(){
  const sc=cornersNow().map(([x,y])=>[vr.ox+x*vr.w,vr.oy+y*vr.h]),gc=[[0,0],[N,0],[N,N],[0,N]];
  G2S=solveH(gc,sc);S2G=solveH(sc,gc);
}
const P=(u,v)=>apH(G2S,u,v);
const toGrid=(x,y)=>apH(S2G,x,y);
const cellPx=(u,v)=>{const a=P(u-.5,v),b=P(u+.5,v);return Math.hypot(b.x-a.x,b.y-a.y);};
function projPath(pts){const p=new Path2D();pts.forEach(([u,v],i)=>{const q=P(u,v);i?p.lineTo(q.x,q.y):p.moveTo(q.x,q.y);});p.closePath();return p;}

/* ================= TILES ================= */
const cells=[];for(let i=0;i<N*N;i++)cells.push({i,u:i%N+.5,v:Math.floor(i/N)+.5,type:'lava',t0:0,seed:Math.random()*10,sink:0});
function tileShape(c,h,wob=0,squish=1){
  const pts=[],n=28;
  for(let k=0;k<n;k++){const a=k/n*Math.PI*2,co=Math.cos(a),si=Math.sin(a),
    r=h/Math.pow(Math.pow(Math.abs(co),4)+Math.pow(Math.abs(si),4),.25)*(1+.05*Math.sin(3*a+c.seed)+wob*Math.sin(5*a+c.seed*2+tNow*6));
    pts.push([c.u+r*co,c.v+r*si*squish]);}
  return pts;
}
function hull(pts){pts=pts.slice().sort((a,b)=>a.x-b.x||a.y-b.y);const cr=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x),lo=[],up=[];
  for(const p of pts){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  up.pop();lo.pop();return lo.concat(up);}
// a raised slab: side (hull of bottom+top), then top face
function slab(c,h,height,top,side,lw,wob=0,lift=0){
  const base=tileShape(c,h,wob).map(([u,v])=>P(u,v));
  const px=cellPx(c.u,c.v),hh=height*px,dy=-lift*px;
  const bot=base.map(p=>({x:p.x,y:p.y+dy})),tp=base.map(p=>({x:p.x,y:p.y+dy-hh}));

const blobs=[];for(let i=0;i<16;i++)blobs.push({u:Math.random()*N,v:Math.random()*N,r:.35+Math.random()*.55,ph:Math.random()*7,sp:.15+Math.random()*.25,c:i%3});
const bubbles=[];
function lavaPool(){
  const pts=[],e=.18,step=.25;
  const edge=(u,v,nu,nv)=>{const w=.07*Math.sin(u*3.1+v*2.3+tNow*.8)+.05*Math.sin(u*7+v*5);pts.push([u+nu*w,v+nv*w]);};
  for(let u=-e;u<N+e;u+=step)edge(u,-e,0,-1);
  for(let v=-e;v<N+e;v+=step)edge(N+e,v,1,0);
  for(let u=N+e;u>-e;u-=step)edge(u,N+e,0,1);
  for(let v=N+e;v>-e;v-=step)edge(-e,v,-1,0);
  return projPath(pts);
}
function drawLava(alpha=1){
  const pool=lavaPool();
  ctx.save();ctx.globalAlpha=alpha;
  const a=P(N/2,0),b=P(N/2,N),g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);g.addColorStop(0,'#D8401E');g.addColorStop(1,'#F25A24');
  ctx.fillStyle=g;ctx.fill(pool);
  ctx.save();ctx.clip(pool);
  for(const bl of blobs){const u=bl.u+Math.sin(tNow*bl.sp+bl.ph)*.6,v=bl.v+Math.cos(tNow*bl.sp*.8+bl.ph)*.5,r=bl.r*(1+.15*Math.sin(tNow*1.3+bl.ph));
    const pts=[];for(let k=0;k<18;k++){const t=k/18*Math.PI*2;pts.push([u+Math.cos(t)*r*(1+.12*Math.sin(3*t+bl.ph+tNow)),v+Math.sin(t)*r*.8]);}
    ctx.fillStyle=['rgba(255,154,60,.75)','rgba(255,205,77,.55)','rgba(180,40,20,.45)'][bl.c];ctx.fill(projPath(pts));}
  if(Math.random()<.12)bubbles.push({u:Math.random()*N,v:Math.random()*N,t:tNow,life:.9+Math.random()*.6});
  for(let i=bubbles.length-1;i>=0;i--){const bb=bubbles[i],k=(tNow-bb.t)/bb.life;if(k>=1){bubbles.splice(i,1);continue;}
    const q=P(bb.u,bb.v),px=cellPx(bb.u,bb.v),r=px*.09*Math.sin(k*Math.PI*.9);
    ctx.fillStyle='#FFD35C';ctx.fill(ell(q.x,q.y,r,r*.6));ctx.strokeStyle='rgba(43,33,24,.5)';ctx.lineWidth=1.5;ctx.stroke(ell(q.x,q.y,r,r*.6));
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.fill(ell(q.x-r*.3,q.y-r*.2,r*.25,r*.15));}
  ctx.restore();
  ctx.lineWidth=Math.max(3,cellPx(N/2,N/2)*.05);ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.stroke(pool);
  ctx.restore();
}

// which squares a player stands on
function cellOf(x,y){const g=toGrid(x,y);if(!(g.x>=0&&g.x<N&&g.y>=0&&g.y<N))return null;return cells[Math.floor(g.y)*N+Math.floor(g.x)];}

const video=$('v');
let tracker=null,stream=null,camOK=false,lastVT=-1;
const proc=document.createElement('canvas'),pctx=proc.getContext('2d',{willReadFrequently:true});
const cutA=document.createElement('canvas'),cutB=document.createElement('canvas');
let maskA=null,maskB=null;
function fakeTracker(){
  return {detectForVideo(img,now){const t=now/1000,L=[],M=[],pw=img.width,ph=img.height;
    for(let k=0;k<2;k++){const cx=.35+.3*k+.12*Math.sin(t*.7+k*2),fy=.78+.12*Math.sin(t*.5+k),hgt=.55*(.6+.4*fy);
      const lm=[];for(let i=0;i<33;i++)lm.push({x:cx,y:fy-hgt*.5,visibility:1});
      lm[0]={x:cx,y:fy-hgt,visibility:1};lm[2]=lm[5]=lm[0];lm[23]={x:cx-.02,y:fy-hgt*.45,visibility:1};lm[24]={x:cx+.02,y:fy-hgt*.45,visibility:1};
      for(const [h,to,an,dx] of [[29,31,27,-.025],[30,32,28,.025]]){lm[h]={x:cx+dx,y:fy,visibility:1};lm[to]={x:cx+dx,y:fy+.01,visibility:1};lm[an]={x:cx+dx,y:fy-.02,visibility:1};}
      L.push(lm);
      const arr=new Float32Array(pw*ph);for(let y=0;y<ph;y++)for(let x=0;x<pw;x++){const nx=x/pw,ny=y/ph;if(Math.abs(nx-cx)<.04&&ny>fy-hgt&&ny<fy+.01)arr[y*pw+x]=1;}
      M.push({getAsFloat32Array:()=>arr,close(){}});}
    return {landmarks:L,segmentationMasks:M};}};
}
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});}
  catch(e){if(e&&e.name==='NotAllowedError')throw e;stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}
  video.srcObject=stream;await video.play();
  if(!tracker&&/[?&]fake/.test(location.search))tracker=fakeTracker();   // test hook: two pretend children
  if(!tracker){
    let vision,files;
    try{vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
      files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');}
    catch(e){const x=new Error('model');x.cause=e;throw x;}
    const opts=(d,m)=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:d},
      runningMode:'VIDEO',numPoses:4,minPoseDetectionConfidence:.45,minPosePresenceConfidence:.45,minTrackingConfidence:.45,outputSegmentationMasks:m});
    let lastErr=null;
    for(const [d,m] of [['GPU',true],['CPU',true],['GPU',false],['CPU',false]]){
      try{tracker=await vision.PoseLandmarker.createFromOptions(files,opts(d,m));break;}catch(e){lastErr=e;console.warn('tracker',d,m,e);}}
    if(!tracker){const e=new Error('model');e.cause=lastErr;throw e;}
  }
  camOK=true;
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}camOK=false;}
const DEMO_L=[[.27,.5],[.73,.5],[.95,.96],[.05,.96]],DEMO_P=[[.1,.4],[.9,.4],[1.03,.8],[-.03,.8]];
function videoRect(){
  if(!(mode==='camera'&&camOK)&&!setupMode){vr={ox:0,oy:0,w:W,h:H,mirror:false};return;}
  const vw=camOK?video.videoWidth||16:16,vh=camOK?video.videoHeight||9:9,s=Math.min(W/vw,H/vh);
  vr={ox:(W-vw*s)/2,oy:(H-vh*s)/2,w:vw*s,h:vh*s,mirror:camOK&&facing==='user'};
}
function track(now){
  if(!tracker||video.readyState<2||video.currentTime===lastVT)return;lastVT=video.currentTime;
  const vw=video.videoWidth,vh=video.videoHeight,sc=512/Math.max(vw,vh),pw=Math.round(vw*sc),ph=Math.round(vh*sc);
  if(proc.width!==pw||proc.height!==ph){proc.width=pw;proc.height=ph;for(const c of [cutA,cutB]){c.width=pw;c.height=ph;}maskA=new ImageData(pw,ph);maskB=new ImageData(pw,ph);}
  pctx.drawImage(video,0,0,pw,ph);
  let res;try{res=tracker.detectForVideo(proc,now);}catch(e){return;}
  const L=res.landmarks||[],M=res.segmentationMasks||[];
  const sx=nx=>vr.ox+(vr.mirror?1-nx:nx)*vr.w,sy=ny=>vr.oy+ny*vr.h;
  // match poses to players by hip position
  const seen=[];
  for(let k=0;k<L.length;k++){
    const lm=L[k],hip={x:sx((lm[23].x+lm[24].x)/2),y:sy((lm[23].y+lm[24].y)/2)};
    let pl=null,bd=W*.18;for(const p of players){if(seen.includes(p))continue;const d=Math.hypot(p.hip.x-hip.x,p.hip.y-hip.y);if(d<bd){bd=d;pl=p;}}
    if(!pl){pl={id:Math.random(),color:COLORS[nextColor++%COLORS.length],status:'',statusT:0,score:0,feet:[{x:0,y:0,ok:false},{x:0,y:0,ok:false}],hip};players.push(pl);}
    seen.push(pl);pl.hip=hip;pl.seen=now;pl.mask=k;
    const foot=(heel,toe,ank)=>{const h=lm[heel],t=lm[toe],a=lm[ank],vis=x=>(x.visibility??1)>.4;
      if(vis(h)&&vis(t))return {x:sx((h.x+t.x)/2),y:sy((h.y+t.y)/2),ok:true};if(vis(a))return {x:sx(a.x),y:sy(a.y)+vr.h*.015,ok:true};return {ok:false};};
    const nf=[foot(29,31,27),foot(30,32,28)];
    nf.forEach((f,i)=>{const o=pl.feet[i];if(f.ok&&o.ok){o.x+=(f.x-o.x)*.6;o.y+=(f.y-o.y)*.6;}else Object.assign(o,f);});
    const ok=pl.feet.filter(f=>f.ok);
    if(ok.length){pl.sx=ok.reduce((s,f)=>s+f.x,0)/ok.length;pl.sy=Math.max(...ok.map(f=>f.y));const g=toGrid(pl.sx,pl.sy);pl.u=g.x;pl.v=g.y;pl.px=cellPx(Math.max(0,Math.min(N,g.x)),Math.max(0,Math.min(N,g.y)));}
    pl.headPt={x:sx(lm[0].x),y:sy(Math.min(lm[0].y,lm[2].y,lm[5].y))-vr.h*.04};
  }
  for(const p of players)if(!seen.includes(p))p.mask=-1;
  players=players.filter(p=>now-p.seen<1500);
  // person cut-outs so the children stand "in front of" the lava; toasty children get a warm red glow
  const dA=maskA.data,dB=maskB.data;dA.fill(0);dB.fill(0);
  for(const p of players){if(p.mask<0||!M[p.mask])continue;
    let arr;try{arr=M[p.mask].getAsFloat32Array();}catch(e){continue;}
    const d=p.status==='toast'&&tNow-p.statusT<2.6?dB:dA;
    for(let i=0,j=3;i<arr.length;i++,j+=4){const m=arr[i];if(m>.35){const a=m>.75?255:Math.round((m-.35)/.4*255);if(a>d[j])d[j]=a;}}}
  for(const m of M)try{m.close();}catch(e){}
  for(const [cc,md] of [[cutA,maskA],[cutB,maskB]]){const c=cc.getContext('2d');c.globalCompositeOperation='copy';c.putImageData(md,0,0);c.globalCompositeOperation='source-in';c.drawImage(proc,0,0);c.globalCompositeOperation='source-over';}
  {const c=cutB.getContext('2d');c.globalCompositeOperation='source-atop';c.fillStyle=`rgba(255,80,40,${.38+.12*Math.sin(tNow*10)})`;c.fillRect(0,0,cutB.width,cutB.height);c.globalCompositeOperation='source-over';}
}

function hopTo(p,c){if(!c)return;p.hopFrom={u:p.u,v:p.v};p.tu=c.u+(Math.random()-.5)*.15;p.tv=c.v+(Math.random()-.5)*.15;p.hop=0;p.hopDur=.45+Math.hypot(p.tu-p.u,p.tv-p.v)*.12;FX.hop();}

  for(const p of players){if(!p.bot)continue;
    const here=cells[Math.floor(Math.max(0,Math.min(N-1,p.v)))*N+Math.floor(Math.max(0,Math.min(N-1,p.u)))];
    const near=types=>{let b=null,bd=1e9;for(const c of cells)if(types.includes(c.type)&&!players.some(o=>o!==p&&Math.hypot(o.tu-c.u,o.tv-c.v)<.4)){const d=Math.hypot(c.u-p.u,c.v-p.v)+Math.random()*.8;if(d<bd){bd=d;b=c;}}return b;};
    if(phase==='quiz'&&!p.planned&&phaseT>.4+Math.random()*1.2){p.planned=true;if(here.type!=='q')hopTo(p,Math.random()<p.skill+.3?near(['q']):near(['lava']));}
    if(phase==='melt'&&!p.planned2&&phaseT>.25+Math.random()*.6){p.planned2=true;if(here.type==='glass'||here.type==='lava'){if(Math.random()<p.skill)hopTo(p,near(['rock']));}}

function updateBots(dt){

/* ================= GAME FLOW ================= */
const QUIZ=3,FLIP=.35,MELT=2,RESULT=2.2,RESET=1;
let dtNow=.016,quizN=0,state='menu',mode='demo',phase='',phaseT=0,roundNo=0,score=0,lastNew=false,tNow=0,countT=0,introT=0;
function setPhase(p){phase=p;phaseT=0;}
function startRound(){
  roundNo++;$('round').textContent=roundNo+'/'+rounds;
  for(const c of cells){c.type='lava';c.sink=0;}
  const order=cells.slice().sort(()=>Math.random()-.5).slice(0,15);
  order.forEach((c,i)=>{c.type='q';c.t0=tNow+i*.04;setTimeout(()=>FX.pop(i%6),i*40);});
  for(const p of players){p.status='';p.planned=p.planned2=false;}
  if(roundNo===rounds)banner(UI[lang].lastround);
  quizN=0;setPhase('quiz');FX.whoosh();
}
function reveal(){
  const qs=cells.filter(c=>c.type==='q').sort(()=>Math.random()-.5);
  qs.forEach((c,i)=>{c.type=i<rockN?'rock':'glass';c.t0=tNow;});
  FX.rock();setTimeout(FX.glass,60);setTimeout(FX.sizzle,350);
  msg(UI[lang].melt);setPhase('melt');
  for(const p of players){const s=standing(p);if(s.on&&!s.rock&&!s.glass&&s.lava===s.on)judge(p,'toast');}   // straight on the lava
}
function finishRound(){
  for(const c of cells)if(c.type==='glass'){c.type='lava';}
  FX.melt();
  for(const p of players){if(p.status)continue;const s=standing(p);if(s.rock)judge(p,'safe');else if(s.on)judge(p,'toast');}
  msg('');setPhase('result');
}
function resetFloor(){setPhase('reset');}

function banner(txt){const el=$('lvl');el.textContent=txt;let f=44;el.style.fontSize=f+'px';while(el.scrollWidth>W*.92&&f>18){f-=2;el.style.fontSize=f+'px';}
  el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1300);}
let msgNow='';function msg(t){const m=$('msg');if(t){m.textContent=t;m.classList.add('on')}else m.classList.remove('on');msgNow=t;}
function toast(t,ms=4000){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.tm);if(ms)toast.tm=setTimeout(()=>e.classList.remove('on'),ms);}

async function play(wantDemo){
  audio();SFX.go();
  $('start').hidden=true;$('end').hidden=true;
  if(!wantDemo){
    msg(UI[lang].ready);
    try{if(!camOK)await startCam();mode='camera';}
    catch(e){console.warn(e);stopCam();msg('');$('start').hidden=false;state='menu';showCamError(e);return;}
  } else {mode='demo';stopCam();}
  msg('');
  if(mode==='camera'&&!corners){openSetup();return;}
  begin();
}
function begin(){
  $('toast').classList.remove('on');musicStart();
  score=0;roundNo=0;$('score').textContent='0';loadBest();$('hud').classList.add('on');$('stopx').classList.add('on');
  for(const c of cells){c.type='lava';c.sink=0;}
  if(mode==='demo'){makeBots();$('demotip').classList.add('on');state='count';countT=tNow;}
  else{players=[];nextColor=0;state='ready';msg(UI[lang].feet);if(H>W)toast(UI[lang].turn,6000);}
}
$('play').onclick=()=>play(false);$('demo').onclick=()=>play(true);$('again').onclick=()=>play(mode==='demo');
$('stopx').onclick=()=>endGame(true);
$('refloor').onclick=async()=>{audio();$('start').hidden=true;try{if(!camOK)await startCam();mode='camera';openSetup(true);}catch(e){$('start').hidden=false;toast(UI[lang].nocam);}};

function showCamError(e){
  const u=UI[lang],n=e&&e.name||'',inApp=/FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)|GSA\//i.test(navigator.userAgent);
  let t=e&&e.message==='model'?u.errModel:n==='NotAllowedError'?u.errAllow:(n==='NotFoundError'||n==='OverconstrainedError'||(e&&e.message==='nocam'))?u.errNone:u.errOther;
  if(inApp)t+=' '+u.errInApp;
  toast(t+' ('+(n||e&&e.message||'?')+')',0);
}
function endGame(quit){
  state='over';musicStop();$('hud').classList.remove('on');$('stopx').classList.remove('on');$('demotip').classList.remove('on');msg('');$('count').style.display='none';
  for(const c of cells){c.type='lava';c.sink=0;}
  if(quit){$('start').hidden=false;state='menu';return;}
  lastNew=score>best&&mode==='camera';if(lastNew){best=score;LS.set('lv-best-'+rounds,best);SFX.star();}
  fillEnd(lastNew);$('end').hidden=false;SFX.chime();
}
function fillEnd(nb){const u=UI[lang];$('final').textContent=score;$('newbest').hidden=!nb;$('newbest').textContent=u.newbest;
  $('best-line').textContent=mode==='camera'?u.bestis+best:'';$('t-privacy2').textContent=u.privacy;$('t-sec2').textContent=u.sec2;
  const per=score/Math.max(1,rounds*Math.max(1,players.length));$('t-over').textContent=u.over[per<.4?0:per<.65?1:per<.85?2:3];
  const box=$('pstars');box.innerHTML='';
  for(const p of players){const d=document.createElement('div'),c=document.createElement('canvas');c.width=c.height=92;const x=c.getContext('2d');
    x.translate(46,48);sticker(x,starPath(38),p.color,5);d.appendChild(c);const b=document.createElement('span');b.textContent=p.score;d.appendChild(b);box.appendChild(d);}
}

/* ---- floor setup: drag the 4 stones ---- */
let setupMode=false,drag=-1,setupFromMenu=false;
function openSetup(fromMenu){setupMode=true;setupFromMenu=!!fromMenu;state='setup';if(!corners)corners=DEF.map(c=>c.slice());$('setup').hidden=false;$('start').hidden=true;}
$('setok').onclick=()=>{LS.set('lv-floor',JSON.stringify(corners));setupMode=false;$('setup').hidden=true;SFX.go();
  if(setupFromMenu){state='menu';$('start').hidden=false;}else begin();};
$('setreset').onclick=()=>{corners=DEF.map(c=>c.slice());SFX.tick();};
const handlePos=i=>{const c=cornersNow()[i];return {x:vr.ox+c[0]*vr.w,y:vr.oy+c[1]*vr.h};};
cv.addEventListener('pointerdown',e=>{
  const x=e.clientX,y=e.clientY;
  if(setupMode){let bd=60;drag=-1;for(let i=0;i<4;i++){const h=handlePos(i),d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;drag=i;}}if(drag>=0)cv.setPointerCapture(e.pointerId);return;}
  if(mode==='demo'&&state==='play'){const you=players.find(p=>p.you),c=cellOf(x,y);if(you&&c&&you.hop>=1&&!(you.status==='toast'&&phase!=='quiz'))hopTo(you,c);}
});
cv.addEventListener('pointermove',e=>{if(!setupMode||drag<0)return;corners[drag]=[Math.max(-.05,Math.min(1.05,(e.clientX-vr.ox)/vr.w)),Math.max(0,Math.min(1.05,(e.clientY-vr.oy)/vr.h))];});
cv.addEventListener('pointerup',()=>{drag=-1;});

/* ================= MAIN LOOP ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;tNow+=dt;phaseT+=dt;dtNow=dt;
  videoRect();updateFloor();
  if(mode==='camera'&&camOK&&state!=='menu'&&state!=='over')track(now);
  if(mode==='demo'&&players.length)updateBots(dt);

  if(state==='ready'){
    const withFeet=players.filter(p=>p.feet.some(f=>f.ok));
    const inside=withFeet.filter(p=>standing(p).on>0);
    if(inside.length){state='count';countT=tNow;msg('');}
    else msg(withFeet.length?UI[lang].onfloor:UI[lang].feet);
  }
  else if(state==='count'){
    const n=3-Math.floor(tNow-countT),el=$('count');
    if(n>0){if(el.textContent!==String(n)){el.textContent=n;el.style.display='block';SFX.tick();}}
    else{el.style.display='none';el.textContent='';state='play';startRound();}
  }
  else if(state==='play'){
    if(mode==='demo')botThink();
    const el=$('count');
    if(phase==='quiz'){const n=QUIZ-Math.floor(phaseT);if(n>0&&quizN!==n){quizN=n;msg(UI[lang].q+'  '+n);SFX.tick();}
      if(phaseT>=QUIZ){quizN=0;reveal();}}
    else if(phase==='melt'){if(phaseT>=FLIP+MELT)finishRound();}
    else if(phase==='result'){if(phaseT>=RESULT){for(const c of cells)if(c.type==='rock')c.sinkT=tNow;resetFloor();}}
    else if(phase==='reset'){for(const c of cells)if(c.type==='rock')c.sink=Math.min(1,phaseT/RESET);
      if(phaseT>=RESET){if(roundNo>=rounds)endGame();else startRound();}}
  }
  render(dt);
  requestAnimationFrame(frame);
}

function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const cam=mode==='camera'&&camOK&&state!=='menu'&&state!=='over';
  if(cam){ctx.fillStyle='#2a2033';ctx.fillRect(0,0,W,H);if(video.readyState>=2)drawVid(video);}
  else drawRoom(ctx,W,H);
    drawLava(setupMode?.6:1);
  const order=cells.slice().sort((a,b)=>a.v-b.v||a.u-b.u);
  if(setupMode){for(const c of order){const t=c.type;c.type='rock';c.t0=-9;c.sink=0;drawTileGhost(c);c.type=t;}}
  else{
    // draw tiles and demo players far → near so nearer things overlap
    const items=order.map(c=>({v:c.v+.45,c}));
    if(mode==='demo'&&(state==='play'||state==='count'))for(const p of players)items.push({v:p.v+.5,p});
    items.sort((a,b)=>a.v-b.v);
    for(const it of items){if(it.c){if(it.c.type!=='lava')drawTile(it.c);}else drawBean(it.p);}
  }
  if(cam&&cutA.width){drawVid(cutA);drawVid(cutB);}
  if(cam&&(state==='play'||state==='count'||state==='ready'))for(const p of players){ // a little colour star above each child
    if(!p.headPt||p.mask<0)continue;const s=Math.max(12,Math.min(30,(p.px||60)*.25));ctx.save();ctx.translate(p.headPt.x,p.headPt.y-s);sticker(ctx,starPath(s),p.color,3);ctx.restore();}
  // effects
  for(let i=steam.length-1;i>=0;i--){const s=steam[i];s.life-=dt;if(s.life<=0){steam.splice(i,1);continue;}s.y+=s.vy*dt;s.x+=Math.sin(tNow*3+i)*.4;const k=1-s.life/s.max;
    ctx.save();ctx.globalAlpha=Math.min(s.soft?.55:.85,s.life*1.2);sticker(ctx,ell(s.x,s.y,s.r*(1+k),s.r*(.8+k*.8)),'#FFFFFF',2);ctx.restore();}
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.life-=dt;if(p.life<=0){sparks.splice(i,1);continue;}p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=Math.min(1,p.life*1.6);sticker(ctx,starPath(10),'#FFD84D',2);ctx.restore();}
  for(let i=labels.length-1;i>=0;i--){const l=labels[i],k=(tNow-l.t)/1.6;if(k>=1){labels.splice(i,1);continue;}
    const f=Math.max(18,Math.min(34,W*.05)),y=Math.max(150,l.y-k*30);ctx.save();ctx.globalAlpha=k<.8?1:(1-k)/.2;ctx.font=`900 ${f}px Grandstander,Fredoka,sans-serif`;ctx.textAlign='center';
    ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.strokeText(l.txt,l.x,y);ctx.fillStyle=l.color;ctx.fillText(l.txt,l.x,y);ctx.restore();}
  drawOverlay();
  if(setupMode){
    const pts=[0,1,2,3].map(handlePos);ctx.save();ctx.setLineDash([10,8]);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();ctx.restore();
    pts.forEach((p,i)=>{const r=drag===i?30:26;ctx.fillStyle='rgba(43,33,24,.3)';ctx.fill(ell(p.x,p.y+6,r,r*.5));sticker(ctx,ell(p.x,p.y,r,r*.8),'#B9A794',4);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fill(ell(p.x-r*.3,p.y-r*.3,r*.3,r*.15));});
  }
}
/* while showing on a big screen, the messages and scores are drawn into the picture itself so the TV gets them too */
function bubble(txt,cx,cy,f,fill='#fff',big=false){
  ctx.save();ctx.font=`${big?900:700} ${f}px ${big?'Grandstander,':''}Fredoka,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(txt).width+f*1.4,h=f*1.9,p=new Path2D();p.roundRect(cx-w/2,cy-h/2,w,h,h/2);
  ctx.fillStyle=INK;ctx.translate(0,4);ctx.fill(p);ctx.translate(0,-4);sticker(ctx,p,fill,3);ctx.fillStyle=INK;ctx.fillText(txt,cx,cy+1);ctx.restore();
}
function drawOverlay(){
  if(!casting)return;const f=Math.max(16,Math.min(26,W*.03)),top=70;
  if($('hud').classList.contains('on')){bubble((lang==='he'?'סבב ':'Round ')+$('round').textContent,W*.12,top,f*.8);bubble('★ '+score,W/2,top,f);}
  if(msgNow)bubble(msgNow,W/2,top+f*3.2,f);
  const c=$('count');if(c.style.display==='block'&&c.textContent){ctx.save();const F=Math.min(H*.25,120);ctx.font=`900 ${F}px Grandstander,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=F*.08;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.strokeText(c.textContent,W/2,H*.48);ctx.fillStyle='#fff';ctx.fillText(c.textContent,W/2,H*.48);ctx.restore();}
  const lv=$('lvl');if(lv.classList.contains('on')){ctx.save();const F=Math.min(44,W*.06);ctx.font=`900 ${F}px Grandstander,sans-serif`;ctx.textAlign='center';ctx.lineWidth=F*.14;ctx.strokeStyle=INK;ctx.lineJoin='round';
    ctx.strokeText(lv.textContent,W/2,top+f*6);ctx.fillStyle='#FFD84D';ctx.fillText(lv.textContent,W/2,top+f*6);ctx.restore();}
}
function drawTileGhost(c){ctx.save();ctx.globalAlpha=.55;const lw=2;slab(c,.42,.0,'#B9A794','#7D6A58',lw);ctx.restore();}

setLang(lang);loadBest();
requestAnimationFrame(frame);
</script>
