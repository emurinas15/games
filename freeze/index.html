<script type="module">

/* Freeze & Copy — v2 "animal statues" (14 Nov 2026, Edgar).
   Raise a hand to spin the animal wheel. The animal it lands on dances, shouts "Freeze!" and turns into a statue
   in its pose; the players copy the statue. Later spins can be MIX-UPS: the top half of one animal glued to the
   bottom half of another (seated: left arm of one, right arm of the other), with a silly mixed name.
   1 player: copy before the time runs out. 2 players: a race — first to hold the copy wins the spin.
   Legal design notes (see project doc IP-CHECK.md): target poses are only the game's own drawn animals, stored as
   joint angles (never a player's captured pose, never a photo); one ordinary camera, 2D angles; ONE tolerance for
   every limb segment (no per-body-part weighting); the statue is shown on its own pedestal, not over the player. */

const UI={
 en:{title:"Freeze & Copy",sub:"Spin the animal wheel, watch it freeze — and copy the statue!",play:"Play",
  privacy:"The camera is used only to play. Nothing is recorded or sent.",grown:"For grown-ups",
  g1:"Raise a hand to spin the wheel. The animal dances, freezes into a funny pose, and you copy it — hold the copy until the jar fills. After a few spins come mix-ups: half one animal, half another. 8 spins a game. One player plays against the clock; two players race to copy first.",
  body:"Body",full:"Standing",seated:"Seated",who:"Players",solo:"One",duo:"Two",strict:"Copy",easy:"Easy",medium:"Medium",hard:"Hard",
  music:"Music",sfx:"Sound effects",on:"On",off:"Off",mute:"Sound on or off",
  g2:"★ Standing: phone upright, about 2.5–3 m away, so the whole body is seen. Seated: arms and trunk only; the phone can be closer, about 1–1.5 m.",

  great:["Great copy!","Perfect!","You're a statue!","Nailed it!"],miss:["Hehe, too tricky!","Almost!","Next one!"],winL:"← Blue wins!",winR:"Pink wins! →",

 he:{title:"קופאים ומעתיקים",sub:"מסובבים את גלגל החיות, החיה קופאת — ומעתיקים את הפסל!",play:"שחקו",

  body:"גוף",full:"עמידה",seated:"ישיבה",who:"שחקנים",solo:"אחד",duo:"שניים",strict:"העתקה",easy:"קל",medium:"בינוני",hard:"קשה",

  ready:"מתכוננים…",two:"שני שחקנים, זה לצד זה!",raise:"הרימו יד כדי לסובב!",mix:"ערבוב!",freeze:"קופאים!",copy:"תעתיקו אותי!",
  great:["העתקה מעולה!","מושלם!","אתם פסל!","בול!"],miss:["חחח, קשה מדי!","כמעט!","הבא!"],winL:"← הכחול ניצח!",winR:"הוורוד ניצח! →",
  spin:"סיבוב",left:"שנ׳",blue:"כחול",pink:"ורוד",tie:"תיקו!",nobody:"היכנסו מול המצלמה!",
  nocam:"אין כאן מצלמה — המשחק הזה צריך מצלמה.",aria:"אזור המשחק"}
};

const SPINS=8,TOL={easy:40,medium:31,hard:23};
let lang=LS.get('bamboo-lang','en'); if(!UI[lang])lang='en';
let bodyMode=LS.get('fc-body','full'); if(!['full','seated'].includes(bodyMode))bodyMode='full';
let who=LS.get('fc-who3','solo'); if(!['solo','duo'].includes(who))who='solo';
let strict=LS.get('fc-strict','medium'); if(!TOL[strict])strict='medium';
let best=0; const bestKey=()=>'fc2-best-'+bodyMode+strict; const loadBest=()=>{best=+LS.get(bestKey(),'0')||0;};
S.track='dance'; S.amb='none'; S.ambOn=false;
const syncSound=bindSound(()=>UI[lang]);
setupCast({canvas:$('c'),button:$('cast'),lang:()=>lang,sound:()=>(audio(),S),onChange:()=>{}});

function segs(){
  const u=UI[lang],mark=(id,v)=>document.querySelectorAll('#'+id+' button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.v===String(v));});
  for(const id of ['body-seg','who-seg','strict-seg'])document.querySelectorAll('#'+id+' button').forEach(b=>b.textContent=u[b.dataset.v]);
  mark('body-seg',bodyMode);mark('who-seg',who);mark('strict-seg',strict);
}
let lastNew=false;
function setLang(l){
  lang=l;LS.set('bamboo-lang',l);const u=UI[l];
  document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';document.querySelector('.top').dir='ltr';
  for(const k of ['title','sub','play','privacy','grown','g1','body','who','strict','music','sfx','g2','g3','g4','legal','sec2','again'])
    {const e=$('t-'+k);if(e)e.textContent=u[k];}
  $('t-privacy2').textContent=u.privacy;
  $('lang-en').setAttribute('aria-pressed',l==='en');$('lang-he').setAttribute('aria-pressed',l==='he');
  $('c').setAttribute('aria-label',u.aria);
  segs();syncSound();if(!$('end').hidden)fillEnd(lastNew);
}
$('lang-en').onclick=()=>setLang('en');$('lang-he').onclick=()=>setLang('he');
const segBind=(id,fn)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{fn(b.dataset.v);loadBest();segs();});
segBind('body-seg',v=>{bodyMode=v;LS.set('fc-body',v);});
segBind('who-seg',v=>{who=v;LS.set('fc-who3',v);});
segBind('strict-seg',v=>{strict=v;LS.set('fc-strict',v);});

/* ================= CANVAS ================= */
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',resize);resize();
function toast(t,ms=4000){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.tm);if(ms)toast.tm=setTimeout(()=>e.classList.remove('on'),ms);}

/* ================= SOUND ================= */
const FX={
  great(){[784,988,1175,1568].forEach((f,i)=>tone({f0:f,dur:.25,type:'triangle',vol:.32,at:i*.07}));},
  nope(){tone({f0:420,f1:300,dur:.25,type:'triangle',vol:.16});},
  fill(p){tone({f0:500+p*600,dur:.06,type:'sine',vol:.08});},
  whoosh(){noise({dur:.35,freq:1400,vol:.12,type:'bandpass'});},
  freeze(){noise({dur:.25,freq:5000,vol:.12,type:'highpass'});[2093,2637,3136].forEach((f,i)=>tone({f0:f,dur:.18,type:'sine',vol:.1,at:.05+i*.05}));},
  tick(){tone({f0:1300,dur:.03,type:'triangle',vol:.1});},
  giggle(){[0,1,2,3].forEach(i=>tone({f0:700+i*60,f1:900+i*60,dur:.07,type:'triangle',vol:.12,at:i*.09}));}
};

/* ================= CAMERA + POSE TRACKING (on device) ================= */
const video=$('v');
let tracker=null,camOK=false,lastVT=-1,people=[];   // people: [{lm:[{x,y,v}] in screen px, raw, nose, sw}]
const vmap=()=>{const vw=video.videoWidth||640,vh=video.videoHeight||480,s=Math.max(W/vw,H/vh);return {vw,vh,s,ox:(W-vw*s)/2,oy:(H-vh*s)/2};};
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();
  const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts=(d,k)=>({baseOptions:{modelAssetPath:`https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${k}/float16/1/pose_landmarker_${k}.task`,delegate:d},
    runningMode:'VIDEO',numPoses:2,minPoseDetectionConfidence:.45,minPosePresenceConfidence:.45,minTrackingConfidence:.45});
  let err=null;
  for(const [d,k] of [['GPU','full'],['GPU','lite'],['CPU','lite']]){try{tracker=await vision.PoseLandmarker.createFromOptions(files,opts(d,k));break;}catch(e){err=e;}}
  if(!tracker)throw err||new Error('model');
  camOK=true;
}
function track(now){
  if(!tracker||video.readyState<2||video.currentTime===lastVT)return;lastVT=video.currentTime;
  let res;try{res=tracker.detectForVideo(video,now);}catch(e){return;}
  const m=vmap(),L=res.landmarks||[];
  const ps=L.map(lm=>{const pts=lm.map(p=>({x:m.ox+(1-p.x)*m.vw*m.s,y:m.oy+p.y*m.vh*m.s,v:p.visibility??1}));
    return {lm:pts,nose:pts[0],sw:Math.hypot(pts[11].x-pts[12].x,pts[11].y-pts[12].y)};}).filter(p=>p.lm[11].v>.4&&p.lm[12].v>.4);
  ps.sort((a,b)=>a.nose.x-b.nose.x);
  people=who==='solo'&&ps.length>1?[ps.reduce((a,b)=>b.sw>a.sw?b:a)]:ps;   // solo: the closest person
}

/* ================= POSES (screen-space angles, degrees: 0 = right, 90 = down, -90 = up) ================= */
// segments by screen side (mirrored picture): left arm = the arm whose shoulder is further left on screen
function sides(lm){const sL=lm[11].x<lm[12].x,hL=lm[23].x<lm[24].x;
  return {aL:sL?[11,13,15]:[12,14,16],aR:sL?[12,14,16]:[11,13,15],lL:hL?[23,25,27]:[24,26,28],lR:hL?[24,26,28]:[23,25,27]};}
const ARMS=['uaL','faL','uaR','faR'],LEGS=['thL','shL','thR','shR'];
function poseOf(p){
  const lm=p.lm,s=sides(lm),o={},ang=(a,b)=>(lm[a].v>.5&&lm[b].v>.5)?Math.atan2(lm[b].y-lm[a].y,lm[b].x-lm[a].x)*180/Math.PI:null;
  o.uaL=ang(s.aL[0],s.aL[1]);o.faL=ang(s.aL[1],s.aL[2]);o.uaR=ang(s.aR[0],s.aR[1]);o.faR=ang(s.aR[1],s.aR[2]);
  if(bodyMode==='full'){o.thL=ang(s.lL[0],s.lL[1]);o.shL=ang(s.lL[1],s.lL[2]);o.thR=ang(s.lR[0],s.lR[1]);o.shR=ang(s.lR[1],s.lR[2]);}
  return o;
}
const dAng=(a,b)=>Math.abs(((a-b+540)%360)-180);
// ONE tolerance for every segment; every visible arm segment must match, and at least 75% of all visible segments
function compare(T,P,tol){
  const keys=bodyMode==='full'?[...ARMS,...LEGS]:ARMS;let n=0,good=0,armsOk=true;const by={};
  for(const k of keys){if(T[k]==null||P[k]==null)continue;n++;const ok=dAng(T[k],P[k])<tol;by[k]=ok;if(ok)good++;else if(ARMS.includes(k))armsOk=false;}
  return {ok:n>=3&&armsOk&&good>=Math.ceil(n*.75),by,n};
}

/* ================= THE ANIMALS ================= */
// colours: body, light (belly/muzzle), hand/foot colour. Poses: arms + legs (screen-space angles)
const A=(id,en,he,body,light,feet,pose,line)=>({id,en,he,body,light,feet,pose,line});
const P=(uaL,faL,uaR,faR,thL=90,shL=90,thR=90,shR=90)=>({uaL,faL,uaR,faR,thL,shL,thR,shR});
const ANIMALS=[
  A('sprout','Sprout','נבט','#7DCB6B','#B6E59E','#6CC56B',P(-135,-135,-45,-45),{en:"Sunshine, everybody!",he:"שמש לכולם!"}),
  A('bear','Bear','דוב','#B07A4F','#E8C9A0','#8A5A36',P(150,40,30,140,110,100,70,80),{en:"Bear-y strong!",he:"דוב חזק!"}),
  A('crab','Crab','סרטן','#F06A5A','#FFB3A6','#F06A5A',P(180,-90,0,-90,140,95,40,85),{en:"Snip snap!",he:"קליק קלאק!"}),
  A('frog','Frog','צפרדע','#7DCB6B','#D8F2B8','#5DB04E',P(140,80,40,100,150,70,30,110),{en:"Ribbit squat!",he:"קוואק סקוואט!"}),
  A('flamingo','Flamingo','פלמינגו','#FF9FB0','#FFD3DC','#F28AA0',P(-165,-150,-15,-30,90,90,20,100),{en:"One leg, no wobbles!",he:"רגל אחת, בלי להתנדנד!"}),
  A('penguin','Penguin','פינגווין','#3E4C6E','#F7F3EA','#FF9A3D',P(110,115,70,65,85,85,95,95),{en:"Flap flap!",he:"פלאפ פלאפ!"}),
  A('bunny','Bunny','ארנב','#F3EEE4','#FFD3DC','#F3EEE4',P(-135,-25,-45,-155),{en:"Bunny ears!",he:"אוזני ארנב!"}),
  A('elephant','Elephant','פיל','#A9B4C2','#D6DDE6','#8E99A8',P(-170,-60,-10,-120,100,90,80,90),{en:"Flappy ears!",he:"אוזניים מנפנפות!"}),
  A('duck','Duck','ברווז','#FFD84D','#FFF1B8','#FF9A3D',P(150,30,30,150,100,80,80,100),{en:"Quack wings!",he:"כנפי קוואק!"}),
  A('spider','Spider','עכביש','#6B4E9B','#B9A3E0','#6B4E9B',P(-150,-150,-30,-30,120,120,60,60),{en:"Super star spider!",he:"עכביש כוכב!"})
];
const IDX=Object.fromEntries(ANIMALS.map((a,i)=>[a.id,i]));
// mixed name: first half of A + second half of B ("Frog"+"Flamingo" -> "Frmingo"... tuned to sound silly)
function mixName(a,b,l){const x=a[l],y=b[l];return x.slice(0,Math.max(2,Math.ceil(x.length*.6)))+y.slice(-Math.max(2,Math.ceil(y.length*.6)));}   // Frog+Flamingo -> Fromingo
// a target = {top: animal (head/body/arms or left arm), bot: animal (legs or right arm), pose, name}
function makeTarget(a,b){
  const pa=ANIMALS[a].pose,pb=ANIMALS[b??a].pose,pose={...pa};
  if(b!=null){ if(bodyMode==='full'){for(const k of LEGS)pose[k]=pb[k];} else {pose.uaR=pb.uaR;pose.faR=pb.faR;} }
  if(bodyMode!=='full')for(const k of LEGS)pose[k]=90;
  return {a,b:b??a,pose,mix:b!=null&&b!==a};
}

/* draw a sticker animal statue in the pose. (x,y) = centre of the body, s = size (about the body height) */
function drawAnimal(T,x,y,s,t,o={}){
  const top=ANIMALS[T.a],bot=ANIMALS[T.b],pose=o.pose||T.pose,lw=Math.max(2.5,s*.03);
  const legC=bodyMode==='full'?bot:top,armR=(bodyMode!=='full'&&T.mix)?bot:top;
  ctx.save();ctx.translate(x,y+(o.hop||0));
  const sh={L:{x:-s*.25,y:-s*.2},R:{x:s*.25,y:-s*.2}},hp={L:{x:-s*.15,y:s*.3},R:{x:s*.15,y:s*.3}};
  const R=a=>a*Math.PI/180,seg=(p,a,len)=>({x:p.x+Math.cos(R(a))*len,y:p.y+Math.sin(R(a))*len});
  const limb=(p,a1,a2,l1,l2,w,col,end,endCol)=>{const e=seg(p,a1,l1),h=seg(e,a2,l2);
    ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=INK;ctx.lineWidth=w+lw*2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(e.x,e.y);ctx.lineTo(h.x,h.y);ctx.stroke();
    ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();end(h,a2,endCol);};

  const foot=(h,a,c)=>sticker(ctx,ell(h.x,h.y+s*.02,s*.11,s*.055),c,lw);
  const legW=legC.id==='flamingo'?s*.05:s*.11,arm=a=>a.id==='crab'?claw:mitt;
  // legs
  if(bodyMode==='full'){limb(hp.L,pose.thL,pose.shL,s*.34,s*.32,legW,legC.body,foot,legC.feet);limb(hp.R,pose.thR,pose.shR,s*.34,s*.32,legW,legC.body,foot,legC.feet);}
  else{sticker(ctx,ell(0,s*.42,s*.36,s*.1),bot.feet,lw);}
  // spider: extra little legs out of the body
  if(top.id==='spider')for(const d of [-1,1])for(let i=0;i<3;i++){const yy=-s*.05+i*s*.12;ctx.strokeStyle=INK;ctx.lineWidth=s*.035+lw*2;ctx.beginPath();ctx.moveTo(d*s*.22,yy);ctx.quadraticCurveTo(d*s*.42,yy-s*.12,d*s*.48,yy+s*.06);ctx.stroke();ctx.strokeStyle=top.body;ctx.lineWidth=s*.035;ctx.stroke();}

}
function drawHead(a,x,y,r,lw,t,o){
  const id=a.id;
  // things behind the head
  if(id==='bunny')for(const d of [-1,1]){sticker(ctx,ell(x+d*r*.45,y-r*1.25,r*.28,r*.75,d*.15),a.body,lw);ctx.fillStyle='#FFB3C4';ctx.fill(ell(x+d*r*.45,y-r*1.2,r*.13,r*.55,d*.15));}
  if(id==='bear')for(const d of [-1,1]){sticker(ctx,ell(x+d*r*.75,y-r*.75,r*.3,r*.3),a.body,lw);ctx.fillStyle=a.light;ctx.fill(ell(x+d*r*.75,y-r*.75,r*.15,r*.15));}
  if(id==='elephant')for(const d of [-1,1]){const fl=Math.sin(t*6)*.08*(o.dance||0);sticker(ctx,ell(x+d*r*1.05,y+r*.05,r*.62,r*.78,d*(.2+fl)),a.body,lw);ctx.fillStyle='#F7C6D0';ctx.fill(ell(x+d*r*1.05,y+r*.08,r*.38,r*.52,d*.2));}
  if(id==='crab')for(const d of [-1,1]){ctx.strokeStyle=INK;ctx.lineWidth=lw*2.6;ctx.beginPath();ctx.moveTo(x+d*r*.35,y-r*.6);ctx.lineTo(x+d*r*.45,y-r*1.15);ctx.stroke();ctx.strokeStyle=a.body;ctx.lineWidth=lw*1.2;ctx.stroke();}
  if(id==='sprout')for(const [d,c] of [[-1,'#7CC86B'],[1,'#8BD16B']]){ctx.save();ctx.translate(x+d*r*.3,y-r*.85);ctx.rotate(d*.6-.0);const p=new Path2D();p.moveTo(0,0);p.quadraticCurveTo(d*r*.4,-r*.5,d*r*.1,-r*.95);p.quadraticCurveTo(-d*r*.25,-r*.45,0,0);sticker(ctx,p,c,lw*.8);ctx.restore();}
  // head
  sticker(ctx,ell(x,y,r,r*(id==='penguin'?1.05:.95)),a.body,lw);
  if(id==='penguin')sticker(ctx,ell(x,y+r*.15,r*.68,r*.62),a.light,lw*.6);
  if(id==='frog')for(const d of [-1,1])sticker(ctx,ell(x+d*r*.5,y-r*.75,r*.34,r*.32),a.body,lw);
  // eyes
  const blink=(Math.sin(t*1.7+a.id.length)>.97)?.15:1,ey=id==='frog'?y-r*.78:y-r*.12,ex=id==='frog'?r*.5:r*.36,er=id==='frog'?r*.2:r*.17;
  const eyes=id==='spider'?[[-.42,-.25,.11],[-.15,-.32,.13],[.15,-.32,.13],[.42,-.25,.11]]:[[-1,0,1],[1,0,1]];
  if(id==='spider'){for(const [dx,dy,rr] of eyes){sticker(ctx,ell(x+dx*r,y+dy*r,r*rr*1.25,r*rr*1.25*blink),'#fff',lw*.5);ctx.fillStyle=INK;ctx.fill(ell(x+dx*r,y+dy*r,r*rr*.6,r*rr*.6*blink));}}
  else for(const d of [-1,1]){const cx=x+d*ex,cy=id==='crab'?y-r*1.2:ey;
    if(o.happy){ctx.strokeStyle=INK;ctx.lineWidth=lw;ctx.beginPath();ctx.arc(cx,cy+er*.3,er*.75,Math.PI*1.1,Math.PI*1.9);ctx.stroke();continue;}
    if(id==='frog')sticker(ctx,ell(cx,cy,er*1.3,er*1.3),'#fff',lw*.6);
    ctx.fillStyle=INK;ctx.fill(ell(cx,cy,er*.75,er*.95*blink));ctx.fillStyle='#fff';ctx.fill(ell(cx+er*.25,cy-er*.3,er*.3,er*.3*blink));}
  // cheeks
  ctx.fillStyle='rgba(255,130,150,.6)';for(const d of [-1,1])ctx.fill(ell(x+d*r*.62,y+r*.22,r*.17,r*.1));
  // snout / beak / trunk / mouth
  if(id==='duck'||id==='penguin'){sticker(ctx,ell(x,y+r*.28,r*.34,r*.15),'#FF9A3D',lw*.7);}
  else if(id==='flamingo'){const p=new Path2D();p.moveTo(x-r*.2,y+r*.15);p.quadraticCurveTo(x+r*.35,y+r*.05,x+r*.3,y+r*.55);p.quadraticCurveTo(x+r*.05,y+r*.35,x-r*.2,y+r*.35);p.closePath();sticker(ctx,p,'#FFF1E0',lw*.7);ctx.fillStyle=INK;ctx.fill(ell(x+r*.28,y+r*.47,r*.07,r*.09));}
  else if(id==='elephant'){const sw=Math.sin(t*4)*r*.2*(o.dance||0);const p=new Path2D();p.moveTo(x-r*.16,y+r*.1);p.quadraticCurveTo(x-r*.2+sw,y+r*.9,x+r*.05+sw,y+r*1.05);p.quadraticCurveTo(x+r*.2+sw,y+r*1.0,x+r*.12+sw,y+r*.92);p.quadraticCurveTo(x+r*.05,y+r*.6,x+r*.16,y+r*.1);p.closePath();sticker(ctx,p,a.body,lw*.8);}
  else if(id==='bear'){sticker(ctx,ell(x,y+r*.32,r*.32,r*.24),a.light,lw*.6);ctx.fillStyle=INK;ctx.fill(ell(x,y+r*.24,r*.11,r*.08));}
  if(!['duck','penguin','flamingo','elephant'].includes(id)||o.happy){ctx.strokeStyle=INK;ctx.lineWidth=lw*.8;ctx.beginPath();
    if(o.happy){const m=new Path2D();m.moveTo(x-r*.22,y+r*.42);m.quadraticCurveTo(x,y+r*.78,x+r*.22,y+r*.42);m.closePath();sticker(ctx,m,'#E2564A',lw*.6);}
    else{ctx.arc(x,y+(id==='frog'?r*.2:r*.4),r*(id==='frog'?.45:.18),.15*Math.PI,.85*Math.PI);ctx.stroke();}}
}

/* ================= GAME ================= */
let state='menu',phase='',phaseT=0,tNow=0,countT=0,spinN=0,score=[0,0],target=null,lastPicks=[],meters=[0,0],winner=-1,bigMsg='',bigMsgT=0,pops=[],frost=[],fillTick=0,lastMatch=[];
let guide=null,awayT=0;
function say(t,dur=1.6){bigMsg=t;bigMsgT=tNow+dur;}
function setPhase(p){phase=p;phaseT=0;}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const copyTime=()=>Math.max(6,10-spinN*.6), holdTime=()=>Math.min(1.6,.9+spinN*.1);

/* the animal wheel: spins until a hand goes up, then always brakes over exactly 3 s (same braking every time) */
const WH_W=Math.PI*2*.6,WH_STOP=3,NS=ANIMALS.length;
const WH={ang:0,stopT:-1,ang0:0,raise:0,up:false,lastSlice:-1,auto:false,result:-1};
function wheelStart(auto){Object.assign(WH,{stopT:auto?0:-1,ang0:WH.ang,raise:0,up:false,auto,result:-1});if(auto)WH.ang0=WH.ang+Math.random()*Math.PI*2;}
const sliceAt=a=>{const r=((-Math.PI/2-a)%(Math.PI*2)+Math.PI*4)%(Math.PI*2);return Math.floor(r/(Math.PI*2/NS));};
const handUp=p=>{const l=p.lm;return [15,16].some(i=>l[i].v>.5&&l[i].y<l[0].y-p.sw*.15);};
function wheelUpdate(dt){
  if(WH.stopT<0){WH.ang+=WH_W*dt;WH.up=people.some(handUp);WH.raise=WH.up?WH.raise+dt:0;if(WH.raise>.25){WH.stopT=0;WH.ang0=WH.ang;FX.whoosh();}}
  else if(WH.result<0){WH.stopT+=dt;const T=WH.auto?1.8:WH_STOP,t2=Math.min(WH.stopT,T);WH.ang=WH.ang0+WH_W*(t2-t2*t2/(2*T))*(WH.auto?1.4:1);
    if(WH.stopT>=T){let r=sliceAt(WH.ang);
      while(lastPicks.includes(r)){ // never the same animal as the last two: nudge the wheel one slice on
        r=(r+1)%NS;WH.ang-=Math.PI*2/NS;}
      WH.result=r;WH.stopT=0;}}
  else WH.stopT+=dt;   // after it stops: time to look at the result
  const sl=sliceAt(WH.ang);if(sl!==WH.lastSlice){if(WH.lastSlice>=0&&WH.stopT>=0&&WH.result<0)FX.tick();WH.lastSlice=sl;}
}

async function play(){
  audio();SFX.go();
  $('start').hidden=true;$('end').hidden=true;
  if(!camOK){say(UI[lang].ready,99);state='loading';
    try{await startCam();}catch(e){console.warn(e);state='menu';bigMsg='';$('start').hidden=false;toast(UI[lang].nocam,6000);return;}}
  bigMsg='';score=[0,0];spinN=0;lastPicks=[];target=null;pops=[];loadBest();
  $('stopx').classList.add('on');musicStart();
  guide=who==='duo'?null:makeGuide(bodyMode==='full'?'full':'body');if(guide)guide.reset();
  state='setup';
}
$('play').onclick=play;$('again').onclick=play;
$('stopx').onclick=()=>endGame(true);
function endGame(quit){
  state='over';musicStop();$('stopx').classList.remove('on');if(guide)guide.hide();target=null;
  if(quit){state='menu';$('start').hidden=false;return;}
  const sc=who==='duo'?Math.max(score[0],score[1]):score[0];
  lastNew=who==='solo'&&sc>best;if(lastNew){best=sc;LS.set(bestKey(),String(sc));}
  fillEnd(lastNew);$('end').hidden=false;SFX.chime();
}
function fillEnd(nb){const u=UI[lang];$('newbest').hidden=!nb;$('newbest').textContent=u.newbest;
  if(who==='duo'){$('final').textContent=score[0]+' – '+score[1];$('t-over').textContent=score[0]===score[1]?u.tie:(score[0]>score[1]?u.winL:u.winR);$('best-line').textContent='';}
  else{$('final').textContent=score[0]+u.of+SPINS;$('t-over').textContent=u.over[Math.min(3,Math.floor(score[0]/2.1))];$('best-line').textContent=u.bestis+best;}}

function nextSpin(){ if(spinN>=SPINS){endGame(false);return;} state='play';setPhase('spin');wheelStart(false);target=null;meters=[0,0];winner=-1; }

let last=performance.now();
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;tNow+=dt;
  if(camOK)track(now);
  const u=UI[lang];
  if(state==='setup'){
    if(guide){const p=people[0];if(guide.update(dt,p?{x:p.nose.x,y:p.nose.y,size:p.sw}:null,{x:0,y:0,w:W,h:H})==='done'){state='count';countT=tNow;}}
    else{ if(people.length>=2){awayT+=dt;if(awayT>1){state='count';countT=tNow;awayT=0;}}else awayT=0; }
  }
  else if(state==='count'){ if(tNow-countT>=3)nextSpin(); }
  else if(state==='play'){
    phaseT+=dt;
    if(phase==='spin'){ wheelUpdate(dt);
      if(WH.result>=0&&WH.stopT>.8){ const a=WH.result;lastPicks=[a,...lastPicks].slice(0,2);
        if(spinN>=3&&Math.random()<.6){ target={a,b:null};setPhase('mix');say(u.mix,1.2);FX.giggle();wheelStart(true);}
        else{ target=makeTarget(a);setPhase('show');SFX.boing(); } } }
    else if(phase==='mix'){ if(phaseT>1.1){ wheelUpdate(dt);
      if(WH.result>=0&&WH.stopT>.6){let b=WH.result;if(b===target.a)b=(b+1)%NS;target=makeTarget(target.a,b);setPhase('show');SFX.boing();} } }
    else if(phase==='show'){ // the animal dances, then snaps into the statue
      if(phaseT>1.4&&!target.frozen){target.frozen=true;FX.freeze();say(u.freeze,.9);for(let i=0;i<18;i++)frost.push({a:Math.random()*6.3,r:0,v:.6+Math.random(),life:1});}
      if(phaseT>2.2){setPhase('copy');meters=[0,0];spinN++;} }
    else if(phase==='copy'){
      const n=who==='duo'?2:1;lastMatch=[];
      for(let i=0;i<n;i++){const p=who==='duo'?people[i]:people[0];
        if(p){const r=compare(target.pose,poseOf(p),TOL[strict]);lastMatch[i]={r,p};
          if(r.ok){meters[i]=Math.min(1,meters[i]+dt/holdTime());fillTick+=dt;if(fillTick>.2){fillTick=0;FX.fill(meters[i]);}}
          else meters[i]=Math.max(0,meters[i]-dt*.4);}
        else meters[i]=Math.max(0,meters[i]-dt*.4);
        if(meters[i]>=1&&winner<0)winner=i;}
      if(winner>=0){score[who==='duo'?winner:0]++;FX.great();say(who==='duo'?(winner?u.winR:u.winL):pick(u.great),1.4);
        for(let k=0;k<14;k++)pops.push({x:W/2,y:H*.3,vx:(Math.random()-.5)*W*.8,vy:-H*(.3+Math.random()*.5),life:1.2});setPhase('cheer');}
      else if(phaseT>copyTime()){say(pick(u.miss),1.4);FX.giggle();setPhase('laugh');} }
    else if(phase==='cheer'||phase==='laugh'){ if(phaseT>1.6)nextSpin(); }
  }
  render(dt);
  requestAnimationFrame(frame);
}

function drawMirrored(){const m=vmap();ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,W-m.ox-m.vw*m.s,m.oy,m.vw*m.s,m.vh*m.s);ctx.restore();}
function bubble(txt,x,y,fs,fill='#fff'){
  ctx.save();ctx.font=`700 ${fs}px Fredoka,sans-serif`;ctx.direction=lang==='he'?'rtl':'ltr';ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(txt).width+fs*1.4,h=fs*1.9;
  ctx.fillStyle=INK;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2+4,w,h,h/2);ctx.fill();
  ctx.fillStyle=fill;ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,h/2);ctx.fill();ctx.stroke();
  ctx.fillStyle=INK;ctx.fillText(txt,x,y+1);ctx.restore();
}
function bigText(txt,x,y,fs,col='#FFD84D',sc=1){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.font=`900 ${fs}px Grandstander,Fredoka,sans-serif`;ctx.direction=lang==='he'?'rtl':'ltr';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=fs*.14;ctx.strokeStyle=INK;ctx.fillStyle=INK;ctx.fillText(txt,0,fs*.08);ctx.strokeText(txt,0,0);ctx.fillStyle=col;ctx.fillText(txt,0,0);ctx.restore();

// the statue stage: a rounded card at the top, with a pedestal (kept apart from the player's picture)
function stageRect(){const land=W>H*1.1,h=land?H*.42:Math.min(H*.3,W*.62),w=Math.min(W*.5,h*1.05);return {x:W/2-w/2,y:60+(land?6:0),w,h};}
function animalName(T){if(!T.mix)return ANIMALS[T.a][lang];return mixName(ANIMALS[T.a],ANIMALS[T.b],lang);}
function drawStage(){
  if(!target||!target.pose)return;const R=stageRect(),s=R.h*.6,cx=R.x+R.w/2,cy=R.y+R.h*.5;
  ctx.save();ctx.fillStyle='rgba(255,248,236,.86)';ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(R.x,R.y,R.w,R.h,24);ctx.fill();ctx.stroke();
  // pedestal
  sticker(ctx,(()=>{const p=new Path2D();p.roundRect(cx-s*.5,R.y+R.h-s*.16,s,s*.13,8);return p;})(),'#E9DCC6',3);
  ctx.save();const p=new Path2D();p.roundRect(R.x,R.y,R.w,R.h,24);ctx.clip(p);
  const frozen=phase!=='show'||target.frozen,happy=phase==='cheer'||phase==='laugh';
  let pose=target.pose,hop=0,dance=0;
  if(!frozen||happy){ // dancing: arms wave around the target, a little hop
    const w=Math.sin(tNow*9)*40,v=Math.cos(tNow*9)*25;pose={...target.pose,uaL:target.pose.uaL+w,faL:target.pose.faL+v,uaR:target.pose.uaR-w,faR:target.pose.faR-v};
    hop=-Math.abs(Math.sin(tNow*9))*s*.06;dance=1;}
  const d=s*.8,ped=R.y+R.h-s*.16,ay=bodyMode==='full'?ped-.98*d:ped-.55*d;
  drawAnimal(target,cx,ay,d,tNow,{pose,hop,dance,happy});
  if(frozen&&!happy){ // icy statue shine
    ctx.fillStyle='rgba(190,230,255,.28)';ctx.fillRect(R.x,R.y,R.w,R.h);
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;for(let i=0;i<3;i++){const x0=cx-s*.4+i*s*.32,y0=R.y+R.h*.25+((tNow*30+i*40)%(R.h*.4));ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0+10,y0-10);ctx.stroke();}}
  ctx.restore();
  // frost burst
  frost=frost.filter(f=>(f.life-=.02)>0);for(const f of frost){f.r+=f.v*6;ctx.save();ctx.translate(cx+Math.cos(f.a)*f.r*s*.04,cy+Math.sin(f.a)*f.r*s*.04);ctx.globalAlpha=f.life;sticker(ctx,starPath(7),'#DDF3FF',2);ctx.restore();}

function drawWheel(){
  const u=UI[lang],cx=W/2,cy=H*.46,Rr=Math.min(W,H)*.28,seg=Math.PI*2/NS,cols=['#FFF1B8','#D8F2B8','#FFD3DC','#DDF3FF','#F3EEE4'];
  ctx.save();ctx.translate(cx,cy);
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(0,6,Rr+8,0,7);ctx.fill();
  for(let j=0;j<NS;j++){const a0=WH.ang+j*seg,a1=a0+seg,res=WH.result>=0&&j===WH.result;
    ctx.save();ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,Rr,a0,a1);ctx.closePath();ctx.fillStyle=WH.result>=0&&!res?'#E6E1D8':cols[j%cols.length];ctx.fill();ctx.clip();
    const am=a0+seg/2,fx=Math.cos(am)*Rr*.66,fy=Math.sin(am)*Rr*.66;
    ctx.translate(fx,fy);ctx.rotate(am+Math.PI/2);drawHead(ANIMALS[j],0,0,Rr*.13,2.5,tNow,{});ctx.restore();
    ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a0)*Rr,Math.sin(a0)*Rr);ctx.stroke();}
  ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(0,0,Rr,0,7);ctx.stroke();
  sticker(ctx,ell(0,0,Rr*.12,Rr*.12),'#FFD84D',4);
  ctx.fillStyle='#FFD84D';ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-Rr*.11,-Rr-Rr*.16);ctx.lineTo(Rr*.11,-Rr-Rr*.16);ctx.lineTo(0,-Rr+Rr*.1);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();

  if(phase==='spin'&&WH.stopT<0){bubble('✋ '+u.raise,W/2,Math.min(H*.9,cy+Rr+fs*2.4),fs,WH.up?'#E6F7DE':'#fff');}
  if(phase==='mix'&&target)bubble(ANIMALS[target.a][lang]+' + ?',W/2,Math.min(H*.9,cy+Rr+fs*2.4),fs,'#FFE3E8');
}
// the copy jar: one per player (blue left, pink right in two-player mode)
function drawMeter(i,x){
  const h=Math.min(H*.36,280),w=Math.max(34,h*.17),y=H*.6,m=meters[i];
  ctx.save();ctx.translate(x,y);
  const jar=new Path2D();jar.roundRect(-w/2,-h/2,w,h,w/2);
  ctx.fillStyle=INK;ctx.fill(new Path2D(jar));ctx.translate(0,-4);
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fill(jar);
  ctx.save();ctx.clip(jar);const top=h/2-h*m;ctx.fillStyle=m>=1?'#FFD84D':(who==='duo'?(i?'#FF9FB0':'#7FC8F8'):'#7DCB6B');ctx.beginPath();ctx.moveTo(-w/2,h/2);
  for(let k=0;k<=10;k++){const xx=-w/2+w*k/10;ctx.lineTo(xx,top+Math.sin(k*1.3+tNow*7)*3);}ctx.lineTo(w/2,h/2);ctx.closePath();ctx.fill();ctx.restore();
  ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke(jar);
  ctx.translate(0,-h/2-w*.55);ctx.rotate(Math.sin(tNow*2)*.1);sticker(ctx,starPath(w*.55),m>=1?'#FFD84D':'#FFF1B8',3);
  ctx.restore();
}
// soft dots on the player's elbows, hands, knees and feet: green when that part matches
function drawCopyDots(){
  for(const lmatch of lastMatch){if(!lmatch)continue;const {r,p}=lmatch,lm=p.lm,s=sides(lm),R=Math.max(9,p.sw*.09);
    const dots=[[s.aL[1],'uaL'],[s.aL[2],'faL'],[s.aR[1],'uaR'],[s.aR[2],'faR']];
    if(bodyMode==='full')dots.push([s.lL[1],'thL'],[s.lL[2],'shL'],[s.lR[1],'thR'],[s.lR[2],'shR']);
    for(const [i,n] of dots){const q=lm[i];if(q.v<.5||r.by[n]===undefined)continue;sticker(ctx,ell(q.x,q.y,R,R),r.by[n]?'#7DCB6B':'rgba(255,255,255,.9)',3);}}
}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const u=UI[lang],live=camOK&&video.readyState>=2&&state!=='menu'&&state!=='over';
  if(live){drawMirrored();ctx.fillStyle='rgba(255,248,236,.08)';ctx.fillRect(0,0,W,H);}
  else drawRoom(ctx,W,H);
  if(state==='menu'||state==='over'){drawDemo();return;}
  const fs=Math.max(18,Math.min(26,W*.045));
  if(state==='setup'){ if(guide)guide.draw(ctx,{x:0,y:0,w:W,h:H},lang); else bubble(u.two,W/2,H*.16,fs); }
  else if(state==='count'){const n=3-Math.floor(tNow-countT),k=(tNow-countT)%1;if(n>0)bigText(String(n),W/2,H*.42,Math.min(150,H*.22),'#fff',1+.25*Math.max(0,1-k*4));}
  else if(state==='play'){
    if(phase==='spin'||phase==='mix')drawWheel();
    else{drawStage();
      if(phase==='copy'||phase==='cheer'||phase==='laugh'){
        if(who==='duo'){drawMeter(0,18+25);drawMeter(1,W-18-25);}else drawMeter(0,18+25);
        if(phase==='copy'){drawCopyDots();const left=Math.ceil(copyTime()-phaseT);bubble('⏱ '+left,W/2,H-fs*2.2,fs,left<=3?'#FFE3E8':'#fff');}}
      if(phase==='show'&&!target.frozen){const ln=ANIMALS[target.a].line[lang];bubble(ln,W/2,stageRect().y+stageRect().h+fs*2.4,fs);}}
    // HUD: spin count and score(s)
    const hf=Math.max(16,Math.min(24,W*.042)),hy=H-hf*1.6;
    if(phase==='spin'||phase==='mix'){bubble(u.spin+' '+Math.min(SPINS,spinN+1)+' / '+SPINS,W*.5,64+hf*.2,hf);}
    if(who==='duo'){bubble(String(score[0]),36,64+hf*.2,hf,'#DDF3FF');bubble(String(score[1]),W-36,64+hf*.2,hf,'#FFE3E8');}
    else bubble('★ '+score[0],W-44,64+hf*.2,hf,'#E6F7DE');
  }
  if(bigMsg&&tNow<bigMsgT){const k=1-Math.max(0,bigMsgT-tNow-1.2)*4;bigText(bigMsg,W/2,H*.5,Math.min(64,W*.1),'#FFD84D',Math.max(.6,Math.min(1,k)));}
  pops=pops.filter(p=>(p.life-=dt)>0);
  for(const p of pops){p.vy+=H*1.2*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*5);ctx.globalAlpha=Math.min(1,p.life*2);sticker(ctx,starPath(12),'#FFD84D',2.5);ctx.restore();}
}
// menu: two animals take turns striking poses (bear and flamingo, then others)
function drawDemo(){
  const card=$('start').hidden?$('end'):$('start'),ct=card&&!card.hidden?card.getBoundingClientRect().top:H;
  const i=Math.floor(tNow/2.4)%NS,j=(i+4)%NS,k=(tNow%2.4)/2.4,s=Math.max(40,Math.min(W*.26,H*.2,(ct-120)/1.75)),y=Math.min(H*.6,ct-s*1.05);
  const ta=makeTarget(i),tb=makeTarget(j),wig=k<.35;
  const wave=T=>wig?{...T.pose,uaL:T.pose.uaL+Math.sin(tNow*9)*40,uaR:T.pose.uaR-Math.sin(tNow*9)*40}:T.pose;
  drawAnimal(ta,W/2-s*.75,y,s,tNow,{pose:wave(ta),dance:wig?1:0});
  drawAnimal(tb,W/2+s*.75,y,s,tNow,{pose:wave(tb),dance:wig?1:0});
}

setLang(lang);loadBest();
requestAnimationFrame(frame);
</script>
