const GAME_T=90,TOL={easy:31,medium:23,hard:16},MISS={easy:1,medium:1,hard:0};
let lang=LS.get('bamboo-lang','en'); if(!UI[lang])lang='en';
let bodyMode=LS.get('fc-body','full'); if(!['full','seated'].includes(bodyMode))bodyMode='full';
let who=LS.get('fc-who3','solo'); if(!['solo','duo'].includes(who))who='solo';
let strict=LS.get('fc-strict','medium'); if(!TOL[strict])strict='medium';
let best=0; const bestKey=()=>'fc4-best-'+bodyMode+strict;   /* new tiers -> new records */ const loadBest=()=>{best=+LS.get(bestKey(),'0')||0;};
S.track='dance'; S.amb='none'; S.ambOn=false;
const syncSound=bindSound(()=>UI[lang]);
setupCast({canvas:$('c'),button:$('cast'),lang:()=>lang,sound:()=>(audio(),S),onChange:()=>{}});

function segs(){
  const u=UI[lang],mark=(id,v)=>document.querySelectorAll('#'+id+' button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.v===String(v));});
  for(const id of ['body-seg','who-seg','strict-seg'])document.querySelectorAll('#'+id+' button').forEach(b=>b.textContent=u[b.dataset.v]);

}
let lastNew=false;
function setLang(l){
  lang=l;LS.set('bamboo-lang',l);const u=UI[l];
  document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';document.querySelector('.top').dir='ltr';

}

/* 20 Nov (Edgar): play until a number of statues instead of 90 seconds (2 players: first to the goal wins) */
const goal=setupGoal({key:'fc',min:3,max:20,step:1,def:8,unit:{en:'statues',he:'פסלים'},onChange:()=>subLine()});
let G=0,gb=null;
function subLine(){const n=goal.get(),u=UI[lang];$('t-sub').textContent=n?(who==='duo'?u.subG2(n):u.subG(n)):u.sub;}
segBind('body-seg',v=>{bodyMode=v;LS.set('fc-body',v);});
segBind('who-seg',v=>{who=v;LS.set('fc-who3',v);subLine();});
segBind('strict-seg',v=>{strict=v;LS.set('fc-strict',v);});

/* ================= CANVAS ================= */
const cv=$('c');let ctx=cv.getContext('2d');   // let: the How-to-play cartoon borrows the drawing code with its own canvas
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',resize);resize();
function toast(t,ms=4000){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.tm);if(ms)toast.tm=setTimeout(()=>e.classList.remove('on'),ms);}

/* ================= SOUND ================= */
const FX={
  great(){[784,988,1175,1568].forEach((f,i)=>tone({f0:f,dur:.25,type:'triangle',vol:.32,at:i*.07}));},
  nope(){tone({f0:420,f1:300,dur:.25,type:'triangle',vol:.16});},
  fill(p){tone({f0:500+p*600,dur:.06,type:'sine',vol:.08});},
  whoosh(){noise({dur:.35,freq:1400,vol:.12,type:'bandpass'});},
  freeze(){noise({dur:.25,freq:5000,vol:.12,type:'highpass'});[2093,2637,3136].forEach((f,i)=>tone({f0:f,dur:.18,type:'sine',vol:.1,at:.05+i*.05}));},
  tick(){tone({f0:1300,dur:.03,type:'triangle',vol:.1});},
  giggle(){[0,1,2,3].forEach(i=>tone({f0:700+i*60,f1:900+i*60,dur:.07,type:'triangle',vol:.12,at:i*.09}));}
};

/* ================= CAMERA + POSE TRACKING (on device) ================= */
const video=$('v');
let tracker=null,camOK=false,lastVT=-1,people=[];   // people: [{lm:[{x,y,v}] in screen px, raw, nose, sw}]
const vmap=()=>{const vw=video.videoWidth||640,vh=video.videoHeight||480,s=Math.max(W/vw,H/vh);return {vw,vh,s,ox:(W-vw*s)/2,oy:(H-vh*s)/2};};
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();
  const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts=(d,k)=>({baseOptions:{modelAssetPath:`https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${k}/float16/1/pose_landmarker_${k}.task`,delegate:d},
    runningMode:'VIDEO',numPoses:2,minPoseDetectionConfidence:.45,minPosePresenceConfidence:.45,minTrackingConfidence:.45});
  let err=null;
  for(const [d,k] of [['GPU','full'],['GPU','lite'],['CPU','lite']]){try{tracker=await timeoutP(vision.PoseLandmarker.createFromOptions(files,opts(d,k)),d==='GPU'?30000:120000);break;}catch(e){err=e;}}
  if(!tracker)throw err||new Error('model');
  camOK=true;
}
function track(now){
  if(!tracker||video.readyState<2||video.currentTime===lastVT)return;lastVT=video.currentTime;
  let res;try{res=tracker.detectForVideo(video,now);}catch(e){return;}
  const m=vmap(),L=res.landmarks||[];
  const ps=L.map(lm=>{const pts=lm.map(p=>({x:m.ox+(1-p.x)*m.vw*m.s,y:m.oy+p.y*m.vh*m.s,v:p.visibility??1}));
    return {lm:pts,nose:pts[0],sw:Math.hypot(pts[11].x-pts[12].x,pts[11].y-pts[12].y)};}).filter(p=>p.lm[11].v>.4&&p.lm[12].v>.4);
  ps.sort((a,b)=>a.nose.x-b.nose.x);
  people=who==='solo'&&ps.length>1?[ps.reduce((a,b)=>b.sw>a.sw?b:a)]:ps;   // solo: the closest person
}

/* ================= POSES (screen-space angles, degrees: 0 = right, 90 = down, -90 = up) ================= */
// segments by screen side (mirrored picture): left arm = the arm whose shoulder is further left on screen
function sides(lm){const sL=lm[11].x<lm[12].x,hL=lm[23].x<lm[24].x;
  return {aL:sL?[11,13,15]:[12,14,16],aR:sL?[12,14,16]:[11,13,15],lL:hL?[23,25,27]:[24,26,28],lR:hL?[24,26,28]:[23,25,27]};}
const ARMS=['uaL','faL','uaR','faR'],LEGS=['thL','shL','thR','shR'];
function poseOf(p){
  const lm=p.lm,s=sides(lm),o={},ang=(a,b)=>(lm[a].v>.5&&lm[b].v>.5)?Math.atan2(lm[b].y-lm[a].y,lm[b].x-lm[a].x)*180/Math.PI:null;
  o.uaL=ang(s.aL[0],s.aL[1]);o.faL=ang(s.aL[1],s.aL[2]);o.uaR=ang(s.aR[0],s.aR[1]);o.faR=ang(s.aR[1],s.aR[2]);
  if(bodyMode==='full'){o.thL=ang(s.lL[0],s.lL[1]);o.shL=ang(s.lL[1],s.lL[2]);o.thR=ang(s.lR[0],s.lR[1]);o.shR=ang(s.lR[1],s.lR[2]);}
  // trunk: middle of the hips -> middle of the shoulders (sideways lean); only when both hips are seen
  if(lm[23].v>.5&&lm[24].v>.5){const hx=(lm[23].x+lm[24].x)/2,hy=(lm[23].y+lm[24].y)/2,sx=(lm[11].x+lm[12].x)/2,sy=(lm[11].y+lm[12].y)/2;o.tr=Math.atan2(sy-hy,sx-hx)*180/Math.PI;}
  return o;
}
const dAng=(a,b)=>Math.abs(((a-b+540)%360)-180);
// ONE tolerance for every segment. 15 Nov (Edgar: "barely saw my legs and accepted almost every pose"):
// every segment the pose uses must be SEEN (standing: both legs too) — an unseen part no longer counts as a pass;
// every arm segment must match, a leaning pose must be leaned, and only MISS[strict] other segments may be off.
function compare(T,P,tol){
  const keys=bodyMode==='full'?[...ARMS,...LEGS,'tr']:[...ARMS,'tr'];let n=0,bad=0,unseen=0,armsOk=true,legsUnseen=false;const by={};
  for(const k of keys){if(T[k]==null)continue;
    const lean=k==='tr'&&Math.abs(T.tr+90)>8;
    if(P[k]==null){if(k==='tr'&&!lean)continue;unseen++;by[k]=false;if(LEGS.includes(k))legsUnseen=true;continue;}   // straight trunk may go unseen (seated)
    n++;const ok=dAng(T[k],P[k])<tol;by[k]=ok;
    if(!ok){if(ARMS.includes(k)||lean)armsOk=false;else bad++;}}
  return {ok:unseen===0&&n>=4&&armsOk&&bad<=MISS[strict],by,n,legsUnseen};
}

/* 14 Nov night (Edgar): kids dressed as animals; each animal keeps its signature body part in all 3 poses, and at
   least one pose has the body leaning sideways (a front camera can't see forward leans or forward knee lifts).
   Signatures: frog always squats · crab legs always bent and wide · flamingo always on one leg (switches legs) ·
   bear hands on hips · lion roaring claws · duck arms straight close to the body · elephant hands together,
   arms stretched out like a trunk · bunny at least one bent paw · spider at least one bent arm with the hand drooping. */

const P=(uaL,faL,uaR,faR,thL=90,shL=90,thR=90,shR=90,tr=-90)=>({uaL,faL,uaR,faR,thL,shL,thR,shR,tr});
// tr = trunk angle (hips -> shoulders): -90 upright, -105 leaning to the screen-left, -75 leaning to the screen-right

const IDX=Object.fromEntries(ANIMALS.map((a,i)=>[a.id,i]));
function mixName(a,b,l){const x=a[l],y=b[l];return x.slice(0,Math.max(2,Math.ceil(x.length*.6)))+y.slice(-Math.max(2,Math.ceil(y.length*.6)));}   // Frog+Flamingo -> Fromingo
// a target = {a: animal for head/body/arms (or left arm), b: animal for legs (or right arm), pa/pb: which of their 3 poses}
function makeTarget(a,b,pa,pb){
  pa=pa??Math.floor(Math.random()*3);const A1=ANIMALS[a].poses[pa];
  if(b==null){b=a;pb=pa;} else pb=pb??Math.floor(Math.random()*3);
  const A2=ANIMALS[b].poses[pb],pose={...A1.pose};
  if(b!==a){ if(bodyMode==='full'){for(const k of LEGS)pose[k]=A2.pose[k];} else {pose.uaR=A2.pose.uaR;pose.faR=A2.pose.faR;} }
  if(bodyMode!=='full')for(const k of LEGS)pose[k]=90;
  return {a,b,pa,pb,pose,mix:b!==a,line:A1.line};
}

/* draw a kid in an animal costume, frozen in the pose. (x,y) = centre of the body, s = size (about the body height) */
const SKIN=['#F6D3B0','#E8B48A','#C68B5E','#8D5B3A','#F2C9A0'];
function drawAnimal(T,x,y,s,t,o={}){
  const top=o.top||ANIMALS[T.a],bot=o.top||ANIMALS[T.b],pose=o.pose||T.pose,lw=Math.max(2.5,s*.03),skin=SKIN[T.a%SKIN.length];
  const legC=bodyMode==='full'?bot:top,armR=(bodyMode!=='full'&&T.mix)?bot:top;
  ctx.save();ctx.translate(x,y+(o.hop||0));
  const R=a=>a*Math.PI/180,tilt=R((pose.tr??-90)+90),pv={x:0,y:s*.3};
  const rot=p=>({x:pv.x+(p.x-pv.x)*Math.cos(tilt)-(p.y-pv.y)*Math.sin(tilt),y:pv.y+(p.x-pv.x)*Math.sin(tilt)+(p.y-pv.y)*Math.cos(tilt)});
  const sh={L:rot({x:-s*.25,y:-s*.2}),R:rot({x:s*.25,y:-s*.2})},hp={L:rot({x:-s*.15,y:s*.3}),R:rot({x:s*.15,y:s*.3})};
  const seg=(p,a,len)=>({x:p.x+Math.cos(R(a))*len,y:p.y+Math.sin(R(a))*len});
  const limb=(p,a1,a2,l1,l2,w,col,end,endCol)=>{const e=seg(p,a1,l1),h=seg(e,a2,l2);
    ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=INK;ctx.lineWidth=w+lw*2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(e.x,e.y);ctx.lineTo(h.x,h.y);ctx.stroke();
    ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();end(h,a2,endCol);};
  const hand=(h,a,c)=>sticker(ctx,ell(h.x,h.y,s*.07,s*.07),skin,lw);
  const claw=(h,a,c)=>{ctx.save();ctx.translate(h.x,h.y);ctx.rotate(R(a));const p=new Path2D();p.moveTo(-s*.02,0);p.quadraticCurveTo(s*.06,-s*.13,s*.14,-s*.05);p.lineTo(s*.05,-s*.01);p.lineTo(s*.14,s*.04);p.quadraticCurveTo(s*.06,s*.12,-s*.02,0);sticker(ctx,p,c,lw);ctx.restore();};
  const paw=(h,a,c)=>{sticker(ctx,ell(h.x,h.y+s*.03,s*.065,s*.08),'#fff',lw);};   // bunny: a soft drooping paw glove
  const foot=(h,a,c)=>sticker(ctx,ell(h.x,h.y+s*.02,s*.11,s*.055),c,lw);
  const legW=legC.id==='flamingo'?s*.06:s*.11,arm=a=>a.id==='crab'?claw:a.id==='bunny'?paw:hand;
  // legs (costume tights + booties)
  if(bodyMode==='full'){limb(hp.L,pose.thL,pose.shL,s*.34,s*.32,legW,legC.body,foot,legC.feet);limb(hp.R,pose.thR,pose.shR,s*.34,s*.32,legW,legC.body,foot,legC.feet);}
  else sticker(ctx,ell(0,s*.42,s*.36,s*.1),bot.feet,lw);
  // body (leans with the trunk)
  ctx.save();ctx.translate(pv.x,pv.y);ctx.rotate(tilt);ctx.translate(-pv.x,-pv.y);
  if(top.id==='spider')for(const d of [-1,1])for(let i=0;i<3;i++){const yy=-s*.05+i*s*.12;ctx.strokeStyle=INK;ctx.lineWidth=s*.035+lw*2;ctx.beginPath();ctx.moveTo(d*s*.22,yy);ctx.quadraticCurveTo(d*s*.42,yy-s*.12,d*s*.48,yy+s*.06);ctx.stroke();ctx.strokeStyle=top.body;ctx.lineWidth=s*.035;ctx.stroke();}
  if(top.id==='lion'){ctx.strokeStyle=INK;ctx.lineWidth=lw*2.4;ctx.beginPath();ctx.moveTo(s*.2,s*.32);ctx.quadraticCurveTo(s*.45,s*.4,s*.42,s*.15);ctx.stroke();ctx.strokeStyle=top.body;ctx.lineWidth=lw;ctx.stroke();sticker(ctx,ell(s*.42,s*.13,s*.05,s*.06),'#C9692B',lw*.7);}
  if(top.id==='duck')sticker(ctx,(()=>{const p=new Path2D();p.moveTo(s*.2,s*.3);p.lineTo(s*.36,s*.24);p.lineTo(s*.26,s*.38);p.closePath();return p;})(),top.body,lw*.8);
  sticker(ctx,ell(0,s*.05,s*.29,s*.38),top.body,lw);
  if(top.id!=='spider')sticker(ctx,ell(0,s*.12,s*.18,s*.24),top.light,lw*.7);
  ctx.restore();
  // arms (costume sleeves, kid hands)
  limb(sh.L,pose.uaL,pose.faL,s*.3,s*.27,s*.1,top.body,arm(top),top.feet);
  limb(sh.R,pose.uaR,pose.faR,s*.3,s*.27,s*.1,armR.body,arm(armR),armR.feet);
  // head (kid face in an animal hood), leans with the trunk
  const hc=rot({x:0,y:-s*.45});ctx.save();ctx.translate(hc.x,hc.y);ctx.rotate(tilt);drawHead(top,0,0,s*.22,lw,t,o,skin);ctx.restore();
  ctx.restore();
}
function drawHead(a,x,y,r,lw,t,o,skin=SKIN[0]){
  const id=a.id;
  // hood pieces behind
  if(id==='lion'){const m=new Path2D();for(let i=0;i<=24;i++){const an=i/24*Math.PI*2,rr=r*(i%2?1.22:1.42);m[i?'lineTo':'moveTo'](x+Math.cos(an)*rr,y+Math.sin(an)*rr);}m.closePath();sticker(ctx,m,'#C9692B',lw);
    for(const d of [-1,1])sticker(ctx,ell(x+d*r*.62,y-r*.78,r*.2,r*.2),a.body,lw);}
  if(id==='bunny')for(const d of [-1,1]){sticker(ctx,ell(x+d*r*.42,y-r*1.25,r*.26,r*.72,d*.15),a.body,lw);ctx.fillStyle='#FFB3C4';ctx.fill(ell(x+d*r*.42,y-r*1.2,r*.12,r*.52,d*.15));}
  if(id==='bear')for(const d of [-1,1]){sticker(ctx,ell(x+d*r*.72,y-r*.72,r*.28,r*.28),a.body,lw);ctx.fillStyle=a.light;ctx.fill(ell(x+d*r*.72,y-r*.72,r*.14,r*.14));}
  if(id==='elephant')for(const d of [-1,1]){sticker(ctx,ell(x+d*r*1.02,y+r*.05,r*.55,r*.72,d*.2),a.body,lw);ctx.fillStyle='#F7C6D0';ctx.fill(ell(x+d*r*1.02,y+r*.08,r*.33,r*.48,d*.2));}
  if(id==='crab')for(const d of [-1,1]){ctx.strokeStyle=INK;ctx.lineWidth=lw*2.6;ctx.beginPath();ctx.moveTo(x+d*r*.35,y-r*.7);ctx.lineTo(x+d*r*.48,y-r*1.25);ctx.stroke();ctx.strokeStyle=a.body;ctx.lineWidth=lw*1.2;ctx.stroke();
    sticker(ctx,ell(x+d*r*.48,y-r*1.3,r*.17,r*.17),'#fff',lw*.7);ctx.fillStyle=INK;ctx.fill(ell(x+d*r*.48,y-r*1.3,r*.08,r*.09));}
  if(id==='frog')for(const d of [-1,1]){sticker(ctx,ell(x+d*r*.48,y-r*.82,r*.3,r*.28),a.body,lw);sticker(ctx,ell(x+d*r*.48,y-r*.84,r*.18,r*.18),'#fff',lw*.6);ctx.fillStyle=INK;ctx.fill(ell(x+d*r*.48,y-r*.84,r*.09,r*.11));}
  if(id==='flamingo'){ctx.strokeStyle=INK;ctx.lineWidth=r*.24+lw*2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+r*.1,y-r*.8);ctx.quadraticCurveTo(x+r*.55,y-r*1.25,x+r*.15,y-r*1.55);ctx.stroke();ctx.strokeStyle=a.body;ctx.lineWidth=r*.24;ctx.stroke();
    sticker(ctx,ell(x+r*.12,y-r*1.6,r*.2,r*.17),a.body,lw*.8);const b=new Path2D();b.moveTo(x-r*.05,y-r*1.62);b.quadraticCurveTo(x-r*.35,y-r*1.55,x-r*.3,y-r*1.32);b.lineTo(x-r*.02,y-r*1.52);b.closePath();sticker(ctx,b,'#3b2a20',lw*.6);}
  // the hood
  sticker(ctx,ell(x,y,r,r),a.body,lw);
  // hood front decorations
  if(id==='duck'||id==='penguin')sticker(ctx,ell(x,y-r*.66,r*.36,r*.13),'#FF9A3D',lw*.7);
  if(id==='spider')for(const [dx,rr] of [[-.36,.08],[-.13,.1],[.13,.1],[.36,.08]]){sticker(ctx,ell(x+dx*r,y-r*.72,r*rr*1.2,r*rr*1.2),'#fff',lw*.5);ctx.fillStyle=INK;ctx.fill(ell(x+dx*r,y-r*.72,r*rr*.6,r*rr*.6));}
  // the kid's face
  const fy=y+r*.12,fr=r*.7;sticker(ctx,ell(x,fy,fr,fr*.95),skin,lw*.8);
  ctx.fillStyle='#4A3226';const bang=new Path2D();bang.moveTo(x-fr*.85,fy-fr*.35);bang.quadraticCurveTo(x-fr*.3,fy-fr*1.05,x+fr*.1,fy-fr*.62);bang.quadraticCurveTo(x+fr*.5,fy-fr*1.05,x+fr*.85,fy-fr*.35);bang.quadraticCurveTo(x,fy-fr*1.2,x-fr*.85,fy-fr*.35);ctx.fill(bang);
  if(id==='elephant')sticker(ctx,ell(x,y-r*.72,r*.12,r*.1),a.light,lw*.6);   // little trunk tip on the hood; the arms are the trunk
  const blink=(Math.sin(t*1.7+id.length)>.97)?.15:1,er=fr*.13;
  for(const d of [-1,1]){const cx=x+d*fr*.36,cy=fy-fr*.02;
    if(o.sleepy){ctx.strokeStyle=INK;ctx.lineWidth=lw*.9;ctx.beginPath();ctx.arc(cx,cy-er*.2,er,Math.PI*.1,Math.PI*.9);ctx.stroke();continue;}
    if(o.happy){ctx.strokeStyle=INK;ctx.lineWidth=lw*.9;ctx.beginPath();ctx.arc(cx,cy+er*.3,er,Math.PI*1.1,Math.PI*1.9);ctx.stroke();continue;}
    ctx.fillStyle=INK;ctx.fill(ell(cx,cy,er*.8,er*1.05*blink));ctx.fillStyle='#fff';ctx.fill(ell(cx+er*.28,cy-er*.35,er*.32,er*.32*blink));}
  ctx.fillStyle='rgba(255,120,140,.55)';for(const d of [-1,1])ctx.fill(ell(x+d*fr*.58,fy+fr*.28,fr*.15,fr*.09));
  if(o.mouth==='frown'){ctx.strokeStyle=INK;ctx.lineWidth=lw*.9;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,fy+fr*.56,fr*.22,1.2*Math.PI,1.8*Math.PI);ctx.stroke();
    for(const d of [-1,1]){ctx.beginPath();ctx.moveTo(x+d*fr*.58,fy-fr*.3);ctx.lineTo(x+d*fr*.16,fy-fr*.17);ctx.stroke();}}   // story: grumpy crab
  else if(o.mouth==='o'){sticker(ctx,ell(x,fy+fr*.42,fr*.1,fr*.12),'#7A2E26',lw*.6);}   // story: surprised / squeaky lion
  else if(o.mouth==='smile'){const m=new Path2D();m.moveTo(x-fr*.25,fy+fr*.3);m.quadraticCurveTo(x,fy+fr*.72,x+fr*.25,fy+fr*.3);m.closePath();sticker(ctx,m,'#E2564A',lw*.6);}
  else if(o.mouth==='sleep'){ctx.strokeStyle=INK;ctx.lineWidth=lw*.8;ctx.beginPath();ctx.moveTo(x-fr*.12,fy+fr*.38);ctx.lineTo(x+fr*.12,fy+fr*.38);ctx.stroke();}
  else if(o.happy){const m=new Path2D();m.moveTo(x-fr*.25,fy+fr*.3);m.quadraticCurveTo(x,fy+fr*.72,x+fr*.25,fy+fr*.3);m.closePath();sticker(ctx,m,'#E2564A',lw*.6);}
  else if(id==='lion'){const m=new Path2D();m.ellipse(x,fy+fr*.45,fr*.2,fr*.17,0,0,7);sticker(ctx,m,'#7A2E26',lw*.6);}   // roaring
  else{ctx.strokeStyle=INK;ctx.lineWidth=lw*.8;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,fy+fr*.28,fr*.2,.15*Math.PI,.85*Math.PI);ctx.stroke();}
}

function sLeaf(c,x,y,len,ang,col,wid=.38){c.save();c.translate(x,y);c.rotate(ang);const p=new Path2D();p.moveTo(0,0);p.bezierCurveTo(len*.25,-len*wid,len*.75,-len*wid*.8,len,0);p.bezierCurveTo(len*.75,len*wid*.8,len*.25,len*wid,0,0);sticker(c,p,col,2.6);
 c.strokeStyle='rgba(43,33,24,.45)';c.lineWidth=1.6;c.beginPath();c.moveTo(len*.06,0);c.quadraticCurveTo(len*.5,-len*.04,len*.9,0);c.stroke();c.restore();}
function sBush(c,x,y,r,col){const p=new Path2D();for(let i=0;i<7;i++){const a=Math.PI+i/6*Math.PI;p.moveTo(x+Math.cos(a)*r*.6+r*.38,y+Math.sin(a)*r*.5);p.arc(x+Math.cos(a)*r*.6,y+Math.sin(a)*r*.5,r*.38,0,7);}sticker(c,p,col,2.6);c.fillStyle=col;c.fill(ell(x,y,r*.75,r*.42));}
function sDrawBG(c,W,H,k,t){
 const B=S_BG[k],g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,B.sky[0]);g.addColorStop(1,B.sky[1]);c.fillStyle=g;c.fillRect(0,0,W,H);
 if(k==='sunrise'||k==='party'){sticker(c,ell(W*.82,H*.2,H*.09,H*.09),'#FFD86B',3);c.fillStyle='rgba(255,255,255,.35)';c.fill(ell(W*.8,H*.18,H*.03,H*.02));}
 // soft clouds
 c.fillStyle='rgba(255,255,255,.8)';for(const [cx,cy,r] of [[.2,.12,.05],[.55,.08,.04]]){c.fill(ell(W*cx,H*cy,H*r*2,H*r));c.fill(ell(W*cx+H*r,H*cy-H*r*.6,H*r*1.1,H*r*.9));}
 // far hills
 c.fillStyle=B.hill;c.beginPath();c.moveTo(0,H*.62);c.bezierCurveTo(W*.2,H*.48,W*.35,H*.5,W*.5,H*.6);c.bezierCurveTo(W*.65,H*.5,W*.85,H*.46,W,H*.58);c.lineTo(W,H);c.lineTo(0,H);c.fill();
 c.fillStyle=B.hill2;c.beginPath();c.moveTo(0,H*.72);c.bezierCurveTo(W*.25,H*.64,W*.6,H*.7,W,H*.66);c.lineTo(W,H);c.lineTo(0,H);c.fill();
 // props behind
 if(k==='cave'){const p=new Path2D();p.moveTo(W*.56,H*.92);p.bezierCurveTo(W*.54,H*.38,W*.98,H*.3,W*1.02,H*.5);p.lineTo(W*1.02,H*.92);p.closePath();sticker(c,p,'#B9A58C',3);const q=new Path2D();q.moveTo(W*.64,H*.92);q.bezierCurveTo(W*.64,H*.52,W*.92,H*.5,W*.94,H*.92);q.closePath();c.fillStyle='#5E4B3C';c.fill(q);}
 if(k==='tree'){const p=new Path2D();p.moveTo(W*.88,H*.95);p.bezierCurveTo(W*.9,H*.6,W*.86,H*.35,W*.9,H*.1);p.lineTo(W*1.02,H*.1);p.lineTo(W*1.02,H*.95);p.closePath();sticker(c,p,'#A97A52',3);}
 if(k==='web'){c.save();c.translate(W*.7,H*.02);c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=2;for(let i=0;i<9;i++){const a=Math.PI*(.05+i/8*.9);c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*H*.5,Math.sin(a)*H*.5);c.stroke();}
   for(let r=H*.1;r<H*.5;r+=H*.08){c.beginPath();for(let i=0;i<9;i++){const a=Math.PI*(.05+i/8*.9),px=Math.cos(a)*r,py=Math.sin(a)*r;if(i)c.quadraticCurveTo(Math.cos(a-.17)*r*.92,Math.sin(a-.17)*r*.92,px,py);else c.moveTo(px,py);}c.stroke();}c.restore();
   c.fillStyle='rgba(255,236,150,.9)';for(const [fx,fy] of [[.15,.3],[.4,.2],[.9,.55],[.6,.45]])c.fill(ell(W*fx,H*fy,4,4));}
 // ground
 c.fillStyle=B.ground;c.beginPath();c.moveTo(0,H*.84);c.bezierCurveTo(W*.3,H*.8,W*.7,H*.86,W,H*.82);c.lineTo(W,H);c.lineTo(0,H);c.fill();
 if(k==='pond'||k==='mud'){const pc=k==='pond'?'#7FCDE0':'#A8855E';sticker(c,ell(W*.72,H*.92,W*.24,H*.06),pc,3);c.fillStyle='rgba(255,255,255,.4)';c.fill(ell(W*.66,H*.905,W*.06,H*.012));
   if(k==='pond')for(const [lx,lr] of [[.55,.035],[.88,.03]]){const p=new Path2D();p.ellipse(W*lx,H*.93,H*lr*1.6,H*lr*.6,0,.3,Math.PI*2-.05);p.lineTo(W*lx,H*.93);p.closePath();sticker(c,p,'#6FC06A',2);} }
 if(k==='meadow')for(const [cx,cy] of [[.14,.86],[.2,.88],[.88,.84],[.93,.87]]){const p=new Path2D();p.ellipse(W*cx,H*cy,H*.016,H*.012,0,Math.PI,0);p.closePath();sticker(c,p,'#FF9A3D',2);sLeaf(c,W*cx,H*cy-H*.012,H*.045,-Math.PI/2-.3,'#6CBF6A',.3);sLeaf(c,W*cx,H*cy-H*.012,H*.045,-Math.PI/2+.3,'#5DB86A',.3);}
 if(k==='mud'){sticker(c,ell(W*.12,H*.95,W*.12,H*.03),'#7FCDE0',2.5);}
 if(k==='river'||k==='lagoon'){const col=k==='river'?'#86CDEB':'#9ED8E6';c.fillStyle=col;c.beginPath();c.moveTo(0,H*.76);c.bezierCurveTo(W*.3,H*.72,W*.6,H*.8,W,H*.74);c.lineTo(W,H*.8);c.bezierCurveTo(W*.6,H*.86,W*.3,H*.78,0,H*.82);c.fill();
   c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=2.5;c.lineCap='round';for(const wx of [.18,.5,.8]){c.beginPath();c.moveTo(W*wx,H*.78);c.quadraticCurveTo(W*wx+12,H*.77,W*wx+24,H*.78);c.stroke();}}
 // framing foliage
 const L1='#5DB86A',L2='#7FCB6B',L3='#3FA06A';
 sLeaf(c,-10,H*.1,H*.34,.35,L1);sLeaf(c,-6,H*.28,H*.3,.05,L2);sLeaf(c,-8,H*.02,H*.28,.75,L3);
 if(k!=='tree'&&k!=='cave'){sLeaf(c,W+10,H*.12,H*.32,Math.PI-.35,L2);sLeaf(c,W+8,H*.3,H*.28,Math.PI-.05,L1);}
 // hanging vines
 c.strokeStyle='#4E9A54';c.lineWidth=4;for(const vx of [.36,.6]){c.beginPath();c.moveTo(W*vx,0);c.bezierCurveTo(W*vx+14,H*.06,W*vx-12,H*.12,W*vx+4,H*.18);c.stroke();sLeaf(c,W*vx+4,H*.18,H*.07,1.2,L2,.45);sLeaf(c,W*vx-3,H*.09,H*.06,2.4,L1,.45);}
 sBush(c,W*.06,H*.88,H*.13,'#6CBF6A');sBush(c,W*.95,H*.9,H*.1,'#5DB86A');
 if(k==='lagoon'){c.strokeStyle='#4E9A54';c.lineWidth=3;for(const rx of [.08,.11,.92]){c.beginPath();c.moveTo(W*rx,H*.86);c.quadraticCurveTo(W*rx+6,H*.7,W*rx+2,H*.62);c.stroke();sticker(c,ell(W*rx+2,H*.62,4,12),'#A97A52',2);}}
 // flowers
 for(const [fx,fy,fc] of [[.2,.9,'#FF9FB0'],[.48,.93,'#FFD86B'],[.85,.86,'#B9A3E0']]){for(let i=0;i<5;i++){const a=i/5*Math.PI*2;sticker(c,ell(W*fx+Math.cos(a)*6,H*fy+Math.sin(a)*6,5,5),fc,1.6);}sticker(c,ell(W*fx,H*fy,4,4),'#FFF1B8',1.4);}
}

const S_STAND={uaL:105,faL:95,uaR:75,faR:85,thL:95,shL:90,thR:85,shR:90,tr:-90};
function sPose(pg){const p={...ANIMALS[IDX[pg.pose[0]]].poses[pg.pose[1]].pose};if(bodyMode!=='full')for(const k of LEGS)p[k]=90;return p;}
function sFigure(id,x,ground,s,o={}){const i=IDX[id],pose=o.pose||S_STAND;drawAnimal({a:i,b:i,pose},x,ground-s*(bodyMode==='full'?.98:.55),s,o.t??10,o);}
function sLionPose(pg){const p=sPose(pg);
 if(pg.lion==='stand')return S_STAND;
 if(pg.lion==='wobble')return {...p,tr:-78,uaL:-150,faL:-120,uaR:-30,faR:-60};
 if(pg.lion==='wobble2')return {...p,tr:-102,uaL:200,faL:170,uaR:-20,faR:10};
 return p;}

/* ================= STORY MODE — "Where's Lion's Roar?" (21 Nov 2026, Edgar) =================
   One continuous comic: Lion + 9 friends × 3 pages = 30 pages, then a last page with the big roar.
   Each page shows one of that friend's 3 statue poses (the same poses and the same matching as the wheel game);
   holding the copy until the jar fills turns the page. 1 player only. Progress is kept on this device only
   (localStorage 'jp-story'), and the start card has a "Start over" button. No clock in story mode. */
let SCHEER=false;
const SFX_O=(s,t)=>SCHEER?{happy:true,hop:-Math.abs(Math.sin(t*9))*s*.06,t}:{t};
const SN=SPAGES.length,SKEY='jp-story';
let story=false,sp=+LS.get(SKEY,'0')||0,whoKeep='solo',sFlip=null;
if(!(sp>=0&&sp<=SN))sp=0;

/* the comic card: 3:2, on the left; the child plays in the rest of the picture */
function storyRect(){const y=58,hMax=H-y-Math.max(50,H*.1),w=Math.min(W*.6,hMax*1.5);return {x:12,y:y+(hMax-w/1.5)/2,w,h:w/1.5};}

/* speech bubbles drawn in page units (900 × 600), same layout rules as the comic preview:
   one column per speaker, kept in reading order, moved to the edge if they would cover a face */
function sWrap(t,maxW){const words=t.split(' '),lines=[];let cur='';
  for(const w of words){const tryL=cur?cur+' '+w:w;if(ctx.measureText(tryL).width>maxW&&cur){lines.push(cur);cur=w;}else cur=tryL;}
  if(cur)lines.push(cur);return lines;}
function sBubbleX(pg,sp_,end){if(end)return .5;if(pg.dangle&&sp_==='spider')return .9;if(sp_==='pal')return .9;if(pg.solo)return sp_==='lion'?.42:.78;return sp_==='lion'?.27:.7;}
function sBubbles(pg,end,count){
  const W=900,U=W/100,list=end?SEND:pg.b,col={};let prevTop=-99,prevH=0;
  ctx.save();ctx.direction=lang==='he'?'rtl':'ltr';ctx.textAlign='center';ctx.textBaseline='middle';
  list.forEach((b,k)=>{if(k>=count)return;
    const [who_,en,he,cls]=b,txt=lang==='he'?he:en,small=cls==='small',f=small?U*2.9:U*3.3;
    ctx.font=`${small?'italic ':''}700 ${f}px Fredoka,sans-serif`;
    const pad=U*2.2,lines=sWrap(txt,W*.46-pad*2),tw=Math.max(...lines.map(l=>ctx.measureText(l).width)),w=tw+pad*2,h=lines.length*f*1.15+U*2.4;
    const c=sBubbleX(pg,who_,end);let cx=c*100;
    const y=Math.max(2,col[c]??2,prevTop+prevH*.95);
    if(y+h/U>26.5&&c!==.5)cx=c>.5?100:0;
    const L=Math.min(Math.max(cx,w/2/U+1.5),100-w/2/U-1.5),x=L*U,top=y*U;
    const tail=Math.max(x-w/2+U*3,Math.min(x+w/2-U*3,c*W));
    const fill=small?'#FFF1B8':who_==='all'?'#FFE3E8':'#fff';
    const p=new Path2D();p.roundRect(x-w/2,top,w,h,Math.min(h/2,U*4));
    ctx.fillStyle='rgba(43,33,24,.15)';ctx.save();ctx.translate(0,U*.6);ctx.fill(p);ctx.restore();
    const tp=new Path2D();tp.moveTo(tail-U*1.3,top+h-2);tp.lineTo(tail,top+h+U*2);tp.lineTo(tail+U*1.3,top+h-2);tp.closePath();
    ctx.lineWidth=U*.55;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.fillStyle=fill;ctx.fill(tp);ctx.stroke(tp);ctx.fill(p);ctx.stroke(p);
    ctx.fillStyle=fill;ctx.fillRect(tail-U*1.1,top+h-U*.6,U*2.2,U*.9);   // join the tail to the bubble
    ctx.fillStyle=INK;lines.forEach((l,i)=>ctx.fillText(l,x,top+U*1.2+f*1.15*(i+.5)+1));
    prevTop=y;prevH=h/U;col[c]=y+h/U+3.2;});
  ctx.restore();
}
const sBubCount=pg=>(pg?pg.b:SEND).length;
function drawStoryPage(R,i,t,count){   // i = page index, SN = the last page
  const end=i>=SN,pg=end?null:SPAGES[i],k=R.w/900;
  ctx.save();const clip=new Path2D();clip.roundRect(R.x,R.y,R.w,R.h,18);ctx.clip(clip);
  ctx.translate(R.x,R.y);ctx.scale(k,k);sDrawPage(pg,end,t);sBubbles(pg,end,count);ctx.restore();
  ctx.save();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke(clip);ctx.restore();
}
function drawStory(){
  const R=storyRect(),u=UI[lang];
  // card shadow
  ctx.save();ctx.fillStyle=INK;ctx.beginPath();ctx.roundRect(R.x,R.y+5,R.w,R.h,18);ctx.fill();ctx.restore();
  if(sFlip){ // page turn: the old page folds away, the new one unfolds
    const k=Math.min(1,sFlip.t/.6),half=k<.5,sx=Math.abs(Math.cos(k*Math.PI));
    ctx.save();ctx.translate(R.x+R.w/2,0);ctx.scale(Math.max(.02,sx),1);ctx.translate(-R.x-R.w/2,0);
    drawStoryPage(R,half?sFlip.from:sp,tNow,half?99:0);ctx.restore();}
  else{SCHEER=phase==='cheer'||phase==='finale';drawStoryPage(R,sp,tNow,phase==='read'?Math.floor(phaseT/1.1)+1:99);SCHEER=false;}
  const fs=Math.max(15,Math.min(22,R.w*.045)),by=R.y+R.h+fs*1.05;
  if(sp<SN&&target){bubble((lang==='he'?'מחקים: ':'Copy: ')+animalName(target),R.x+R.w/2,by,fs,'#E6F7DE');}
  bubble('📖 '+Math.min(sp+1,SN)+'/'+SN,R.x+R.w+8+(W-R.x-R.w-8)/2,64+fs*.2,fs,'#fff');
}
function storyTarget(){const pg=SPAGES[sp],a=IDX[pg.pose[0]];target=makeTarget(a,null,pg.pose[1]);target.frozen=true;}
function storyPage(){state='play';meters=[0,0];winner=-1;if(sp>=SN){setPhase('finale');target=null;SFX.chime();
    for(let k=0;k<40;k++)pops.push({x:W*.3,y:H*.3,vx:(Math.random()-.5)*W,vy:-H*(.4+Math.random()*.6),life:2});return;}
  storyTarget();setPhase('read');}
function storyUpdate(dt,u){
  if(sFlip){sFlip.t+=dt;if(sFlip.t>=.6){sFlip=null;storyPage();}return;}
  if(phase==='read'){if(phaseT>Math.min(4,sBubCount(SPAGES[sp])*1.1+.3))setPhase('copy');}   // copying may start while the last bubbles appear
  if(phase==='read'||phase==='copy'){
    const p=people[0];lastMatch=[];
    if(p){const r=compare(target.pose,poseOf(p),TOL[strict]);lastMatch[0]={r,p};if(r.legsUnseen&&tNow-feetHintT>3){feetHintT=tNow;say(u.feet,1.4);}
      if(r.ok&&phase==='copy'){meters[0]=Math.min(1,meters[0]+dt/1.2);fillTick+=dt;if(fillTick>.2){fillTick=0;FX.fill(meters[0]);}}
      else meters[0]=Math.max(0,meters[0]-dt*.4);}
    else meters[0]=Math.max(0,meters[0]-dt*.4);
    if(meters[0]>=1){FX.great();say(pick(u.great),1.2);
      for(let k=0;k<14;k++)pops.push({x:W*.3,y:H*.3,vx:(Math.random()-.5)*W*.8,vy:-H*(.3+Math.random()*.5),life:1.2});setPhase('cheer');}
  }
  else if(phase==='cheer'){if(phaseT>1.3){sFlip={from:sp,t:0};sp=Math.min(SN,sp+1);LS.set(SKEY,String(sp));FX.whoosh();target=null;lastMatch=[];}}
  else if(phase==='finale'){if(phaseT>7)endGame(false);}
}
function storyLabel(){const u=UI[lang],b=$('story');if(!b)return;b.querySelector('span').textContent=sp>0&&sp<SN?u.storyAt(sp+1):u.story;
  $('story-restart').hidden=!(sp>0);$('story-restart').textContent=u.restart;}

/* ================= GAME ================= */
let feetHintT=-9,state='menu',phase='',phaseT=0,tNow=0,countT=0,spinN=0,score=[0,0],target=null,lastPicks=[],meters=[0,0],winner=-1,bigMsg='',bigMsgT=0,pops=[],frost=[],fillTick=0,lastMatch=[];
let guide=null,guides=[],awayT=0;
// what the setup avatar needs to see: head + shoulders, both hands, and (standing) both feet
const seen=(p,i)=>p.lm[i].v>.5;
const obsOf=p=>p?{x:p.nose.x,y:p.nose.y,size:p.sw,arms:seen(p,15)&&seen(p,16),feet:bodyMode==='full'?seen(p,27)&&seen(p,28)&&seen(p,25)&&seen(p,26):true}:null;
// 2 players: each child gets one side; the centre card (wheel / statue) is kept free between them
const halves=()=>{const C=stageRect(),g=8;return [{x:0,y:0,w:C.x-g,h:H},{x:C.x+C.w+g,y:0,w:W-C.x-C.w-g,h:H}];};
function duoSlots(){const mid=W/2,s=[null,null];if(people.length>=2){s[0]=people[0];s[1]=people[people.length-1];}else if(people.length===1)s[people[0].nose.x<mid?0:1]=people[0];return s;}
function say(t,dur=1.6){bigMsg=t;bigMsgT=tNow+dur;}
function setPhase(p){phase=p;phaseT=0;}
const pick=a=>a[Math.floor(Math.random()*a.length)];
let gameT=0;const timeLeft=()=>G?1e9:Math.max(0,GAME_T-gameT),clock=()=>{const t=Math.ceil(timeLeft());return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};
const holdTime=()=>Math.min(1.6,.9+spinN*.1);

/* the animal wheel: spins until a hand goes up, then always brakes over exactly 2 s (same braking every time).
   15 Nov (Edgar): one second less and 75% faster (was 0.6 turns/s, 3 s braking; mix-up auto spin 1.8 -> 1.2 s) */
const WH_W=Math.PI*2*.6*1.75,WH_STOP=2,WH_AUTO=1.2,NS=ANIMALS.length;
const WH={ang:0,stopT:-1,ang0:0,raise:0,up:false,lastSlice:-1,auto:false,result:-1};
function wheelStart(auto){Object.assign(WH,{stopT:auto?0:-1,ang0:WH.ang,raise:0,up:false,auto,result:-1});if(auto)WH.ang0=WH.ang+Math.random()*Math.PI*2;}
const sliceAt=a=>{const r=((-Math.PI/2-a)%(Math.PI*2)+Math.PI*4)%(Math.PI*2);return Math.floor(r/(Math.PI*2/NS));};
const handUp=p=>{const l=p.lm;return [15,16].some(i=>l[i].v>.5&&l[i].y<l[0].y-p.sw*.15);};
function wheelUpdate(dt){
  if(WH.stopT<0){WH.ang+=WH_W*dt;WH.up=people.some(handUp);WH.raise=WH.up?WH.raise+dt:0;if(WH.raise>.25){WH.stopT=0;WH.ang0=WH.ang;FX.whoosh();}}
  else if(WH.result<0){WH.stopT+=dt;const T=WH.auto?WH_AUTO:WH_STOP,t2=Math.min(WH.stopT,T);WH.ang=WH.ang0+WH_W*(t2-t2*t2/(2*T))*(WH.auto?1.4:1);
    if(WH.stopT>=T){let r=sliceAt(WH.ang);
      while(lastPicks.includes(r)){ // never the same animal as the last two: nudge the wheel one slice on
        r=(r+1)%NS;WH.ang-=Math.PI*2/NS;}
      WH.result=r;WH.stopT=0;}}
  else WH.stopT+=dt;   // after it stops: time to look at the result
  const sl=sliceAt(WH.ang);if(sl!==WH.lastSlice){if(WH.lastSlice>=0&&WH.stopT>=0&&WH.result<0)FX.tick();WH.lastSlice=sl;}
}

async function play(storyMode=false){
  audio();SFX.go();
  if(story)who=whoKeep;story=!!storyMode;if(story){whoKeep=who;who='solo';if(sp>=SN)sp=0;sFlip=null;}
  $('start').hidden=true;$('end').hidden=true;
  if(!camOK){say(UI[lang].ready,99);state='loading';
    try{await camLoad(startCam);}catch(e){console.warn(e);state='menu';bigMsg='';$('start').hidden=false;toast(UI[lang].nocam,6000);return;}}
  bigMsg='';score=[0,0];spinN=0;gameT=0;G=goal.get();gb=null;lastPicks=[];target=null;pops=[];loadBest();
  $('stopx').classList.add('on');musicStart();
  const gk=bodyMode==='full'?'full':'body',gt={en:{find:'Stand in front of the camera'},he:{find:'עמדו מול המצלמה'}};
  guide=who==='duo'?null:makeGuide(gk,{},bodyMode==='full'?gt:{});if(guide)guide.reset();
  guides=who==='duo'?[makeGuide(gk,{},bodyMode==='full'?gt:{}),makeGuide(gk,{},bodyMode==='full'?gt:{})]:[];guides.forEach(g=>g.reset());

}
$('play').onclick=()=>play(false);$('story').onclick=()=>play(true);
$('again').onclick=()=>{if(story){sp=0;LS.set(SKEY,'0');play(true);}else play(false);};
$('story-restart').onclick=()=>{sp=0;LS.set(SKEY,'0');storyLabel();};
$('tomenu').onclick=()=>{$('end').hidden=true;$('start').hidden=false;state='menu';storyLabel();};
$('stopx').onclick=()=>endGame(true);
function endGame(quit){
  state='over';musicStop();$('stopx').classList.remove('on');if(guide)guide.hide();guides.forEach(g=>g.hide());target=null;
  if(story){who=whoKeep;}
  if(quit){state='menu';$('start').hidden=false;storyLabel();return;}
  if(story){fillEnd(false);$('end').hidden=false;SFX.chime();storyLabel();return;}
  const sc=who==='duo'?Math.max(score[0],score[1]):score[0];
  lastNew=!G&&who==='solo'&&sc>best;if(lastNew){best=sc;LS.set(bestKey(),String(sc));}
  if(G&&who==='solo'){gb=goalBest('fc-'+bodyMode+strict,G,gameT);lastNew=gb.isNew&&gb.best>0;}
  fillEnd(lastNew);$('end').hidden=false;SFX.chime();
}
function fillEnd(nb){const u=UI[lang];$('newbest').hidden=!nb;$('newbest').textContent=u.newbest;$('tomenu').hidden=!story;$('tomenu').textContent=u.menu;$('t-again').textContent=story?u.storyAgain:u.again;
  if(story){$('t-over').textContent=u.theEnd;$('final').textContent='🦁';$('t-sec2').textContent=' '+u.roarBack;$('best-line').textContent='';return;}
  if(who==='duo'){$('final').textContent=score[0]+' – '+score[1];$('t-over').textContent=score[0]===score[1]?u.tie:(score[0]>score[1]?u.winL:u.winR);$('best-line').textContent='';}
  else{$('final').textContent=score[0];$('t-over').textContent=u.over[Math.min(3,Math.floor(score[0]/3))];$('best-line').textContent=u.bestis+best;}
  if(G){const T=goalText();$('t-sec2').textContent=' '+u.statues+' · '+T.inT+fmtTime(gameT);
    if(who==='solo'){$('t-over').textContent='🎯 '+T.reached;$('best-line').textContent=gb&&gb.best?T.fast+fmtTime(gb.best):'';}}
  else $('t-sec2').textContent=u.sec2||'';}

function nextSpin(){ if(timeLeft()<=0){endGame(false);return;} state='play';setPhase('spin');wheelStart(false);target=null;meters=[0,0];winner=-1; }

let last=performance.now();
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;tNow+=dt;
  if(camOK)track(now);

    if(phase==='timeup'){if(phaseT>1.9)endGame(false);}

      if(WH.result>=0&&WH.stopT>.8){ const a=WH.result;lastPicks=[a,...lastPicks].slice(0,2);
        if(spinN>=3&&Math.random()<.6){ target={a,b:null};setPhase('mix');say(u.mix,1.2);FX.giggle();wheelStart(true);}
        else{ target=makeTarget(a);setPhase('show');SFX.boing(); } } }
    else if(phase==='mix'){ if(phaseT>1.1){ wheelUpdate(dt);
      if(WH.result>=0&&WH.stopT>.6){let b=WH.result;if(b===target.a)b=(b+1)%NS;target=makeTarget(target.a,b);setPhase('show');SFX.boing();} } }

      if(!target.frozen){target.frozen=true;FX.freeze();say(u.freeze,.9);for(let i=0;i<18;i++)frost.push({a:Math.random()*6.3,r:0,v:.6+Math.random(),life:1});}

  ctx.lineJoin='round';ctx.lineWidth=fs*.14;ctx.strokeStyle=INK;ctx.fillStyle=INK;ctx.fillText(txt,0,fs*.08);ctx.strokeText(txt,0,0);ctx.fillStyle=col;ctx.fillText(txt,0,0);ctx.restore();

/* 14 Nov (Edgar): the game is played with the phone SIDEWAYS. The statue stands on a card on the left;
   the player plays in the rest of the picture, so their face and arms stay visible. */
const portraitPlay=()=>H>W*1.05&&['setup','count','play'].includes(state);
/* 16 Nov (Edgar): in 2-player mode the players stand on the two sides and the action is in the MIDDLE —
   the wheel spins in a centre card and, once it picks, the animal statue takes the wheel's place in that same card.
   One player: the same card sits on the left and the player has the rest of the picture. */
function stageRect(){if(story)return storyRect();const y=58,h=H-y-Math.max(56,H*.11);
  if(who==='duo'){const w=Math.min(W*.24,h*.75);return {x:(W-w)/2,y,w,h};}
  const w=Math.min(W*.3,h*.82);return {x:12,y,w,h};}
function playRect(){if(who==='duo')return {x:0,y:0,w:W,h:H};const R=stageRect(),x=R.x+R.w+8;return {x,y:0,w:W-x,h:H};}
function animalName(T){if(!T.mix)return ANIMALS[T.a][lang]+' · '+ANIMALS[T.a].poses[T.pa][lang];return mixName(ANIMALS[T.a],ANIMALS[T.b],lang);}
function drawTurnPhone(){
  ctx.fillStyle='rgba(255,248,236,.92)';ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H*.42,s=Math.min(W,H)*.22,k=(tNow%2.4)/2.4,rot=-Math.PI/2*Math.min(1,Math.max(0,(k-.3)*3));
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);const p=new Path2D();p.roundRect(-s*.32,-s*.58,s*.64,s*1.16,s*.12);sticker(ctx,p,'#fff',5);
  ctx.fillStyle='#DDF3FF';ctx.fillRect(-s*.24,-s*.46,s*.48,s*.92);ctx.restore();
  ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx,cy,s*.85,-Math.PI*.9,-Math.PI*.55);ctx.stroke();
  bubble(UI[lang].turn,W/2,H*.72,Math.max(18,Math.min(26,W*.05)));
}
function drawStage(){
  if(!target||!target.pose)return;const R=stageRect(),s=Math.min(R.h*.5,R.w*.95),cx=R.x+R.w/2,cy=R.y+R.h*.5;
  ctx.save();ctx.fillStyle='rgba(255,248,236,.86)';ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(R.x,R.y,R.w,R.h,24);ctx.fill();ctx.stroke();
  // pedestal
  sticker(ctx,(()=>{const p=new Path2D();p.roundRect(cx-s*.5,R.y+R.h-s*.16,s,s*.13,8);return p;})(),'#E9DCC6',3);
  ctx.save();const p=new Path2D();p.roundRect(R.x,R.y,R.w,R.h,24);ctx.clip(p);
  const happy=phase==='cheer',frozen=!happy;
  const hop=happy?-Math.abs(Math.sin(tNow*9))*s*.06:0,pop=phase==='show'?Math.min(1,phaseT/.3)*(1+.15*Math.sin(Math.min(1,phaseT/.3)*Math.PI)):1;
  const d=s*.8,ped=R.y+R.h-s*.16,ay=bodyMode==='full'?ped-.98*d:ped-.55*d;
  ctx.save();ctx.translate(cx,ped);ctx.scale(pop,pop);ctx.translate(-cx,-ped);
  drawAnimal(target,cx,ay,d,tNow,{hop,happy});ctx.restore();
  if(frozen&&!happy){ // icy statue shine
    ctx.fillStyle='rgba(190,230,255,.28)';ctx.fillRect(R.x,R.y,R.w,R.h);
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;for(let i=0;i<3;i++){const x0=cx-s*.4+i*s*.32,y0=R.y+R.h*.25+((tNow*30+i*40)%(R.h*.4));ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0+10,y0-10);ctx.stroke();}}
  ctx.restore();
  // frost burst
  frost=frost.filter(f=>(f.life-=.02)>0);for(const f of frost){f.r+=f.v*6;ctx.save();ctx.translate(cx+Math.cos(f.a)*f.r*s*.04,cy+Math.sin(f.a)*f.r*s*.04);ctx.globalAlpha=f.life;sticker(ctx,starPath(7),'#DDF3FF',2);ctx.restore();}
  // name tag
  const fs=Math.max(15,Math.min(24,R.w*.075));bubble(animalName(target),cx,R.y+R.h+fs*.2,fs,target.mix?'#FFE3E8':'#fff');
  if(phase==='show'||(phase==='copy'&&phaseT<1.5))bubble(target.line[lang],cx,R.y+fs*1.4,fs*.9,'#FFF1B8');
  ctx.restore();
}
function drawWheel(){
  const SR=stageRect();
  ctx.save();ctx.fillStyle='rgba(255,248,236,.86)';ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(SR.x,SR.y,SR.w,SR.h,24);ctx.fill();ctx.stroke();ctx.restore();
  const u=UI[lang],cx=SR.x+SR.w/2,cy=SR.y+SR.h*.5,Rr=Math.min(SR.w*.46,SR.h*.36),seg=Math.PI*2/NS,cols=['#FFF1B8','#D8F2B8','#FFD3DC','#DDF3FF','#F3EEE4'];
  ctx.save();ctx.translate(cx,cy);
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(0,6,Rr+8,0,7);ctx.fill();
  for(let j=0;j<NS;j++){const a0=WH.ang+j*seg,a1=a0+seg,res=WH.result>=0&&j===WH.result;
    ctx.save();ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,Rr,a0,a1);ctx.closePath();ctx.fillStyle=WH.result>=0&&!res?'#E6E1D8':cols[j%cols.length];ctx.fill();ctx.clip();
    const am=a0+seg/2,fx=Math.cos(am)*Rr*.66,fy=Math.sin(am)*Rr*.66;
    ctx.translate(fx,fy);ctx.rotate(am+Math.PI/2);drawHead(ANIMALS[j],0,0,Rr*.13,2.5,tNow,{});ctx.restore();
    ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a0)*Rr,Math.sin(a0)*Rr);ctx.stroke();}
  ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(0,0,Rr,0,7);ctx.stroke();
  sticker(ctx,ell(0,0,Rr*.12,Rr*.12),'#FFD84D',4);
  ctx.fillStyle='#FFD84D';ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-Rr*.11,-Rr-Rr*.16);ctx.lineTo(Rr*.11,-Rr-Rr*.16);ctx.lineTo(0,-Rr+Rr*.1);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
  const fs=Math.max(18,Math.min(26,W*.045));
  const by=SR.y+SR.h+fs*.2,bx=t=>{ctx.save();ctx.font=`700 ${fs}px Fredoka,sans-serif`;const hw=ctx.measureText(t).width/2+fs*.7+8;ctx.restore();return Math.max(hw,Math.min(W-hw,cx));};
  if(phase==='spin'&&WH.stopT<0){const t='✋ '+u.raise;bubble(t,bx(t),by,fs,WH.up?'#E6F7DE':'#fff');}
  if(phase==='mix'&&target){const t=ANIMALS[target.a][lang]+' + ?';bubble(t,bx(t),by,fs,'#FFE3E8');}
}
// the copy jar: one per player (blue left, pink right in two-player mode)
function drawMeter(i,x){
  const h=Math.min(H*.36,280),w=Math.max(34,h*.17),y=H*.6,m=meters[i];
  ctx.save();ctx.translate(x,y);
  const jar=new Path2D();jar.roundRect(-w/2,-h/2,w,h,w/2);
  ctx.fillStyle=INK;ctx.fill(new Path2D(jar));ctx.translate(0,-4);
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fill(jar);
  ctx.save();ctx.clip(jar);const top=h/2-h*m;ctx.fillStyle=m>=1?'#FFD84D':(who==='duo'?(i?'#FF9FB0':'#7FC8F8'):'#7DCB6B');ctx.beginPath();ctx.moveTo(-w/2,h/2);
  for(let k=0;k<=10;k++){const xx=-w/2+w*k/10;ctx.lineTo(xx,top+Math.sin(k*1.3+tNow*7)*3);}ctx.lineTo(w/2,h/2);ctx.closePath();ctx.fill();ctx.restore();
  ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke(jar);
  ctx.translate(0,-h/2-w*.55);ctx.rotate(Math.sin(tNow*2)*.1);sticker(ctx,starPath(w*.55),m>=1?'#FFD84D':'#FFF1B8',3);
  ctx.restore();
}
// soft dots on the player's elbows, hands, knees and feet: green when that part matches
function drawCopyDots(){
  for(const lmatch of lastMatch){if(!lmatch)continue;const {r,p}=lmatch,lm=p.lm,s=sides(lm),R=Math.max(9,p.sw*.09);
    const dots=[[s.aL[1],'uaL'],[s.aL[2],'faL'],[s.aR[1],'uaR'],[s.aR[2],'faR']];
    if(bodyMode==='full')dots.push([s.lL[1],'thL'],[s.lL[2],'shL'],[s.lR[1],'thR'],[s.lR[2],'shR']);
    for(const [i,n] of dots){const q=lm[i];if(q.v<.5||r.by[n]===undefined)continue;sticker(ctx,ell(q.x,q.y,R,R),r.by[n]?'#7DCB6B':'rgba(255,255,255,.9)',3);}}
}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const u=UI[lang],live=camOK&&video.readyState>=2&&state!=='menu'&&state!=='over';
  if(live){drawMirrored();ctx.fillStyle='rgba(255,248,236,.08)';ctx.fillRect(0,0,W,H);}
  else drawRoom(ctx,W,H);
  if(state==='menu'||state==='over'){drawDemo();return;}
  const fs=Math.max(18,Math.min(26,W*.045));
  if(portraitPlay()){drawTurnPhone();return;}
  if(state==='setup'){ if(guide)guide.draw(ctx,playRect(),lang); else{const hv=halves();guides.forEach((g,k)=>g.draw(ctx,hv[k],lang));} }
  else if(state==='count'){const n=3-Math.floor(tNow-countT),k=(tNow-countT)%1;if(n>0)bigText(String(n),W/2,H*.42,Math.min(150,H*.22),'#fff',1+.25*Math.max(0,1-k*4));}
  else if(state==='play'&&story){drawStory();if(phase==='read'||phase==='copy'||phase==='cheer'){drawMeter(0,W-43);if(phase!=='cheer')drawCopyDots();}}
  else if(state==='play'){
    if(phase==='spin'||phase==='mix')drawWheel();
    else{drawStage();
      if(phase==='copy'||phase==='cheer'||phase==='laugh'){
        const PR=playRect();if(who==='duo'){drawMeter(0,PR.x+30);drawMeter(1,W-43);}else drawMeter(0,W-43);
        if(phase==='copy')drawCopyDots();}}
    // HUD: spin count and score(s)
    const hf=Math.max(16,Math.min(24,W*.042)),hy=H-hf*1.6;
    {const SR=stageRect(),left=timeLeft();bubble(G?'🎯 '+G:'⏱ '+clock(),who==='duo'?W*.5:SR.x+SR.w+8+(W-SR.x-SR.w-8)/2,64+hf*.2,hf,left<=10?'#FFE3E8':'#fff');}   // one game clock, always on screen
    if(who==='duo'){bubble(String(score[0]),36,64+hf*.2,hf,'#DDF3FF');bubble(String(score[1]),W-36,64+hf*.2,hf,'#FFE3E8');}
    else bubble('★ '+score[0],W-44,64+hf*.2,hf,'#E6F7DE');
  }
  if(bigMsg&&tNow<bigMsgT){const k=1-Math.max(0,bigMsgT-tNow-1.2)*4;bigText(bigMsg,W/2,H*.5,Math.min(64,W*.1),'#FFD84D',Math.max(.6,Math.min(1,k)));}
  pops=pops.filter(p=>(p.life-=dt)>0);
  for(const p of pops){p.vy+=H*1.2*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*5);ctx.globalAlpha=Math.min(1,p.life*2);sticker(ctx,starPath(12),'#FFD84D',2.5);ctx.restore();}
}
// menu: two animals take turns striking poses (bear and flamingo, then others)
function drawDemo(){
  const card=$('start').hidden?$('end'):$('start'),ct=card&&!card.hidden?card.getBoundingClientRect().top:H;
  const i=Math.floor(tNow/2.4)%NS,j=(i+4)%NS,k=(tNow%2.4)/2.4,s=Math.max(40,Math.min(W*.26,H*.2,(ct-120)/1.75)),y=Math.min(H*.6,ct-s*1.05);
  const n=Math.floor(tNow/2.4),pi=n%3,ta=makeTarget(i,null,pi),tb=makeTarget(j,null,(pi+1)%3),pop=Math.min(1,k*5);
  for(const [T,x] of [[ta,W/2-s*.75],[tb,W/2+s*.75]]){ctx.save();ctx.translate(x,y+s);ctx.scale(pop,pop);ctx.translate(-x,-y-s);drawAnimal(T,x,y,s,tNow,{});ctx.restore();}
}

/* ================= HOW TO PLAY (cartoon for a 5-year-old) ================= */
{
  const KID={id:'kid',body:'#5FB7F0',light:'#BFE6FF',feet:'#FFFFFF'};
  const FL=ANIMALS.findIndex(a=>a.id==='flamingo'),FPOSE=ANIMALS[FL].poses[0].pose;
  const STAND={uaL:105,faL:95,uaR:75,faR:85,thL:95,shL:90,thR:85,shR:90,tr:-90},HAND={...STAND,uaR:-55,faR:-80};
  const lerp=(A,B,k)=>{const o={};for(const key in B){const a=A[key]??B[key],d=((B[key]-a+540)%360)-180;o[key]=a+d*k;}return o;};
  const withCtx=(c,fn)=>{const keep=ctx,bm=bodyMode;ctx=c;bodyMode='full';try{fn();}finally{ctx=keep;bodyMode=bm;}};
  const kid=(c,x,y,s,pose,t,o={})=>withCtx(c,()=>drawAnimal({a:1,b:1,pose},x,y,s,t,{top:KID,pose,...o}));
  const statue=(c,x,ped,s,t,k)=>withCtx(c,()=>{const T=makeTarget(FL,null,0),pop=Math.min(1,k*4)*(1+.15*Math.sin(Math.min(1,k*4)*Math.PI));
    sticker(c,(()=>{const p=new Path2D();p.roundRect(x-s*.55,ped,s*1.1,s*.13,8);return p;})(),'#E9DCC6',3);
    c.save();c.translate(x,ped);c.scale(pop,pop);c.translate(-x,-ped);drawAnimal(T,x,ped-.98*s*.8,s*.8,tNow,{});c.restore();
    c.fillStyle='rgba(190,230,255,.35)';c.fill(ell(x,ped-s*.45,s*.6,s*.62));});
  const wheel=(c,x,y,r,ang)=>withCtx(c,()=>{const n=NS,sg=Math.PI*2/n,cols=['#FFF1B8','#D8F2B8','#FFD3DC','#DDF3FF','#F3EEE4'];
    c.save();c.translate(x,y);c.fillStyle=INK;c.beginPath();c.arc(0,5,r+6,0,7);c.fill();
    for(let j=0;j<n;j++){const a0=ang+j*sg;c.save();c.beginPath();c.moveTo(0,0);c.arc(0,0,r,a0,a0+sg);c.closePath();c.fillStyle=cols[j%5];c.fill();c.clip();
      const am=a0+sg/2;c.translate(Math.cos(am)*r*.66,Math.sin(am)*r*.66);c.rotate(am+Math.PI/2);drawHead(ANIMALS[j],0,0,r*.13,2,tNow,{});c.restore();
      c.lineWidth=2.5;c.strokeStyle=INK;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a0)*r,Math.sin(a0)*r);c.stroke();}
    c.lineWidth=4;c.strokeStyle=INK;c.beginPath();c.arc(0,0,r,0,7);c.stroke();sticker(c,ell(0,0,r*.12,r*.12),'#FFD84D',3);
    c.fillStyle='#FFD84D';c.lineWidth=3;c.beginPath();c.moveTo(-r*.12,-r*1.17);c.lineTo(r*.12,-r*1.17);c.lineTo(0,-r*.9);c.closePath();c.fill();c.stroke();c.restore();});
  // the wheel angle that puts the flamingo under the pointer
  const stopAng=-Math.PI/2-(FL+.5)*Math.PI*2/NS;
  const jar=(c,x,y,h,m)=>{const w=h*.36;const p=new Path2D();p.roundRect(x-w/2,y-h,w,h,w*.3);sticker(c,p,'#fff',3);
    c.save();c.clip(p);c.fillStyle='#8BD16B';c.fillRect(x-w/2,y-h*m,w,h*m);c.restore();c.lineWidth=3;c.strokeStyle=INK;c.stroke(p);};
  const dots=(c,x,y,s,pose,on)=>{ // green dots on hands and feet when the copy matches
    const R=a=>a*Math.PI/180,sgm=(p,a,l)=>({x:p.x+Math.cos(R(a))*l,y:p.y+Math.sin(R(a))*l});
    const sh={L:{x:x-s*.25,y:y-s*.2},R:{x:x+s*.25,y:y-s*.2}},hp={L:{x:x-s*.15,y:y+s*.3},R:{x:x+s*.15,y:y+s*.3}};
    const pts=[sgm(sgm(sh.L,pose.uaL,s*.3),pose.faL,s*.27),sgm(sgm(sh.R,pose.uaR,s*.3),pose.faR,s*.27),sgm(sgm(hp.L,pose.thL,s*.34),pose.shL,s*.32),sgm(sgm(hp.R,pose.thR,s*.34),pose.shR,s*.32)];
    pts.forEach((p,i)=>{if(on>i/4)sticker(c,ell(p.x,p.y,s*.06,s*.06),'#8BD16B',2.5);});};
  const lay=(w,h)=>({s:Math.min(h*.36,w*.2),gy:h*.9});
  setupHowTo({lang:()=>lang,play:()=>play(),before:'.play-row',steps:[
    {dur:3.4,cap:{en:'Raise a hand ✋',he:'מרימים יד ✋'},draw(c,w,h,t,k){const L=lay(w,h);
      kid(c,w*.3,L.gy-L.s*.98,L.s,lerp(STAND,HAND,seg(k,.1,.3)),t);
      const spin=k<.35?t*6:(()=>{const u=seg(k,.35,.9);return 3.4*.35*6+u*4;})(),ang=k<.9?spin:spin;
      const base=stopAng-(3.4*.35*6+4);wheel(c,w*.68,h*.52,Math.min(h*.3,w*.17),base+ang);}},
    {dur:2.6,cap:{en:'The animal freezes ❄️',he:'החיה קופאת ❄️'},draw(c,w,h,t,k){const L=lay(w,h);
      kid(c,w*.3,L.gy-L.s*.98,L.s,STAND,t);statue(c,w*.7,L.gy,L.s*1.15,t,k);
      for(let i=0;i<8;i++){const a=i/8*6.3+k*2,r=L.s*(.3+k*.9);bigStar(c,w*.7+Math.cos(a)*r,L.gy-L.s*.6+Math.sin(a)*r*.7,6,a,'#DDF3FF');}}},
    {dur:3.4,cap:{en:'Copy it!',he:'מעתיקים!'},draw(c,w,h,t,k){const L=lay(w,h),pose=lerp(STAND,FPOSE,seg(k,.05,.55)),x=w*.3,y=L.gy-L.s*.98;
      kid(c,x,y,L.s,pose,t);statue(c,w*.7,L.gy,L.s*1.15,t,1);dots(c,x,y,L.s,pose,seg(k,.5,.75));jar(c,w*.5,L.gy-L.s*.2,L.s*.8,seg(k,.6,1));}},
    {dur:2.4,cap:{en:'Hold it… yay! ⭐',he:'מחזיקים… יש! ⭐'},draw(c,w,h,t,k){const L=lay(w,h),hop=-Math.abs(Math.sin(t*8))*L.s*.08;
      kid(c,w*.3,L.gy-L.s*.98+hop,L.s,lerp(FPOSE,HAND,seg(k,.2,.4)),t,{happy:true});statue(c,w*.7,L.gy,L.s*1.15,t,1);jar(c,w*.5,L.gy-L.s*.2,L.s*.8,1);
      for(let i=0;i<10;i++){const a=i/10*6.3,r=L.s*(.2+k*1.6);bigStar(c,w*.3+Math.cos(a)*r,L.gy-L.s*1.4+Math.sin(a)*r*.6,10*(1-k*.5),a+k*3);}}}
  ]});
}
